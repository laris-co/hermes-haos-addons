server {
    listen 8099;
    server_name _;

    # Home Assistant Supervisor is the only network peer allowed to reach an
    # ingress service. Authentication has already happened in Home Assistant,
    # so this is the whole auth boundary — which is why there is no `ports:`
    # entry in config.yaml to go around it.
    allow 172.30.32.2;
    deny all;

    root /usr/share/hello-haos-oracle;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # No script-src, and default-src 'none' — so an inline <script> here would be
    # blocked SILENTLY, with nothing in the console and nothing in the UI. That is
    # a real bug that cost three rebuilds elsewhere on this guest. This page is
    # therefore HTML + CSS only, by design. If you ever need JS, ship it as a
    # same-origin file and add script-src 'self' — do not inline it.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; frame-ancestors 'self'" always;

    # index.html is REGENERATED from index.tmpl at every container start, so its
    # bytes change whenever an option changes. Without an explicit directive a
    # browser may apply heuristic freshness and keep showing the old page after
    # a Restart — the change is served correctly and simply never seen.
    #
    # This is the mild form of a real bug found next door on 2026-08-25: an
    # add-on that appends to a CONTENT-HASHED bundle changes the bytes without
    # changing the filename, and a hashed asset is treated as immutable because
    # the hash is a promise the bytes never change. That one cannot be fixed with
    # a header. This one can: the page is small, dynamic, and must never be stale.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
