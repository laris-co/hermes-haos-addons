# Standalone nginx config (not a fragment — loaded via `nginx -c`, replacing
# /etc/nginx/nginx.conf entirely), sitting in front of `maw serve`.
#
# Three jobs, none of which maw serve does for itself the way this add-on needs:
#
#   1. Supplying maw serve's bearer token. maw serve rejects browser API and
#      WebSocket clients without one, and a browser cannot be prompted for a
#      bearer, so maw-proxy.inc injects it server-side. The human gate is Home
#      Assistant's own ingress session — the same trust boundary every other
#      ingress-only add-on in this repo uses.
#
#      An HTTP Basic gate was tried here first and removed: inside HA's ingress
#      iframe it produces a native browser credential prompt (the page cannot
#      even be screenshotted while it is up), and browsers increasingly refuse
#      auth prompts in cross-origin iframes outright.
#
#   2. Serving the web UI at the root. maw serve keeps its own plain
#      "maw · federation" status page at `/` and serves the maw-ui dist
#      alongside it, so the actual application lives at /index.html. Verified
#      live: `/` returns <title>maw · federation</title> while `/index.html`
#      returns <title>ARRA Office</title> — the same UI deployed at
#      god.buildwithoracle.com. The exact-match location below makes that UI
#      the landing page without shadowing anything else.
#
#   3. WebSocket upgrades, with a long read timeout (see maw-proxy.inc).
# Explicit, and load-bearing: `nginx -c` replaces /etc/nginx/nginx.conf
# wholesale, including the `user www-data;` the Debian package sets there.
# Without this line nginx falls back to its compiled-in default and the worker
# runs as nobody(65534), which cannot read the 0400 www-data-owned credential
# files run.sh writes — every request then 500s with "Permission denied".
user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Only ask for "Connection: upgrade" when the client actually requested
    # one; sending it unconditionally breaks plain HTTP responses.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Supervisor tells the add-on where it is mounted with X-Ingress-Path
    # (e.g. /api/hassio_ingress/<token>, no trailing slash). Outside ingress
    # this header is absent and the prefix is simply empty.
    map $http_x_ingress_path $ingress_prefix {
        default $http_x_ingress_path;
        ''      '';
    }

    # HA terminates TLS upstream, so the browser's scheme is what
    # X-Forwarded-Proto says, not what nginx itself is serving.
    map $http_x_forwarded_proto $ext_scheme {
        default $http_x_forwarded_proto;
        ''      http;
    }

    server {
        listen 8343;
        server_name _;

        # An agent fleet UI has no business being cached by an intermediary.
        add_header Cache-Control "no-store" always;

        # Exact match only: `/` is the app, everything else (assets, /api, /ws,
        # maw serve's own pages) passes through untouched below.
        location = / {
            # maw-ui builds its API and WebSocket URLs from an OPTIONAL ?host=
            # query parameter, and from the origin root when it is absent:
            #
            #   with ?host=X   ->  http://X/api/config   ws://X/ws
            #   without        ->  /api/config           ws://<origin>/ws
            #
            # Under ingress the second form is wrong — it drops the
            # /api/hassio_ingress/<token> prefix and the requests land on Home
            # Assistant. Observed exactly that: the UI rendered but sat on
            # "Connection lost / Reconnecting…", with 403s on api/ui-state,
            # api/asks, api/teams and a failed ws://catlab.local/ws.
            #
            # So send the browser back to the same page with ?host= filled in
            # from what Supervisor tells us. This uses maw-ui's own supported
            # parameter rather than patching its minified bundle.
            # The ":" and "/" are percent-encoded. Unencoded, the Location
            # header reads `?host=http://…`, and a strict URL parser takes
            # everything before that first colon as a scheme and rejects it:
            # bun's fetch fails the redirect with UnsupportedRedirectProtocol,
            # which is how `just serves` broke. Browsers and URLSearchParams
            # both decode this back to the plain URL.
            if ($arg_host = '') {
                return 302 '?host=$ext_scheme%3A%2F%2F$http_host$ingress_prefix';
            }

            proxy_pass http://127.0.0.1:3461/index.html;
            include /etc/nginx/maw-proxy.inc;

            # maw-ui is built with root-absolute asset URLs (/assets/…,
            # /favicon.svg). Supervisor serves ingress under
            # /api/hassio_ingress/<token>/ and strips that prefix before
            # proxying, so a root-absolute URL leaves the ingress path
            # entirely and hits Home Assistant instead. Measured from inside
            # the iframe: "/assets/main-*.js" -> 404 from HA, while the same
            # file as "assets/main-*.js" -> 200 through ingress. Without this
            # rewrite the document loads (title is right) and React never
            # mounts, because not one script tag resolves.
            #
            # The ingress URL always ends in "/", so making these relative is
            # what makes them resolve under the prefix.
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'src="/assets/'  'src="assets/';
            sub_filter 'href="/assets/' 'href="assets/';
            sub_filter 'href="/favicon' 'href="favicon';

            # sub_filter cannot rewrite a compressed upstream response.
            proxy_set_header Accept-Encoding "";
        }

        location / {
            proxy_pass http://127.0.0.1:3461;
            include /etc/nginx/maw-proxy.inc;
        }
    }
}
