# Standalone nginx config (not a fragment — loaded via `nginx -c`, replacing
# /etc/nginx/nginx.conf entirely), sitting in front of `maw serve`.
#
# Three jobs, none of which maw serve does for itself the way this add-on needs:
#
#   1. Supplying maw serve's bearer token. maw serve rejects browser API and
#      WebSocket clients without one, and a browser cannot be prompted for a
#      bearer, so maw-proxy.inc injects it server-side. The human gate is Home
#      Assistant's own ingress session — the same trust boundary every other
#      ingress-only add-on in this repo uses.
#
#      An HTTP Basic gate was tried here first and removed: inside HA's ingress
#      iframe it produces a native browser credential prompt (the page cannot
#      even be screenshotted while it is up), and browsers increasingly refuse
#      auth prompts in cross-origin iframes outright.
#
#   2. Serving the web UI at the root. maw serve keeps its own plain
#      "maw · federation" status page at `/` and serves the maw-ui dist
#      alongside it, so the actual application lives at /index.html. Verified
#      live: `/` returns <title>maw · federation</title> while `/index.html`
#      returns <title>ARRA Office</title> — the same UI deployed at
#      god.buildwithoracle.com. The exact-match location below makes that UI
#      the landing page without shadowing anything else.
#
#   3. WebSocket upgrades, with a long read timeout (see maw-proxy.inc).
# Explicit, and load-bearing: `nginx -c` replaces /etc/nginx/nginx.conf
# wholesale, including the `user www-data;` the Debian package sets there.
# Without this line nginx falls back to its compiled-in default and the worker
# runs as nobody(65534), which cannot read the 0400 www-data-owned credential
# files run.sh writes — every request then 500s with "Permission denied".
user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Only ask for "Connection: upgrade" when the client actually requested
    # one; sending it unconditionally breaks plain HTTP responses.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8343;
        server_name _;

        # An agent fleet UI has no business being cached by an intermediary.
        add_header Cache-Control "no-store" always;

        # Exact match only: `/` is the app, everything else (assets, /api, /ws,
        # maw serve's own pages) passes through untouched below.
        location = / {
            proxy_pass http://127.0.0.1:3461/index.html;
            include /etc/nginx/maw-proxy.inc;
        }

        location / {
            proxy_pass http://127.0.0.1:3461;
            include /etc/nginx/maw-proxy.inc;
        }
    }
}
