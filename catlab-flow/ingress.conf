server {
    listen 8099;
    server_name _;
    allow 172.30.32.2;
    deny all;

    root /usr/share/catlab-flow;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # script-src 'self': the React Flow bundle is VENDORED (bun build from
    # node_modules), so no external origin is ever requested. It is loaded as
    # type=module because bun's browser output emits import.meta, which is a
    # hard SyntaxError in a classic script.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'self'" always;

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
