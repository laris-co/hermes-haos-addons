<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>catlab-flow</title>
  <link rel="stylesheet" href="app.css">
  <style>html,body,#root{margin:0;height:100%;background:#0d1117}</style>
</head>

  <div id="root"></div>

       SyntaxError in a classic script. Measured: "Cannot use 'import.meta'

       own code ran, so nothing rendered and no error surfaced in-page. -->
  <script type="module" src="app.js"></script>
</body>
