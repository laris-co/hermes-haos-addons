<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island — the air over Chiang Mai</title>
<style>
/* ============================================================================
   ISLAND — a Dynamic-Island wall for the Kit4Kids PM2.5 boards.

   The photograph IS the reading: the whole screen is a picture of what the air
   outside currently looks like, chosen by the worst live board. One black pill
   floats at the top holding the essential state; it expands when the band
   changes or someone touches it, then contracts again. Nothing else is UI.

   CONTRAST — how legibility is guaranteed across all six photographs:
     1. No glyph ever sits on raw photograph. Every text node on this page lives
        inside a .glass panel (the island, the settings sheet) or on the authored
        flat ground of the failure screen.
     2. The panel fill is a NEAR-OPAQUE BLACK: rgba(8,11,16,.80), raised to .90
        where backdrop-filter is unavailable. Worst case is a pure-white ground
        pixel: 0.80 alpha black over #fff composites to #333, on which #f4f7fb
        text measures 12.6:1 — far past the 4.5:1 floor. Any real photograph is
        darker than white, so every real composite is better than that bound.
        The blur/saturate/brightness(.6) on top only ever darkens further; the
        guarantee does not depend on it existing.
     3. A top scrim darkens the sky under the island BEFORE the panel composites,
        so the fallback path is safer still.
     4. Every accent colour below was checked against that #333 worst case:
        good 10.2:1 · moderate 12.6:1 · sensitive 6.7:1 · unhealthy 5.6:1 ·
        very 6.6:1 · hazardous 5.8:1 · --dim 7.1:1 · --faint 5.3:1.
     5. The white text never changes with the band, so it cannot drift dark on a
        dark frame; only the accents move, and they were picked light-first.
   ========================================================================== */

:root{
  --ink:#f4f7fb;            /* 12.6:1 on the worst-case panel composite */
  --dim:#b8c4d4;            /*  7.1:1 */
  --faint:#9aa9bc;          /*  5.3:1 — floor for the smallest type */
  --band-good:#7dffb0; --band-mod:#ffd66b; --band-usg:#ffab5e;
  --band-unh:#ff8a8a; --band-vun:#d3aaff; --band-haz:#ff8fa3;
  --band:var(--faint);
  --hair:rgba(255,255,255,.10);
  /* Two stacks, one page. The Latin stack is the design's original type; the Thai
     faces are named ahead of it only when the page is actually in Thai, so English
     rendering is bit-for-bit what it was. No webfont link: this wall must open with
     no network, so we name real installed faces and accept the system fallback. */
  --f-latin:-apple-system,BlinkMacSystemFont,"SF Pro Text",ui-sans-serif,system-ui,
            "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-th:'Noto Sans Thai','IBM Plex Sans Thai','Sarabun';
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;background:#0a0d12}
/* The wall is a fixed composition: nothing on this page ever scrolls, in either
   axis, at any level. Content that cannot fit is clipped, never given a bar. */
body{
  overflow:hidden;
  color:var(--ink);
  font:16px/1.5 var(--f-latin);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
html[lang="th"] body{font-family:var(--f-th),var(--f-latin)}

/* ---------------------------------------------------------------- the sky */
/* Two stacked layers so a band change cross-fades instead of flashing white.
   The incoming image is decoded before the swap, and every band is preloaded. */
.sky{
  position:fixed;inset:0;
  background-position:center;background-size:cover;background-repeat:no-repeat;
  transform:scale(1.04);
  opacity:0;transition:opacity 1.15s ease;
  will-change:opacity;
}
/* The scale is held. It used to drift 1.04 → 1.11 over 120 s, which is about
   half a pixel a second — invisible on a wall, and expensive in a way nothing
   on screen showed: the island above it is a blur(30px) backdrop covering 27.7%
   of the viewport, and a backdrop-filter must re-sample whatever moves behind
   it. A still island was re-blurring the whole photograph at 60fps, forever,
   for an effect no one could see. The island's own morph is fine — it is
   event-driven (band change, first data, touch), never a timer. */
.sky.on{opacity:1}

/* Belt and braces for rule 3 above: the ground under the island is darkened
   before the glass ever composites over it. */
.scrim{
  position:fixed;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.24) 26%,rgba(0,0,0,0) 48%),
    linear-gradient(0deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 24%),
    radial-gradient(130% 82% at 50% 0%,rgba(0,0,0,.30),rgba(0,0,0,0) 62%);
}

/* ---------------------------------------------------------------- glass */
.glass{
  position:relative;
  background-color:rgba(8,11,16,.80);
  background-image:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.012) 42%,rgba(255,255,255,0) 70%);
  -webkit-backdrop-filter:blur(30px) saturate(160%) brightness(.6);
  backdrop-filter:blur(30px) saturate(160%) brightness(.6);
  border:1px solid var(--hair);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.26),      /* the 1px hairline top edge */
    0 30px 70px rgba(0,0,0,.55),
    0 2px 12px rgba(0,0,0,.42);
}
/* Firefox before 103 and anything else without the filter gets a MORE opaque
   fill, not a transparent one. Readability must not depend on a nice-to-have. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background-color:rgba(6,9,13,.90)}
}

/* ---------------------------------------------------------------- island */
.stage{
  position:fixed;inset:0;pointer-events:none;
  display:flex;justify-content:center;align-items:flex-start;
  padding:clamp(.7rem,2.4vh,2.2rem) clamp(.6rem,2vw,1.6rem);
}
.island{
  pointer-events:auto;
  width:var(--iw);max-width:100%;
  max-height:calc(100vh - clamp(1.4rem,4.8vh,4.4rem));
  /* The reading is sized off THIS BOX, never off the viewport: the island's own
     width is the only thing that decides how much room a digit has. (cqi here,
     fixed geometry above — the two halves of the fix for the "163." + "3" bug.) */
  container-type:inline-size;
  display:grid;grid-template-rows:auto 0fr;
  border-radius:var(--ir);
  overflow:hidden;
  --iw:min(92vw,46rem);
  --ir:999px;
  transition:
    width .62s cubic-bezier(.32,.72,0,1),
    grid-template-rows .62s cubic-bezier(.32,.72,0,1),
    border-radius .62s cubic-bezier(.32,.72,0,1);
  outline:none;
}
.island[data-open="1"]{
  --iw:min(96vw,64rem);
  --ir:clamp(1.3rem,2.6vw,2.3rem);
  grid-template-rows:auto 1fr;
}
.island:focus-visible{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 0 0 3px rgba(150,196,255,.6),0 30px 70px rgba(0,0,0,.55);
}

.head{
  display:flex;align-items:center;min-width:0;
  gap:clamp(.45rem,1.7cqi,1.15rem);
  padding:clamp(.62rem,2.1cqi,1.3rem) clamp(.95rem,3.2cqi,2rem);
}
.dot{
  width:clamp(.6rem,1.8cqi,1.15rem);height:clamp(.6rem,1.8cqi,1.15rem);
  border-radius:50%;background:var(--band);flex:none;
  box-shadow:0 0 0 .28em color-mix(in srgb,var(--band) 22%,transparent);
}
.island[data-live="1"] .dot{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

.read{display:flex;align-items:baseline;gap:.3em;min-width:0}
/* Digits may never break or wrap. A wall reading split across two lines reads as
   a different number. */
.num{
  font-size:clamp(1.5rem,7.4cqi,5rem);line-height:.94;font-weight:700;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  white-space:nowrap;color:var(--band);
  text-shadow:0 2px 10px rgba(0,0,0,.6);
  transition:font-size .62s cubic-bezier(.32,.72,0,1);
}
.num[data-kind="word"]{font-size:clamp(1.05rem,4.2cqi,2.4rem);letter-spacing:-.01em}
/* Escape hatch: a payload longer than any plausible reading steps down rather
   than overflowing the pill. */
.num[data-long="1"]{font-size:clamp(.95rem,3.2cqi,1.8rem)}
.unit{
  font-size:clamp(.68rem,1.9cqi,1.2rem);color:var(--dim);font-weight:500;white-space:nowrap;
}
.bandlab{
  /* Sized down from 1.35rem: it is a caption beside a 5rem number, and at the old
     size the longest band name lost its last glyphs to the ellipsis in four of the
     six bands once the names were no longer English. */
  font-size:clamp(.7rem,1.85cqi,1.12rem);font-weight:600;color:var(--band);
  white-space:nowrap;letter-spacing:.005em;
  /* A flex row shrinks its items in proportion, which would shave glyphs off a
     nowrap band name while the verdict — the one item that CAN reflow — sat on one
     line. So the band name is never shrunk; the verdict absorbs the pressure by
     wrapping, which is what it was sized for. The ellipsis stays as a last resort
     for a width neither of them was built for. */
  flex:none;min-width:0;overflow:hidden;text-overflow:ellipsis;
}
.sep{width:1px;align-self:stretch;background:rgba(255,255,255,.16);flex:none;margin:.2em 0}
/* The verdict is now a whole sentence, not two words, so it is sized to wrap to a
   second line inside the pill rather than to fill one line edge to edge. */
.verdict{
  font-size:clamp(.92rem,3.2cqi,1.95rem);font-weight:680;line-height:1.12;
  color:var(--ink);letter-spacing:-.018em;min-width:0;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
  transition:font-size .62s cubic-bezier(.32,.72,0,1);
}
.tally{
  margin-left:auto;flex:none;display:flex;align-items:center;
  gap:clamp(.3rem,1cqi,.6rem);
  font-size:clamp(.6rem,1.55cqi,.95rem);color:var(--faint);white-space:nowrap;
}
.pips{display:inline-flex;gap:.34em;align-items:center}
.pip{width:.62em;height:.62em;border-radius:50%;background:var(--faint);flex:none}
.pip[data-s="live"]{background:var(--band)}
.pip[data-s="stale"],.pip[data-s="fault"],.pip[data-s="unknown"]{background:var(--band-mod)}
.pip[data-s="waiting"]{background:transparent;box-shadow:inset 0 0 0 .1em var(--faint)}
/* Offline is the normal state for two of the three boards. A hollow ring is a
   deliberate mark — it is never a gap and never a zero. */
.pip[data-s="offline"]{background:transparent;box-shadow:inset 0 0 0 .16em rgba(255,255,255,.5)}

/* Collapsed, the pill carries only the essentials — reading, verdict, pips. The
   band name arrives with the expansion, which is the Dynamic-Island idiom and the
   room the longer verdict sentence needs. */
@container (max-width:50rem){
  .bandlab,.sep{display:none}
}
@container (max-width:23rem){
  .tally span:last-child{display:none}
}

/* ---------------------------------------------------------------- detail */
.detail{overflow:hidden;min-height:0}
.detail-in{
  display:flex;flex-direction:column;gap:clamp(.55rem,1.7cqi,1.05rem);
  padding:0 clamp(.95rem,3.2cqi,2rem) clamp(.85rem,2.6cqi,1.5rem);
  opacity:1;transition:opacity .34s ease .12s;
}
.island[data-open="0"] .detail-in{opacity:0;transition-delay:0s}
.rule{height:1px;background:rgba(255,255,255,.13)}
.say{
  margin:0;font-size:clamp(.9rem,3cqi,1.75rem);line-height:1.34;color:var(--ink);
  font-weight:520;letter-spacing:-.006em;text-wrap:pretty;
}
.sub{
  margin:0;font-size:clamp(.66rem,1.7cqi,1rem);color:var(--faint);
  font-variant-numeric:tabular-nums;
}

/* band scale ---------------------------------------------------------- */
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(.2rem,.7cqi,.45rem)}
.seg{display:flex;flex-direction:column;gap:.42em;min-width:0}
.seg i{
  display:block;height:clamp(.3rem,.85cqi,.55rem);border-radius:999px;
  background:var(--c);opacity:.26;transition:opacity .4s ease,transform .4s ease;
  transform-origin:center;
}
.seg[data-on="1"] i{opacity:1;transform:scaleY(1.9)}
.seg b{
  font-size:clamp(.5rem,1.25cqi,.76rem);font-weight:600;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg[data-on="1"] b{color:var(--c)}
.seg em{
  font-style:normal;font-size:clamp(.46rem,1.1cqi,.7rem);color:var(--faint);
  opacity:.8;font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* boards -------------------------------------------------------------- */
.boards{
  display:grid;gap:clamp(.4rem,1.3cqi,.85rem);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr));
}
.b{
  /* Each tile is its own container, so a tile number is sized by the tile — not
     by the island, and not by the viewport. */
  container-type:inline-size;
  display:flex;flex-direction:column;gap:.22em;min-width:0;
  border-radius:clamp(.6rem,1.6cqi,1.1rem);
  border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.055);
  padding:clamp(.45rem,1.4cqi,.85rem) clamp(.55rem,1.6cqi,.95rem);
}
.b[data-s="offline"]{border-style:dashed;border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.025)}
.b[data-s="live"]{border-color:color-mix(in srgb,var(--band) 42%,transparent)}
.b-id{
  font-size:clamp(.6rem,7cqi,.88rem);font-weight:700;color:var(--ink);
  letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.b-v{display:flex;align-items:baseline;gap:.3em;min-width:0}
.b-num{
  font-size:clamp(1.05rem,17cqi,2.5rem);line-height:1;font-weight:700;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;
  color:var(--band);
}
/* A dead board is stated as loudly as a live one, in words, never as a blank. */
.b-num[data-kind="word"]{font-size:clamp(.9rem,12cqi,1.7rem);letter-spacing:-.005em}
.b-num[data-long="1"]{font-size:clamp(.8rem,9cqi,1.2rem)}
.b-u{font-size:clamp(.55rem,5.5cqi,.8rem);color:var(--dim);white-space:nowrap}
.b-n{
  font-size:clamp(.55rem,5.6cqi,.8rem);line-height:1.32;color:var(--faint);
  overflow-wrap:anywhere;
}

/* extras -------------------------------------------------------------- */
.extras{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem clamp(.6rem,2cqi,1.3rem)}
.ex-h{font-size:clamp(.58rem,1.5cqi,.85rem);color:var(--faint);flex:none}
.ex{display:inline-flex;align-items:baseline;gap:.36em;min-width:0}
.ex b{font-size:clamp(.56rem,1.45cqi,.82rem);font-weight:600;color:var(--faint)}
.ex span{
  font-size:clamp(.72rem,1.95cqi,1.15rem);font-weight:650;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.ex i{font-style:normal;font-size:clamp(.55rem,1.4cqi,.8rem);color:var(--dim);white-space:nowrap}

/* foot ---------------------------------------------------------------- */
.foot{
  display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
  gap:.3rem .9rem;font-size:clamp(.58rem,1.5cqi,.85rem);color:var(--faint);
}
.foot .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.note{
  font-size:clamp(.58rem,1.5cqi,.85rem);line-height:1.4;color:var(--band-mod);
  overflow-wrap:anywhere;
}
.note:empty{display:none}
.kbd{
  display:inline-block;border:1px solid rgba(255,255,255,.24);border-radius:.35em;
  padding:0 .35em;font-size:.92em;color:var(--dim);
}

/* ---------------------------------------------------------------- sheet */
.sheet{
  position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  padding:clamp(1rem,4vw,3rem);
  background:rgba(4,6,9,.55);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
/* An author display declaration outranks the UA [hidden] rule, so say it here. */
.sheet[hidden],.calm[hidden]{display:none}
.sheet-card{
  width:min(100%,34rem);max-height:100%;
  border-radius:clamp(1rem,2.4vw,1.5rem);
  padding:clamp(.95rem,2.6vw,1.5rem);
}
.sheet h2{margin:0 0 .15rem;font-size:1.05rem;font-weight:650;letter-spacing:-.01em}
.sheet p.why{margin:0 0 .85rem;font-size:.78rem;color:var(--faint);line-height:1.45}
.form{display:grid;gap:.6rem .8rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr))}
.f{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.f label{font-size:.68rem;letter-spacing:.06em;color:var(--faint)}
.f input{
  background:rgba(0,0,0,.45);color:var(--ink);border:1px solid rgba(255,255,255,.2);
  border-radius:.55rem;padding:.5rem .6rem;font:inherit;font-size:.9rem;width:100%;min-width:0;
}
.f input:focus{outline:2px solid #6aa9e0;outline-offset:1px}
.f-check{flex-direction:row;align-items:center;gap:.45rem}
.f-check label{letter-spacing:0;color:var(--dim);font-size:.82rem}
.f-check input{width:auto}
.acts{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.9rem}
button{
  font:inherit;font-weight:640;cursor:pointer;border-radius:.6rem;padding:.55rem 1.1rem;
  background:#2b6fa8;color:#fff;border:1px solid #4a8dc4;
}
button.ghost{background:transparent;color:var(--dim);border-color:rgba(255,255,255,.22)}
.sheet .hint{margin:.7rem 0 0;font-size:.72rem;color:var(--faint);line-height:1.45}

/* ---------------------------------------------------------------- calm */
/* On failure the whole screen becomes one calm sentence — on an authored flat
   ground, so its contrast owes nothing to whatever photograph was showing. */
.calm{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:clamp(1.5rem,8vw,6rem);
  background:linear-gradient(180deg,#141920 0%,#0d1116 55%,#080b0f 100%);
}
.calm p{
  margin:0;max-width:26ch;text-align:center;text-wrap:balance;
  font-size:clamp(1.15rem,3.6vw,2.7rem);line-height:1.42;font-weight:500;
  color:#e6ecf4;letter-spacing:-.012em;
}
.calm .kbd{font-size:.9em}

/* ---------------------------------------------------------------- language */
/* One corner glyph, and only ever the OTHER language — a single word, one tap.
   It obeys contrast rule 1 by being a .glass panel itself, it sits in the corner
   the bottom scrim already darkens, and at z-index 70 it stays reachable over the
   settings sheet and over the failure curtain — which is exactly the screen a Thai
   reader most needs to be able to switch. */
.lang{
  position:fixed;z-index:70;
  right:clamp(.6rem,2vw,1.6rem);bottom:clamp(.6rem,2vh,1.5rem);
  padding:.28rem .72rem;border-radius:999px;
  font:inherit;font-size:clamp(.64rem,1.5vh,.85rem);font-weight:640;
  line-height:1.6;letter-spacing:.02em;
  color:var(--dim);cursor:pointer;
  opacity:.72;transition:opacity .25s ease,color .25s ease;
  /* Its label is always the OTHER language, so one of the two is always Thai. */
  font-family:var(--f-th),var(--f-latin);
}
/* The English foot names the Thai option in Thai script — Latin from the design's
   own face, the one Thai word from a Thai face, by per-glyph fallback. */
html[lang="en"] #d-keys{font-family:var(--f-latin),var(--f-th)}
.lang:hover,.lang:focus-visible{opacity:1;color:var(--ink)}
.lang:focus-visible{outline:2px solid #6aa9e0;outline-offset:2px}

/* ---------------------------------------------------------------- thai */
/* Thai stacks ascenders and descenders (สั้ / ญู), so every line-height tuned for
   Latin has to open up or the tone marks are clipped by an ancestor that hides its
   overflow. Negative tracking jams Thai glyphs together, so it is zeroed. Thai has
   no word boundaries for the browser to break on, so long strings are told they may
   break anywhere — the readings never are, which is the "163." + "3" bug. */
html[lang="th"] .verdict{line-height:1.5;letter-spacing:0;overflow-wrap:anywhere}
html[lang="th"] .say{line-height:1.62;letter-spacing:0;overflow-wrap:anywhere}
html[lang="th"] .sub{line-height:1.6;overflow-wrap:anywhere}
html[lang="th"] .b-n{line-height:1.55}
html[lang="th"] .note{line-height:1.6}
html[lang="th"] .calm p{line-height:1.58;letter-spacing:0;max-width:30ch;overflow-wrap:anywhere}
html[lang="th"] .sheet p.why,html[lang="th"] .sheet .hint{line-height:1.62}
html[lang="th"] .seg b,html[lang="th"] .seg em{line-height:1.55}
html[lang="th"] .f label{line-height:1.6}
/* Word states only — a numeric reading keeps its tight leading and never wraps. */
html[lang="th"] .num[data-kind="word"]{line-height:1.4;letter-spacing:0}
html[lang="th"] .b-num[data-kind="word"]{line-height:1.4;letter-spacing:0}

/* ---------------------------------------------------------------- motion */
/* Frozen: no morph, no cross-fade, no breathing dot. The island is pinned open
   by script in this mode so nothing has to move to be readable. (The sky no
   longer drifts in any mode — see .sky above.) */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .sky{transform:none}
}

/* ------------------------------------------------------------------ demo ---
   ?demo= and nothing else turns this on. See DEMO MODE in the script.

   The marker is a SAFETY DEVICE, not part of the picture, so it is drawn in one
   fixed pair of colours that never tracks the EPA band. A green DEMO bar under a
   green "Good" wall would borrow the health signal it exists to withdraw. Fixed
   top AND bottom plus a ring around the viewport, so no crop of a photograph of
   this wall can lose it, and sized against the viewport rather than capped in
   rem: on a wall-sized screen a marker that stops growing stops being a marker.

   Nothing here is uppercased by CSS. Every capital is typed as a capital,
   because text-transform maps "µ" to "M" and turns µg/m³ into a 1000x lie. */
.wdemo{
  position:fixed;left:0;right:0;z-index:2147483000;
  display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;
  gap:.3em 1em;text-align:center;
  background:#12100a;color:#ffeec2;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  line-height:1.3;letter-spacing:.12em;
}
.wdemo-top{
  top:0;font-size:clamp(.78rem,2.35vmin,1.6rem);
  padding:clamp(.35rem,1.1vmin,.7rem) clamp(.6rem,2vw,1.4rem)
          calc(clamp(.35rem,1.1vmin,.7rem) + .6rem);
}
.wdemo-bot{
  bottom:0;font-size:clamp(.62rem,1.62vmin,1.1rem);
  padding:calc(clamp(.35rem,1.1vmin,.7rem) + .6rem) clamp(.6rem,2vw,1.4rem)
          clamp(.35rem,1.1vmin,.7rem);
}
/* The caution banding sits inside each bar's own box, reserved in padding, so a
   measured bar height is the whole marker and nothing sticks out unaccounted. */
.wdemo-top::after,.wdemo-bot::before{
  content:"";position:absolute;left:0;right:0;height:.6rem;
  background:repeating-linear-gradient(135deg,#ffb300 0 .8rem,#12100a .8rem 1.6rem);
}
.wdemo-top::after{bottom:0}
.wdemo-bot::before{top:0}
.wdemo b{font-weight:800;font-size:1.6em;letter-spacing:.3em;margin-right:-.3em;color:#ffb300}
/* Thai never takes the wide tracking — it pulls the combining marks apart. */
.wdemo .wd-th{letter-spacing:normal;font-size:1.12em;color:#ffd166}
.wdemo .wd-val{
  border:.14em solid #ffb300;padding:.1em .55em;max-width:100%;
  color:#fff6df;font-weight:700;letter-spacing:.04em;
  white-space:normal;                  /* the bar may wrap … */
}
.wdemo .wd-val .nb{white-space:nowrap} /* … but a number never leaves its unit */
.wdemo-ring{
  position:fixed;inset:0;z-index:2147482999;pointer-events:none;
  border:clamp(3px,.7vmin,10px) solid #ffb300;
}
html[lang="th"] .wdemo{letter-spacing:normal;line-height:1.6}
</style>
</head>
<body>

<div class="sky" id="sky-a" aria-hidden="true"></div>
<div class="sky" id="sky-b" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<main class="stage">
  <section class="island glass" id="island" data-open="0" data-live="0" tabindex="0"
           role="status" aria-live="polite" aria-label="Air quality right now">

    <div class="head">
      <span class="dot" id="k-dot"></span>
      <span class="read">
        <span class="num" id="k-num" data-kind="word">&mdash;</span>
        <span class="unit" id="k-unit"></span>
      </span>
      <span class="bandlab" id="k-band"></span>
      <span class="sep" aria-hidden="true"></span>
      <span class="verdict" id="k-verdict"></span>
      <span class="tally">
        <span class="pips" id="k-pips"></span>
        <span id="k-tally"></span>
      </span>
    </div>

    <div class="detail">
      <div class="detail-in">
        <div class="rule"></div>
        <p class="say" id="d-say"></p>
        <p class="sub" id="d-sub"></p>
        <div class="scale" id="d-scale" aria-hidden="true"></div>
        <div class="boards" id="d-boards"></div>
        <div class="extras" id="d-extras"></div>
        <div class="note" id="d-note"></div>
        <div class="foot">
          <span id="d-conn" class="mono"></span>
          <span id="d-keys"></span>
        </div>
      </div>
    </div>

  </section>
</main>

<aside class="sheet" id="sheet" hidden>
  <div class="sheet-card glass">
    <h2 data-t="sheet.title"></h2>
    <p class="why" data-t="sheet.why"></p>
    <form class="form" id="form" autocomplete="off">
      <div class="f"><label for="f-host" data-t="f.host"></label>
        <input id="f-host" name="host" spellcheck="false" required></div>
      <div class="f"><label for="f-port" data-t="f.port"></label>
        <input id="f-port" name="port" inputmode="numeric" required></div>
      <div class="f"><label for="f-user" data-t="f.user"></label>
        <input id="f-user" name="user" spellcheck="false"></div>
      <div class="f"><label for="f-pass" data-t="f.pass"></label>
        <input id="f-pass" name="pass" type="password" autocomplete="off"></div>
      <div class="f"><label for="f-filter" data-t="f.filter"></label>
        <input id="f-filter" name="filter" spellcheck="false" placeholder="dbk/"></div>
      <div class="f f-check"><input id="f-tls" name="tls" type="checkbox">
        <label for="f-tls" data-t="f.tls"></label></div>
      <div class="f f-check"><input id="f-remember" name="remember" type="checkbox">
        <label for="f-remember" data-t="f.remember"></label></div>
      <div class="f acts">
        <button type="submit" data-t="btn.connect"></button>
        <button type="button" class="ghost" id="btn-forget" data-t="btn.forget"></button>
        <button type="button" class="ghost" id="btn-close" data-t="btn.close"></button>
      </div>
    </form>
    <p class="hint" id="store-hint"></p>
  </div>
</aside>

<div class="calm" id="calm" hidden><p id="calm-text"></p></div>

<button type="button" class="lang glass" id="lang"></button>

      var id = e.board || e.title || e.stateTopic;
      var st = stateOf(e);
      var prev = out.get(id);
      if (prev && RANK[prev.state] >= RANK[st]) return;
      out.set(id, {
        id: id, ent: e, state: st,
        num: (st === 'live' && e.value && e.value.kind === 'number') ? e.value.n1 : null,
        text: e.value ? e.value.text : '',
        unit: e.unit || '', at: e.at, ghost: false
      });
    });
    // A board whose retained status we hold but whose sensor never announced itself
    // still gets said out loud — silence is not a state.
    boardStatus.forEach(function (v, id) {
      if (out.has(id)) return;
      out.set(id, {
        id: id, ent: null,
        state: (v.raw === 'offline') ? 'offline' : 'ghost',
        num: null, text: '', unit: '', at: v.at, ghost: true
      });
    });
    var list = [];
    out.forEach(function (v) { list.push(v); });
    // Stable, human order. Positions must not jump around on a wall.
    list.sort(function (a, b) { return String(a.id).localeCompare(String(b.id), undefined, { numeric:true }); });
    return list;
  }

  // ---------------------------------------------------------------- the sky
  // An unknown fleet must never show the clear dawn: a picture of good air when
  // nothing is measuring is a false all-clear. It gets an authored neutral ground
  // that is obviously not a photograph of anywhere.
  var GROUND_NONE =
    'linear-gradient(180deg,#1b212a 0%,#141a22 42%,#0c1015 100%)';

  function preload(imgName) { var im = new Image(); im.src = 'img/' + imgName + '.jpg'; }
  function preloadAround(key) {
    var i = IDX[key];
    if (i === undefined) return;
    if (BANDS[i - 1]) preload(BANDS[i - 1].img);
    if (BANDS[i + 1]) preload(BANDS[i + 1].img);
  }

  function paintSky(key) {
    if (key === curKey || key === pendingKey) return;
    pendingKey = key;
    var apply = function () {
      if (pendingKey !== key) return;          // a newer band won the race
      pendingKey = null;
      curKey = key;
      var back = (frontSky === skyA) ? skyB : skyA;
      back.style.backgroundImage = (key === 'none')
        ? GROUND_NONE
        : 'url("img/' + BY_KEY[key].img + '.jpg")';
      back.classList.add('on');
      if (frontSky && frontSky !== back) frontSky.classList.remove('on');
      frontSky = back;
      preloadAround(key);
    };
    if (key === 'none') { apply(); return; }
    // Decode before swapping so a cross-fade never fades in through white.
    var im = new Image();
    im.onload = apply;
    im.onerror = apply;                        // a missing file must not freeze the wall
    im.src = 'img/' + BY_KEY[key].img + '.jpg';
    if (im.complete) apply();
  }

  // ---------------------------------------------------------------- island
  function bump(ms) {
    if (reduced) return;                       // frozen open; nothing moves
    var until = Date.now() + (ms || TOUCH_MS);
    if (until > openUntil) openUntil = until;
    setAttr(island, 'data-open', '1');
  }
  function collapse() { if (!reduced && !pinned) { openUntil = 0; setAttr(island, 'data-open', '0'); } }

  // The scale strip is rebuilt on a language change — its labels are the band names.
  var SEGS = null;
  function buildScale() {
    var host = $('d-scale'), html = '';
    for (var i = 0; i < BANDS.length; i++) {
      html += '<div class="seg" data-k="' + BANDS[i].key + '" data-on="0" style="--c:var(' + BANDS[i].v + ')">' +
              '<i></i><b>' + esc(t('band.' + BANDS[i].tk)) + '</b><em>' + esc(BANDS[i].r) + '</em></div>';
    }
    host.innerHTML = html;
    SEGS = host.querySelectorAll('.seg');
  }
  buildScale();

  function unknownSay(list, liveCount) {
    if (!list.length) return t('say.none.noboards');
    var off = 0;
    for (var i = 0; i < list.length; i++) if (list[i].state === 'offline') off++;
    if (off === list.length) return t('say.none.alloff', { n:off });
    if (!liveCount) return t('say.none.waiting');
    return t('say.none.short');
  }

  var lastKey = null, everData = false;

  function paint() {
    var list = roster();
    var live = 0, offline = 0, worst = null;
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (r.state === 'live') { live++; if (r.num !== null && (!worst || r.num > worst.num)) worst = r; }
      if (r.state === 'offline') offline++;
    }

    var band = worst ? bandFor(worst.num) : null;
    var key = band ? band.key : 'none';

    // ---- the photograph is the reading
    paintSky(key);

    // ---- band change opens the island, and says so
    if (key !== lastKey) {
      if (lastKey !== null) bump(HOLD_MS);
      lastKey = key;
    }
    if (worst && !everData) { everData = true; bump(HOLD_MS); }

    island.style.setProperty('--band', band ? css(band.v) : css('--faint'));
    setAttr(island, 'data-live', live ? '1' : '0');
    setAttr(island, 'data-band', key);

    // ---- head
    var num = $('k-num');
    if (worst) {
      setText(num, worst.text);
      setAttr(num, 'data-kind', 'num');
      setText($('k-unit'), worst.unit);
    } else {
      setText(num, '—');
      setAttr(num, 'data-kind', 'word');
      setText($('k-unit'), '');
    }
    setAttr(num, 'data-long', num.textContent.length > 7 ? '1' : '0');

    setText($('k-band'), band ? t('band.' + band.tk) : t('band.none'));
    setText($('k-verdict'), band ? t('verdict.' + band.tk) : t('verdict.unknown'));

    // ---- pips: three boards, and two of them are normally hollow rings
    var pips = '';
    for (var p = 0; p < list.length; p++) pips += '<span class="pip" data-s="' + esc(list[p].state) + '"></span>';
    setHTML($('k-pips'), pips);
    setText($('k-tally'), list.length
      ? t('tally.live', { a:live, b:list.length })
      : t('tally.none'));

    // ---- the sentence
    setText($('d-say'), band ? t('say.' + band.tk) : unknownSay(list, live));

    var subBits = [];
    if (worst) {
      subBits.push((live > 1 ? t('sub.worst', { n:live }) : t('sub.one')) +
                   ' · ' + worst.id + ' · ' + t('sub.updated', { t:ago(worst.at) }));
    } else if (list.length) {
      subBits.push(t('sub.counts', { a:live, b:offline, c:list.length }));
    }
    if (band) subBits.push(t('scale.epa') + ': ' + t('band.' + band.tk));
    setText($('d-sub'), subBits.join(' · '));

    // ---- scale
    for (var s = 0; s < SEGS.length; s++) {
      setAttr(SEGS[s], 'data-on', (band && SEGS[s].getAttribute('data-k') === band.key) ? '1' : '0');
    }

    // ---- boards
    var bh = '';
    for (var j = 0; j < list.length; j++) {
      var d = list[j];
      var big, kind, foot, colour;
      if (d.state === 'live') {
        big = d.text; kind = 'num';
        var db = bandFor(d.num);
        colour = db ? css(db.v) : css('--ink');
        foot = (db ? t('band.' + db.tk) : t('state.live')) + ' · ' + ago(d.at);
      } else if (d.state === 'offline') {
        big = t('state.offline'); kind = 'word'; colour = css('--dim');
        foot = (d.ent && d.ent.value && d.ent.value.kind === 'number')
          ? t('tile.lastreading', {
              v: d.ent.value.text + (d.unit ? ' ' + d.unit : ''),   // unit comes off the wire
              t: ago(d.at)
            })
          : t('tile.noreading');
        var seen = (d.ent && d.ent.availAt) || (boardStatus.has(d.id) ? boardStatus.get(d.id).at : 0);
        foot += ' · ' + t('tile.reportedoff', { t:ago(seen) });
      } else if (d.state === 'waiting') {
        big = '—'; kind = 'word'; colour = css('--faint');
        foot = t('tile.waitingfirst');
      } else if (d.state === 'stale') {
        big = d.text; kind = 'num'; colour = css('--dim');
        foot = t('tile.expired', { t:ago(d.at) });
      } else if (d.state === 'fault') {
        big = d.text; kind = 'word'; colour = css('--band-mod');
        foot = t('tile.fault');
      } else if (d.state === 'ghost') {
        big = t('tile.nosensor'); kind = 'word'; colour = css('--faint');
        foot = t('tile.ghost');
      } else {
        // d.text is whatever the board actually published ("unavailable", "nan"):
        // wire text, printed as it came and never translated or recased.
        big = d.text || t('state.noreading'); kind = 'word'; colour = css('--faint');
        foot = t('tile.unusable');
      }
      bh += '<article class="b" data-s="' + esc(d.state) + '" style="--band:' + esc(colour) + '">' +
              '<div class="b-id">' + esc(d.id) + '</div>' +
              '<div class="b-v"><span class="b-num" data-kind="' + kind + '" data-long="' +
                (String(big).length > 7 ? '1' : '0') + '">' + esc(big) + '</span>' +
                '<span class="b-u">' + (kind === 'num' ? esc(d.unit) : '') + '</span></div>' +
              '<div class="b-n">' + esc(foot) + '</div>' +
            '</article>';
    }
    setHTML($('d-boards'), bh || '<div class="b-n">' + esc(t('tile.empty')) + '</div>');

    // ---- extras from the board we are quoting
    var src = worst || null;
    if (!src) { for (var q = 0; q < list.length; q++) if (list[q].state !== 'offline' && extras.has(list[q].id)) { src = list[q]; break; } }
    var ex = src && extras.get(src.id);
    if (ex && ex.size) {
      var eh = '<span class="ex-h">' + esc(t('tile.alsoreports', { id:src.id })) + '</span>';
      for (var k = 0; k < EXTRA_KEYS.length; k++) {
        var ky = EXTRA_KEYS[k];
        if (!ex.has(ky)) continue;
        var val = ex.get(ky).text;
        // Units are only ever asserted where the wire told us one: PM1.0 and PM10
        // borrow the unit this board published in its own PM2.5 discovery config.
        var u = (ky === 'pm1_0' || ky === 'pm10') ? (src.unit || '')
              : (ky === 'wi-fi_rssi' ? 'dBm' : '');
        eh += '<span class="ex"><b>' + esc(EXTRA_TK[ky] ? t(EXTRA_TK[ky]) : ky) + '</b>' +
              '<span>' + esc(val) + '</span>' + (u ? '<i>' + esc(u) + '</i>' : '') + '</span>';
      }
      setHTML($('d-extras'), eh);
    } else {
      setHTML($('d-extras'), '');
    }

    // ---- foot
    setText($('d-conn'), (CONN_TK[connState] ? t(CONN_TK[connState]) : connState) + ' · ' + hostLabel +
      ' · ' + t('foot.sensors', { n:entities.size, s:(entities.size === 1 ? '' : 's') }) +
      (filteredOut.size ? ' · ' + t('foot.hidden', { n:filteredOut.size }) : ''));
    setText($('d-note'), noteState ? t(noteState.key, liveVars(noteState.vars)) : '');

    // ---- auto-contract
    if (!reduced && !pinned && openUntil && Date.now() > openUntil) collapse();
  }

  // ---------------------------------------------------------------- calm screen
  // The curtain is a list of parts: { k:'a key' } resolves through t() every time it
  // is drawn, { s:'…' } is a message straight off the wire and is printed as it came.
  // Holding parts rather than a finished sentence is what lets the language switch
  // repaint the failure screen — which is exactly the screen a Thai reader is most
  // likely to be looking at when they reach for the switch.
  function calm(parts) { calmState = parts; renderCalm(); }
  function renderCalm() {
    if (!calmState) return;
    var out = [];
    for (var i = 0; i < calmState.length; i++) {
      var p = calmState[i];
      if (!p) continue;                       // a part that adds nothing is left out
      out.push(p.k ? t(p.k) : String(p.s !== undefined ? p.s : p));
    }
    setText($('calm-text'), out.join(' '));
    $('calm').hidden = false;
  }
  function uncalm() { calmState = null; $('calm').hidden = true; }

  // ---------------------------------------------------------------- connect
  var hostLabel = '—';

  // Returns a KEY where the reason is one we recognise, and only falls back to the
  // library's own English message where it is not.
  function describe(err) {
    var code = err && (err.code !== undefined ? err.code : err.reasonCode);
    // Code 5, "not authorised", is already exactly what conn.refused says — in Thai
    // word for word ("เข้าระบบไม่ได้ บัญชีนี้ไม่มีสิทธิ์"). It maps to nothing so the
    // curtain states it once instead of stuttering.
    var map = {
      1:'err.protocol', 2:'err.clientid', 3:'err.unavailable',
      4:'err.badauth',  5:''
    };
    if (Object.prototype.hasOwnProperty.call(map, code)) {
      return { key:map[code], fatal:code === 2 || code === 4 || code === 5 };
    }
    var m = String((err && err.message) || err || 'unknown error');
    if (/not authoriz|bad user/i.test(m)) return { text:m, fatal:true };
    return { text:m, fatal:false };
  }

  function disconnect() {
    manualStop = true;
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    subs.clear();
    extraSubbed.clear();
  }


  /* ===================================================================
     DEMO MODE — opt-in from the address bar, and from nowhere else.

       ?demo=163.3     every board publishes that value
       ?demo=<band>    good | moderate | sensitive | unhealthy | verybad | hazardous
       ?demo=cycle     all six bands in turn, four seconds each (also the empty value)
       ?demo=mixed     the fleet as it usually is: one live, one stale, one dark

     Why this is safe to leave in a file that hangs on a school wall:

       1. It cannot start itself. One switch, in the URL. Nothing is written to
          storage and nothing defaults to it, so a reload without the parameter
          is an ordinary wall display again, byte for byte.
       2. It never opens a socket. connect() refuses outright while DEMO is set,
          and subRaw() returns before it can reach a client — so real air and
          invented air can never appear on one screen.
       3. It cannot be missed or cropped away: two fixed bars, top and bottom, a
          ring around the whole viewport, and "DEMO ·" in the tab title. The bars
          carry the VALUE being simulated, not merely the word DEMO.
       4. It renders through the SHIPPED path. The scene is emitted as discovery
          configs and state payloads — the same abbreviated-key JSON and the same
          UTF-8 bytes a board puts on the wire — and pushed through onDiscovery()
          and onMessage(). There is no second renderer, so the alias expansion,
          the wildcard refusal, the unique_id eviction, the EPA truncate-then-band
          and the availability rules all still run, and the band-reactive backdrop
          is swapped by exactly the code the broker drives.

     An unrecognised value FAILS TOWARD THE DEMO, never toward live air: whoever
     typed ?demo= is shown the mixed fleet with their token echoed back and
     crossed out. Silently handing them today's real reading, under an expectation
     of a simulation, is the more dangerous of the two answers — it is the one
     that can send a child outside during a hazardous episode.
     =================================================================== */

  // Written as escapes, not as a literal: the micro sign and the letter M are one
  // careless transform apart, and µg/m³ read as mg/m³ is a 1000x lie about the air.
  // Spelled this way no editor, pipeline or copy-paste can bend it.
  var DEMO_UNIT = '\u00b5g/m\u00b3';

  // A value from the middle of each band, so a screenshot shows that band's
  // colour and wording rather than an edge case that could belong to either
  // neighbour. `wire` is the English payload a board publishes on
  // air_quality_level — it is data, not display copy, and is never shown as-is.
  var DEMO_BANDS = [
    { key:'good',      max:12.0,     mid:6,   wire:'Good' },
    { key:'moderate',  max:35.4,     mid:24,  wire:'Moderate' },
    { key:'sensitive', max:55.4,     mid:45,  wire:'Unhealthy for Sensitive Groups' },
    { key:'unhealthy', max:150.4,    mid:103, wire:'Unhealthy' },
    { key:'verybad',   max:250.4,    mid:200, wire:'Very Unhealthy' },
    { key:'hazardous', max:Infinity, mid:320, wire:'Hazardous' }
  ];

  var demoBad = '';                  // the token that was not understood, as typed
  var DEMO = readDemo();             // decided ONCE, here, and never re-read
  var demoStep = 0, demoStarted = false, demoDeclared = false;
  var demoValEl = null, demoTopEl = null, demoBotEl = null, demoFootEl = null;
  var demoLast = null;

  function demoBandOf(n) {
    for (var i = 0; i < DEMO_BANDS.length; i++) { if (n <= DEMO_BANDS[i].max) return DEMO_BANDS[i]; }
    return DEMO_BANDS[DEMO_BANDS.length - 1];
  }
  function demoByKey(k) {
    for (var i = 0; i < DEMO_BANDS.length; i++) { if (DEMO_BANDS[i].key === k) return DEMO_BANDS[i]; }
    return null;
  }

  function readDemo() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return null; }
    if (!q.has('demo')) return null;              // the real wall, untouched
    var raw = q.get('demo');
    var s = String(raw == null ? '' : raw).trim().toLowerCase();
    if (s === '' || s === 'cycle') return { mode:'cycle' };
    if (s === 'mixed') return { mode:'mixed' };
    var b = demoByKey(s);
    if (b) return { mode:'value', value:b.mid };
    // Digits only. Number('') is 0 and Number('-') is NaN; letting either through
    // would answer a question nobody asked with a confident green zero.
    if (/^\d+(\.\d+)?$/.test(s)) return { mode:'value', value:Number(s) };
    demoBad = String(raw);
    return { mode:'mixed' };
  }

  // Truncate, never round — the same rule the shipped parser applies to a payload.
  function demoTrunc(n) { return Math.trunc(n * 10) / 10; }

  var demoEnc = (typeof TextEncoder === 'function') ? new TextEncoder() : null;

  // Exactly the bytes a board puts on the wire, into the handler the broker feeds.
  // Encoded rather than handed over as a string so the UTF-8 decode that protects
  // µ is part of what the demo exercises.
  function demoPublish(topic, text) {
    var s = String(text);
    try { onMessage(topic, demoEnc ? demoEnc.encode(s) : s); }
    catch (e) { /* one bad synthetic message must not stop the scene */ }
  }

  // DBK-002 publishes more than PM2.5; the other two send PM2.5 only, which is
  // itself worth demonstrating — a dense layout has to survive both.
  var DEMO_EXTRA = [
    { leaf:'pm1_0',             name:'PM1.0',             cls:'pm1',             unit:DEMO_UNIT },
    { leaf:'pm10',              name:'PM10',              cls:'pm10',            unit:DEMO_UNIT },
    { leaf:'wi-fi_rssi',        name:'WiFi Signal',       cls:'signal_strength', unit:'dBm' },
    { leaf:'uptime',            name:'Uptime',            cls:'duration',        unit:'s' },
    { leaf:'air_quality_level', name:'Air Quality Level', cls:'',                unit:'' }
  ];

  function demoDeclare(id) {
    var slug = id.toLowerCase();
    var list = [{ leaf:'pm2_5', name:'PM2.5', cls:'pm25', unit:DEMO_UNIT }];
    if (id === 'DBK-002') list = list.concat(DEMO_EXTRA);
    list.forEach(function (s) {
      // Abbreviated keys and a '~' base on purpose: alias expansion is part of
      // what a demo has to prove still works, not something to step around.
      var cfg = {
        '~': 'dbk/' + id,
        name: s.name,                 // every board calls its sensor the same thing —
        stat_t: '~/' + s.leaf,        // identity has to come from the board id
        avty_t: '~/status',
        uniq_id: slug + '-' + s.leaf,
        exp_aft: 900,
        dev: { name: 'Kit4Kids ' + id, ids: [slug] }
      };
      if (s.unit) { cfg.unit_of_meas = s.unit; cfg.stat_cla = 'measurement'; }
      if (s.cls) cfg.dev_cla = s.cls;
      demoPublish('homeassistant/sensor/' + slug + '/' + s.leaf + '/config', JSON.stringify(cfg));
    });
  }

  // When a message arrived is the only thing that makes a reading stale, so
  // back-date the very field onMessage() just wrote. No parallel clock and no
  // second state model — the shipped expiry rule still decides.
  function demoAge(id, secondsAgo) {
    if (!secondsAgo) return;
    var t0 = Date.now() - secondsAgo * 1000;
    entities.forEach(function (e) { if (e.board === id && e.at) e.at = t0; });
  }

  function demoScene() {
    if (DEMO.mode === 'mixed') {
      // What the fleet actually looks like most days, and the layout that breaks
      // first: a three-digit reading beside two boards with nothing to say. 163.3
      // is the string that once wrapped between "163." and "3"; it stays here as
      // a regression test.
      return [
        { id:'DBK-001', up:true,  pm:41.8,  age:26 * 60 },   // older than expire_after
        { id:'DBK-002', up:true,  pm:163.3, age:11 },
        { id:'DBK-010', up:false, pm:24.6,  age:4 * 3600 }
      ];
    }
    var v = (DEMO.mode === 'cycle')
      ? DEMO_BANDS[demoStep % DEMO_BANDS.length].mid
      : DEMO.value;
    return [
      { id:'DBK-001', up:true, pm:v, age:9 },
      { id:'DBK-002', up:true, pm:v, age:6 },
      { id:'DBK-010', up:true, pm:v, age:14 }
    ];
  }

  function demoApply() {
    var scene = demoScene();
    if (!demoDeclared) { scene.forEach(function (b) { demoDeclare(b.id); }); demoDeclared = true; }
    scene.forEach(function (b) {
      var pm = demoTrunc(b.pm);
      demoPublish('dbk/' + b.id + '/status', b.up ? 'online' : 'offline');
      demoPublish('dbk/' + b.id + '/pm2_5', pm.toFixed(1));
      if (b.id === 'DBK-002') {
        // Derived from the same reading rather than invented separately: a PM1
        // that contradicts PM2.5 teaches a wrong shape to anyone reading a dense
        // board.
        demoPublish('dbk/DBK-002/pm1_0', demoTrunc(b.pm * 0.62).toFixed(1));
        demoPublish('dbk/DBK-002/pm10',  demoTrunc(b.pm * 1.45).toFixed(1));
        demoPublish('dbk/DBK-002/wi-fi_rssi', '-58');
        demoPublish('dbk/DBK-002/uptime', String(93124 + demoStep * 4));
        demoPublish('dbk/DBK-002/air_quality_level', demoBandOf(pm).wire);
      }
      demoAge(b.id, b.age);
    });
    demoLast = scene;
    demoMark(scene);
    paint();
  }

  /* -------------------------------------------------- the non-negotiable bit --
     Two fixed bars and a ring. They do not fade, they do not scroll away, they
     cannot be dismissed, and they carry the word DEMO, the Thai ตัวอย่าง, and the
     VALUE being simulated — "DEMO" alone leaves a reader wondering which part of
     the screen is pretending. */
  function demoMark(scene) {
    if (!demoValEl) return;
    var parts = [];
    if (DEMO.mode === 'mixed') {
      scene.forEach(function (b) {
        parts.push(b.id + ' ' + (!b.up ? 'offline'
          : b.age > 900 ? 'stale'
          : demoTrunc(b.pm).toFixed(1) + ' ' + DEMO_UNIT));
      });
    } else {
      var v = demoTrunc(scene[0].pm);
      parts.push('every board at ' + v.toFixed(1) + ' ' + DEMO_UNIT +
                 ' · ' + demoBandOf(v).wire);
      // A glyph and a duration rather than a clause: this fragment has no
      // reviewed Thai and needs none, because it is not words.
      if (DEMO.mode === 'cycle') parts.push('↻ 4s');
    }
    // Echoed back exactly as typed, with a cross. Whoever put a bad token in the
    // address bar reads their own token, in whatever language they typed it.
    if (demoBad) parts.push('?demo=' + demoBad + ' ✗');

    demoValEl.textContent = '';
    parts.forEach(function (p, i) {
      if (i) demoValEl.appendChild(document.createTextNode(' · '));
      var s = document.createElement('span');
      s.className = 'nb';
      s.textContent = p;
      demoValEl.appendChild(s);
    });
  }

  function demoBar(cls) {
    var el = document.createElement('div');
    el.className = 'wdemo ' + cls;
    var w = document.createElement('b');
    w.textContent = 'DEMO';
    var th = document.createElement('span');
    th.className = 'wd-th';
    th.textContent = 'ตัวอย่าง';   // ตัวอย่าง
    el.appendChild(w);
    el.appendChild(th);
    return el;
  }

  // The warning is printed in BOTH languages, always, whatever the wall is set
  // to. It is a safety marker, not copy: a Thai-speaking child and an
  // English-reading visitor must both be told these numbers are invented, and
  // neither of them pressed the language button.
  function demoBuild() {
    document.documentElement.setAttribute('data-demo', DEMO.mode);

    var top = demoBar('wdemo-top');
    top.setAttribute('role', 'status');
    var en = document.createElement('span');
    en.textContent = 'SIMULATED DATA, NOT A REAL READING';
    var th = document.createElement('span');
    th.className = 'wd-th';
    th.textContent = 'ข้อมูลตัวอย่าง ' +
                     'ไม่ใช่ค่าจริง';
    demoValEl = document.createElement('span');
    demoValEl.className = 'wd-val';
    top.appendChild(en);
    top.appendChild(th);
    top.appendChild(demoValEl);

    var bot = demoBar('wdemo-bot');
    demoFootEl = document.createElement('span');
    demoFootEl.textContent = 'every number on this screen is invented for design testing · ' +
      'no broker is connected · remove ?demo= from the address for the real wall';
    var botTh = document.createElement('span');
    botTh.className = 'wd-th';
    botTh.textContent = 'ทุกตัวเลขสร้าง' +
      'ขึ้นมาเพื่อทดสอบหน้าจอ';
    bot.appendChild(demoFootEl);
    bot.appendChild(botTh);

    var ring = document.createElement('div');
    ring.className = 'wdemo-ring';
    ring.setAttribute('aria-hidden', 'true');

    document.body.appendChild(top);
    document.body.appendChild(bot);
    document.body.appendChild(ring);
    demoTopEl = top; demoBotEl = bot;
  }

  function demoStart() {
    if (demoStarted) return;             // connect() can be called again from the
    demoStarted = true;                  // settings sheet; the demo starts once
    document.title = 'DEMO · ' + document.title;
    // The pill must not go on saying "connecting…" while nothing is connecting.
    // The words go into the language tables rather than straight into the DOM, so
    // a language switch relabels them like any other word on the wall.
    try {
      STR.en['conn.demo'] = 'demo · no broker';
      STR.th['conn.demo'] = 'ตัวอย่าง · ' +
                            'ไม่ได้ต่อ broker';
      CONN_TK.demo='conn.demo'; connState='demo';
    } catch (e) {}
    demoBuild();
    demoApply();
    // Re-assert the scene. Without this a static demo drifts past expire_after and
    // starts describing itself as stale; re-applying is idempotent, including the
    // back-dating that keeps the deliberately stale board stale.
    setInterval(function () {
      if (DEMO.mode === 'cycle') demoStep++;
      demoApply();
    }, DEMO.mode === 'cycle' ? 4000 : 15000);
  }

  function connect(cfg) {
    // The one gate that makes demo mode safe on a health display: while ?demo= is
    // set no socket is opened, from here or from the settings sheet, so real air
    // and invented air can never be on one screen.
    if (DEMO) { demoStart(); return; }

    if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
      connState = 'fatal';
      calm([{ k:'calm.nolib' }, { k:'conn.hint' }]);
      return;
    }

    disconnect();
    manualStop = false;
    everConnected = false;
    attemptAt = Date.now();
    noteState = null;
    activeFilter = typeof cfg.filter === 'string' ? cfg.filter.trim() : '';
    filteredOut.clear();

    var url = (cfg.tls ? 'wss' : 'ws') + '://' + cfg.host + ':' + cfg.port;
    hostLabel = cfg.host + ':' + cfg.port;
    connState = 'connecting';

    if (!cfg.tls && location.protocol === 'https:') {
      note('note.httpsws');
    }

    try {
      client = mqtt.connect(url, {
        username: cfg.user || undefined,
        password: cfg.pass || undefined,
        clientId: 'island-' + Math.random().toString(16).slice(2, 10),
        clean: true,
        reconnectPeriod: 4000,
        connectTimeout: 8000,
        keepalive: 45,
        resubscribe: true
      });
    } catch (e) {
      connState = 'fatal';
      calm([{ k:'calm.nostart' }, { k:'conn.hint' }]);
      return;
    }

    client.on('connect', function () {
      everConnected = true;
      connectedAt = Date.now();
      connState = 'connected';
      uncalm();
      // Bounded discovery wildcards — the only wildcards this page may subscribe to,
      // authored here, never taken from a payload.
      subRaw('homeassistant/+/+/config');
      subRaw('homeassistant/+/+/+/config');
      subRaw('dbk/+/status');
      paint();
    });

    client.on('message', function (topic, payload) {
      try { onMessage(topic, payload); }
      catch (e) { /* one bad message must never stop the stream */ }
    });

    client.on('reconnect', function () { if (!manualStop && connState !== 'fatal') connState = 'reconnecting'; });
    client.on('offline', function () { if (!manualStop && connState !== 'fatal') connState = 'reconnecting'; });

    // A browser never reveals why a WebSocket handshake failed, and for a refused
    // port mqtt.js may close without ever emitting a useful 'error'.
    client.on('close', function () {
      if (manualStop || connState === 'fatal') return;
      if (!everConnected) {
        connState = 'error';
        if (Date.now() - attemptAt > GIVE_UP_MS) {
          calm([{ k:'conn.unreachable' }, { k:'conn.hint' }]);
        }
      } else {
        connState = 'reconnecting';
        note('note.dropped');
      }
    });

    client.on('error', function (err) {
      var d = describe(err);
      if (d.fatal) {
        connState = 'fatal';
        manualStop = true;
        try { client.end(true); } catch (e) {}
        client = null;
        calm([{ k:'conn.refused' },
               (d.key ? { k:d.key } : (d.text ? { s:d.text } : null)),
               { k:'conn.hint' }]);
      } else {
        connState = 'error';
        if (Date.now() - attemptAt > GIVE_UP_MS) {
          calm([{ k:'conn.unreachable' }, { k:'conn.hint' }]);
        }
      }
    });
  }

  // ---------------------------------------------------------------- settings
  var sheet = $('sheet'), form = $('form');
  function readForm() {
    return {
      host: $('f-host').value.trim(), port: $('f-port').value.trim(),
      user: $('f-user').value, pass: $('f-pass').value,
      tls: $('f-tls').checked, filter: $('f-filter').value.trim(),
      remember: $('f-remember').checked
    };
  }
  function fillForm(v) {
    $('f-host').value = (v && v.host) || DEFAULT_HOST;
    $('f-port').value = (v && v.port) || DEFAULT_PORT;
    $('f-user').value = (v && v.user) || '';
    $('f-pass').value = (v && v.pass) || '';
    $('f-tls').checked = !!(v && v.tls);
    $('f-filter').value = v && typeof v.filter === 'string' ? v.filter : DEFAULT_FILTER;
    $('f-remember').checked = !!(v && (v.remember || v.pass));
  }
  // What goes to disk is not what is in the form: the passphrase is opt-in.
  function storable(cfg) {
    var out = { host:cfg.host, port:cfg.port, user:cfg.user, tls:cfg.tls,
                filter:cfg.filter, remember:!!cfg.remember };
    if (cfg.remember) out.pass = cfg.pass;
    return out;
  }
  // Which hint the sheet is showing is state, not text: remembered so a language
  // switch with the sheet open repaints the right one.
  var hintKey = null;
  function setHint(key) { hintKey = key; setText($('store-hint'), key ? t(key) : ''); }
  function openSheet() {
    sheet.hidden = false;
    setHint(storeWorks ? 'hint.store' : 'hint.nostore');
    setTimeout(function () { $('f-host').focus(); }, 30);
  }
  function closeSheet() { sheet.hidden = true; island.focus(); }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var cfg = readForm();
    if (!cfg.host || !cfg.port) return;
    entities.clear(); byState.clear(); byAvail.clear(); byUid.clear();
    boardStatus.clear(); extras.clear(); filteredOut.clear();
    parseErrors = 0; lastKey = null; everData = false;
    saveStore(storable(cfg));
    closeSheet();
    uncalm();
    connect(cfg);
    paint();
  });
  $('btn-forget').addEventListener('click', function () {
    clearStore(); fillForm(null); $('f-pass').value = '';
    setHint('hint.cleared');
  });
  $('btn-close').addEventListener('click', closeSheet);

  // ---------------------------------------------------------------- language
  var langBtn = $('lang');

  // Everything written once rather than every frame; paint() covers the rest.
  function applyStatic() {
    // <html lang> drives line-breaking, font selection and the Thai leading rules.
    document.documentElement.lang = LANG;
    document.title = t('page.title');
    setAttr(island, 'aria-label', t('aria.island'));

    var nodes = document.querySelectorAll('[data-t]');
    for (var i = 0; i < nodes.length; i++) setText(nodes[i], t(nodes[i].getAttribute('data-t')));

    // The two shortcut letters are keycaps, so this one line is built as HTML.
    setHTML($('d-keys'), esc(t('foot.keys'))
      .replace('{k}', '<span class="kbd">S</span>')
      .replace('{l}', '<span class="kbd">L</span>'));

    setText(langBtn, t('lang.other'));
    setAttr(langBtn, 'aria-label', t('lang.aria'));
    setAttr(langBtn, 'title', t('lang.aria'));
    setAttr(langBtn, 'lang', LANG === 'th' ? 'en' : 'th');   // the label is the other one

    if (hintKey) setHint(hintKey);
  }

  // Switching NEVER reloads. The MQTT connection, every retained reading, the open
  // island and the photograph on screen all survive it, and the wall does not flash.
  function setLang(next) {
    if (next !== 'th' && next !== 'en') return;
    LANG = next;
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
    // ?lang= outranks localStorage on load, so a click has to clear it — otherwise
    // the choice would silently revert the next time a kiosk URL is refreshed.
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('lang') !== null) {
        q.delete('lang');
        var rest = q.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
      }
    } catch (e) {}
    applyStatic();
    buildScale();     // its labels are band names
    renderCalm();     // repaint the failure curtain if it is the thing on screen
    paint();
  }
  function toggleLang() { setLang(LANG === 'th' ? 'en' : 'th'); }

  langBtn.addEventListener('click', function (ev) { ev.stopPropagation(); toggleLang(); });

  // ---------------------------------------------------------------- input
  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
    if (ev.key === 'Escape') {
      if (!sheet.hidden) { closeSheet(); return; }
      pinned = false; collapse(); return;
    }
    if (typing) return;
    if (ev.key === 's' || ev.key === 'S') {
      ev.preventDefault();
      if (sheet.hidden) openSheet(); else closeSheet();
      return;
    }
    // "l" for language — deliberately not "t", which is one slip from "s".
    if (ev.key === 'l' || ev.key === 'L') {
      ev.preventDefault();
      toggleLang();
      return;
    }
    bump(TOUCH_MS);
  });
  island.addEventListener('click', function () {
    if (reduced) return;
    if (island.getAttribute('data-open') === '1' && pinned) { pinned = false; collapse(); }
    else { pinned = true; bump(HOLD_MS); }
  });
  island.addEventListener('pointerenter', function () { bump(TOUCH_MS); });
  document.addEventListener('pointermove', function () {
    if (openUntil - Date.now() < 3000) bump(TOUCH_MS);
  }, { passive: true });
  document.addEventListener('touchstart', function () { bump(TOUCH_MS); }, { passive: true });

  // ---------------------------------------------------------------- boot
  // No configuration screen on load. Stored settings first, then ?u=&p= from the
  // URL, then an anonymous connection to the lab broker.
  (function boot() {
    var saved = loadStore();
    var q = null;
    try { q = new URLSearchParams(location.search); } catch (e) {}
    var qp = function (k) { return (q && q.get(k)) || ''; };

    var cfg;
    if (saved && saved.host && saved.port) {
      cfg = {
        host: saved.host, port: saved.port,
        user: saved.user || qp('u'),
        pass: saved.pass || qp('p'),
        tls: !!saved.tls,
        filter: typeof saved.filter === 'string' ? saved.filter : DEFAULT_FILTER,
        remember: !!saved.remember
      };
    } else {
      cfg = {
        host: qp('h') || DEFAULT_HOST,
        port: qp('port') || DEFAULT_PORT,
        user: qp('u'), pass: qp('p'),
        tls: qp('tls') === '1',
        filter: DEFAULT_FILTER,
        remember: false
      };
    }

    // Credentials passed in the address bar do not belong on a wall screen where
    // anyone can read them. Take them, then wipe them out of the visible URL.
    if (q && (q.get('u') || q.get('p'))) {
      try {
        q.delete('u'); q.delete('p');
        var rest = q.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
      } catch (e) {}
    }

    applyStatic();                    // before anything is drawn, so nothing flashes English
    fillForm(cfg);
    paintSky('none');                 // never the clear dawn before a reading exists
    if (reduced) { setAttr(island, 'data-open', '1'); pinned = true; }
    connect(cfg);
    paint();

    setInterval(paint, 1000);
    // Every band is in the cache long before it is needed, so a change is a
    // cross-fade and never a white flash.
    setTimeout(function () { for (var i = 0; i < BANDS.length; i++) preload(BANDS[i].img); }, 4000);
  })();

})();
</script>
</body>
</html>
