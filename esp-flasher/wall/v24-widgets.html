<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Widgets — Kit4Kids PM2.5</title>
<style>
/* ===========================================================================
   v24 — WIDGETS.  A home screen, not a dashboard.

   The wallpaper is the reading: one of six photographs of the same valley,
   swapped to whatever the worst live board is measuring right now. Widgets are
   iOS-sized glass tiles floating on it — 4x4 large, 2x2 small, 4x2 medium,
   full-width accessory.

   ---------------------------------------------------------------------------
   LEGIBILITY — the whole reason the numbers below are not round numbers.
   The six wallpapers span an enormous brightness range: the brightest 1/384th
   patch of moderate.jpg has relative luminance 0.94 (near-white), of
   hazardous.jpg 0.115 (near-black). One text colour cannot survive both, so
   the ground is NORMALISED before any type touches it:

     1. base scrim   rgba(7,10,16,.26) flat over the whole photograph
     2. glass tiles  backdrop-filter: … brightness(.34) — this darkens ONLY the
        pixels behind a tile, so the exposed wallpaper stays bright enough to
        read as a photograph while the tile interior collapses into a narrow
        band. Measured on the brightest cell of each image, the ground behind
        tile text lands at L 0.0077 (hazardous) … 0.0258 (moderate).
     3. tile fill    rgba(13,17,24,.40) on top of that.

   Measured worst case across ALL SIX photographs, brightest-patch, every ink:
        on glass                 6.41:1   (unhealthy red on the moderate dawn)
        no backdrop-filter       7.39:1   (the @supports fallback below)
        white on glass          13.84:1
   The status bar and the dock are the only text OUTSIDE a widget, so they are
   measured differently — against the single brightest pixel of each photograph,
   not a patch average, because the wallpaper is nearly sharp and that pixel can
   really land under a glyph. Under the edge gradients as they now stand, over
   the worst ground (moderate.jpg):
        status bar --ink          ~8.6:1
        status bar --dim          ~6.4:1   (.sb-sky, which names the band)
        dock       --dim          ~5.0:1
   The earlier claim here — "status bar on bare sky 7.96:1", "nothing below
   6:1" — was arithmetic against a thinner gradient than the one that shipped;
   --dim actually measured 4.16:1 over moderate.jpg, under AA. Both the figure
   and the gradient are corrected now. Numbers come from sampling the six JPEGs
   and compositing this exact stack; they are not an eyeball estimate.

   Bug notes carried forward from the dashboard this is built on:
     A. NOT ONE CSS uppercasing rule exists in this file. Uppercasing in CSS
        maps "µ" to "M", turning µg/m³ into mg/m³ — a 1000x unit error
        introduced by a styling rule. Every label here is authored in the case
        it is displayed in, and every unit comes off the wire untouched.
     B. Every reading sizes off its own tile (cqi) or off --slot, the grid unit
        the tile's width is built from. Never off the viewport: that is how
        "163.3" once broke into "163." + "3". Readings are nowrap with a
        step-down for implausibly long payloads.
   =========================================================================== */

:root{
  /* inks — above 6:1 on all six grounds on glass; see the table above for the
     two strips that sit on bare wallpaper, where the floor is ~5:1 */
  --ink:#eaf0f8; --dim:#c6d0dd; --faint:#a7b4c4;
  --good:#7ee8a6; --mod:#ffd473; --usg:#ffb072;
  --unh:#ff9192;  --vun:#cbb2ff; --haz:#ff8fa6;
  --accent:var(--faint);

  --glass:rgba(13,17,24,.40);
  --hair:rgba(255,255,255,.40);      /* 1px top-edge highlight */
  --ring:rgba(255,255,255,.055);

  --slot:88px;                        /* the grid unit; JS fits it to the screen */
  --gapr:.155;                        /* gap as a fraction of a slot */
  --radius:calc(var(--slot) * .30);   /* one radius for every widget size, as iOS does */
  --pad:calc(var(--slot) * .17);
}
body[data-band="good"]     {--accent:var(--good)}
body[data-band="moderate"] {--accent:var(--mod)}
body[data-band="usg"]      {--accent:var(--usg)}
body[data-band="unh"]      {--accent:var(--unh)}
body[data-band="vun"]      {--accent:var(--vun)}
body[data-band="haz"]      {--accent:var(--haz)}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:#0a0d12;
  color:var(--ink);
  /* The Latin stack comes first so the Latin design is untouched; the Thai faces
     sit AFTER it, because font matching is per-glyph — Thai codepoints fall
     through Segoe/Roboto/Arial (which have none) and land on a real Thai face
     instead of whatever the browser would otherwise substitute. No webfont
     link: this page must open with no network. */
  font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
       system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,
       "Noto Sans Thai","IBM Plex Sans Thai","Sarabun","Leelawadee UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------------------------------------------------------------- wallpaper */
.sky{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;                          /* the panes below bleed 5% past this */
  /* The no-data ground. Deliberately NOT the clear dawn: a screen with no live
     board must never render as good air. Neutral graphite reads as "no signal". */
  background:radial-gradient(125% 95% at 50% 0%, #1b212a 0%, #0d1116 56%, #070a0e 100%);
}
/* THE PHOTOGRAPH MUST STILL BE A PHOTOGRAPH.
   This blur used to select 17px at wall resolution, which destroyed about 80%
   of the fine structure in exactly the two clear frames whose entire content is
   distant ridges — the difference between "ridges visible to the far horizon"
   and "far ridges nearly gone" is the reading, not decoration, and a 17px
   Gaussian deleted it. The six grounds stayed tellable apart by TONE, but the
   mechanism the design is built on was gone: it had become a colour wash.
   An iOS home screen has a sharp wallpaper and frosted widgets, not the other
   way round. What is left here is a light softening — enough to keep a single
   blown highlight from landing under the status bar, small enough that the far
   ridge line survives. The two strips of text that sit on bare wallpaper are
   protected by the edge gradients in .veil below, not by this. */
.pane{
  position:absolute;inset:-5%;              /* bleed, so the blur has no soft edge */
  background-size:cover;background-position:center 45%;background-repeat:no-repeat;
  filter:blur(clamp(2.5px,.4vmax,7px)) saturate(1.06);
  opacity:0;transition:opacity 1100ms ease;
  will-change:opacity;
}
/* The top and bottom edge gradients are the whole protection for the status bar
   and the dock — the only two things on this page outside a widget. Both were
   too thin: at the status bar's own band the composite came to alpha .64, which
   left --dim at 4.16:1 over the moderate dawn (below AA) while the header
   claimed 7.96:1. Deeper and slightly taller, they take that to ~6.4:1 without
   touching the exposed wallpaper below 17% / above 84%. */
.veil{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(0,3,8,.82) 0%, rgba(0,3,8,0) 17%),
    linear-gradient(0deg,   rgba(0,3,8,.70) 0%, rgba(0,3,8,0) 16%),
    rgba(7,10,16,.26);
}

/* ---------------------------------------------------------------- screen */
.screen{
  position:relative;z-index:1;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:clamp(10px,1.7vmin,26px) clamp(12px,2.1vmin,34px);
  gap:clamp(6px,1.1vmin,16px);
}
.screen[hidden]{display:none}

/* status bar — the only text that sits on bare wallpaper, hence the shadow
   AND the top-edge gradient in .veil above it */
.statusbar{
  display:flex;align-items:center;gap:.9rem;flex:none;
  font-size:clamp(.72rem,1.35vmin,1rem);font-weight:600;letter-spacing:.005em;
  color:var(--ink);
  text-shadow:0 1px 3px rgba(0,0,0,.72), 0 0 14px rgba(0,0,0,.5);
  padding:0 calc(var(--slot) * .06);
}
.sb-right{margin-left:auto;display:flex;align-items:center;gap:.75rem;min-width:0}
.sb-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sky{color:var(--dim)}
.sb-dot{width:.55em;height:.55em;border-radius:50%;background:var(--faint);flex:none;
        box-shadow:0 0 0 2px rgba(0,0,0,.4)}
body[data-conn="connected"] .sb-dot{background:var(--good)}
body[data-conn="connecting"] .sb-dot,body[data-conn="reconnecting"] .sb-dot{background:var(--mod)}
body[data-conn="error"] .sb-dot,body[data-conn="fatal"] .sb-dot{background:var(--unh)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}

.board{
  display:grid;
  grid-template-columns:repeat(var(--cols,8), var(--slot));
  grid-auto-rows:var(--slot);
  grid-auto-flow:row dense;
  gap:calc(var(--slot) * var(--gapr));
  justify-content:center;align-content:start;
  width:100%;
}
@media (max-width:1040px){ .board{--cols:4} }
@media (max-aspect-ratio:4/5){ .board{--cols:4} }

/* dock: page dots + the settings hint, iOS home-screen furniture */
.dock{
  flex:none;display:flex;align-items:center;justify-content:center;gap:1rem;
  font-size:clamp(.66rem,1.15vmin,.86rem);color:var(--dim);
  text-shadow:0 1px 3px rgba(0,0,0,.7);
  padding-top:.15rem;
}
.dots{display:inline-flex;gap:.42rem}
.dots i{width:.42em;height:.42em;border-radius:50%;background:rgba(255,255,255,.34);display:block}
.dots i.on{background:var(--ink)}
kbd{
  font:inherit;font-weight:700;border-radius:.35em;padding:.02em .38em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);
}

/* language — dock furniture, deliberately the quietest thing on the screen.
   Same weight as the page dots beside it; never louder than a reading. */
.langsw{display:inline-flex;align-items:center;gap:.12rem;flex:none}
.langsw button{
  font:inherit;font-size:1em;font-weight:600;line-height:1.5;
  color:var(--dim);background:transparent;border:1px solid transparent;
  border-radius:999px;padding:.1em .55em;cursor:pointer;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
}
.langsw button[aria-pressed="true"]{
  color:var(--ink);background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.18);
}
.langsw button:focus-visible{outline:2px solid #6fb6ff;outline-offset:2px}

/* ---------------------------------------------------------------- the glass */
.w{
  position:relative;overflow:hidden;min-width:0;
  container-type:inline-size;
  display:flex;flex-direction:column;
  border-radius:var(--radius);
  padding:var(--pad);
  color:var(--ink);
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(155%) brightness(.34);
  backdrop-filter:blur(30px) saturate(155%) brightness(.34);
  box-shadow:
    0 calc(var(--slot) * .055) calc(var(--slot) * .15) rgba(0,0,0,.38),
    0 0 0 1px var(--ring) inset;
}
/* 1px hairline along the top edge — the tell that says "glass" */
.w::before{
  content:"";position:absolute;left:9%;right:9%;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--hair),transparent);
}
/* Firefox and anything else without backdrop-filter gets a near-solid tile.
   Measured worst case in this branch is 7.39:1 — better than the glass, never
   an unreadable transparent panel. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .w{background:rgba(13,17,24,.90)}
  .sheet-card{background:rgba(11,14,20,.97)}
  .calm{background:rgba(6,9,14,.94)}
  .toast{background:rgba(13,17,24,.92)}
}

.w-lg{grid-area:1 / 1 / span 4 / span 4}
.w-sm{grid-column:span 2;grid-row:span 2}
.w-md{grid-column:span 4;grid-row:span 2}
.w-tiny{grid-column:1 / -1;grid-row:span 1}

/* widget title, in the corner, always */
.w-head{display:flex;align-items:center;gap:.55em;min-width:0;flex:none}
.w-ic{
  width:1.02em;height:1.02em;border-radius:.3em;flex:none;background:var(--accent);
  box-shadow:0 0 0 .085em rgba(255,255,255,.2) inset;
}
.w-name{
  font-weight:650;letter-spacing:.005em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.w-badge{
  margin-left:auto;flex:none;font-size:.82em;font-weight:600;color:var(--faint);
  background:rgba(255,255,255,.11);border-radius:999px;padding:.16em .62em;
  white-space:nowrap;
}
.w[data-state="live"] .w-badge{color:var(--accent);background:rgba(255,255,255,.08)}

/* Offline is the normal state for two of three boards here. It gets its own
   deliberate treatment — a dashed inner ring and a full-strength word — not a
   faded tile, not a blank, and never a zero. */
.w[data-state="offline"] .w-ic{background:var(--faint);box-shadow:0 0 0 .085em rgba(0,0,0,.35) inset}
.w[data-state="offline"]::after{
  content:"";position:absolute;pointer-events:none;
  inset:calc(var(--slot) * .052);
  border:1px dashed rgba(255,255,255,.30);
  border-radius:calc(var(--radius) - var(--slot) * .052);
}

/* ------------------------------------------------ large: the worst board */
.w-lg .w-head{font-size:4.4cqi}
.hero-read{display:flex;align-items:baseline;gap:.32em;min-width:0;margin-top:3.4cqi}
.hero-num{
  /* cqi, not vw: the tile owns this number's space, so the tile must own its size */
  font-size:26cqi;line-height:.84;font-weight:700;letter-spacing:-.042em;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent);
  text-shadow:0 calc(var(--slot) * .012) calc(var(--slot) * .05) rgba(0,0,0,.5);
}
.hero-num[data-kind="word"]{font-size:11.5cqi;line-height:1.14;letter-spacing:-.015em;
                            color:var(--ink);white-space:normal}
/* A long WORD may wrap anywhere — that is how a Thai state word fits a tile.
   A long NUMBER may only step down: breaking inside it is how "163.3" once
   became "163." + "3". The wrap is scoped to data-kind="word" for that reason. */
.hero-num[data-long="1"]{font-size:13cqi}
.hero-num[data-kind="word"][data-long="1"]{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.hero-unit{font-size:5.2cqi;font-weight:600;color:var(--dim);white-space:nowrap}
.hero-band{font-size:6cqi;font-weight:650;color:var(--accent);letter-spacing:-.015em;margin-top:.15em;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-rule{height:1px;background:rgba(255,255,255,.13);margin:3.2cqi 0 2.6cqi}
.hero-go{
  font-size:8cqi;line-height:1.02;font-weight:700;letter-spacing:-.028em;color:#fff;
  text-shadow:0 calc(var(--slot) * .01) calc(var(--slot) * .045) rgba(0,0,0,.45);
}
.hero-why{
  font-size:4.05cqi;line-height:1.34;color:var(--dim);margin-top:1.4cqi;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.hero-stats{display:flex;gap:3cqi;margin-top:auto;padding-top:3cqi;flex:none;
            border-top:1px solid rgba(255,255,255,.12)}
.hero-stats[hidden]{display:none}
.hs{min-width:0;display:flex;flex-direction:column;gap:.12em}
.hs b{font-size:4.2cqi;font-weight:700;color:var(--ink);white-space:nowrap;
      font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.hs span{font-size:2.75cqi;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the fallback single stat carries a sentence, not a number — let it wrap */
.hs.wide{flex:1}
.hs.wide b{font-size:3.3cqi;font-weight:600;white-space:normal;line-height:1.3}

/* ------------------------------------------------ small: the other boards */
.w-sm .w-head{font-size:8.4cqi}
.w-sm .w-badge{font-size:.74em}
.sm-line{margin-top:auto;display:flex;align-items:baseline;min-width:0}
.sm-val{
  font-size:29cqi;line-height:.88;font-weight:700;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent);
}
.sm-val[data-kind="word"]{font-size:13cqi;line-height:1.14;letter-spacing:-.01em;color:var(--ink);
                          white-space:normal}
.sm-val[data-long="1"]{font-size:14cqi}
.sm-val[data-kind="word"][data-long="1"]{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.w[data-state="offline"] .sm-val{color:var(--ink)}
.sm-unit{font-size:6.4cqi;font-weight:600;color:var(--dim);margin-left:.28em;white-space:nowrap}
.sm-foot{margin-top:auto;padding-top:3cqi;font-size:6.2cqi;line-height:1.24;color:var(--dim);
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ------------------------------------------------ medium: the EPA scale */
.w-md .w-head{font-size:4.4cqi}
.scale{display:flex;gap:.7cqi;margin-top:2.6cqi;flex:none}
.sg{flex:1;min-width:0;display:flex;flex-direction:column;gap:1cqi}
.sg i{display:block;height:2.3cqi;border-radius:99px;background:currentColor;opacity:.42}
.sg.on i{opacity:1;box-shadow:0 0 0 .5cqi rgba(255,255,255,.16)}
.sg b{font-size:2.5cqi;font-weight:650;color:var(--dim);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
.sg.on b{color:var(--ink)}
.sg em{font-size:2.25cqi;font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-note{
  margin-top:auto;font-size:3.1cqi;line-height:1.36;color:var(--dim);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}

/* ------------------------------------------------ tiny: the fleet accessory */
.w-tiny{flex-direction:row;align-items:center;gap:calc(var(--slot) * .13);
        padding:0 calc(var(--slot) * .26)}
.fleet-l{display:flex;align-items:center;gap:calc(var(--slot) * .09);min-width:0}
.fleet-count{font-size:calc(var(--slot) * .21);font-weight:700;color:var(--ink);white-space:nowrap;
             font-variant-numeric:tabular-nums}
.fleet-sep{width:1px;height:calc(var(--slot) * .3);background:rgba(255,255,255,.16);flex:none}
.fleet-txt{font-size:calc(var(--slot) * .145);color:var(--dim);white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;min-width:0}
.fleet-r{margin-left:auto;display:flex;align-items:center;gap:calc(var(--slot) * .13);flex:none}
.fleet-chip{
  font-size:calc(var(--slot) * .135);color:var(--dim);white-space:nowrap;
  background:rgba(255,255,255,.09);border-radius:999px;padding:calc(var(--slot) * .05) calc(var(--slot) * .16);
}
.fleet-chip b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:clamp(42px,7vmin,88px);z-index:3;max-width:min(46rem,88vw);
  padding:.6rem 1rem;border-radius:14px;
  font-size:clamp(.74rem,1.4vmin,.95rem);line-height:1.4;color:var(--ink);
  background:rgba(13,17,24,.5);
  -webkit-backdrop-filter:blur(26px) saturate(150%) brightness(.4);
  backdrop-filter:blur(26px) saturate(150%) brightness(.4);
  box-shadow:0 8px 26px rgba(0,0,0,.42), 0 0 0 1px var(--ring) inset;
}
.toast[hidden]{display:none}
.toast[data-l="bad"]{border-left:3px solid var(--unh)}
.toast[data-l="warn"]{border-left:3px solid var(--mod)}
.toast[data-l="info"]{border-left:3px solid var(--dim)}

/* ---------------------------------------------------------------- calm */
/* Every failure ends here: the whole screen becomes one sentence. */
.calm{
  position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.6rem;
  padding:8vmin;text-align:center;
  background:rgba(6,9,14,.6);
  -webkit-backdrop-filter:blur(22px) saturate(120%) brightness(.5);
  backdrop-filter:blur(22px) saturate(120%) brightness(.5);
}
.calm[hidden]{display:none}
.calm p{
  margin:0;max-width:22ch;font-size:clamp(1.5rem,4.6vmin,3.4rem);line-height:1.22;
  font-weight:600;letter-spacing:-.02em;color:#fff;
  text-shadow:0 2px 18px rgba(0,0,0,.6);
}
.calm small{font-size:clamp(.72rem,1.5vmin,1rem);color:var(--dim);letter-spacing:.01em}

/* ---------------------------------------------------------------- settings */
.sheet{
  position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
  padding:5vmin;background:rgba(4,6,10,.55);
}
.sheet[hidden]{display:none}
.sheet-card{
  width:min(38rem,100%);max-height:88vh;overflow:hidden;
  border-radius:22px;padding:clamp(1rem,2.4vmin,1.6rem);
  background:rgba(14,18,25,.62);
  -webkit-backdrop-filter:blur(34px) saturate(150%) brightness(.42);
  backdrop-filter:blur(34px) saturate(150%) brightness(.42);
  box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 1px var(--ring) inset;
}
.sheet h2{margin:0 0 .2rem;font-size:clamp(1rem,2vmin,1.3rem);font-weight:650;letter-spacing:-.01em}
.sheet .sub{color:var(--dim);font-size:clamp(.74rem,1.35vmin,.9rem);margin:0 0 1rem}
.grid2{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr))}
.f{display:flex;flex-direction:column;gap:.28rem;min-width:0}
.f label{font-size:.72rem;letter-spacing:.05em;color:var(--faint)}
.f input{
  font:inherit;font-size:.92rem;color:var(--ink);min-width:0;width:100%;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.16);border-radius:11px;
  padding:.55rem .68rem;
}
.f input:focus{outline:2px solid #6fb6ff;outline-offset:1px}
.f-row{flex-direction:row;align-items:center;gap:.5rem}
.f-row input{width:auto}
.f-row label{font-size:.85rem;color:var(--dim);letter-spacing:0}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
button{
  font:inherit;font-weight:650;cursor:pointer;border-radius:12px;padding:.55rem 1.1rem;
  color:#06101a;background:#8fd0ff;border:1px solid rgba(255,255,255,.25);
}
button.ghost{background:rgba(255,255,255,.1);color:var(--ink)}

/* ---------------------------------------------------------------- ภาษาไทย */
/* Thai stacks a vowel above and a tone mark above that (สั้), and a lower vowel
   below (ญู). Every line-height in this file was set for Latin; at 1.02–1.4 the
   marks are clipped by the overflow:hidden that keeps these tiles tidy. These
   rules only relax leading — no colour, no size, no transform changes.
   NOT ONE text-transform anywhere: uppercase is a no-op on Thai glyphs but it
   maps µ to M in mixed text, and this project shipped that 1000x unit error once.
   Digits stay Arabic: a PM2.5 reading is read as digits in Thai too. */
html[lang="th"] .hero-go{line-height:1.36}
html[lang="th"] .hero-why{line-height:1.56}
html[lang="th"] .hero-num[data-kind="word"]{line-height:1.32}

html[lang="th"] .sg b,html[lang="th"] .sg em{line-height:1.55}
html[lang="th"] .statusbar,html[lang="th"] .dock{line-height:1.55}
html[lang="th"] .fleet-txt,html[lang="th"] .fleet-chip{line-height:1.55}
html[lang="th"] .w-name,html[lang="th"] .w-badge{line-height:1.5}
html[lang="th"] .calm p{line-height:1.46;max-width:26ch}
html[lang="th"] .calm small{line-height:1.6}
html[lang="th"] .toast{line-height:1.6}
html[lang="th"] .sheet h2,html[lang="th"] .sheet .sub,
html[lang="th"] .f label,html[lang="th"] .sheet .hint{line-height:1.6}
/* Thai has no word boundaries for the browser to break on, so a long string
   overflows instead of wrapping. Every block below is prose — never a reading. */
html[lang="th"] .hero-why,html[lang="th"] .sm-foot,html[lang="th"] .md-note,
html[lang="th"] .hero-go,html[lang="th"] .hs.wide b,html[lang="th"] .calm p,
html[lang="th"] .calm small,html[lang="th"] .toast,html[lang="th"] .sheet .sub,
html[lang="th"] .sheet .hint{overflow-wrap:anywhere;word-break:break-word}
/* The band name under the big number is nowrap+ellipsis in English; the Thai
   names are longer than the tile, so let it use two lines rather than lose the
   end of the sentence. */
html[lang="th"] .hero-band{
  font-size:5.2cqi;line-height:1.5;white-space:normal;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ------------------------------------------------------------------ demo ---
   ?demo= and nothing else turns this on. See DEMO MODE in the script.

   The marker is a SAFETY DEVICE, not part of the picture, so it is drawn in one
   fixed pair of colours that never tracks the EPA band. A green DEMO bar under a
   green "Good" wall would borrow the health signal it exists to withdraw. Fixed
   top AND bottom plus a ring around the viewport, so no crop of a photograph of
   this wall can lose it, and sized against the viewport rather than capped in
   rem: on a wall-sized screen a marker that stops growing stops being a marker.

   Nothing here is uppercased by CSS. Every capital is typed as a capital,
   because text-transform maps "µ" to "M" and turns µg/m³ into a 1000x lie. */
.wdemo{
  position:fixed;left:0;right:0;z-index:2147483000;
  display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;
  gap:.3em 1em;text-align:center;
  background:#12100a;color:#ffeec2;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  line-height:1.3;letter-spacing:.12em;
}
.wdemo-top{
  top:0;font-size:clamp(.78rem,2.35vmin,1.6rem);
  padding:clamp(.35rem,1.1vmin,.7rem) clamp(.6rem,2vw,1.4rem)
          calc(clamp(.35rem,1.1vmin,.7rem) + .6rem);
}
.wdemo-bot{
  bottom:0;font-size:clamp(.62rem,1.62vmin,1.1rem);
  padding:calc(clamp(.35rem,1.1vmin,.7rem) + .6rem) clamp(.6rem,2vw,1.4rem)
          clamp(.35rem,1.1vmin,.7rem);
}
/* The caution banding sits inside each bar's own box, reserved in padding, so a
   measured bar height is the whole marker and nothing sticks out unaccounted. */
.wdemo-top::after,.wdemo-bot::before{
  content:"";position:absolute;left:0;right:0;height:.6rem;
  background:repeating-linear-gradient(135deg,#ffb300 0 .8rem,#12100a .8rem 1.6rem);
}
.wdemo-top::after{bottom:0}
.wdemo-bot::before{top:0}
.wdemo b{font-weight:800;font-size:1.6em;letter-spacing:.3em;margin-right:-.3em;color:#ffb300}
/* Thai never takes the wide tracking — it pulls the combining marks apart. */
.wdemo .wd-th{letter-spacing:normal;font-size:1.12em;color:#ffd166}
.wdemo .wd-val{
  border:.14em solid #ffb300;padding:.1em .55em;max-width:100%;
  color:#fff6df;font-weight:700;letter-spacing:.04em;

}
.wdemo .wd-val .nb{white-space:nowrap} /* … but a number never leaves its unit */
.wdemo-ring{
  position:fixed;inset:0;z-index:2147482999;pointer-events:none;
  border:clamp(3px,.7vmin,10px) solid #ffb300;
}
html[lang="th"] .wdemo{letter-spacing:normal;line-height:1.6}
