<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Widgets — Kit4Kids PM2.5</title>
<style>
/* ===========================================================================
   v24 — WIDGETS.  A home screen, not a dashboard.

   The wallpaper is the reading: one of six photographs of the same valley,
   swapped to whatever the worst live board is measuring right now. Widgets are
   iOS-sized glass tiles floating on it — 4x4 large, 2x2 small, 4x2 medium,
   full-width accessory.

   ---------------------------------------------------------------------------
   LEGIBILITY — the whole reason the numbers below are not round numbers.
   The six wallpapers span an enormous brightness range: the brightest 1/384th
   patch of moderate.jpg has relative luminance 0.94 (near-white), of
   hazardous.jpg 0.115 (near-black). One text colour cannot survive both, so
   the ground is NORMALISED before any type touches it:

     1. base scrim   rgba(7,10,16,.26) flat over the whole photograph
     2. glass tiles  backdrop-filter: … brightness(.34) — this darkens ONLY the
        pixels behind a tile, so the exposed wallpaper stays bright enough to
        read as a photograph while the tile interior collapses into a narrow
        band. Measured on the brightest cell of each image, the ground behind
        tile text lands at L 0.0077 (hazardous) … 0.0258 (moderate).
     3. tile fill    rgba(13,17,24,.40) on top of that.

   Measured worst case across ALL SIX photographs, brightest-patch, every ink:
        on glass                 6.41:1   (unhealthy red on the moderate dawn)
        no backdrop-filter       7.39:1   (the @supports fallback below)
        white on glass          13.84:1
        status bar on bare sky   7.96:1   (has its own top-edge gradient)
   Nothing on this page is below 6:1. Numbers come from sampling the six JPEGs
   and compositing this exact stack; they are not an eyeball estimate.

   Bug notes carried forward from the dashboard this is built on:
     A. NOT ONE CSS uppercasing rule exists in this file. Uppercasing in CSS
        maps "µ" to "M", turning µg/m³ into mg/m³ — a 1000x unit error
        introduced by a styling rule. Every label here is authored in the case
        it is displayed in, and every unit comes off the wire untouched.
     B. Every reading sizes off its own tile (cqi) or off --slot, the grid unit
        the tile's width is built from. Never off the viewport: that is how
        "163.3" once broke into "163." + "3". Readings are nowrap with a
        step-down for implausibly long payloads.
   =========================================================================== */

:root{
  /* inks — every one measured above 6:1 on all six grounds */
  --ink:#eaf0f8; --dim:#c6d0dd; --faint:#a7b4c4;
  --good:#7ee8a6; --mod:#ffd473; --usg:#ffb072;
  --unh:#ff9192;  --vun:#cbb2ff; --haz:#ff8fa6;
  --accent:var(--faint);

  --glass:rgba(13,17,24,.40);
  --hair:rgba(255,255,255,.40);      /* 1px top-edge highlight */
  --ring:rgba(255,255,255,.055);

  --slot:88px;                        /* the grid unit; JS fits it to the screen */
  --gapr:.155;                        /* gap as a fraction of a slot */
  --radius:calc(var(--slot) * .30);   /* one radius for every widget size, as iOS does */
  --pad:calc(var(--slot) * .17);
}
body[data-band="good"]     {--accent:var(--good)}
body[data-band="moderate"] {--accent:var(--mod)}
body[data-band="usg"]      {--accent:var(--usg)}
body[data-band="unh"]      {--accent:var(--unh)}
body[data-band="vun"]      {--accent:var(--vun)}
body[data-band="haz"]      {--accent:var(--haz)}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:#0a0d12;
  color:var(--ink);
  font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
       system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------------------------------------------------------------- wallpaper */
.sky{
  position:fixed;inset:0;z-index:0;
  /* The no-data ground. Deliberately NOT the clear dawn: a screen with no live
     board must never render as good air. Neutral graphite reads as "no signal". */
  background:radial-gradient(125% 95% at 50% 0%, #1b212a 0%, #0d1116 56%, #070a0e 100%);
}
.pane{
  position:absolute;inset:-5%;              /* bleed, so the blur has no soft edge */
  background-size:cover;background-position:center 45%;background-repeat:no-repeat;
  filter:blur(clamp(6px,1.05vmax,17px)) saturate(1.06);
  opacity:0;transition:opacity 1100ms ease;
  will-change:opacity;
}
.veil{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(0,3,8,.62) 0%, rgba(0,3,8,0) 15%),
    linear-gradient(0deg,   rgba(0,3,8,.52) 0%, rgba(0,3,8,0) 13%),
    rgba(7,10,16,.26);
}

/* ---------------------------------------------------------------- screen */
.screen{
  position:relative;z-index:1;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:clamp(10px,1.7vmin,26px) clamp(12px,2.1vmin,34px);
  gap:clamp(6px,1.1vmin,16px);
}
.screen[hidden]{display:none}

/* status bar — the only text that sits on bare wallpaper, hence the shadow
   AND the top-edge gradient in .veil above it */
.statusbar{
  display:flex;align-items:center;gap:.9rem;flex:none;
  font-size:clamp(.72rem,1.35vmin,1rem);font-weight:600;letter-spacing:.005em;
  color:var(--ink);
  text-shadow:0 1px 3px rgba(0,0,0,.72), 0 0 14px rgba(0,0,0,.5);
  padding:0 calc(var(--slot) * .06);
}
.sb-right{margin-left:auto;display:flex;align-items:center;gap:.75rem;min-width:0}
.sb-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sky{color:var(--dim)}
.sb-dot{width:.55em;height:.55em;border-radius:50%;background:var(--faint);flex:none;
        box-shadow:0 0 0 2px rgba(0,0,0,.4)}
body[data-conn="connected"] .sb-dot{background:var(--good)}
body[data-conn="connecting"] .sb-dot,body[data-conn="reconnecting"] .sb-dot{background:var(--mod)}
body[data-conn="error"] .sb-dot,body[data-conn="fatal"] .sb-dot{background:var(--unh)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}

.board{
  display:grid;
  grid-template-columns:repeat(var(--cols,8), var(--slot));
  grid-auto-rows:var(--slot);
  grid-auto-flow:row dense;
  gap:calc(var(--slot) * var(--gapr));
  justify-content:center;align-content:start;
  width:100%;
}
@media (max-width:1040px){ .board{--cols:4} }
@media (max-aspect-ratio:4/5){ .board{--cols:4} }

/* dock: page dots + the settings hint, iOS home-screen furniture */
.dock{
  flex:none;display:flex;align-items:center;justify-content:center;gap:1rem;
  font-size:clamp(.66rem,1.15vmin,.86rem);color:var(--dim);
  text-shadow:0 1px 3px rgba(0,0,0,.7);
  padding-top:.15rem;
}
.dots{display:inline-flex;gap:.42rem}
.dots i{width:.42em;height:.42em;border-radius:50%;background:rgba(255,255,255,.34);display:block}
.dots i.on{background:var(--ink)}
kbd{
  font:inherit;font-weight:700;border-radius:.35em;padding:.02em .38em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);
}

/* ---------------------------------------------------------------- the glass */
.w{
  position:relative;overflow:hidden;min-width:0;
  container-type:inline-size;
  display:flex;flex-direction:column;
  border-radius:var(--radius);
  padding:var(--pad);
  color:var(--ink);
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(155%) brightness(.34);
  backdrop-filter:blur(30px) saturate(155%) brightness(.34);
  box-shadow:
    0 calc(var(--slot) * .055) calc(var(--slot) * .15) rgba(0,0,0,.38),
    0 0 0 1px var(--ring) inset;
}
/* 1px hairline along the top edge — the tell that says "glass" */
.w::before{
  content:"";position:absolute;left:9%;right:9%;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--hair),transparent);
}
/* Firefox and anything else without backdrop-filter gets a near-solid tile.
   Measured worst case in this branch is 7.39:1 — better than the glass, never
   an unreadable transparent panel. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .w{background:rgba(13,17,24,.90)}
  .sheet-card{background:rgba(11,14,20,.97)}
  .calm{background:rgba(6,9,14,.94)}
  .toast{background:rgba(13,17,24,.92)}
}

.w-lg{grid-area:1 / 1 / span 4 / span 4}
.w-sm{grid-column:span 2;grid-row:span 2}
.w-md{grid-column:span 4;grid-row:span 2}
.w-tiny{grid-column:1 / -1;grid-row:span 1}

/* widget title, in the corner, always */
.w-head{display:flex;align-items:center;gap:.55em;min-width:0;flex:none}
.w-ic{
  width:1.02em;height:1.02em;border-radius:.3em;flex:none;background:var(--accent);
  box-shadow:0 0 0 .085em rgba(255,255,255,.2) inset;
}
.w-name{
  font-weight:650;letter-spacing:.005em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.w-badge{
  margin-left:auto;flex:none;font-size:.82em;font-weight:600;color:var(--faint);
  background:rgba(255,255,255,.11);border-radius:999px;padding:.16em .62em;
  white-space:nowrap;
}
.w[data-state="live"] .w-badge{color:var(--accent);background:rgba(255,255,255,.08)}

/* Offline is the normal state for two of three boards here. It gets its own
   deliberate treatment — a dashed inner ring and a full-strength word — not a
   faded tile, not a blank, and never a zero. */
.w[data-state="offline"] .w-ic{background:var(--faint);box-shadow:0 0 0 .085em rgba(0,0,0,.35) inset}
.w[data-state="offline"]::after{
  content:"";position:absolute;pointer-events:none;
  inset:calc(var(--slot) * .052);
  border:1px dashed rgba(255,255,255,.30);
  border-radius:calc(var(--radius) - var(--slot) * .052);
}

/* ------------------------------------------------ large: the worst board */
.w-lg .w-head{font-size:4.4cqi}
.hero-read{display:flex;align-items:baseline;gap:.32em;min-width:0;margin-top:3.4cqi}
.hero-num{
  /* cqi, not vw: the tile owns this number's space, so the tile must own its size */
  font-size:26cqi;line-height:.84;font-weight:700;letter-spacing:-.042em;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent);
  text-shadow:0 calc(var(--slot) * .012) calc(var(--slot) * .05) rgba(0,0,0,.5);
}
.hero-num[data-kind="word"]{font-size:11.5cqi;letter-spacing:-.015em;color:var(--ink);white-space:normal}
.hero-num[data-long="1"]{font-size:13cqi;white-space:normal;overflow-wrap:anywhere}
.hero-unit{font-size:5.2cqi;font-weight:600;color:var(--dim);white-space:nowrap}
.hero-band{font-size:6cqi;font-weight:650;color:var(--accent);letter-spacing:-.015em;margin-top:.15em;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-rule{height:1px;background:rgba(255,255,255,.13);margin:3.2cqi 0 2.6cqi}
.hero-go{
  font-size:8cqi;line-height:1.02;font-weight:700;letter-spacing:-.028em;color:#fff;
  text-shadow:0 calc(var(--slot) * .01) calc(var(--slot) * .045) rgba(0,0,0,.45);
}
.hero-why{
  font-size:4.05cqi;line-height:1.34;color:var(--dim);margin-top:1.4cqi;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.hero-stats{display:flex;gap:3cqi;margin-top:auto;padding-top:3cqi;flex:none;
            border-top:1px solid rgba(255,255,255,.12)}
.hero-stats[hidden]{display:none}
.hs{min-width:0;display:flex;flex-direction:column;gap:.12em}
.hs b{font-size:4.2cqi;font-weight:700;color:var(--ink);white-space:nowrap;
      font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.hs span{font-size:2.75cqi;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the fallback single stat carries a sentence, not a number — let it wrap */
.hs.wide{flex:1}
.hs.wide b{font-size:3.3cqi;font-weight:600;white-space:normal;line-height:1.3}

/* ------------------------------------------------ small: the other boards */
.w-sm .w-head{font-size:8.4cqi}
.w-sm .w-badge{font-size:.74em}
.sm-line{margin-top:auto;display:flex;align-items:baseline;min-width:0}
.sm-val{
  font-size:29cqi;line-height:.88;font-weight:700;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent);
}
.sm-val[data-kind="word"]{font-size:13cqi;letter-spacing:-.01em;color:var(--ink)}
.sm-val[data-long="1"]{font-size:14cqi;white-space:normal;overflow-wrap:anywhere}
.w[data-state="offline"] .sm-val{color:var(--ink)}
.sm-unit{font-size:6.4cqi;font-weight:600;color:var(--dim);margin-left:.28em;white-space:nowrap}
.sm-foot{margin-top:auto;padding-top:3cqi;font-size:6.2cqi;line-height:1.24;color:var(--dim);
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ------------------------------------------------ medium: the EPA scale */
.w-md .w-head{font-size:4.4cqi}
.scale{display:flex;gap:.7cqi;margin-top:2.6cqi;flex:none}
.sg{flex:1;min-width:0;display:flex;flex-direction:column;gap:1cqi}
.sg i{display:block;height:2.3cqi;border-radius:99px;background:currentColor;opacity:.42}
.sg.on i{opacity:1;box-shadow:0 0 0 .5cqi rgba(255,255,255,.16)}
.sg b{font-size:2.5cqi;font-weight:650;color:var(--dim);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
.sg.on b{color:var(--ink)}
.sg em{font-size:2.25cqi;font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-note{
  margin-top:auto;font-size:3.1cqi;line-height:1.36;color:var(--dim);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}

/* ------------------------------------------------ tiny: the fleet accessory */
.w-tiny{flex-direction:row;align-items:center;gap:calc(var(--slot) * .13);
        padding:0 calc(var(--slot) * .26)}
.fleet-l{display:flex;align-items:center;gap:calc(var(--slot) * .09);min-width:0}
.fleet-count{font-size:calc(var(--slot) * .21);font-weight:700;color:var(--ink);white-space:nowrap;
             font-variant-numeric:tabular-nums}
.fleet-sep{width:1px;height:calc(var(--slot) * .3);background:rgba(255,255,255,.16);flex:none}
.fleet-txt{font-size:calc(var(--slot) * .145);color:var(--dim);white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;min-width:0}
.fleet-r{margin-left:auto;display:flex;align-items:center;gap:calc(var(--slot) * .13);flex:none}
.fleet-chip{
  font-size:calc(var(--slot) * .135);color:var(--dim);white-space:nowrap;
  background:rgba(255,255,255,.09);border-radius:999px;padding:calc(var(--slot) * .05) calc(var(--slot) * .16);
}
.fleet-chip b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:clamp(42px,7vmin,88px);z-index:3;max-width:min(46rem,88vw);
  padding:.6rem 1rem;border-radius:14px;
  font-size:clamp(.74rem,1.4vmin,.95rem);line-height:1.4;color:var(--ink);
  background:rgba(13,17,24,.5);
  -webkit-backdrop-filter:blur(26px) saturate(150%) brightness(.4);
  backdrop-filter:blur(26px) saturate(150%) brightness(.4);
  box-shadow:0 8px 26px rgba(0,0,0,.42), 0 0 0 1px var(--ring) inset;
}
.toast[hidden]{display:none}
.toast[data-l="bad"]{border-left:3px solid var(--unh)}
.toast[data-l="warn"]{border-left:3px solid var(--mod)}
.toast[data-l="info"]{border-left:3px solid var(--dim)}

/* ---------------------------------------------------------------- calm */
/* Every failure ends here: the whole screen becomes one sentence. */
.calm{
  position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.6rem;
  padding:8vmin;text-align:center;
  background:rgba(6,9,14,.6);
  -webkit-backdrop-filter:blur(22px) saturate(120%) brightness(.5);
  backdrop-filter:blur(22px) saturate(120%) brightness(.5);
}
.calm[hidden]{display:none}
.calm p{
  margin:0;max-width:22ch;font-size:clamp(1.5rem,4.6vmin,3.4rem);line-height:1.22;
  font-weight:600;letter-spacing:-.02em;color:#fff;
  text-shadow:0 2px 18px rgba(0,0,0,.6);
}
.calm small{font-size:clamp(.72rem,1.5vmin,1rem);color:var(--dim);letter-spacing:.01em}

/* ---------------------------------------------------------------- settings */
.sheet{
  position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
  padding:5vmin;background:rgba(4,6,10,.55);
}
.sheet[hidden]{display:none}
.sheet-card{
  width:min(38rem,100%);max-height:88vh;overflow:hidden;
  border-radius:22px;padding:clamp(1rem,2.4vmin,1.6rem);
  background:rgba(14,18,25,.62);
  -webkit-backdrop-filter:blur(34px) saturate(150%) brightness(.42);
  backdrop-filter:blur(34px) saturate(150%) brightness(.42);
  box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 1px var(--ring) inset;
}
.sheet h2{margin:0 0 .2rem;font-size:clamp(1rem,2vmin,1.3rem);font-weight:650;letter-spacing:-.01em}
.sheet .sub{color:var(--dim);font-size:clamp(.74rem,1.35vmin,.9rem);margin:0 0 1rem}
.grid2{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr))}
.f{display:flex;flex-direction:column;gap:.28rem;min-width:0}
.f label{font-size:.72rem;letter-spacing:.05em;color:var(--faint)}
.f input{
  font:inherit;font-size:.92rem;color:var(--ink);min-width:0;width:100%;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.16);border-radius:11px;
  padding:.55rem .68rem;
}
.f input:focus{outline:2px solid #6fb6ff;outline-offset:1px}
.f-row{flex-direction:row;align-items:center;gap:.5rem}
.f-row input{width:auto}
.f-row label{font-size:.85rem;color:var(--dim);letter-spacing:0}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
button{
  font:inherit;font-weight:650;cursor:pointer;border-radius:12px;padding:.55rem 1.1rem;
  color:#06101a;background:#8fd0ff;border:1px solid rgba(255,255,255,.25);
}
button.ghost{background:rgba(255,255,255,.1);color:var(--ink)}
.sheet .hint{color:var(--faint);font-size:.76rem;line-height:1.5;margin:.9rem 0 0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-band="unknown" data-conn="idle">

<div class="sky" aria-hidden="true">
  <div class="pane" id="paneA"></div>
  <div class="pane" id="paneB"></div>
  <div class="veil"></div>
</div>

<div class="screen" id="screen">
  <header class="statusbar">
    <span class="sb-item">Kit4Kids &middot; Chiang Mai</span>
    <span class="sb-right">
      <span class="sb-item sb-sky" id="sb-sky">wallpaper &middot; no reading</span>
      <span class="sb-dot" id="sb-dot"></span>
      <span class="sb-item" id="sb-conn">connecting</span>
      <span class="sb-item mono" id="sb-clock">--:--</span>
    </span>
  </header>

  <main class="stage" id="stage">
    <div class="board" id="board"></div>
  </main>

  <footer class="dock">
    <span class="dots"><i class="on"></i><i></i></span>
    <span>press <kbd>s</kbd> for broker settings</span>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<div class="calm" id="calm" hidden>
  <p id="calm-text"></p>
  <small>Press <b>s</b> to change the broker.</small>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <h2>Broker</h2>
    <p class="sub">This screen connects on its own. Nothing here leaves this browser.</p>
    <form id="form" autocomplete="off">
      <div class="grid2">
        <div class="f"><label for="f-host">Host</label>
          <input id="f-host" spellcheck="false" required></div>
        <div class="f"><label for="f-port">WebSocket port</label>
          <input id="f-port" inputmode="numeric" required></div>
        <div class="f"><label for="f-user">Username</label>
          <input id="f-user" spellcheck="false"></div>
        <div class="f"><label for="f-pass">Passphrase</label>
          <input id="f-pass" type="password" autocomplete="off"></div>
        <div class="f"><label for="f-filter">Topics start with</label>
          <input id="f-filter" spellcheck="false" placeholder="dbk/"></div>
        <div class="f f-row"><input id="f-tls" type="checkbox"><label for="f-tls">TLS (wss)</label></div>
        <div class="f f-row"><input id="f-remember" type="checkbox"><label for="f-remember">Remember passphrase</label></div>
      </div>
      <div class="acts">
        <button type="submit">Connect</button>
        <button type="button" class="ghost" id="btn-forget">Forget</button>
        <button type="button" class="ghost" id="btn-close">Close</button>
      </div>
    </form>
    <p class="hint" id="store-hint"></p>
  </div>
</div>

<!-- Pinned AND hash-locked: this page can carry a broker passphrase, so a hijacked
     CDN response must not be able to execute here. Same bundle the source dashboard
     verified. -->
<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"
        integrity="sha384-haZiwxTLortiFcYMBEEE1+8ayC+o18YtuwHZv+4WQHoPaLzRjwOV6h7Vva5iLSCZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  'use strict';

  /* =======================================================================
     DATA LAYER — lifted from tools/mqtt-dashboard.html, which is the tested
     one. Discovery parsing, alias expansion, availability, expiry, the EPA
     truncate-then-band rule, the wildcard refusal and the subscription
     ceiling are all unchanged in behaviour. Only the presentation is new.
     ======================================================================= */

  var DEFAULT_HOST = (location.hostname || '');  /* Served from the add-on, the broker is the same host as this page, so derive it rather than hardcoding a LAN address into a public repo. Empty under file:// — the settings panel covers that case. */
  var DEFAULT_PORT = '1884';          // the broker's MQTT-over-WebSocket listener.
                                      // A browser has no other way in — it cannot
                                      // open a raw MQTT socket at all.
  var STORE_KEY   = 'air-widgets.conn.v1';
  var MAX_SUBS    = 64;
  var DEFAULT_EXPIRE = 900;
  var DEFAULT_FILTER = 'dbk/';

  // US EPA PM2.5 breakpoints, micrograms per cubic metre. One source of truth for
  // the tiles, the scale widget AND which photograph is on the wall.
  var BANDS = [
    { i:0, max: 12.0,     key:'good',     file:'good',      label:'Good',
      short:'Good',        r:'0–12' },
    { i:1, max: 35.4,     key:'moderate', file:'moderate',  label:'Moderate',
      short:'Moderate',    r:'12.1–35.4' },
    { i:2, max: 55.4,     key:'usg',      file:'sensitive', label:'Unhealthy for sensitive groups',
      short:'Sensitive',   r:'35.5–55.4' },
    { i:3, max: 150.4,    key:'unh',      file:'unhealthy', label:'Unhealthy',
      short:'Unhealthy',   r:'55.5–150.4' },
    { i:4, max: 250.4,    key:'vun',      file:'verybad',   label:'Very unhealthy',
      short:'Very unhealthy', r:'150.5–250.4' },
    { i:5, max: Infinity, key:'haz',      file:'hazardous', label:'Hazardous',
      short:'Hazardous',   r:'250.5+' }
  ];

  // The plain-language answer to "should we go outside?", written for children.
  var ADVICE = [
    { go:'Yes — go outside.',
      why:'The air is clean right now. Play outside for as long as you like.' },
    { go:'Yes — go outside.',
      why:'The air is okay. If you cough or wheeze easily, take it a little slower.' },
    { go:'Go out, but take it easy.',
      why:'Fine for most people. With asthma or a cough, keep it short and skip the hard running.' },
    { go:'Short trips outside only.',
      why:'Everyone should keep it short today. No running games, and wear a mask if you go.' },
    { go:'Stay inside.',
      why:'Keep the windows shut. Go out only if you really must, and wear a mask.' },
    { go:'Stay inside.',
      why:'Do not go outside. Keep the windows shut and run a filter if you have one.' }
  ];
  var NO_ADVICE = {
    go:'We cannot tell right now.',
    why:'No monitor is reporting, so nobody knows what the air is doing. Unknown is not the same as clear.'
  };

  var ALIASES = {
    stat_t:'state_topic', avty_t:'availability_topic', uniq_id:'unique_id',
    unit_of_meas:'unit_of_measurement', dev_cla:'device_class', stat_cla:'state_class',
    exp_aft:'expire_after', pl_avail:'payload_available', pl_not_avail:'payload_not_available',
    dev:'device', val_tpl:'value_template', avty:'availability', ic:'icon'
  };

  var client = null;
  var entities = new Map();      // discovery topic -> entity
  var byState  = new Map();      // state topic     -> Set(discovery topic)
  var byAvail  = new Map();      // avail topic     -> Set(discovery topic)
  var byUid    = new Map();
  var boardStatus = new Map();   // board id -> { raw, at }
  var aux = new Map();           // board id -> Map(name -> { text, n, at })
  var subs = new Set();
  var filteredOut = new Set();
  var activeFilter = '';
  var connState = 'idle';
  var manualStop = false;
  var everConnected = false;
  var connectedAt = 0;
  var attachedAt = 0;
  var parseErrors = 0;

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  // The EPA scale starts at 0; without the lower bound a faulty -999 fell into the
  // first band and rendered as a reassuring green "Good".
  function bandFor(n) {
    if (!Number.isFinite(n) || n < 0) return null;
    for (var i = 0; i < BANDS.length; i++) if (n <= BANDS[i].max) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  function isPm(ent) {
    return ent.deviceClass === 'pm25' || /pm ?2\.?5/i.test(ent.measure || ent.title || '');
  }

  function ago(ts) {
    if (!ts) return 'never';
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 2) return 'just now';
    if (s < 60) return s + 's ago';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ' + (m % 60) + 'm ago';
    return Math.floor(h / 24) + 'd ago';
  }

  function parseValue(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (s === '') return { kind:'empty', text:'no value' };
    if (/^(unknown|unavailable|none|null|nan|n\/a)$/i.test(s)) {
      return { kind:'unknown', text:s.toLowerCase() };
    }
    var n = Number(s);
    if (!Number.isFinite(n)) return { kind:'text', text:s };
    // Truncate to one decimal ONCE, and band on that same value, so the number
    // printed and the label under it can never disagree. Truncate, never round:
    // rounding 35.44 up to 35.5 would invent a severity nothing measured.
    var n1 = Math.trunc(n * 10) / 10;
    var text = /^[+-]?\d+(\.\d)?$/.test(s) ? s.replace(/^\+/, '') : n1.toFixed(1);
    return { kind:'number', n:n, n1:n1, text:text };
  }

  function boardFromTopic(topic) {
    var m = /^dbk\/([^/]+)\//i.exec(topic || '');
    return m ? m[1] : null;
  }

  var storeWorks = true;
  function loadStore() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); }
    catch (e) { storeWorks = false; return null; }
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (e) { try { localStorage.removeItem(STORE_KEY); } catch (e2) {} return null; }
  }
  function saveStore(v) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; }
    catch (e) { storeWorks = false; return false; }
  }
  function clearStore() {
    try { localStorage.removeItem(STORE_KEY); return true; } catch (e) { return false; }
  }

  // ------------------------------------------------------------ notices
  var notes = new Map();
  var RANK = { bad:3, warn:2, info:1 };
  function note(id, level, text) { notes.set(id, { level:level, text:text }); paintNotes(); }
  function unnote(id) { if (notes.delete(id)) paintNotes(); }
  function paintNotes() {
    var best = null;
    notes.forEach(function (n) { if (!best || RANK[n.level] > RANK[best.level]) best = n; });
    var el = $('toast');
    if (!best) { el.hidden = true; return; }
    el.hidden = false;
    el.setAttribute('data-l', best.level);
    el.textContent = best.text;
  }

  // ------------------------------------------------------------ calm failure
  var calmed = false;
  function calm(sentence) {
    calmed = true;
    $('calm-text').textContent = sentence;
    $('calm').hidden = false;
    $('screen').hidden = true;
    $('toast').hidden = true;
  }
  function uncalm() {
    if (!calmed) return;
    calmed = false;
    $('calm').hidden = true;
    $('screen').hidden = false;
    fit();
  }

  // ------------------------------------------------------------ subscribe
  // subRaw is the only thing that talks to the broker and is private to topics
  // authored in THIS file. Anything that arrived over the wire goes through
  // sub(), which refuses wildcards outright.
  function subRaw(topic) {
    if (!client || !topic || typeof topic !== 'string') return false;
    if (subs.has(topic)) return true;
    if (subs.size >= MAX_SUBS) {
      note('subcap', 'warn', 'Subscription ceiling reached (' + MAX_SUBS +
        '). Further sensors are ignored so this screen cannot flood the broker.');
      return false;
    }
    subs.add(topic);
    client.subscribe(topic, { qos:0 }, function (err) {
      if (err) {
        subs.delete(topic);
        note('suberr', 'bad', 'The broker refused a subscription to ' + topic +
          ' — ' + (err.message || String(err)) + '. Its ACL may not allow this topic.');
      }
    });
    return true;
  }

  function sub(topic) {
    if (!client || !topic || typeof topic !== 'string') return false;
    // Absolute guard. A wildcard on this broker costs roughly 109 GB a day, and
    // '+' is every bit as dangerous as '#': a retained config asking for "+/+/+"
    // delivered ten out of ten unrelated fleet topics in testing. A topic that
    // came off the wire must name exactly one topic.
    if (/[#+]/.test(topic)) {
      note('wildcard', 'warn', 'Refused a wildcard subscription. A discovery payload asked for ' +
        topic + '; topics that arrive over the wire must name one exact topic.');
      return false;
    }
    return subRaw(topic);
  }

  function unsub(topic) {
    if (!topic || !subs.has(topic)) return;
    if (byState.has(topic) || byAvail.has(topic)) return;
    subs.delete(topic);
    if (client) { try { client.unsubscribe(topic); } catch (e) {} }
  }

  // ------------------------------------------------------------ discovery
  function expand(cfg) {
    var out = {};
    Object.keys(cfg).forEach(function (k) { out[ALIASES[k] || k] = cfg[k]; });
    var base = out['~'];
    if (typeof base === 'string' && base) {
      ['state_topic', 'availability_topic'].forEach(function (k) {
        var v = out[k];
        if (typeof v !== 'string') return;
        if (v.charAt(0) === '~') out[k] = base + v.slice(1);
        else if (v.charAt(v.length - 1) === '~') out[k] = v.slice(0, -1) + base;
      });
    }
    if (!out.availability_topic && Array.isArray(out.availability) && out.availability.length) {
      var a = out.availability[0];
      if (a && typeof a.topic === 'string') {
        out.availability_topic = a.topic;
        if (a.payload_available) out.payload_available = a.payload_available;
        if (a.payload_not_available) out.payload_not_available = a.payload_not_available;
      }
    }
    return out;
  }

  function index(map, key, dtopic) {
    if (!key) return;
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(dtopic);
  }
  function unindex(map, key, dtopic) {
    if (!key || !map.has(key)) return;
    var set = map.get(key);
    set.delete(dtopic);
    if (set.size === 0) { map.delete(key); unsub(key); }
  }

  function removeEntity(dtopic) {
    var gone = entities.get(dtopic);
    if (!gone) return false;
    entities.delete(dtopic);
    if (gone.uid && byUid.get(gone.uid) === dtopic) byUid.delete(gone.uid);
    unindex(byState, gone.stateTopic, dtopic);
    unindex(byAvail, gone.availTopic, dtopic);
    return true;
  }

  function matchesFilter(topic) {
    return !activeFilter || String(topic).indexOf(activeFilter) === 0;
  }

  function noteFilter() {
    if (!activeFilter || filteredOut.size === 0) { unnote('filter'); return; }
    note('filter', 'info', filteredOut.size + ' sensor' + (filteredOut.size === 1 ? '' : 's') +
      ' on this broker are hidden — this screen is scoped to topics starting with “' +
      activeFilter + '”. Press s to widen it.');
  }

  function onDiscovery(dtopic, text) {
    if (text.trim() === '') {                    // empty retained payload = delete
      filteredOut.delete(dtopic);
      removeEntity(dtopic);
      noteFilter();
      refresh();
      return;
    }

    var cfg;
    try { cfg = JSON.parse(text); }
    catch (e) {
      parseErrors++;
      note('parse', 'warn', parseErrors + ' malformed discovery payload' +
        (parseErrors === 1 ? '' : 's') + ' ignored. Everything else still works.');
      return;
    }
    if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) { parseErrors++; return; }

    cfg = expand(cfg);
    if (typeof cfg.state_topic !== 'string' || !cfg.state_topic) return;

    if (!matchesFilter(cfg.state_topic)) {
      filteredOut.add(dtopic);
      if (removeEntity(dtopic)) refresh();
      noteFilter();
      return;
    }
    filteredOut.delete(dtopic);
    noteFilter();

    var parts = dtopic.split('/');
    var dev = cfg.device && typeof cfg.device === 'object' ? cfg.device : null;
    var devName = dev && typeof dev.name === 'string' ? dev.name : '';
    var measure = typeof cfg.name === 'string' && cfg.name ? cfg.name : (parts[2] || 'sensor');
    var expire = Number(cfg.expire_after);
    var uid = typeof cfg.unique_id === 'string' && cfg.unique_id ? cfg.unique_id : '';
    var board = boardFromTopic(cfg.state_topic);
    var newAvail = typeof cfg.availability_topic === 'string' ? cfg.availability_topic : '';

    if (uid && byUid.has(uid) && byUid.get(uid) !== dtopic) removeEntity(byUid.get(uid));

    var ent = entities.get(dtopic) ||
      { key:dtopic, value:null, at:0, availRaw:null, availAt:0 };

    if (ent.stateTopic && ent.stateTopic !== cfg.state_topic) {
      unindex(byState, ent.stateTopic, dtopic);
      ent.value = null; ent.at = 0;
    }
    if (ent.availTopic && ent.availTopic !== newAvail) {
      unindex(byAvail, ent.availTopic, dtopic);
      ent.availRaw = null; ent.availAt = 0;
    }
    if (ent.uid && ent.uid !== uid && byUid.get(ent.uid) === dtopic) byUid.delete(ent.uid);

    // IDENTITY. Every board on this fleet publishes the discovery name "PM2.5",
    // so the name cannot identify anything — three boards reading 8, 58.2 and
    // 163.3 would all be titled the same. The board id parsed out of state_topic
    // is the identity; the discovery name is demoted to the badge.
    ent.board = board;
    ent.title = board || devName || uid || measure;
    ent.measure = measure;
    ent.uid = uid;
    ent.stateTopic = cfg.state_topic;
    ent.availTopic = newAvail;
    ent.unit = typeof cfg.unit_of_measurement === 'string' ? cfg.unit_of_measurement : '';
    ent.deviceClass = typeof cfg.device_class === 'string' ? cfg.device_class : '';
    ent.expire = Number.isFinite(expire) && expire > 0 ? expire : DEFAULT_EXPIRE;
    ent.pAvail = typeof cfg.payload_available === 'string' ? cfg.payload_available : 'online';
    ent.pNot = typeof cfg.payload_not_available === 'string' ? cfg.payload_not_available : 'offline';
    ent.templated = !!cfg.value_template;

    // A sensor this page cannot listen to must never take a tile: it would sit
    // in "waiting" forever for data that can never arrive.
    if (!sub(ent.stateTopic)) { if (removeEntity(dtopic)) refresh(); return; }

    entities.set(dtopic, ent);
    if (uid) byUid.set(uid, dtopic);
    index(byState, ent.stateTopic, dtopic);
    if (ent.availTopic) { index(byAvail, ent.availTopic, dtopic); sub(ent.availTopic); }

    unnote('nodisc');
    refresh();
  }

  // ------------------------------------------------------------ messages
  var AUX_RE = /^dbk\/([^/]+)\/sensor\/([^/]+)\/state$/i;

  function onMessage(topic, payload) {
    var text;
    try { text = new TextDecoder('utf-8').decode(payload); }
    catch (e) { text = String(payload); }

    if (/^homeassistant\/.+\/config$/.test(topic)) {
      try { onDiscovery(topic, text); }
      catch (e) {
        parseErrors++;
        note('parse', 'warn', 'A discovery payload could not be applied. ' + (e.message || ''));
      }
      return;
    }

    var now = Date.now();

    var b = /^dbk\/([^/]+)\/status$/i.exec(topic);
    if (b) { boardStatus.set(b[1], { raw:text.trim(), at:now }); refresh(); }

    // The boards publish extra readings alongside the discovered PM2.5 one.
    // They are stashed per board and shown only as sub-stats on the large tile.
    var a = AUX_RE.exec(topic);
    if (a) {
      if (!aux.has(a[1])) aux.set(a[1], new Map());
      aux.get(a[1]).set(a[2].toLowerCase(), { v:parseValue(text), at:now });
      refresh();
    }

    if (byState.has(topic)) {
      byState.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.value = parseValue(text); e.at = now;
      });
      refresh();
    }
    if (byAvail.has(topic)) {
      byAvail.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.availRaw = text.trim(); e.availAt = now;
      });
      refresh();
    }
  }

  // ------------------------------------------------------------ entity state
  function availabilityOf(ent) {
    if (ent.availTopic && ent.availRaw !== null) {
      if (ent.availRaw === ent.pNot) return 'offline';
      if (ent.availRaw === ent.pAvail) return 'online';
      return 'unknown';
    }
    if (ent.board && boardStatus.has(ent.board)) {
      var raw = boardStatus.get(ent.board).raw;
      if (raw === ent.pNot || raw === 'offline') return 'offline';
      if (raw === ent.pAvail || raw === 'online') return 'online';
    }
    return 'unknown';
  }

  function stateOf(ent) {
    if (availabilityOf(ent) === 'offline') return 'offline';
    if (!ent.at || !ent.value) return 'waiting';
    if (ent.value.kind === 'unknown' || ent.value.kind === 'empty') return 'unknown';
    // A concentration cannot be negative — checked before stale and before live so
    // a broken sensor is never dressed up as a reading, least of all a green one.
    if (ent.value.kind === 'number' && ent.value.n1 < 0 && isPm(ent)) return 'fault';
    if ((Date.now() - ent.at) / 1000 > ent.expire) return 'stale';
    return 'live';
  }

  /* =======================================================================
     PRESENTATION — the home screen
     ======================================================================= */

  var board = $('board'), stage = $('stage');
  var W = null;            // live widget references, rebuilt only when the tile
  var lastCount = -1;      // COUNT changes — never on a value change
  var pending = false;

  function refresh() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; sync(); });
  }

  // ---- model ------------------------------------------------------------
  function model() {
    var boards = new Map();
    entities.forEach(function (e) {
      var id = e.board || e.title || e.stateTopic;
      if (!boards.has(id)) boards.set(id, { id:id, pm:null, others:[] });
      var g = boards.get(id);
      if (isPm(e) && (!g.pm || e.at > g.pm.at)) {
        if (g.pm) g.others.push(g.pm);
        g.pm = e;
      } else g.others.push(e);
    });
    // A board that only ever published availability still deserves a tile —
    // "DBK-001 is offline" is information; a missing tile is not.
    boardStatus.forEach(function (v, id) {
      if (!boards.has(id)) boards.set(id, { id:id, pm:null, others:[] });
    });

    var list = [];
    boards.forEach(function (g) {
      var e = g.pm || g.others[0] || null;
      var st = e ? stateOf(e) : (boardStatus.has(g.id) &&
        boardStatus.get(g.id).raw === 'offline' ? 'offline' : 'waiting');
      var live = st === 'live' && e && e.value && e.value.kind === 'number' && isPm(e);
      list.push({
        id:g.id, ent:e, others:g.others, state:st,
        live:live, n1:live ? e.value.n1 : null,
        band:live ? bandFor(e.value.n1) : null
      });
    });

    // Worst live board first — that one gets the large tile and sets the sky.
    // Then everything that is merely quiet, then the offline boards, so the
    // deliberate two-offline-one-live shape always reads the same way.
    var order = { live:0, stale:1, waiting:2, unknown:3, fault:4, offline:5 };
    list.sort(function (a, b) {
      if (a.live && b.live) return b.n1 - a.n1;
      if (a.live !== b.live) return a.live ? -1 : 1;
      return (order[a.state] - order[b.state]) || String(a.id).localeCompare(String(b.id));
    });

    var worst = null;
    list.forEach(function (r) { if (r.live && (!worst || r.n1 > worst.n1)) worst = r; });
    return { rows:list, worst:worst, reporting:list.filter(function (r) { return r.live; }).length };
  }

  // ---- DOM ---------------------------------------------------------------
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function head(parent, cls) {
    var h = el('header', 'w-head');
    var ic = el('span', 'w-ic');
    var nm = el('span', 'w-name');
    var bd = el('span', 'w-badge');
    h.appendChild(ic); h.appendChild(nm); h.appendChild(bd);
    parent.appendChild(h);
    return { name:nm, badge:bd };
  }

  function buildLarge() {
    var w = el('section', 'w w-lg');
    var h = head(w);
    var read = el('div', 'hero-read');
    var num = el('span', 'hero-num');
    var unit = el('span', 'hero-unit');
    read.appendChild(num); read.appendChild(unit);
    var bandLine = el('div', 'hero-band');
    var rule = el('div', 'hero-rule');
    var go = el('div', 'hero-go');
    var why = el('div', 'hero-why');
    var stats = el('div', 'hero-stats');
    w.appendChild(read); w.appendChild(bandLine); w.appendChild(rule);
    w.appendChild(go); w.appendChild(why); w.appendChild(stats);
    board.appendChild(w);
    return { root:w, name:h.name, badge:h.badge, num:num, unit:unit,
             band:bandLine, go:go, why:why, stats:stats };
  }

  function buildSmall() {
    var w = el('section', 'w w-sm');
    var h = head(w);
    var line = el('div', 'sm-line');
    var val = el('span', 'sm-val');
    var unit = el('span', 'sm-unit');
    line.appendChild(val); line.appendChild(unit);
    var foot = el('div', 'sm-foot');
    w.appendChild(line); w.appendChild(foot);
    board.appendChild(w);
    return { root:w, name:h.name, badge:h.badge, val:val, unit:unit, foot:foot };
  }

  function buildScale() {
    var w = el('section', 'w w-md');
    var h = head(w);
    h.name.textContent = 'The scale';
    var row = el('div', 'scale');
    var segs = BANDS.map(function (b) {
      var s = el('div', 'sg');
      s.style.color = 'var(--' + b.key + ')';
      s.appendChild(el('i'));
      s.appendChild(el('b', null, b.short));
      s.appendChild(el('em', null, b.r));
      row.appendChild(s);
      return s;
    });
    var note2 = el('div', 'md-note');
    w.appendChild(row); w.appendChild(note2);
    board.appendChild(w);
    return { root:w, badge:h.badge, segs:segs, note:note2 };
  }

  function buildFleet() {
    var w = el('section', 'w w-tiny');
    var l = el('div', 'fleet-l');
    var count = el('span', 'fleet-count');
    var sep = el('span', 'fleet-sep');
    var txt = el('span', 'fleet-txt');
    l.appendChild(count); l.appendChild(sep); l.appendChild(txt);
    var r = el('div', 'fleet-r');
    var chipWorst = el('span', 'fleet-chip');
    var chipHost = el('span', 'fleet-chip');
    r.appendChild(chipWorst); r.appendChild(chipHost);
    w.appendChild(l); w.appendChild(r);
    board.appendChild(w);
    return { root:w, count:count, txt:txt, worst:chipWorst, host:chipHost };
  }

  function rebuild(n) {
    board.textContent = '';
    W = { large:buildLarge(), smalls:[], scale:null, fleet:null };
    for (var i = 1; i < n; i++) W.smalls.push(buildSmall());
    W.scale = buildScale();
    W.fleet = buildFleet();
    lastCount = n;
  }

  // ---- painting ----------------------------------------------------------
  // Nothing below uppercases anything. µg/m³ arrives from the wire and is
  // written out byte for byte; a CSS uppercase would turn it into mg/m³.
  function longFlag(node) {
    node.setAttribute('data-long', node.textContent.length > 7 ? '1' : '0');
  }

  function offlineFoot(row) {
    var seen = row.ent && row.ent.availAt ? row.ent.availAt
      : (boardStatus.has(row.id) ? boardStatus.get(row.id).at : 0);
    // The retained status message replays the instant we subscribe, so its
    // timestamp is when WE heard, not when the board died. Say which.
    if (seen && connectedAt && seen - connectedAt < 3000) return 'offline since this screen connected';
    return 'went offline ' + ago(seen);
  }

  // What the line under the big number says when there is no band to name.
  // Every one of these is a different fact, so each gets its own sentence —
  // "no reading yet" for a sensor reporting minus nine hundred is a dodge.
  function bandLine(row) {
    if (!row) return 'nothing has been discovered yet';
    if (row.band) return row.band.label;
    switch (row.state) {
      case 'offline': return 'this board is not reporting';
      case 'stale':   return 'its last reading expired — treat as unknown';
      case 'fault':   return 'below zero is not a reading';
      case 'unknown': return 'the board published no value';
      case 'waiting': return 'waiting for its first reading';
      default:        return 'no band applies to this reading';
    }
  }

  function fillTile(t, row, big) {
    var st = row ? row.state : 'waiting';
    t.root.setAttribute('data-state', st);
    var ent = row ? row.ent : null;

    t.name.textContent = row ? row.id : 'No monitor';
    t.root.style.setProperty('--accent',
      row && row.band ? 'var(--' + row.band.key + ')' : 'var(--faint)');

    var valNode = big ? t.num : t.val;
    var kind = 'num';
    var unit = '';
    var badge = '';

    if (!row) { valNode.textContent = '—'; kind = 'word'; badge = 'waiting'; }
    else if (st === 'offline') { valNode.textContent = 'Offline'; kind = 'word'; badge = 'no signal'; }
    else if (st === 'waiting') { valNode.textContent = '—'; kind = 'word'; badge = 'waiting'; }
    else if (st === 'unknown') {
      valNode.textContent = ent && ent.value ? ent.value.text : 'no value';
      kind = 'word'; badge = 'no reading';
    }
    else if (st === 'fault') {
      valNode.textContent = ent.value.text; kind = 'word';
      unit = ent.unit; badge = 'sensor fault';
    }
    else {
      valNode.textContent = ent.value.text;
      kind = ent.value.kind === 'number' ? 'num' : 'word';
      unit = ent.unit;
      badge = st === 'stale' ? 'stale' : (ent.measure || 'live');
    }
    valNode.setAttribute('data-kind', kind);
    longFlag(valNode);
    t.unit.textContent = unit;
    t.badge.textContent = badge;
    return st;
  }

  function paint() {
    var m = model();
    var n = Math.max(1, m.rows.length);
    if (n !== lastCount) { rebuild(n); fit(); }

    // ---- large tile: the worst board
    var top = m.rows[0] || null;
    var L = W.large;
    fillTile(L, top, true);

    // The advice comes from the worst LIVE reading and nothing else. A faulty or
    // silent board can never produce a "go outside" — only "we cannot tell".
    var adv = m.worst && m.worst.band ? ADVICE[m.worst.band.i] : NO_ADVICE;
    L.band.textContent = bandLine(top);
    L.go.textContent = adv.go;
    L.why.textContent = adv.why;

    // sub-stats: the other things this same board publishes
    var extras = [];
    if (top) {
      var m2 = aux.get(top.id);
      var pmUnit = top.ent && top.ent.unit ? top.ent.unit : '';
      if (m2) {
        // pm1_0 and pm10 come off the same particle counter as the discovered
        // PM2.5, so they carry its unit. Anything else is shown as published,
        // with no unit invented for it.
        var wanted = ['pm1_0', 'pm10', 'wi-fi_rssi', 'uptime', 'air_quality_level'];
        wanted.forEach(function (k) {
          var r = m2.get(k);
          if (!r || extras.length >= 4) return;
          var lbl = k === 'pm1_0' ? 'PM1.0' : k === 'pm10' ? 'PM10'
                  : k === 'wi-fi_rssi' ? 'Wi-Fi' : k === 'uptime' ? 'Uptime'
                  : k === 'air_quality_level' ? 'Level' : k;
          var u = (k === 'pm1_0' || k === 'pm10') ? pmUnit : '';
          extras.push({ label:lbl, value:r.v.text + (u ? ' ' + u : '') });
        });
      }
      if (top.ent && top.at !== 0) { /* nothing: updated line lives in the badge row */ }
    }
    L.stats.textContent = '';
    if (extras.length && top && top.state !== 'offline') {
      extras.forEach(function (x) {
        var s = el('div', 'hs');
        s.appendChild(el('b', null, x.value));
        s.appendChild(el('span', null, x.label));
        L.stats.appendChild(s);
      });
      L.stats.hidden = false;
    } else if (top) {
      var s2 = el('div', 'hs wide');
      s2.appendChild(el('b', null, top.state === 'offline' ? offlineFoot(top)
        : (top.ent && top.ent.at ? 'updated ' + ago(top.ent.at) : 'no reading yet')));
      s2.appendChild(el('span', null, top.ent ? top.ent.stateTopic : ''));
      L.stats.appendChild(s2);
      L.stats.hidden = false;
    } else {
      L.stats.hidden = true;
    }

    // ---- small tiles: everyone else
    for (var i = 0; i < W.smalls.length; i++) {
      var row = m.rows[i + 1] || null;
      var t = W.smalls[i];
      var st = fillTile(t, row, false);
      if (!row) t.foot.textContent = '';
      else if (st === 'offline') t.foot.textContent = offlineFoot(row);
      else if (st === 'waiting') t.foot.textContent = 'connected, waiting for its first reading';
      else if (st === 'stale') t.foot.textContent = 'last heard ' + ago(row.ent.at) + ' — treat as unknown';
      else if (st === 'fault') t.foot.textContent = 'below zero is not a reading';
      else t.foot.textContent = (row.band ? row.band.short + ' · ' : '') + 'updated ' + ago(row.ent.at);
    }

    // ---- the scale
    var cur = m.worst && m.worst.band ? m.worst.band.i : -1;
    W.scale.segs.forEach(function (s, i2) { s.classList.toggle('on', i2 === cur); });
    W.scale.badge.textContent = 'µg/m³';       // authored, never uppercased by CSS
    W.scale.note.textContent = cur >= 0
      ? 'The wallpaper behind these widgets is this reading: what ' + BANDS[cur].label.toLowerCase() +
        ' air looks like from a ridge above the valley.'
      : 'No live reading, so the wallpaper stays dark. An unknown sky is not a clear one.';

    // ---- the fleet accessory
    var total = m.rows.length;
    W.fleet.count.textContent = m.reporting + ' / ' + (total || 0);
    W.fleet.txt.textContent = total === 0
      ? 'no monitors discovered yet'
      : m.reporting + ' of ' + total + ' board' + (total === 1 ? '' : 's') + ' reporting' +
        (m.reporting < total ? ' · ' + (total - m.reporting) + ' quiet or offline' : '');
    W.fleet.worst.textContent = m.worst
      ? 'worst now ' + m.worst.n1.toFixed(1) + ' ' + (m.worst.ent.unit || '') + ' · ' + m.worst.band.label
      : 'worst now — no live reading';
    W.fleet.host.textContent = hostLabel;

    // ---- the sky follows the worst live reading, and nothing else
    setSky(m.worst && m.worst.band ? m.worst.band : null);
    return m;
  }

  function sync() { paint(); }

  // ---- wallpaper ---------------------------------------------------------
  var panes = [$('paneA'), $('paneB')];
  var front = 0, curFile = null, preloaded = {};

  function preload(i) {
    var b = BANDS[i];
    if (!b || preloaded[b.file]) return;
    preloaded[b.file] = true;
    var im = new Image();
    im.src = 'img/' + b.file + '.jpg';
  }

  function setSky(band) {
    var file = band ? band.file : null;
    document.body.setAttribute('data-band', band ? band.key : 'unknown');
    $('sb-sky').textContent = band ? 'wallpaper · ' + band.label : 'wallpaper · no reading';
    if (file === curFile) return;
    curFile = file;

    if (!file) {                       // unknown: fade to the neutral ground, never to dawn
      panes[0].style.opacity = '0';
      panes[1].style.opacity = '0';
      return;
    }
    // Neighbours first, so the next band change is already in cache.
    preload(band.i - 1); preload(band.i + 1);

    var url = 'img/' + file + '.jpg';
    var im = new Image();
    im.onload = function () {
      var back = panes[1 - front];
      back.style.backgroundImage = 'url("' + url + '")';
      back.style.opacity = '1';
      panes[front].style.opacity = '0';
      front = 1 - front;
    };
    im.onerror = function () {
      // A missing photograph must not leave a stale band on the wall.
      curFile = null;
      panes[0].style.opacity = '0';
      panes[1].style.opacity = '0';
      note('img', 'warn', 'The wallpaper for this band did not load, so the screen stays dark. ' +
        'The readings below are unaffected.');
    };
    im.src = url;
    preloaded[file] = true;
  }

  // Everything else, once the page is quiet — a band change should never flash white.
  setTimeout(function () { for (var i = 0; i < BANDS.length; i++) preload(i); }, 4000);

  // ---- fit ---------------------------------------------------------------
  // One pass. Slot width comes from the stage, then the whole board is scaled
  // down if its natural height overflows. Because every dimension in the grid
  // is a multiple of --slot, scaling the slot scales the layout exactly — and
  // every reading is sized in cqi off its own tile, so the type follows.
  var fitting = false;
  function fit() {
    if (fitting || calmed) return;
    fitting = true;
    try {
      var cols = parseInt(getComputedStyle(board).getPropertyValue('--cols'), 10) || 8;
      var availW = stage.clientWidth, availH = stage.clientHeight;
      if (!availW || !availH) return;
      var GAP = 0.155;
      var s = availW / (cols + (cols - 1) * GAP);
      board.style.setProperty('--slot', s.toFixed(3) + 'px');
      var need = board.getBoundingClientRect().height;
      if (need > availH && need > 1) s = s * (availH / need);
      board.style.setProperty('--slot', Math.max(22, s).toFixed(3) + 'px');
    } finally { fitting = false; }
  }
  var fitQueued = false;
  function queueFit() {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(function () { fitQueued = false; fit(); });
  }
  window.addEventListener('resize', queueFit);
  window.addEventListener('orientationchange', queueFit);

  // ---- clock -------------------------------------------------------------
  function tick() {
    var d = new Date();
    $('sb-clock').textContent = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    if (!calmed) paint();          // keeps every "3m ago" honest
  }
  setInterval(tick, 1000);

  /* =======================================================================
     CONNECTION
     ======================================================================= */
  var hostLabel = '—';

  var CONN_TEXT = {
    idle:'not connected', connecting:'connecting', connected:'connected',
    reconnecting:'reconnecting', error:'broker unreachable', fatal:'refused'
  };
  function setConn(state, detail) {
    connState = state;
    document.body.setAttribute('data-conn', state);
    $('sb-conn').textContent = detail || CONN_TEXT[state] || state;
  }

  function describe(err) {
    var code = err && (err.code !== undefined ? err.code : err.reasonCode);
    var map = {
      1:'the broker rejected the MQTT protocol version',
      2:'the broker rejected this client id',
      3:'the broker is unavailable',
      4:'the username or passphrase is wrong',
      5:'this account is not authorised for the broker'
    };
    if (map[code]) return { text:map[code], fatal:code === 2 || code === 4 || code === 5 };
    var msg = String((err && err.message) || err || 'unknown error');
    if (/not authoriz|bad user/i.test(msg)) return { text:msg, fatal:true };
    return { text:msg, fatal:false };
  }

  function disconnect() {
    manualStop = true;
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    subs.clear();
  }

  var graceTimer = null;

  function connect(cfg) {
    if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
      setConn('fatal', 'library missing');
      calm('This screen could not load the library it needs to reach the air monitors.');
      return;
    }

    disconnect();
    manualStop = false;
    everConnected = false;
    activeFilter = typeof cfg.filter === 'string' ? cfg.filter.trim() : '';
    filteredOut.clear();
    ['conn', 'auth', 'mixed', 'nodisc', 'suberr', 'parse', 'wildcard', 'subcap', 'filter', 'img']
      .forEach(unnote);

    var url = (cfg.tls ? 'wss' : 'ws') + '://' + cfg.host + ':' + cfg.port;
    hostLabel = cfg.host + ':' + cfg.port;
    attachedAt = Date.now();
    setConn('connecting');

    if (!cfg.tls && location.protocol === 'https:') {
      note('mixed', 'warn', 'This page is served over HTTPS, so the browser will block a ' +
        'plaintext ws:// connection. Turn on TLS (press s) or open the file from disk.');
    }

    try {
      client = mqtt.connect(url, {
        username: cfg.user || undefined,
        password: cfg.pass || undefined,
        clientId: 'air-widgets-' + Math.random().toString(16).slice(2, 10),
        clean: true, reconnectPeriod: 4000, connectTimeout: 8000,
        keepalive: 45, resubscribe: true
      });
    } catch (e) {
      setConn('fatal');
      calm('This screen could not start a connection to the air monitors.');
      return;
    }

    if (graceTimer) clearTimeout(graceTimer);
    graceTimer = setTimeout(function () {
      // Twenty seconds with no handshake at all is not a blip. Say one calm thing.
      if (!everConnected && !manualStop) {
        calm('The air monitors cannot be reached from this screen right now.');
      }
    }, 20000);

    client.on('connect', function () {
      everConnected = true;
      connectedAt = Date.now();
      uncalm();
      setConn('connected');
      unnote('conn');
      // Bounded wildcards, all four authored HERE. sub() refuses every wildcard
      // that arrives over the wire; none of these contains '#'.
      subRaw('homeassistant/+/+/config');
      subRaw('homeassistant/+/+/+/config');
      subRaw('dbk/+/status');
      subRaw('dbk/+/sensor/+/state');
      setTimeout(function () {
        if (entities.size === 0 && filteredOut.size === 0 && connState === 'connected') {
          note('nodisc', 'info', 'Connected, but nothing has described a sensor yet. Retained ' +
            'discovery messages replay the moment we subscribe, so an empty screen usually ' +
            'means nothing has published one.');
        }
      }, 4000);
      refresh();
    });

    client.on('message', function (topic, payload) {
      try { onMessage(topic, payload); } catch (e) { /* one bad message never stops the stream */ }
    });

    client.on('reconnect', function () { if (!manualStop && connState !== 'fatal') setConn('reconnecting'); });
    client.on('offline', function () { if (!manualStop && connState !== 'fatal') setConn('reconnecting'); });

    client.on('close', function () {
      if (manualStop || connState === 'fatal') return;
      if (!everConnected) setConn('error');
      else {
        setConn('reconnecting');
        note('conn', 'warn', 'The connection to the broker dropped. Retrying every 4 seconds — ' +
          'the tiles keep their last known state and will age into stale.');
      }
    });

    client.on('error', function (err) {
      var d = describe(err);
      if (d.fatal) {
        setConn('fatal');
        manualStop = true;
        try { client.end(true); } catch (e) {}
        client = null;
        calm('The broker would not accept this screen: ' + d.text + '.');
      } else {
        setConn('error');
        note('conn', 'bad', 'Cannot reach the broker at ' + url + ' — ' + d.text +
          '. Retrying every 4 seconds.');
      }
    });
  }

  /* =======================================================================
     SETTINGS — behind "s", never on load
     ======================================================================= */
  var sheet = $('sheet');
  function readForm() {
    return {
      host: $('f-host').value.trim(), port: $('f-port').value.trim(),
      user: $('f-user').value, pass: $('f-pass').value,
      tls: $('f-tls').checked, filter: $('f-filter').value.trim(),
      remember: $('f-remember').checked
    };
  }
  function fillForm(v) {
    $('f-host').value = (v && v.host) || DEFAULT_HOST;
    $('f-port').value = (v && v.port) || DEFAULT_PORT;
    $('f-user').value = (v && v.user) || '';
    $('f-pass').value = (v && v.pass) || '';
    $('f-tls').checked = !!(v && v.tls);
    $('f-filter').value = v && typeof v.filter === 'string' ? v.filter : DEFAULT_FILTER;
    $('f-remember').checked = !!(v && (v.remember || v.pass));
  }
  function storable(cfg) {
    var out = { host:cfg.host, port:cfg.port, user:cfg.user, tls:cfg.tls,
                filter:cfg.filter, remember:!!cfg.remember };
    if (cfg.remember) out.pass = cfg.pass;      // the passphrase is opt-in, always
    return out;
  }
  function openSheet() { sheet.hidden = false; $('f-host').focus(); }
  function closeSheet() { sheet.hidden = true; }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var cfg = readForm();
    if (!cfg.host || !cfg.port) return;
    entities.clear(); byState.clear(); byAvail.clear(); byUid.clear();
    boardStatus.clear(); aux.clear(); filteredOut.clear();
    parseErrors = 0; lastCount = -1;
    var ok = saveStore(storable(cfg));
    $('store-hint').textContent = !ok
      ? 'This browser refused to save settings. The connection still works, but you will re-enter these next time.'
      : cfg.remember
        ? 'Saved in this browser only, on this device — passphrase included. Nothing is uploaded.'
        : 'Saved in this browser only, on this device. The passphrase was not stored.';
    closeSheet();
    connect(cfg);
    refresh();
  });

  $('btn-forget').addEventListener('click', function () {
    clearStore();
    fillForm(null);
    $('f-pass').value = '';
    $('store-hint').textContent = 'Saved settings cleared from this browser.';
  });
  $('btn-close').addEventListener('click', closeSheet);

  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (ev.key === 'Escape' && !sheet.hidden) { closeSheet(); return; }
    if (typing) return;
    if (ev.key === 's' || ev.key === 'S') {
      ev.preventDefault();
      sheet.hidden ? openSheet() : closeSheet();
    }
  });

  /* =======================================================================
     BOOT — no configuration screen, ever, on load
     ======================================================================= */
  var saved = loadStore();
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  var qu = q ? q.get('u') : null, qp = q ? q.get('p') : null;
  var qh = q ? q.get('h') : null, qport = q ? q.get('port') : null;

  var boot;
  if (saved && saved.host && saved.port) {
    boot = {
      host: saved.host, port: saved.port,
      user: saved.user || qu || '',
      pass: saved.pass || qp || '',
      tls: !!saved.tls,
      filter: typeof saved.filter === 'string' ? saved.filter : DEFAULT_FILTER,
      remember: !!saved.remember
    };
  } else if (qu !== null || qp !== null) {
    boot = { host: qh || DEFAULT_HOST, port: qport || DEFAULT_PORT,
             user: qu || '', pass: qp || '', tls:false, filter:DEFAULT_FILTER, remember:false };
  } else {
    // Anonymous. No credential is written in this file; there is nothing here to leak.
    boot = { host: qh || DEFAULT_HOST, port: qport || DEFAULT_PORT,
             user:'', pass:'', tls:false, filter:DEFAULT_FILTER, remember:false };
  }

  fillForm(saved || boot);
  $('store-hint').textContent = !storeWorks
    ? 'This browser blocks local storage, so settings cannot be remembered here.'
    : saved ? 'Loaded from this browser’s local storage.'
            : 'Nothing is stored yet. What you enter stays in this browser, on this device.';

  hostLabel = boot.host + ':' + boot.port;
  paint();
  fit();
  tick();
  connect(boot);
  setTimeout(fit, 300);
  window.addEventListener('load', queueFit);
})();
</script>
</body>
</html>
