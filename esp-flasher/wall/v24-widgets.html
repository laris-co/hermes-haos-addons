  var LANG_KEY = 'air-widgets.lang.v1';

  // ?lang= wins → then what this browser was last told → then the browser's own
  // preference → then English. localStorage throws outright in private mode, so
  // every touch of it is wrapped.
  function pickLang() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    if (q === 'th' || q === 'en') return q;
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
    if (saved === 'th' || saved === 'en') return saved;
    var nav = '';
    try {
      nav = navigator.language ||
            (navigator.languages && navigator.languages.length ? navigator.languages[0] : '') || '';
    } catch (e) {}
    return String(nav).toLowerCase().indexOf('th') === 0 ? 'th' : 'en';
  }

  var LANG = pickLang();

  // Never returns "undefined" on a wall. A missing Thai key shows the English —
  // visibly untranslated, but a sentence. A missing key everywhere shows the key
  // itself, which is loud in dev and still never blank in a classroom.
  function t(key, vars) {
    var s = STR[LANG] ? STR[LANG][key] : undefined;
    if (s === undefined || s === null) s = STR.en[key];
    if (s === undefined || s === null) s = key;
    s = String(s);
    if (vars) {
      s = s.replace(/\{(\w+)\}/g, function (whole, k) {
        if (!Object.prototype.hasOwnProperty.call(vars, k)) return whole;
        var v = vars[k];
        if (v === null || v === undefined) return whole;
        // A variable may itself be a phrase from this table — { key, vars } — so a
        // sentence built out of another sentence still switches language whole.
        if (typeof v === 'object' && typeof v.key === 'string') return t(v.key, v.vars);
        return String(v);
      });
    }
    return s;
  }

  /* =======================================================================
     DATA LAYER — lifted from tools/mqtt-dashboard.html, which is the tested
     one. Discovery parsing, alias expansion, availability, expiry, the EPA
     truncate-then-band rule, the wildcard refusal and the subscription
     ceiling are all unchanged in behaviour. Only the presentation is new.
     ======================================================================= */

  var DEFAULT_HOST = (location.hostname || '');  /* derive from the page's own host — a browser cannot open a WebSocket to a LAN address from a different network, and this keeps one out of source. */
  var DEFAULT_PORT = '1884';          // the broker's MQTT-over-WebSocket listener.
                                      // A browser has no other way in — it cannot
                                      // open a raw MQTT socket at all.
  var STORE_KEY   = 'air-widgets.conn.v1';
  var MAX_SUBS    = 64;
  var DEFAULT_EXPIRE = 900;
  var DEFAULT_FILTER = 'dbk/';

  // US EPA PM2.5 breakpoints, micrograms per cubic metre. One source of truth for
  // the tiles, the scale widget AND which photograph is on the wall.
  // `lk`/`sk`/`vk`/`wk` are STR keys, not words: the band name, its short form,
  // the verdict and the reason all come out of the language table. The numbers,
  // the ranges and the file names are language-free and stay here.
  var BANDS = [
    { i:0, max: 12.0,     key:'good',     file:'good',
      lk:'band.good',      sk:'bandshort.good',      vk:'verdict.good',      wk:'why.good',
      r:'0–12' },
    { i:1, max: 35.4,     key:'moderate', file:'moderate',
      lk:'band.moderate',  sk:'bandshort.moderate',  vk:'verdict.moderate',  wk:'why.moderate',
      r:'12.1–35.4' },
    { i:2, max: 55.4,     key:'usg',      file:'sensitive',
      lk:'band.sensitive', sk:'bandshort.sensitive', vk:'verdict.sensitive', wk:'why.sensitive',
      r:'35.5–55.4' },
    { i:3, max: 150.4,    key:'unh',      file:'unhealthy',
      lk:'band.unhealthy', sk:'bandshort.unhealthy', vk:'verdict.unhealthy', wk:'why.unhealthy',
      r:'55.5–150.4' },
    { i:4, max: 250.4,    key:'vun',      file:'verybad',
      lk:'band.verybad',   sk:'bandshort.verybad',   vk:'verdict.verybad',   wk:'why.verybad',
      r:'150.5–250.4' },
    { i:5, max: Infinity, key:'haz',      file:'hazardous',
      lk:'band.hazardous', sk:'bandshort.hazardous', vk:'verdict.hazardous', wk:'why.hazardous',
      r:'250.5+' }
  ];

  // No band, no verdict. A silent or faulty board can never produce "go outside".
  var NO_ADVICE = { vk:'verdict.unknown', wk:'why.unknown' };

  var ALIASES = {
    stat_t:'state_topic', avty_t:'availability_topic', uniq_id:'unique_id',
    unit_of_meas:'unit_of_measurement', dev_cla:'device_class', stat_cla:'state_class',
    exp_aft:'expire_after', pl_avail:'payload_available', pl_not_avail:'payload_not_available',
    dev:'device', val_tpl:'value_template', avty:'availability', ic:'icon'
  };

  var client = null;
  var entities = new Map();      // discovery topic -> entity
  var byState  = new Map();      // state topic     -> Set(discovery topic)
  var byAvail  = new Map();      // avail topic     -> Set(discovery topic)
  var byUid    = new Map();
  var boardStatus = new Map();   // board id -> { raw, at }
  var aux = new Map();           // board id -> Map(name -> { text, n, at })
  var subs = new Set();
  var filteredOut = new Set();
  var activeFilter = '';
  var connState = 'idle';
  var manualStop = false;
  var everConnected = false;
  var connectedAt = 0;
  var attachedAt = 0;
  var parseErrors = 0;

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  // The EPA scale starts at 0; without the lower bound a faulty -999 fell into the
  // first band and rendered as a reassuring green "Good".
  function bandFor(n) {
    if (!Number.isFinite(n) || n < 0) return null;
    for (var i = 0; i < BANDS.length; i++) if (n <= BANDS[i].max) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  function isPm(ent) {
    return ent.deviceClass === 'pm25' || /pm ?2\.?5/i.test(ent.measure || ent.title || '');
  }

  // Built from the language table every time it is called, so a language switch
  // re-renders "3m ago" as "3 นาทีที่แล้ว" on the next paint with no reload.
  // The number goes in through {n}: Thai puts the unit after the digit and the
  // whole phrase after the verb, which string concatenation cannot express.
  function ago(ts) {
    if (!ts) return t('time.never');
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 2) return t('time.justnow');
    if (s < 60) return t('time.secondsAgo', { n:s });
    var m = Math.floor(s / 60);
    if (m < 60) return t('time.minutesAgo', { n:m });
    var h = Math.floor(m / 60);
    if (h < 24) return t('time.hoursAgo', { n:h });
    return t('time.daysAgo', { n:Math.floor(h / 24) });
  }

  function parseValue(raw) {
    var s = String(raw == null ? '' : raw).trim();
    // No text is baked in here: the value is stored, and the words for it are
    // fetched at paint time so a language switch reaches values already received.
    if (s === '') return { kind:'empty', text:'' };
    if (/^(unknown|unavailable|none|null|nan|n\/a)$/i.test(s)) {
      return { kind:'unknown', text:s.toLowerCase() };
    }
    var n = Number(s);
    if (!Number.isFinite(n)) return { kind:'text', text:s };
    // Truncate to one decimal ONCE, and band on that same value, so the number
    // printed and the label under it can never disagree. Truncate, never round:
    // rounding 35.44 up to 35.5 would invent a severity nothing measured.
    var n1 = Math.trunc(n * 10) / 10;
    var text = /^[+-]?\d+(\.\d)?$/.test(s) ? s.replace(/^\+/, '') : n1.toFixed(1);
    return { kind:'number', n:n, n1:n1, text:text };
  }

  function boardFromTopic(topic) {
    var m = /^dbk\/([^/]+)\//i.exec(topic || '');
    return m ? m[1] : null;
  }

  var storeWorks = true;
  function loadStore() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); }
    catch (e) { storeWorks = false; return null; }
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (e) { try { localStorage.removeItem(STORE_KEY); } catch (e2) {} return null; }
  }
  function saveStore(v) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; }
    catch (e) { storeWorks = false; return false; }
  }
  function clearStore() {
    try { localStorage.removeItem(STORE_KEY); return true; } catch (e) { return false; }
  }

  // ------------------------------------------------------------ notices
  // A notice stores its KEY and its variables, never a finished sentence — so a
  // notice raised in English is repainted in Thai the instant the language changes.
  var notes = new Map();
  var RANK = { bad:3, warn:2, info:1 };
  function note(id, level, key, vars) {
    notes.set(id, { level:level, key:key, vars:vars || null });
    paintNotes();
  }
  function unnote(id) { if (notes.delete(id)) paintNotes(); }
  function paintNotes() {
    var best = null;
    notes.forEach(function (n) { if (!best || RANK[n.level] > RANK[best.level]) best = n; });
    var node = $('toast');
    if (!best) { node.hidden = true; return; }
    if (calmed) { node.hidden = true; return; }
    node.hidden = false;
    node.setAttribute('data-l', best.level);
    node.textContent = t(best.key, best.vars);
  }

  // ------------------------------------------------------------ calm failure
  var calmed = false;
  var calmState = null;             // { key, vars, why:{key,vars}|null }
  function calm(key, vars, why) {
    calmed = true;
    calmState = { key:key, vars:vars || null, why:why || null };
    paintCalm();
    $('calm').hidden = false;
    $('screen').hidden = true;
    $('toast').hidden = true;
  }
  function paintCalm() {
    if (!calmState) return;
    $('calm-text').textContent = t(calmState.key, calmState.vars);
    var w = $('calm-why');
    if (calmState.why) { w.hidden = false; w.textContent = t(calmState.why.key, calmState.why.vars); }
    else { w.hidden = true; w.textContent = ''; }
  }
  function uncalm() {
    if (!calmed) return;
    calmed = false;
    calmState = null;
    $('calm').hidden = true;
    $('screen').hidden = false;
    paintNotes();
    fit();
  }

  // ------------------------------------------------------------ subscribe
  // subRaw is the only thing that talks to the broker and is private to topics
  // authored in THIS file. Anything that arrived over the wire goes through
  // sub(), which refuses wildcards outright.
  function subRaw(topic) {
    // In demo mode there is no broker to ask, and there must never be one — but a
    // synthesised sensor still has to pass the very same subscribe test a real one
    // does, because onDiscovery() DELETES any entity whose topic it cannot listen
    // to. Refusing on !client here would silently empty the wall under a confident
    // DEMO bar. subRaw() stops short of the client itself, a few lines down.
    if ((!client && !DEMO) || !topic || typeof topic !== 'string') return false;
    if (subs.has(topic)) return true;
    if (subs.size >= MAX_SUBS) {
      note('subcap', 'warn', 'note.subcap', { n:MAX_SUBS });
      return false;
    }
    subs.add(topic);
    if (DEMO) return true;   // a demo has no broker to ask, and must never look for one
    client.subscribe(topic, { qos:0 }, function (err) {
      if (err) {
        subs.delete(topic);
        note('suberr', 'bad', 'note.suberr', { topic:topic, msg:(err.message || String(err)) });
      }
    });
    return true;
  }

  function sub(topic) {
    // In demo mode there is no broker to ask, and there must never be one — but a
    // synthesised sensor still has to pass the very same subscribe test a real one
    // does, because onDiscovery() DELETES any entity whose topic it cannot listen
    // to. Refusing on !client here would silently empty the wall under a confident
    // DEMO bar. subRaw() stops short of the client itself, a few lines down.
    if ((!client && !DEMO) || !topic || typeof topic !== 'string') return false;
    // Absolute guard. A wildcard on this broker costs roughly 109 GB a day, and
    // '+' is every bit as dangerous as '#': a retained config asking for "+/+/+"
    // delivered ten out of ten unrelated fleet topics in testing. A topic that
    // came off the wire must name exactly one topic.
    if (/[#+]/.test(topic)) {
      note('wildcard', 'warn', 'note.wildcard', { topic:topic });
      return false;
    }
    return subRaw(topic);
  }

  function unsub(topic) {
    if (!topic || !subs.has(topic)) return;
    if (byState.has(topic) || byAvail.has(topic)) return;
    subs.delete(topic);
    if (client) { try { client.unsubscribe(topic); } catch (e) {} }
  }

  // ------------------------------------------------------------ discovery
  function expand(cfg) {
    var out = {};
    Object.keys(cfg).forEach(function (k) { out[ALIASES[k] || k] = cfg[k]; });
    var base = out['~'];
    if (typeof base === 'string' && base) {
      ['state_topic', 'availability_topic'].forEach(function (k) {
        var v = out[k];
        if (typeof v !== 'string') return;
        if (v.charAt(0) === '~') out[k] = base + v.slice(1);
        else if (v.charAt(v.length - 1) === '~') out[k] = v.slice(0, -1) + base;
      });
    }
    if (!out.availability_topic && Array.isArray(out.availability) && out.availability.length) {
      var a = out.availability[0];
      if (a && typeof a.topic === 'string') {
        out.availability_topic = a.topic;
        if (a.payload_available) out.payload_available = a.payload_available;
        if (a.payload_not_available) out.payload_not_available = a.payload_not_available;
      }
    }
    return out;
  }

  function index(map, key, dtopic) {
    if (!key) return;
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(dtopic);
  }
  function unindex(map, key, dtopic) {
    if (!key || !map.has(key)) return;
    var set = map.get(key);
    set.delete(dtopic);
    if (set.size === 0) { map.delete(key); unsub(key); }
  }

  function removeEntity(dtopic) {
    var gone = entities.get(dtopic);
    if (!gone) return false;
    entities.delete(dtopic);
    if (gone.uid && byUid.get(gone.uid) === dtopic) byUid.delete(gone.uid);
    unindex(byState, gone.stateTopic, dtopic);
    unindex(byAvail, gone.availTopic, dtopic);
    return true;
  }

  function matchesFilter(topic) {
    return !activeFilter || String(topic).indexOf(activeFilter) === 0;
  }

  function noteFilter() {
    if (!activeFilter || filteredOut.size === 0) { unnote('filter'); return; }
    note('filter', 'info', filteredOut.size === 1 ? 'note.filter1' : 'note.filter',
      { n:filteredOut.size, f:activeFilter });
  }

  function onDiscovery(dtopic, text) {
    if (text.trim() === '') {                    // empty retained payload = delete
      filteredOut.delete(dtopic);
      removeEntity(dtopic);
      noteFilter();
      refresh();
      return;
    }

    var cfg;
    try { cfg = JSON.parse(text); }
    catch (e) {
      parseErrors++;
      note('parse', 'warn', parseErrors === 1 ? 'note.parse1' : 'note.parse', { n:parseErrors });
      return;
    }
    if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) { parseErrors++; return; }

    cfg = expand(cfg);
    if (typeof cfg.state_topic !== 'string' || !cfg.state_topic) return;

    if (!matchesFilter(cfg.state_topic)) {
      filteredOut.add(dtopic);
      if (removeEntity(dtopic)) refresh();
      noteFilter();
      return;
    }
    filteredOut.delete(dtopic);
    noteFilter();

    var parts = dtopic.split('/');
    var dev = cfg.device && typeof cfg.device === 'object' ? cfg.device : null;
    var devName = dev && typeof dev.name === 'string' ? dev.name : '';
    var measure = typeof cfg.name === 'string' && cfg.name ? cfg.name : (parts[2] || 'sensor');
    var expire = Number(cfg.expire_after);
    var uid = typeof cfg.unique_id === 'string' && cfg.unique_id ? cfg.unique_id : '';
    var board = boardFromTopic(cfg.state_topic);
    var newAvail = typeof cfg.availability_topic === 'string' ? cfg.availability_topic : '';

    if (uid && byUid.has(uid) && byUid.get(uid) !== dtopic) removeEntity(byUid.get(uid));

    var ent = entities.get(dtopic) ||
      { key:dtopic, value:null, at:0, availRaw:null, availAt:0 };

    if (ent.stateTopic && ent.stateTopic !== cfg.state_topic) {
      unindex(byState, ent.stateTopic, dtopic);
      ent.value = null; ent.at = 0;
    }
    if (ent.availTopic && ent.availTopic !== newAvail) {
      unindex(byAvail, ent.availTopic, dtopic);
      ent.availRaw = null; ent.availAt = 0;
    }
    if (ent.uid && ent.uid !== uid && byUid.get(ent.uid) === dtopic) byUid.delete(ent.uid);

    // IDENTITY. Every board on this fleet publishes the discovery name "PM2.5",
    // so the name cannot identify anything — three boards reading 8, 58.2 and
    // 163.3 would all be titled the same. The board id parsed out of state_topic
    // is the identity; the discovery name is demoted to the badge.
    ent.board = board;
    ent.title = board || devName || uid || measure;
    ent.measure = measure;
    ent.uid = uid;
    ent.stateTopic = cfg.state_topic;
    ent.availTopic = newAvail;
    ent.unit = typeof cfg.unit_of_measurement === 'string' ? cfg.unit_of_measurement : '';
    ent.deviceClass = typeof cfg.device_class === 'string' ? cfg.device_class : '';
    ent.expire = Number.isFinite(expire) && expire > 0 ? expire : DEFAULT_EXPIRE;
    ent.pAvail = typeof cfg.payload_available === 'string' ? cfg.payload_available : 'online';
    ent.pNot = typeof cfg.payload_not_available === 'string' ? cfg.payload_not_available : 'offline';
    ent.templated = !!cfg.value_template;

    // A sensor this page cannot listen to must never take a tile: it would sit
    // in "waiting" forever for data that can never arrive.
    if (!sub(ent.stateTopic)) { if (removeEntity(dtopic)) refresh(); return; }

    entities.set(dtopic, ent);
    if (uid) byUid.set(uid, dtopic);
    index(byState, ent.stateTopic, dtopic);
    if (ent.availTopic) { index(byAvail, ent.availTopic, dtopic); sub(ent.availTopic); }

    unnote('nodisc');
    refresh();
  }

  // ------------------------------------------------------------ messages
  var AUX_RE = /^dbk\/([^/]+)\/sensor\/([^/]+)\/state$/i;

  function onMessage(topic, payload) {
    var text;
    try { text = new TextDecoder('utf-8').decode(payload); }
    catch (e) { text = String(payload); }

    if (/^homeassistant\/.+\/config$/.test(topic)) {
      try { onDiscovery(topic, text); }
      catch (e) {
        parseErrors++;
        note('parse', 'warn', 'note.parseApply', { msg:(e.message || '') });
      }
      return;
    }

    var now = Date.now();

    var b = /^dbk\/([^/]+)\/status$/i.exec(topic);
    if (b) { boardStatus.set(b[1], { raw:text.trim(), at:now }); refresh(); }

    // The boards publish extra readings alongside the discovered PM2.5 one.
    // They are stashed per board and shown only as sub-stats on the large tile.
    var a = AUX_RE.exec(topic);
    if (a) {
      if (!aux.has(a[1])) aux.set(a[1], new Map());
      aux.get(a[1]).set(a[2].toLowerCase(), { v:parseValue(text), at:now });
      refresh();
    }

    if (byState.has(topic)) {
      byState.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.value = parseValue(text); e.at = now;
      });
      refresh();
    }
    if (byAvail.has(topic)) {
      byAvail.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.availRaw = text.trim(); e.availAt = now;
      });
      refresh();
    }
  }

  // ------------------------------------------------------------ entity state
  function availabilityOf(ent) {
    if (ent.availTopic && ent.availRaw !== null) {
      if (ent.availRaw === ent.pNot) return 'offline';
      if (ent.availRaw === ent.pAvail) return 'online';
      return 'unknown';
    }
    if (ent.board && boardStatus.has(ent.board)) {
      var raw = boardStatus.get(ent.board).raw;
      if (raw === ent.pNot || raw === 'offline') return 'offline';
      if (raw === ent.pAvail || raw === 'online') return 'online';
    }
    return 'unknown';
  }

  function stateOf(ent) {
    if (availabilityOf(ent) === 'offline') return 'offline';
    if (!ent.at || !ent.value) return 'waiting';
    if (ent.value.kind === 'unknown' || ent.value.kind === 'empty') return 'unknown';
    // A concentration cannot be negative — checked before stale and before live so
    // a broken sensor is never dressed up as a reading, least of all a green one.
    if (ent.value.kind === 'number' && ent.value.n1 < 0 && isPm(ent)) return 'fault';
    if ((Date.now() - ent.at) / 1000 > ent.expire) return 'stale';
    return 'live';
  }

  /* =======================================================================
     PRESENTATION — the home screen
     ======================================================================= */

  var board = $('board'), stage = $('stage');
  var W = null;            // live widget references, rebuilt only when the tile
  var lastCount = -1;      // COUNT changes — never on a value change
  var pending = false;

  function refresh() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; sync(); });
  }

  // ---- model ------------------------------------------------------------
  function model() {
    var boards = new Map();
    entities.forEach(function (e) {
      var id = e.board || e.title || e.stateTopic;
      if (!boards.has(id)) boards.set(id, { id:id, pm:null, others:[] });
      var g = boards.get(id);
      if (isPm(e) && (!g.pm || e.at > g.pm.at)) {
        if (g.pm) g.others.push(g.pm);
        g.pm = e;
      } else g.others.push(e);
    });
    // A board that only ever published availability still deserves a tile —
    // "DBK-001 is offline" is information; a missing tile is not.
    boardStatus.forEach(function (v, id) {
      if (!boards.has(id)) boards.set(id, { id:id, pm:null, others:[] });
    });

    var list = [];
    boards.forEach(function (g) {
      var e = g.pm || g.others[0] || null;
      var st = e ? stateOf(e) : (boardStatus.has(g.id) &&
        boardStatus.get(g.id).raw === 'offline' ? 'offline' : 'waiting');
      var live = st === 'live' && e && e.value && e.value.kind === 'number' && isPm(e);
      list.push({
        id:g.id, ent:e, others:g.others, state:st,
        live:live, n1:live ? e.value.n1 : null,
        band:live ? bandFor(e.value.n1) : null
      });
    });

    // Worst live board first — that one gets the large tile and sets the sky.
    // Then everything that is merely quiet, then the offline boards, so the
    // deliberate two-offline-one-live shape always reads the same way.
    var order = { live:0, stale:1, waiting:2, unknown:3, fault:4, offline:5 };
    list.sort(function (a, b) {
      if (a.live && b.live) return b.n1 - a.n1;
      if (a.live !== b.live) return a.live ? -1 : 1;
      return (order[a.state] - order[b.state]) || String(a.id).localeCompare(String(b.id));
    });

    var worst = null;
    list.forEach(function (r) { if (r.live && (!worst || r.n1 > worst.n1)) worst = r; });
    return { rows:list, worst:worst, reporting:list.filter(function (r) { return r.live; }).length };
  }

  // ---- DOM ---------------------------------------------------------------
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function head(parent, cls) {
    var h = el('header', 'w-head');
    var ic = el('span', 'w-ic');
    var nm = el('span', 'w-name');
    var bd = el('span', 'w-badge');
    h.appendChild(ic); h.appendChild(nm); h.appendChild(bd);
    parent.appendChild(h);
    return { name:nm, badge:bd };
  }

  function buildLarge() {
    var w = el('section', 'w w-lg');
    var h = head(w);
    var read = el('div', 'hero-read');
    var num = el('span', 'hero-num');
    var unit = el('span', 'hero-unit');
    read.appendChild(num); read.appendChild(unit);
    var bandLine = el('div', 'hero-band');
    var rule = el('div', 'hero-rule');
    var go = el('div', 'hero-go');
    var why = el('div', 'hero-why');
    var stats = el('div', 'hero-stats');
    w.appendChild(read); w.appendChild(bandLine); w.appendChild(rule);
    w.appendChild(go); w.appendChild(why); w.appendChild(stats);
    board.appendChild(w);
    return { root:w, name:h.name, badge:h.badge, num:num, unit:unit,
             band:bandLine, go:go, why:why, stats:stats };
  }

  function buildSmall() {
    var w = el('section', 'w w-sm');
    var h = head(w);
    var line = el('div', 'sm-line');
    var val = el('span', 'sm-val');
    var unit = el('span', 'sm-unit');
    line.appendChild(val); line.appendChild(unit);
    var foot = el('div', 'sm-foot');
    w.appendChild(line); w.appendChild(foot);
    board.appendChild(w);
    return { root:w, name:h.name, badge:h.badge, val:val, unit:unit, foot:foot };
  }

  function buildScale() {
    var w = el('section', 'w w-md');
    var h = head(w);
    var row = el('div', 'scale');
    var labels = [];
    var segs = BANDS.map(function (b) {
      var s = el('div', 'sg');
      s.style.color = 'var(--' + b.key + ')';
      s.appendChild(el('i'));
      var lb = el('b');                      // filled by paint(), in the live language
      labels.push(lb);
      s.appendChild(lb);
      s.appendChild(el('em', null, b.r));    // the breakpoints are numbers, not words
      row.appendChild(s);
      return s;
    });
    var note2 = el('div', 'md-note');
    w.appendChild(row); w.appendChild(note2);
    board.appendChild(w);
    return { root:w, name:h.name, badge:h.badge, segs:segs, labels:labels, note:note2 };
  }

  function buildFleet() {
    var w = el('section', 'w w-tiny');
    var l = el('div', 'fleet-l');
    var count = el('span', 'fleet-count');
    var sep = el('span', 'fleet-sep');
    var txt = el('span', 'fleet-txt');
    l.appendChild(count); l.appendChild(sep); l.appendChild(txt);
    var r = el('div', 'fleet-r');
    var chipWorst = el('span', 'fleet-chip');
    var chipHost = el('span', 'fleet-chip');
    r.appendChild(chipWorst); r.appendChild(chipHost);
    w.appendChild(l); w.appendChild(r);
    board.appendChild(w);
    return { root:w, count:count, txt:txt, worst:chipWorst, host:chipHost };
  }

  function rebuild(n) {
    board.textContent = '';
    W = { large:buildLarge(), smalls:[], scale:null, fleet:null };
    for (var i = 1; i < n; i++) W.smalls.push(buildSmall());
    W.scale = buildScale();
    W.fleet = buildFleet();
    lastCount = n;
  }

  // ---- painting ----------------------------------------------------------
  // Nothing below uppercases anything. µg/m³ arrives from the wire and is
  // written out byte for byte; a CSS uppercase would turn it into mg/m³.
  function longFlag(node) {
    node.setAttribute('data-long', node.textContent.length > 7 ? '1' : '0');
  }

  function offlineFoot(row) {
    var seen = row.ent && row.ent.availAt ? row.ent.availAt
      : (boardStatus.has(row.id) ? boardStatus.get(row.id).at : 0);
    // The retained status message replays the instant we subscribe, so its
    // timestamp is when WE heard, not when the board died. Say which.
    if (seen && connectedAt && seen - connectedAt < 3000) return t('foot.offlineAtConnect');
    return t('foot.offlineSince', { t:ago(seen) });
  }

  // The band name a sentence needs mid-clause. Lowercasing is an ENGLISH
  // operation: Thai has no case, and toLowerCase() on mixed text is how a unit
  // gets mangled. It is applied to English only, and never to a unit.
  function bandName(b) {
    return b ? t(b.lk) : t('band.none');
  }
  function bandNameInline(b) {
    var s = bandName(b);
    return LANG === 'en' ? s.toLowerCase() : s;
  }

  // What the line under the big number says when there is no band to name.
  // Every one of these is a different fact, so each gets its own sentence —
  // "no reading yet" for a sensor reporting minus nine hundred is a dodge.
  function bandLine(row) {
    if (!row) return t('bandline.nodiscovery');
    if (row.band) return bandName(row.band);
    switch (row.state) {
      case 'offline': return t('bandline.offline');
      case 'stale':   return t('bandline.stale');
      case 'fault':   return t('bandline.fault');
      case 'unknown': return t('bandline.unknown');
      case 'waiting': return t('bandline.waiting');
      default:        return t('bandline.nband');
    }
  }

  // NOTE: the tile argument is `tile`, not `t`. `t` is the translator and every
  // painting function needs it; a parameter named `t` would shadow it for the
  // whole function body, which is a silent way to lose the language layer.
  function fillTile(tile, row, big) {
    var st = row ? row.state : 'waiting';
    tile.root.setAttribute('data-state', st);
    var ent = row ? row.ent : null;

    tile.name.textContent = row ? row.id : t('tile.none');
    tile.root.style.setProperty('--accent',
      row && row.band ? 'var(--' + row.band.key + ')' : 'var(--faint)');

    var valNode = big ? tile.num : tile.val;
    var kind = 'num';
    var unit = '';
    var badge = '';

    if (!row) { valNode.textContent = '—'; kind = 'word'; badge = t('state.waiting'); }
    else if (st === 'offline') {
      valNode.textContent = t('state.offline'); kind = 'word'; badge = t('badge.nosignal');
    }
    else if (st === 'waiting') { valNode.textContent = '—'; kind = 'word'; badge = t('state.waiting'); }
    else if (st === 'unknown') {
      // 'unknown'/'unavailable' arrived on the wire — printed as published, never
      // translated and never uppercased. Only a genuinely EMPTY payload gets words.
      valNode.textContent = ent && ent.value && ent.value.kind !== 'empty' && ent.value.text
        ? ent.value.text : t('value.none');
      kind = 'word'; badge = t('state.noreading');
    }
    else if (st === 'fault') {
      valNode.textContent = ent.value.text; kind = 'word';
      unit = ent.unit; badge = t('state.fault');
    }
    else {
      valNode.textContent = ent.value.text;
      kind = ent.value.kind === 'number' ? 'num' : 'word';
      unit = ent.unit;
      // The live badge carries the sensor's own published name (PM2.5) — wire
      // text, shown byte for byte.
      badge = st === 'stale' ? t('state.stale') : (ent.measure || t('state.live'));
    }
    valNode.setAttribute('data-kind', kind);
    longFlag(valNode);
    tile.unit.textContent = unit;
    tile.badge.textContent = badge;
    return st;
  }

  function paint() {
    var m = model();
    var n = Math.max(1, m.rows.length);
    if (n !== lastCount) { rebuild(n); fit(); }

    // ---- large tile: the worst board
    var top = m.rows[0] || null;
    var L = W.large;
    fillTile(L, top, true);

    // The advice comes from the worst LIVE reading and nothing else. A faulty or
    // silent board can never produce a "go outside" — only "we cannot tell".
    var adv = m.worst && m.worst.band ? m.worst.band : NO_ADVICE;
    L.band.textContent = bandLine(top);
    L.go.textContent = t(adv.vk);
    L.why.textContent = t(adv.wk);

    // sub-stats: the other things this same board publishes
    var extras = [];
    if (top) {
      var m2 = aux.get(top.id);
      var pmUnit = top.ent && top.ent.unit ? top.ent.unit : '';
      if (m2) {
        // pm1_0 and pm10 come off the same particle counter as the discovered
        // PM2.5, so they carry its unit. Anything else is shown as published,
        // with no unit invented for it.
        var wanted = ['pm1_0', 'pm10', 'wi-fi_rssi', 'uptime', 'air_quality_level'];
        wanted.forEach(function (k) {
          var r = m2.get(k);
          if (!r || extras.length >= 4) return;
          // PM1.0, PM10 and Wi-Fi are names, not words — the same in both
          // languages. Only the two that are actually English get translated.
          var lbl = k === 'pm1_0' ? 'PM1.0' : k === 'pm10' ? 'PM10'
                  : k === 'wi-fi_rssi' ? 'Wi-Fi' : k === 'uptime' ? t('aux.uptime')
                  : k === 'air_quality_level' ? t('aux.level') : k;
          var u = (k === 'pm1_0' || k === 'pm10') ? pmUnit : '';
          extras.push({ label:lbl, value:(r.v.text || t('value.none')) + (u ? ' ' + u : '') });
        });
      }
      if (top.ent && top.at !== 0) { /* nothing: updated line lives in the badge row */ }
    }
    L.stats.textContent = '';
    if (extras.length && top && top.state !== 'offline') {
      extras.forEach(function (x) {
        var s = el('div', 'hs');
        s.appendChild(el('b', null, x.value));
        s.appendChild(el('span', null, x.label));
        L.stats.appendChild(s);
      });
      L.stats.hidden = false;
    } else if (top) {
      var s2 = el('div', 'hs wide');
      s2.appendChild(el('b', null, top.state === 'offline' ? offlineFoot(top)
        : (top.ent && top.ent.at ? t('foot.updated', { t:ago(top.ent.at) })
                                 : t('foot.noreading'))));
      s2.appendChild(el('span', null, top.ent ? top.ent.stateTopic : ''));
      L.stats.appendChild(s2);
      L.stats.hidden = false;
    } else {
      L.stats.hidden = true;
    }

    // ---- small tiles: everyone else
    for (var i = 0; i < W.smalls.length; i++) {
      var row = m.rows[i + 1] || null;
      var tile = W.smalls[i];
      var st = fillTile(tile, row, false);
      if (!row) tile.foot.textContent = '';
      else if (st === 'offline') tile.foot.textContent = offlineFoot(row);
      else if (st === 'waiting') tile.foot.textContent = t('foot.waiting');
      else if (st === 'stale') tile.foot.textContent = t('foot.stale', { t:ago(row.ent.at) });
      else if (st === 'fault') tile.foot.textContent = t('bandline.fault');
      else tile.foot.textContent = (row.band ? t(row.band.sk) + ' · ' : '') +
                                   t('foot.updated', { t:ago(row.ent.at) });
    }

    // ---- the scale
    var cur = m.worst && m.worst.band ? m.worst.band.i : -1;
    W.scale.segs.forEach(function (s, i2) { s.classList.toggle('on', i2 === cur); });
    W.scale.labels.forEach(function (b, i2) { b.textContent = t(BANDS[i2].sk); });
    W.scale.name.textContent = t('scale.epa');   // whose scale this is, in both languages
    W.scale.badge.textContent = t('unit.ugm3');  // a unit: identical in both, never uppercased
    W.scale.note.textContent = cur >= 0
      ? t('scale.note', { band:bandNameInline(BANDS[cur]) })
      : t('scale.noteNone');

    // ---- the fleet accessory
    var total = m.rows.length;
    W.fleet.count.textContent = m.reporting + ' / ' + (total || 0);
    W.fleet.txt.textContent = total === 0
      ? t('fleet.none')
      : t(total === 1 ? 'fleet.reporting1' : 'fleet.reporting', { r:m.reporting, t:total }) +
        (m.reporting < total ? ' · ' + t('fleet.quiet', { n:total - m.reporting }) : '');
    W.fleet.worst.textContent = m.worst
      ? t('fleet.worst', { v:m.worst.n1.toFixed(1), u:(m.worst.ent.unit || ''),
                           band:bandName(m.worst.band) })
      : t('fleet.worstNone');
    W.fleet.host.textContent = hostLabel;

    // ---- the sky follows the worst live reading, and nothing else
    setSky(m.worst && m.worst.band ? m.worst.band : null);
    return m;
  }

  function sync() { paint(); }

  // ---- wallpaper ---------------------------------------------------------
  var panes = [$('paneA'), $('paneB')];
  var front = 0, curFile = null, preloaded = {}, skyBand = null;

  function paintSky() {
    $('sb-sky').textContent =
      t('sky.label', { band: skyBand ? bandName(skyBand) : t('state.noreading') });
  }

  function preload(i) {
    var b = BANDS[i];
    if (!b || preloaded[b.file]) return;
    preloaded[b.file] = true;
    var im = new Image();
    im.src = 'img/' + b.file + '.jpg';
  }

  function setSky(band) {
    var file = band ? band.file : null;
    document.body.setAttribute('data-band', band ? band.key : 'unknown');
    skyBand = band || null;
    paintSky();
    if (file === curFile) return;
    curFile = file;

    if (!file) {                       // unknown: fade to the neutral ground, never to dawn
      panes[0].style.opacity = '0';
      panes[1].style.opacity = '0';
      return;
    }
    // Neighbours first, so the next band change is already in cache.
    preload(band.i - 1); preload(band.i + 1);

    var url = 'img/' + file + '.jpg';
    var im = new Image();
    im.onload = function () {
      var back = panes[1 - front];
      back.style.backgroundImage = 'url("' + url + '")';
      back.style.opacity = '1';
      panes[front].style.opacity = '0';
      front = 1 - front;
    };
    im.onerror = function () {
      // A missing photograph must not leave a stale band on the wall.
      curFile = null;
      panes[0].style.opacity = '0';
      panes[1].style.opacity = '0';
      note('img', 'warn', 'note.img');
    };
    im.src = url;
    preloaded[file] = true;
  }

  // Everything else, once the page is quiet — a band change should never flash white.
  setTimeout(function () { for (var i = 0; i < BANDS.length; i++) preload(i); }, 4000);

  // ---- fit ---------------------------------------------------------------
  // One pass. Slot width comes from the stage, then the whole board is scaled
  // down if its natural height overflows. Because every dimension in the grid
  // is a multiple of --slot, scaling the slot scales the layout exactly — and
  // every reading is sized in cqi off its own tile, so the type follows.
  var fitting = false;
  function fit() {
    if (fitting || calmed) return;
    fitting = true;
    try {
      var cols = parseInt(getComputedStyle(board).getPropertyValue('--cols'), 10) || 8;
      var availW = stage.clientWidth, availH = stage.clientHeight;
      if (!availW || !availH) return;
      var GAP = 0.155;
      var s = availW / (cols + (cols - 1) * GAP);
      board.style.setProperty('--slot', s.toFixed(3) + 'px');
      var need = board.getBoundingClientRect().height;
      if (need > availH && need > 1) s = s * (availH / need);
      board.style.setProperty('--slot', Math.max(22, s).toFixed(3) + 'px');
    } finally { fitting = false; }
  }
  var fitQueued = false;
  function queueFit() {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(function () { fitQueued = false; fit(); });
  }
  window.addEventListener('resize', queueFit);
  window.addEventListener('orientationchange', queueFit);

  // ---- clock -------------------------------------------------------------
  function tick() {
    var d = new Date();
    $('sb-clock').textContent = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    if (!calmed) paint();          // keeps every "3m ago" honest
  }
  setInterval(tick, 1000);

  /* =======================================================================
     CONNECTION
     ======================================================================= */
  var hostLabel = '—';

  // The status bar holds a short label; the toast and the curtain hold the
  // sentence. Both come from the same table.
  var CONN_KEY = {
    idle:'conn.idle', connecting:'conn.connecting', connected:'conn.connected',
    reconnecting:'conn.retrying', error:'conn.unreachableShort', fatal:'conn.refusedShort'
  };
  var connDetailKey = null;
  function setConn(state, detailKey) {
    connState = state;
    connDetailKey = detailKey || null;
    document.body.setAttribute('data-conn', state);
    paintConn();
  }
  function paintConn() {
    $('sb-conn').textContent = t(connDetailKey || CONN_KEY[connState] || 'conn.idle');
  }

  // Returns a KEY, not a sentence, so the reason survives a language switch.
  // A message that came off the wire is carried through {msg} untouched.
  function describe(err) {
    var code = err && (err.code !== undefined ? err.code : err.reasonCode);
    var map = { 1:'err.proto', 2:'err.clientid', 3:'err.unavailable',
                4:'err.badauth', 5:'err.notauth' };
    if (map[code]) {
      return { key:map[code], vars:null, fatal:code === 2 || code === 4 || code === 5 };
    }
    var msg = String((err && err.message) || err || 'unknown error');
    return { key:'err.raw', vars:{ msg:msg }, fatal:/not authoriz|bad user/i.test(msg) };
  }

  function disconnect() {
    manualStop = true;
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    subs.clear();
  }

  var graceTimer = null;


  /* ===================================================================
     DEMO MODE — opt-in from the address bar, and from nowhere else.

       ?demo=163.3     every board publishes that value
       ?demo=<band>    good | moderate | sensitive | unhealthy | verybad | hazardous
       ?demo=cycle     all six bands in turn, four seconds each (also the empty value)
       ?demo=mixed     the fleet as it usually is: one live, one stale, one dark

     Why this is safe to leave in a file that hangs on a school wall:

       1. It cannot start itself. One switch, in the URL. Nothing is written to
          storage and nothing defaults to it, so a reload without the parameter
          is an ordinary wall display again, byte for byte.
       2. It never opens a socket. connect() refuses outright while DEMO is set,
          and subRaw() returns before it can reach a client — so real air and
          invented air can never appear on one screen.
       3. It cannot be missed or cropped away: two fixed bars, top and bottom, a
          ring around the whole viewport, and "DEMO ·" in the tab title. The bars
          carry the VALUE being simulated, not merely the word DEMO.
       4. It renders through the SHIPPED path. The scene is emitted as discovery
          configs and state payloads — the same abbreviated-key JSON and the same
          UTF-8 bytes a board puts on the wire — and pushed through onDiscovery()
          and onMessage(). There is no second renderer, so the alias expansion,
          the wildcard refusal, the unique_id eviction, the EPA truncate-then-band
          and the availability rules all still run, and the band-reactive backdrop
          is swapped by exactly the code the broker drives.

     An unrecognised value FAILS TOWARD THE DEMO, never toward live air: whoever
     typed ?demo= is shown the mixed fleet with their token echoed back and
     crossed out. Silently handing them today's real reading, under an expectation
     of a simulation, is the more dangerous of the two answers — it is the one
     that can send a child outside during a hazardous episode.
     =================================================================== */

  // Written as escapes, not as a literal: the micro sign and the letter M are one
  // careless transform apart, and µg/m³ read as mg/m³ is a 1000x lie about the air.
  // Spelled this way no editor, pipeline or copy-paste can bend it.
  var DEMO_UNIT = '\u00b5g/m\u00b3';

  // A value from the middle of each band, so a screenshot shows that band's
  // colour and wording rather than an edge case that could belong to either
  // neighbour. `wire` is the English payload a board publishes on
  // air_quality_level — it is data, not display copy, and is never shown as-is.
  var DEMO_BANDS = [
    { key:'good',      max:12.0,     mid:6,   wire:'Good' },
    { key:'moderate',  max:35.4,     mid:24,  wire:'Moderate' },
    { key:'sensitive', max:55.4,     mid:45,  wire:'Unhealthy for Sensitive Groups' },
    { key:'unhealthy', max:150.4,    mid:103, wire:'Unhealthy' },
    { key:'verybad',   max:250.4,    mid:200, wire:'Very Unhealthy' },
    { key:'hazardous', max:Infinity, mid:320, wire:'Hazardous' }
  ];

  var demoBad = '';                  // the token that was not understood, as typed
  var DEMO = readDemo();             // decided ONCE, here, and never re-read
  var demoStep = 0, demoStarted = false, demoDeclared = false;
  var demoValEl = null, demoTopEl = null, demoBotEl = null, demoFootEl = null;
  var demoLast = null;

  function demoBandOf(n) {
    for (var i = 0; i < DEMO_BANDS.length; i++) { if (n <= DEMO_BANDS[i].max) return DEMO_BANDS[i]; }
    return DEMO_BANDS[DEMO_BANDS.length - 1];
  }
  function demoByKey(k) {
    for (var i = 0; i < DEMO_BANDS.length; i++) { if (DEMO_BANDS[i].key === k) return DEMO_BANDS[i]; }
    return null;
  }

  function readDemo() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return null; }
    if (!q.has('demo')) return null;              // the real wall, untouched
    var raw = q.get('demo');
    var s = String(raw == null ? '' : raw).trim().toLowerCase();
    if (s === '' || s === 'cycle') return { mode:'cycle' };
    if (s === 'mixed') return { mode:'mixed' };
    var b = demoByKey(s);
    if (b) return { mode:'value', value:b.mid };
    // Digits only. Number('') is 0 and Number('-') is NaN; letting either through
    // would answer a question nobody asked with a confident green zero.
    if (/^\d+(\.\d+)?$/.test(s)) return { mode:'value', value:Number(s) };
    demoBad = String(raw);
    return { mode:'mixed' };
  }

  // Truncate, never round — the same rule the shipped parser applies to a payload.
  function demoTrunc(n) { return Math.trunc(n * 10) / 10; }

  var demoEnc = (typeof TextEncoder === 'function') ? new TextEncoder() : null;

  // Exactly the bytes a board puts on the wire, into the handler the broker feeds.
  // Encoded rather than handed over as a string so the UTF-8 decode that protects
  // µ is part of what the demo exercises.
  function demoPublish(topic, text) {
    var s = String(text);
    try { onMessage(topic, demoEnc ? demoEnc.encode(s) : s); }
    catch (e) { /* one bad synthetic message must not stop the scene */ }
  }

  // DBK-002 publishes more than PM2.5; the other two send PM2.5 only, which is
  // itself worth demonstrating — a dense layout has to survive both.
  var DEMO_EXTRA = [
    { leaf:'pm1_0',             name:'PM1.0',             cls:'pm1',             unit:DEMO_UNIT },
    { leaf:'pm10',              name:'PM10',              cls:'pm10',            unit:DEMO_UNIT },
    { leaf:'wi-fi_rssi',        name:'WiFi Signal',       cls:'signal_strength', unit:'dBm' },
    { leaf:'uptime',            name:'Uptime',            cls:'duration',        unit:'s' },
    { leaf:'air_quality_level', name:'Air Quality Level', cls:'',                unit:'' }
  ];

  function demoDeclare(id) {
    var slug = id.toLowerCase();
    var list = [{ leaf:'pm2_5', name:'PM2.5', cls:'pm25', unit:DEMO_UNIT }];
    if (id === 'DBK-002') list = list.concat(DEMO_EXTRA);
    list.forEach(function (s) {
      // Abbreviated keys and a '~' base on purpose: alias expansion is part of
      // what a demo has to prove still works, not something to step around.
      var cfg = {
        '~': 'dbk/' + id,
        name: s.name,                 // every board calls its sensor the same thing —
        stat_t: '~/' + s.leaf,        // identity has to come from the board id
        avty_t: '~/status',
        uniq_id: slug + '-' + s.leaf,
        exp_aft: 900,
        dev: { name: 'Kit4Kids ' + id, ids: [slug] }
      };
      if (s.unit) { cfg.unit_of_meas = s.unit; cfg.stat_cla = 'measurement'; }
      if (s.cls) cfg.dev_cla = s.cls;
      demoPublish('homeassistant/sensor/' + slug + '/' + s.leaf + '/config', JSON.stringify(cfg));
    });
  }

  // When a message arrived is the only thing that makes a reading stale, so
  // back-date the very field onMessage() just wrote. No parallel clock and no
  // second state model — the shipped expiry rule still decides.
  function demoAge(id, secondsAgo) {
    if (!secondsAgo) return;
    var t0 = Date.now() - secondsAgo * 1000;
    entities.forEach(function (e) { if (e.board === id && e.at) e.at = t0; });
  }

  function demoScene() {
    if (DEMO.mode === 'mixed') {
      // What the fleet actually looks like most days, and the layout that breaks
      // first: a three-digit reading beside two boards with nothing to say. 163.3
      // is the string that once wrapped between "163." and "3"; it stays here as
      // a regression test.
      return [
        { id:'DBK-001', up:true,  pm:41.8,  age:26 * 60 },   // older than expire_after
        { id:'DBK-002', up:true,  pm:163.3, age:11 },
        { id:'DBK-010', up:false, pm:24.6,  age:4 * 3600 }
      ];
    }
    var v = (DEMO.mode === 'cycle')
      ? DEMO_BANDS[demoStep % DEMO_BANDS.length].mid
      : DEMO.value;
    return [
      { id:'DBK-001', up:true, pm:v, age:9 },
      { id:'DBK-002', up:true, pm:v, age:6 },
      { id:'DBK-010', up:true, pm:v, age:14 }
    ];
  }

  function demoApply() {
    var scene = demoScene();
    if (!demoDeclared) { scene.forEach(function (b) { demoDeclare(b.id); }); demoDeclared = true; }
    scene.forEach(function (b) {
      var pm = demoTrunc(b.pm);
      demoPublish('dbk/' + b.id + '/status', b.up ? 'online' : 'offline');
      demoPublish('dbk/' + b.id + '/pm2_5', pm.toFixed(1));
      if (b.id === 'DBK-002') {
        // Derived from the same reading rather than invented separately: a PM1
        // that contradicts PM2.5 teaches a wrong shape to anyone reading a dense
        // board.
        demoPublish('dbk/DBK-002/pm1_0', demoTrunc(b.pm * 0.62).toFixed(1));
        demoPublish('dbk/DBK-002/pm10',  demoTrunc(b.pm * 1.45).toFixed(1));
        demoPublish('dbk/DBK-002/wi-fi_rssi', '-58');
        demoPublish('dbk/DBK-002/uptime', String(93124 + demoStep * 4));
        demoPublish('dbk/DBK-002/air_quality_level', demoBandOf(pm).wire);
      }
      demoAge(b.id, b.age);
    });
    demoLast = scene;
    demoMark(scene);
    paint();
  }

  /* -------------------------------------------------- the non-negotiable bit --
     Two fixed bars and a ring. They do not fade, they do not scroll away, they
     cannot be dismissed, and they carry the word DEMO, the Thai ตัวอย่าง, and the
     VALUE being simulated — "DEMO" alone leaves a reader wondering which part of
     the screen is pretending. */
  function demoMark(scene) {
    if (!demoValEl) return;
    var parts = [];
    if (DEMO.mode === 'mixed') {
      scene.forEach(function (b) {
        parts.push(b.id + ' ' + (!b.up ? 'offline'
          : b.age > 900 ? 'stale'
          : demoTrunc(b.pm).toFixed(1) + ' ' + DEMO_UNIT));
      });
    } else {
      var v = demoTrunc(scene[0].pm);
      parts.push('every board at ' + v.toFixed(1) + ' ' + DEMO_UNIT +
                 ' · ' + demoBandOf(v).wire);
      // A glyph and a duration rather than a clause: this fragment has no
      // reviewed Thai and needs none, because it is not words.
      if (DEMO.mode === 'cycle') parts.push('↻ 4s');
    }
    // Echoed back exactly as typed, with a cross. Whoever put a bad token in the
    // address bar reads their own token, in whatever language they typed it.
    if (demoBad) parts.push('?demo=' + demoBad + ' ✗');

    demoValEl.textContent = '';
    parts.forEach(function (p, i) {
      if (i) demoValEl.appendChild(document.createTextNode(' · '));
      var s = document.createElement('span');
      s.className = 'nb';
      s.textContent = p;
      demoValEl.appendChild(s);
    });
  }

  function demoBar(cls) {
    var el = document.createElement('div');
    el.className = 'wdemo ' + cls;
    var w = document.createElement('b');
    w.textContent = 'DEMO';
    var th = document.createElement('span');
    th.className = 'wd-th';
    th.textContent = 'ตัวอย่าง';   // ตัวอย่าง
    el.appendChild(w);
    el.appendChild(th);
    return el;
  }

  // The warning is printed in BOTH languages, always, whatever the wall is set
  // to. It is a safety marker, not copy: a Thai-speaking child and an
  // English-reading visitor must both be told these numbers are invented, and
  // neither of them pressed the language button.
  function demoBuild() {
    document.documentElement.setAttribute('data-demo', DEMO.mode);

    var top = demoBar('wdemo-top');
    top.setAttribute('role', 'status');
    var en = document.createElement('span');
    en.textContent = 'SIMULATED DATA, NOT A REAL READING';
    var th = document.createElement('span');
    th.className = 'wd-th';
    th.textContent = 'ข้อมูลตัวอย่าง ' +
                     'ไม่ใช่ค่าจริง';
    demoValEl = document.createElement('span');
    demoValEl.className = 'wd-val';
    top.appendChild(en);
    top.appendChild(th);
    top.appendChild(demoValEl);

    var bot = demoBar('wdemo-bot');
    demoFootEl = document.createElement('span');
    demoFootEl.textContent = 'every number on this screen is invented for design testing · ' +
      'no broker is connected · remove ?demo= from the address for the real wall';
    var botTh = document.createElement('span');
    botTh.className = 'wd-th';
    botTh.textContent = 'ทุกตัวเลขสร้าง' +
      'ขึ้นมาเพื่อทดสอบหน้าจอ';
    bot.appendChild(demoFootEl);
    bot.appendChild(botTh);

    var ring = document.createElement('div');
    ring.className = 'wdemo-ring';
    ring.setAttribute('aria-hidden', 'true');

    document.body.appendChild(top);
    document.body.appendChild(bot);
    document.body.appendChild(ring);
    demoTopEl = top; demoBotEl = bot;
  }

  function demoStart() {
    if (demoStarted) return;             // connect() can be called again from the
    demoStarted = true;                  // settings sheet; the demo starts once
    document.title = 'DEMO · ' + document.title;
    // The pill must not go on saying "connecting…" while nothing is connecting.
    // The words go into the language tables rather than straight into the DOM, so
    // a language switch relabels them like any other word on the wall.
    try {
      STR.en['conn.demo'] = 'demo · no broker';
      STR.th['conn.demo'] = 'ตัวอย่าง · ' +
                            'ไม่ได้ต่อ broker';
      setConn('idle','conn.demo');
    } catch (e) {}
    demoBuild();
    demoApply();
    // Re-assert the scene. Without this a static demo drifts past expire_after and
    // starts describing itself as stale; re-applying is idempotent, including the
    // back-dating that keeps the deliberately stale board stale.
    setInterval(function () {
      if (DEMO.mode === 'cycle') demoStep++;
      demoApply();
    }, DEMO.mode === 'cycle' ? 4000 : 15000);
  }

  function connect(cfg) {
    // The one gate that makes demo mode safe on a health display: while ?demo= is
    // set no socket is opened, from here or from the settings sheet, so real air
    // and invented air can never be on one screen.
    if (DEMO) { demoStart(); return; }

    if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
      setConn('fatal', 'conn.libmissing');
      calm('calm.lib');
      return;
    }

    disconnect();
    manualStop = false;
    everConnected = false;
    activeFilter = typeof cfg.filter === 'string' ? cfg.filter.trim() : '';
    filteredOut.clear();
    ['conn', 'auth', 'mixed', 'nodisc', 'suberr', 'parse', 'wildcard', 'subcap', 'filter', 'img']
      .forEach(unnote);

    var url = (cfg.tls ? 'wss' : 'ws') + '://' + cfg.host + ':' + cfg.port;
    hostLabel = cfg.host + ':' + cfg.port;
    attachedAt = Date.now();
    setConn('connecting');

    if (!cfg.tls && location.protocol === 'https:') {
      note('mixed', 'warn', 'note.mixed');
    }

    try {
      client = mqtt.connect(url, {
        username: cfg.user || undefined,
        password: cfg.pass || undefined,
        clientId: 'air-widgets-' + Math.random().toString(16).slice(2, 10),
        clean: true, reconnectPeriod: 4000, connectTimeout: 8000,
        keepalive: 45, resubscribe: true
      });
    } catch (e) {
      setConn('fatal');
      calm('calm.start');
      return;
    }

    if (graceTimer) clearTimeout(graceTimer);
    graceTimer = setTimeout(function () {
      // Twenty seconds with no handshake at all is not a blip. Say one calm thing.
      if (!everConnected && !manualStop) {
        calm('calm.unreachable');
      }
    }, 20000);

    client.on('connect', function () {
      everConnected = true;
      connectedAt = Date.now();
      uncalm();
      setConn('connected');
      unnote('conn');
      // Bounded wildcards, all four authored HERE. sub() refuses every wildcard
      // that arrives over the wire; none of these contains '#'.
      subRaw('homeassistant/+/+/config');
      subRaw('homeassistant/+/+/+/config');
      subRaw('dbk/+/status');
      subRaw('dbk/+/sensor/+/state');
      setTimeout(function () {
        if (entities.size === 0 && filteredOut.size === 0 && connState === 'connected') {
          note('nodisc', 'info', 'note.nodisc');
        }
      }, 4000);
      refresh();
    });

    client.on('message', function (topic, payload) {
      try { onMessage(topic, payload); } catch (e) { /* one bad message never stops the stream */ }
    });

    client.on('reconnect', function () { if (!manualStop && connState !== 'fatal') setConn('reconnecting'); });
    client.on('offline', function () { if (!manualStop && connState !== 'fatal') setConn('reconnecting'); });

    client.on('close', function () {
      if (manualStop || connState === 'fatal') return;
      if (!everConnected) setConn('error');
      else {
        setConn('reconnecting');
        note('conn', 'warn', 'note.conn');
      }
    });

    client.on('error', function (err) {
      var d = describe(err);
      if (d.fatal) {
        setConn('fatal');
        manualStop = true;
        try { client.end(true); } catch (e) {}
        client = null;
        // One vetted sentence for the wall; the technical reason stays underneath
        // it, small and dim, for whoever set the broker up.
        calm('conn.refused', null, { key:d.key, vars:d.vars });
      } else {
        setConn('error');
        note('conn', 'bad', 'note.connbad', { url:url, msg:{ key:d.key, vars:d.vars } });
      }
    });
  }

  /* =======================================================================
     SETTINGS — behind "s", never on load
     ======================================================================= */
  var sheet = $('sheet');
  function readForm() {
    return {
      host: $('f-host').value.trim(), port: $('f-port').value.trim(),
      user: $('f-user').value, pass: $('f-pass').value,
      tls: $('f-tls').checked, filter: $('f-filter').value.trim(),
      remember: $('f-remember').checked
    };
  }
  function fillForm(v) {
    $('f-host').value = (v && v.host) || DEFAULT_HOST;
    $('f-port').value = (v && v.port) || DEFAULT_PORT;
    $('f-user').value = (v && v.user) || '';
    $('f-pass').value = (v && v.pass) || '';
    $('f-tls').checked = !!(v && v.tls);
    $('f-filter').value = v && typeof v.filter === 'string' ? v.filter : DEFAULT_FILTER;
    $('f-remember').checked = !!(v && (v.remember || v.pass));
  }
  function storable(cfg) {
    var out = { host:cfg.host, port:cfg.port, user:cfg.user, tls:cfg.tls,
                filter:cfg.filter, remember:!!cfg.remember };
    if (cfg.remember) out.pass = cfg.pass;      // the passphrase is opt-in, always
    return out;
  }
  function openSheet() { sheet.hidden = false; $('f-host').focus(); }
  function closeSheet() { sheet.hidden = true; }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var cfg = readForm();
    if (!cfg.host || !cfg.port) return;
    entities.clear(); byState.clear(); byAvail.clear(); byUid.clear();
    boardStatus.clear(); aux.clear(); filteredOut.clear();
    parseErrors = 0; lastCount = -1;
    var ok = saveStore(storable(cfg));
    setStoreHint(!ok ? 'store.failed' : cfg.remember ? 'store.savedPass' : 'store.saved');
    closeSheet();
    connect(cfg);
    refresh();
  });

  $('btn-forget').addEventListener('click', function () {
    clearStore();
    fillForm(null);
    $('f-pass').value = '';
    setStoreHint('store.cleared');
  });
  $('btn-close').addEventListener('click', closeSheet);

  document.addEventListener('keydown', function (ev) {
    var target = ev.target;          // not `t` — that is the translator
    var typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' ||
                            target.isContentEditable);
    if (ev.key === 'Escape' && !sheet.hidden) { closeSheet(); return; }
    if (typing) return;
    if (ev.key === 's' || ev.key === 'S') {
      ev.preventDefault();
      sheet.hidden ? openSheet() : closeSheet();
      return;
    }
    // "l" for language. "s" already owns settings; these are the only two keys.
    if (ev.key === 'l' || ev.key === 'L') {
      ev.preventDefault();
      setLang(LANG === 'th' ? 'en' : 'th');
    }
  });

  /* =======================================================================
     LANGUAGE — the switch, and everything that is written once

     paint() already rebuilds every reading from the model on each frame, so the
     tiles need nothing special. What needs saying is the furniture: the status
     bar, the dock, the curtain, the sheet. paintStatic() owns those, and
     setLang() is paintStatic + paint — no reload, so the MQTT connection, the
     retained discovery already received and the wallpaper all survive a switch.
     ======================================================================= */
  var storeHintKey = 'store.empty';
  function setStoreHint(key) { storeHintKey = key; $('store-hint').textContent = t(key); }

  // "Press s to enter the details." keeps its key cap without the string being
  // cut up: the standalone "s" is wrapped in place, so the sentence reaches the
  // screen character for character in either language.
  function kbdHint(node, text, tag) {
    node.textContent = '';
    var m = /(^|\s)s(\s|$)/.exec(text);
    if (!m) { node.textContent = text; return; }
    var i = m.index + m[1].length;
    node.appendChild(document.createTextNode(text.slice(0, i)));
    node.appendChild(el(tag, null, 's'));
    node.appendChild(document.createTextNode(text.slice(i + 1)));
  }

  var langButtons = Array.prototype.slice.call($('langsw').querySelectorAll('button'));

  function paintStatic() {
    var root = document.documentElement;
    root.setAttribute('lang', LANG);          // line breaking and font selection
    document.title = t('page.title');

    $('sb-site').textContent = t('site.name');
    paintConn();
    paintSky();

    kbdHint($('dock-hint'), t('conn.hint'), 'kbd');
    kbdHint($('calm-hint'), t('conn.hint'), 'b');

    $('sh-title').textContent   = t('sheet.title');
    $('sh-sub').textContent     = t('sheet.sub');
    $('lb-host').textContent    = t('sheet.host');
    $('lb-port').textContent    = t('sheet.port');
    $('lb-user').textContent    = t('sheet.user');
    $('lb-pass').textContent    = t('sheet.pass');
    $('lb-filter').textContent  = t('sheet.filter');
    $('lb-tls').textContent     = t('sheet.tls');
    $('lb-remember').textContent = t('sheet.remember');
    $('btn-connect').textContent = t('sheet.connect');
    $('btn-forget').textContent = t('sheet.forget');
    $('btn-close').textContent  = t('sheet.close');
    $('store-hint').textContent = t(storeHintKey);

    $('langsw').setAttribute('aria-label', t('lang.switch'));
    langButtons.forEach(function (b) {
      var code = b.getAttribute('data-lang');
      b.textContent = t('lang.' + code);
      b.setAttribute('aria-pressed', code === LANG ? 'true' : 'false');
    });

    paintNotes();
    paintCalm();
  }

  function setLang(next) {
    if (next !== 'th' && next !== 'en') return;
    if (next === LANG) return;
    LANG = next;
    try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
    paintStatic();
    // Paint the tiles even while the curtain covers them. They are what the
    // screen returns to, and a board that reconnects should not flash the old
    // language for the second it takes the clock to come round again.
    paint();
    fit();                          // no-ops on its own while calmed
  }

  langButtons.forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
  });

  /* =======================================================================
     BOOT — no configuration screen, ever, on load
     ======================================================================= */
  var saved = loadStore();
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  var qu = q ? q.get('u') : null, qp = q ? q.get('p') : null;
  var qh = q ? q.get('h') : null, qport = q ? q.get('port') : null;

  var boot;
  if (saved && saved.host && saved.port) {
    boot = {
      host: saved.host, port: saved.port,
      user: saved.user || qu || '',
      pass: saved.pass || qp || '',
      tls: !!saved.tls,
      filter: typeof saved.filter === 'string' ? saved.filter : DEFAULT_FILTER,
      remember: !!saved.remember
    };
  } else if (qu !== null || qp !== null) {
    boot = { host: qh || DEFAULT_HOST, port: qport || DEFAULT_PORT,
             user: qu || '', pass: qp || '', tls:false, filter:DEFAULT_FILTER, remember:false };
  } else {
    // Anonymous. No credential is written in this file; there is nothing here to leak.
    boot = { host: qh || DEFAULT_HOST, port: qport || DEFAULT_PORT,
             user:'', pass:'', tls:false, filter:DEFAULT_FILTER, remember:false };
  }

  fillForm(saved || boot);
  setStoreHint(!storeWorks ? 'store.nostore' : saved ? 'store.loaded' : 'store.empty');

  hostLabel = boot.host + ':' + boot.port;
  paintStatic();
  paint();
  fit();
  tick();
  connect(boot);
  setTimeout(fit, 300);
  window.addEventListener('load', queueFit);
})();
</script>
</body>
</html>
