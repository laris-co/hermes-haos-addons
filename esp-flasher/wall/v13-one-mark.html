  // The EPA scale starts at 0. Without a lower bound a faulty sensor reporting
  // -999 fell into the first band and rendered as a reassuring green "Good".
  function bandFor(n) {
    if (!Number.isFinite(n) || n < 0) return null;
    for (var i = 0; i < BANDS.length; i++) if (n <= BANDS[i].max) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  // Where the arc stops. Each band owns one sixth of the circle, so the mark
  // reads as a position on the EPA scale rather than as a linear concentration —
  // which is the only thing worth reading at a glance from across a room.
  function fractionFor(n) {
    if (!Number.isFinite(n) || n < 0) return 0;
    for (var i = 0; i < BANDS.length; i++) {
      var b = BANDS[i];
      var hi = b.max === Infinity ? HAZ_CAP : b.max;
      if (n <= hi || i === BANDS.length - 1) {
        var t = hi > b.lo ? (n - b.lo) / (hi - b.lo) : 1;
        if (t < 0) t = 0;
        if (t > 1) t = 1;
        return (i + t) / BANDS.length;
      }
    }
    return 1;
  }

  function isPm(ent) {
    return ent.deviceClass === 'pm25' || /pm ?2\.?5/i.test(ent.measure || ent.title || '');
  }

  // Relative time is prose, so it comes out of the table like every other
  // sentence. The digits stay Arabic in both languages: the readings on this
  // wall are numbers, and Thai readers read them as numbers.
  function ago(ts) {
    if (!ts) return t('time.never');
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 2) return t('time.justnow');
    if (s < 60) return t('time.secondsAgo', { n: s });
    var m = Math.floor(s / 60);
    if (m < 60) return t('time.minutesAgo', { n: m });
    var h = Math.floor(m / 60);
    if (h < 24) return t('time.hoursAgo', { n: h });
    return t('time.daysAgo', { n: Math.floor(h / 24) });
  }

  // A payload may be "0", "0.0", "unknown", "unavailable" or empty. Never NaN.
  function parseValue(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (s === '') return { kind: 'empty', text: 'no value' };
    if (/^(unknown|unavailable|none|null|nan|n\/a)$/i.test(s)) {
      return { kind: 'unknown', text: s.toLowerCase() };
    }
    var n = Number(s);
    if (!Number.isFinite(n)) return { kind: 'text', text: s };
    // The EPA method truncates the concentration to one decimal BEFORE applying
    // the breakpoints. Truncate ONCE, here, and use that one value for both the
    // printed number and the band. Truncate, never round: rounding 35.44 up to
    // 35.5 would invent a severity the sensor did not report.
    var n1 = Math.trunc(n * 10) / 10;
    var text;
    if (/^[+-]?\d+(\.\d)?$/.test(s)) text = s.replace(/^\+/, '');  // keep the device's precision
    else text = n1.toFixed(1);
    return { kind: 'number', n: n, n1: n1, text: text };
  }

  // Identity comes from the board id in the STATE TOPIC. The discovery "name" is
  // "PM2.5" for every board on this fleet; titling anything from it makes three
  // different boards indistinguishable.
  function boardFromTopic(topic) {
    var m = /^dbk\/([^/]+)\//i.exec(topic || '');
    return m ? m[1] : null;
  }

  var storeWorks = true;
  function loadStore() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); }
    catch (e) { storeWorks = false; return null; }      // private mode throws on access
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (e) {
      try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
      return null;
    }
  }
  function saveStore(v) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; }
    catch (e) { storeWorks = false; return false; }
  }
  function clearStore() {
    try { localStorage.removeItem(STORE_KEY); return true; } catch (e) { return false; }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------------------------------------------------------------- notices --
     The dashboard this is built on had an alert stack. A poster has no room for
     one, but the page must still be able to say a subscription was refused. The
     engine's setAlert/clearAlert contract is kept; the highest-priority message
     is rendered as one quiet line of plain text. */
  var noticeMap = new Map();
  var PRIO = { bad: 3, warn: 2, info: 1 };
  // A notice stores a KEY and its values, never a rendered sentence — otherwise
  // a notice raised in English would still be sitting there in English after
  // someone pressed l. It is rendered at paint time, in the language of the
  // moment. Nothing here goes through innerHTML any more, so wire data (a topic,
  // an error message) needs no escaping on this path.
  function paintNotice() {
    var best = null;
    noticeMap.forEach(function (v) {
      if (!best || (PRIO[v.level] || 0) > (PRIO[best.level] || 0)) best = v;
    });
    $('notice').textContent = best ? t(best.key, best.vars) : '';
  }
  function setAlert(id, level, key, vars) {
    noticeMap.set(id, { level: level, key: key, vars: vars || null });
    paintNotice();
  }
  function clearAlert(id) { if (noticeMap.delete(id)) paintNotice(); }

  /* -------------------------------------------------------------- subscribe --
     subRaw is the ONLY place that talks to the broker and is private to this
     file's own authored topics. Everything that came off the wire goes through
     sub(), which refuses wildcards. Never '#': on this fleet broker that is
     roughly 109 GB a day. */
  function subRaw(topic) {
    if (!topic || typeof topic !== 'string') return false;
    // In demo mode there is no broker to subscribe to, and a synthesised sensor
    // must still be allowed onto the wall — otherwise the very rule below ("a
    // sensor this page cannot listen to must never take a place") would delete
    // every demo entity the moment discovery created it. Nothing is sent.
    if (DEMO) { subs.add(topic); return true; }
    if (!client) return false;
    if (subs.has(topic)) return true;
    if (subs.size >= MAX_SUBS) {
      setAlert('subcap', 'warn', 'notice.subcap', { n: MAX_SUBS });
      return false;
    }
    subs.add(topic);
    client.subscribe(topic, { qos: 0 }, function (err) {
      if (err) {
        subs.delete(topic);
        setAlert('suberr', 'bad', 'notice.suberr',
          { topic: topic, why: err.message || String(err) });
      }
    });
    return true;
  }

  function sub(topic) {
    if (!topic || typeof topic !== 'string') return false;
    // Absolute guard. '+' is every bit as dangerous as '#' — a retained config
    // declaring state_topic "+/+/+" delivered ten out of ten unrelated fleet
    // topics in testing. A topic that came off the wire must name one exact topic.
    // This runs FIRST and applies in demo mode too: a synthesised config gets no
    // more trust than a real one.
    if (/[#+]/.test(topic)) {
      setAlert('wildcard', 'warn', 'notice.wildcard', { topic: topic });
      return false;
    }
    // The "is there anywhere to subscribe" decision belongs to subRaw alone —
    // duplicating the !client test here silently deleted every demo entity.
    return subRaw(topic);
  }

  function unsub(topic) {
    if (!topic || !subs.has(topic)) return;
    if (byState.has(topic) || byAvail.has(topic)) return;
    subs.delete(topic);
    if (client) { try { client.unsubscribe(topic); } catch (e) {} }
  }

  /* -------------------------------------------------------------- discovery -- */
  function expand(cfg) {
    var out = {};
    Object.keys(cfg).forEach(function (k) { out[ALIASES[k] || k] = cfg[k]; });
    var base = out['~'];
    if (typeof base === 'string' && base) {
      ['state_topic', 'availability_topic'].forEach(function (k) {
        var v = out[k];
        if (typeof v !== 'string') return;
        if (v.charAt(0) === '~') out[k] = base + v.slice(1);
        else if (v.charAt(v.length - 1) === '~') out[k] = v.slice(0, -1) + base;
      });
    }
    if (!out.availability_topic && Array.isArray(out.availability) && out.availability.length) {
      var a = out.availability[0];
      if (a && typeof a.topic === 'string') {
        out.availability_topic = a.topic;
        if (a.payload_available) out.payload_available = a.payload_available;
        if (a.payload_not_available) out.payload_not_available = a.payload_not_available;
      }
    }
    return out;
  }

  function index(map, key, dtopic) {
    if (!key) return;
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(dtopic);
  }
  // Without unindex a re-published config left the entity reachable from its OLD
  // state topic — one board's number under another board's name.
  function unindex(map, key, dtopic) {
    if (!key || !map.has(key)) return;
    var set = map.get(key);
    set.delete(dtopic);
    if (set.size === 0) { map.delete(key); unsub(key); }
  }

  function removeEntity(dtopic) {
    var gone = entities.get(dtopic);
    if (!gone) return false;
    entities.delete(dtopic);
    if (gone.uid && byUid.get(gone.uid) === dtopic) byUid.delete(gone.uid);
    unindex(byState, gone.stateTopic, dtopic);
    unindex(byAvail, gone.availTopic, dtopic);
    return true;
  }

  function matchesFilter(topic) {
    return !activeFilter || String(topic).indexOf(activeFilter) === 0;
  }

  function noteFilter() {
    if (!activeFilter || filteredOut.size === 0) { clearAlert('filter'); return; }
    setAlert('filter', 'info',
      filteredOut.size === 1 ? 'notice.filter.one' : 'notice.filter.many',
      { n: filteredOut.size, f: activeFilter });
  }

  function onDiscovery(dtopic, text) {
    if (text.trim() === '') {                 // empty retained payload = delete
      filteredOut.delete(dtopic);
      if (removeEntity(dtopic)) schedule();
      noteFilter();
      return;
    }

    var cfg;
    try { cfg = JSON.parse(text); }
    catch (e) {
      parseErrors++;
      setAlert('parse', 'warn',
        parseErrors === 1 ? 'notice.parse.one' : 'notice.parse.many',
        { n: parseErrors, topic: dtopic });
      return;
    }
    if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) { parseErrors++; return; }

    cfg = expand(cfg);
    if (typeof cfg.state_topic !== 'string' || !cfg.state_topic) return;

    if (!matchesFilter(cfg.state_topic)) {
      filteredOut.add(dtopic);
      if (removeEntity(dtopic)) schedule();
      noteFilter();
      return;
    }
    filteredOut.delete(dtopic);
    noteFilter();

    var parts = dtopic.split('/');
    var dev = cfg.device && typeof cfg.device === 'object' ? cfg.device : null;
    var devName = dev && typeof dev.name === 'string' ? dev.name : '';
    var measure = typeof cfg.name === 'string' && cfg.name ? cfg.name : (parts[2] || 'sensor');
    var expire = Number(cfg.expire_after);
    var uid = typeof cfg.unique_id === 'string' && cfg.unique_id ? cfg.unique_id : '';
    var board = boardFromTopic(cfg.state_topic);
    var newAvail = typeof cfg.availability_topic === 'string' ? cfg.availability_topic : '';

    if (uid && byUid.has(uid) && byUid.get(uid) !== dtopic) removeEntity(byUid.get(uid));

    var ent = entities.get(dtopic) || { key: dtopic, value: null, at: 0, availRaw: null, availAt: 0 };

    // Drop the OLD index entries before writing the new ones, and drop what was
    // measured there with them.
    if (ent.stateTopic && ent.stateTopic !== cfg.state_topic) {
      unindex(byState, ent.stateTopic, dtopic);
      ent.value = null; ent.at = 0; ent.raw = undefined;
    }
    if (ent.availTopic && ent.availTopic !== newAvail) {
      unindex(byAvail, ent.availTopic, dtopic);
      ent.availRaw = null; ent.availAt = 0;
    }
    if (ent.uid && ent.uid !== uid && byUid.get(ent.uid) === dtopic) byUid.delete(ent.uid);

    // Board id first, always. `measure` is only ever used to recognise a PM2.5
    // sensor — it is never the identity of anything on screen.
    ent.title = board || devName || uid || measure;
    ent.measure = measure;
    ent.uid = uid;
    ent.stateTopic = cfg.state_topic;
    ent.availTopic = newAvail;
    ent.unit = typeof cfg.unit_of_measurement === 'string' ? cfg.unit_of_measurement : '';
    ent.deviceClass = typeof cfg.device_class === 'string' ? cfg.device_class : '';
    ent.expire = Number.isFinite(expire) && expire > 0 ? expire : DEFAULT_EXPIRE;
    ent.pAvail = typeof cfg.payload_available === 'string' ? cfg.payload_available : 'online';
    ent.pNot = typeof cfg.payload_not_available === 'string' ? cfg.payload_not_available : 'offline';
    ent.templated = !!cfg.value_template;
    ent.board = board;

    // A sensor this page cannot listen to must never take a place on the wall.
    if (!sub(ent.stateTopic)) {
      if (removeEntity(dtopic)) schedule();
      return;
    }

    entities.set(dtopic, ent);
    if (uid) byUid.set(uid, dtopic);
    index(byState, ent.stateTopic, dtopic);
    if (ent.availTopic) { index(byAvail, ent.availTopic, dtopic); sub(ent.availTopic); }

    clearAlert('nodisc');
    schedule();
  }

  /* ---------------------------------------------------------------- messages */
  function onMessage(topic, payload) {
    var text;
    try { text = new TextDecoder('utf-8').decode(payload); }
    catch (e) { text = String(payload); }

    if (/^homeassistant\/.+\/config$/.test(topic)) {
      try { onDiscovery(topic, text); }
      catch (e) {
        parseErrors++;
        setAlert('parse', 'warn', 'notice.parseapply', { why: e.message || '' });
      }
      return;
    }

    var now = Date.now();

    // Board availability, even where discovery declared no availability_topic.
    var b = /^dbk\/([^/]+)\/status$/i.exec(topic);
    if (b) boardStatus.set(b[1], { raw: text.trim(), at: now });

    if (byState.has(topic)) {
      byState.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.raw = text; e.value = parseValue(text); e.at = now;
      });
    }
    if (byAvail.has(topic)) {
      byAvail.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.availRaw = text.trim(); e.availAt = now;
      });
    }
    schedule();
  }

  /* -------------------------------------------------------------- entity state */
  function availabilityOf(ent) {
    if (ent.availTopic && ent.availRaw !== null) {
      if (ent.availRaw === ent.pNot) return 'offline';
      if (ent.availRaw === ent.pAvail) return 'online';
      return 'unknown';
    }
    if (ent.board && boardStatus.has(ent.board)) {
      var raw = boardStatus.get(ent.board).raw;
      if (raw === ent.pNot || raw === 'offline') return 'offline';
      if (raw === ent.pAvail || raw === 'online') return 'online';
    }
    return 'unknown';
  }

  function stateOf(ent) {
    if (availabilityOf(ent) === 'offline') return 'offline';
    if (!ent.at || !ent.value) return 'waiting';
    if (ent.value.kind === 'unknown' || ent.value.kind === 'empty') return 'unknown';
    // A concentration cannot be negative. Checked BEFORE stale and before live so
    // a broken sensor is never dressed up as a reading — least of all a green one.
    if (ent.value.kind === 'number' && ent.value.n1 < 0 && isPm(ent)) return 'fault';
    if ((Date.now() - ent.at) / 1000 > ent.expire) return 'stale';
    return 'live';
  }

  /* ==========================================================================
     PRESENTATION — one mark.
     ======================================================================= */

  // Boards, not sensors. One row of truth per physical board, keyed on the id
  // parsed out of the state topic; a board that only ever published a status
  // message still appears, so a wall of three boards never silently becomes two.
  function boardList() {
    var m = new Map();
    entities.forEach(function (e) {
      if (!isPm(e)) return;
      var id = e.board || e.title || e.stateTopic;
      var prev = m.get(id);
      if (!prev || (e.at || 0) > (prev.at || 0)) m.set(id, e);
    });
    boardStatus.forEach(function (v, id) { if (!m.has(id)) m.set(id, null); });

    var out = [];
    m.forEach(function (ent, id) {
      var st = ent ? stateOf(ent) : 'nosensor';
      var band = null, n1 = null;
      if (st === 'live' && ent.value && ent.value.kind === 'number') {
        n1 = ent.value.n1;
        band = bandFor(n1);
      }
      // A "live" PM sensor whose payload is not a number is not a reading.
      if (st === 'live' && !band) st = 'unknown';
      out.push({ id: id, ent: ent, st: st, band: band, n1: n1 });
    });
    out.sort(function (a, b) { return String(a.id).localeCompare(String(b.id)); });
    return out;
  }

  // The mark shows the WORST live board. On a smoke-season wall the safe answer
  // is the one that governs whether anyone goes outside.
  function pickPrimary(list) {
    var live = list.filter(function (b) { return b.st === 'live'; });
    if (live.length) {
      live.sort(function (a, b) { return b.n1 - a.n1 || String(a.id).localeCompare(String(b.id)); });
      return live[0];
    }
    var rank = { waiting: 3, stale: 2, unknown: 1, fault: 1 };
    var rest = list.filter(function (b) { return rank[b.st]; });
    if (!rest.length) return null;
    rest.sort(function (a, b) {
      return (rank[b.st] - rank[a.st]) || ((b.ent && b.ent.at) || 0) - ((a.ent && a.ent.at) || 0);
    });
    return rest[0];
  }

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var R = 38;
  var CIRC = 2 * Math.PI * R;
  var MIN_SWEEP = 0.007;   // a rendering floor so a real reading of 0 is still a mark

  (function buildTicks() {
    var g = $('ticks'), n = BANDS.length;
    for (var i = 1; i < n; i++) {
      var a = (i / n) * Math.PI * 2 - Math.PI / 2;
      var l = document.createElementNS(SVG_NS, 'line');
      l.setAttribute('x1', (50 + Math.cos(a) * 45).toFixed(2));
      l.setAttribute('y1', (50 + Math.sin(a) * 45).toFixed(2));
      l.setAttribute('x2', (50 + Math.cos(a) * 49).toFixed(2));
      l.setAttribute('y2', (50 + Math.sin(a) * 49).toFixed(2));
      g.appendChild(l);
    }
  })();

  // Satellite marks are monochrome by rule: colour on this page means the one
  // band the wall is currently reporting, so a satellite is never coloured and
  // can never imply a band it is not in. Shape and word carry its state.
  function satMark(mode, f) {
    var r = 34, c = 2 * Math.PI * r;
    var head = '<svg viewBox="0 0 100 100" aria-hidden="true">';
    var track = '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="currentColor" ' +
                'stroke-width="13" opacity="' + (mode === 'wait' ? '.5' : '.2') + '"' +
                (mode === 'wait' ? ' stroke-dasharray="3 9"' : '') + '></circle>';
    var body = '';
    if (mode === 'live') {
      var len = Math.max(f, MIN_SWEEP) * c;
      body = '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="currentColor" ' +
             'stroke-width="13" transform="rotate(-90 50 50)" stroke-dasharray="' +
             len.toFixed(2) + ' ' + (c + 1).toFixed(2) + '"></circle>';
    } else if (mode === 'none') {
      body = '<line x1="25.96" y1="74.04" x2="74.04" y2="25.96" stroke="currentColor" stroke-width="13"></line>';
    }
    return head + track + body + '</svg>';
  }

  // Fitted, not guessed. The word is measured against the box it actually sits
  // in and shrunk until it fits — the same discipline that keeps a reading from
  // being sized against a viewport it does not own.
  function fitWord() {
    var box = $('word-box'), el = $('word');
    var avail = box.clientWidth;
    if (!avail) return;
    var vh = window.innerHeight || 800;
    var max = Math.min(avail * 0.28, vh * 0.145);
    el.style.fontSize = max.toFixed(2) + 'px';
    var w = el.getBoundingClientRect().width;
    if (w > 0 && w > avail * 0.98) {
      el.style.fontSize = Math.max(11, max * (avail * 0.98) / w).toFixed(2) + 'px';
    }
  }

  var satSig = '';

  function paint() {
    if (calmActive) return;

    var list = boardList();
    var primary = pickPrimary(list);
    var accent = NEUTRAL, word, say, mode = 'none', frac = 0, invert = false;
    var capParts = [];

    if (primary && primary.st === 'live') {
      accent = primary.band.v;
      word = t('word.' + primary.band.k);
      say = t('verdict.' + primary.band.k);
      mode = 'live';
      frac = fractionFor(primary.n1);
      invert = primary.band.max === Infinity;
      // The number and its unit, exactly as published. Never uppercased,
      // never split, never translated: one nowrap object.
      capParts.push('<span class="nb">' + esc(primary.ent.value.text) +
        (primary.ent.unit ? ' ' + esc(primary.ent.unit) : '') + '</span>');
      capParts.push(esc(t('scale.epa')));
      capParts.push(esc(ago(primary.ent.at)));
    } else if (primary && primary.st === 'waiting') {
      word = t('word.waiting');
      mode = 'wait';
      say = t('say.waiting');
      capParts.push(esc(t('cap.waiting')));
    } else if (primary && primary.st === 'stale') {
      word = t('word.stale');
      say = t('say.stale');
      capParts.push(esc(t('cap.stale', { n: primary.ent.expire })));
    } else if (primary && primary.st === 'fault') {
      word = t('word.fault');
      say = t('say.fault');
      capParts.push(esc(t('cap.fault')));
    } else if (primary && primary.st === 'unknown') {
      word = t('word.noreading');
      say = t('verdict.unknown');
      capParts.push(esc(t('cap.payload',
        { v: primary.ent.value ? primary.ent.value.text : t('cap.unreadable') })));
    } else if (list.length) {
      // Every known board is offline or has no sensor configured. Say so — do
      // not fall back to a zero, a last-known number, or an empty mark.
      var allOff = list.every(function (b) { return b.st === 'offline'; });
      word = allOff ? t('word.alloffline') : t('word.noreading');
      say = t('verdict.unknown');
      capParts.push(esc(t(list.length === 1 ? 'cap.none.one' : 'cap.none.many',
        { n: list.length })));
    } else {
      word = t('word.nosensor');
      say = connState === 'connected' ? t('say.connected') : t('say.looking');
      capParts.push(esc(t('scale.epa')));
    }

    // --- the mark -----------------------------------------------------------
    var root = document.documentElement;
    root.style.setProperty('--accent', accent);
    root.setAttribute('data-invert', invert ? '1' : '0');

    var svg = $('mark');
    svg.setAttribute('data-mark', mode);
    var len = mode === 'live' ? Math.max(frac, MIN_SWEEP) * CIRC : 0;
    $('arc').setAttribute('stroke-dasharray', len.toFixed(2) + ' ' + (CIRC + 1).toFixed(2));
    // The spoken version names the band rather than shouting the poster's word:
    // "Unhealthy for sensitive groups, 41% along…" / "เริ่มมีผลกับคนแพ้ง่าย อยู่ที่ 41%…"
    $('mark-alt').textContent = mode === 'live'
      ? t('alt.mark', { band: t('band.' + primary.band.k), p: Math.round(frac * 100) })
      : word + ' · ' + t('band.none');

    // --- the word and the answer -------------------------------------------
    $('word').textContent = word;
    fitWord();
    $('say').textContent = say;
    $('caption').innerHTML = capParts.join(' &middot; ');
    $('who').textContent = primary ? primary.id + ' · PM2.5' : 'PM2.5';

    // --- satellites: every other board, as a small mark ---------------------
    var others = list.filter(function (b) { return !primary || b.id !== primary.id; });
    var sig = others.map(function (b) {
      return b.id + ':' + b.st + ':' + (b.band ? b.band.k : '') + ':' + (b.n1 === null ? '' : b.n1);
    }).join('|');
    if (sig !== satSig) {
      satSig = sig;
      var html = '';
      // The state a satellite is in, as a key into the language table. A change
      // of language resets satSig, so this block re-runs and every satellite is
      // relabelled without touching the connection.
      var SATK = { offline: 'offline', waiting: 'waiting', stale: 'stale',
                   unknown: 'noreading', fault: 'fault', nosensor: 'nosensor' };
      others.forEach(function (b) {
        var m = b.st === 'live' ? 'live' : (b.st === 'waiting' ? 'wait' : 'none');
        var f = b.st === 'live' ? fractionFor(b.n1) : 0;
        // A satellite that has not published shows no number, ever — not a zero,
        // not a last-known value dressed as current.
        var lab = b.st === 'live' ? t('word.' + b.band.k) : t('word.' + SATK[b.st]);
        var title = b.st === 'live'
          ? b.id + ' ' + b.ent.value.text + (b.ent.unit ? ' ' + b.ent.unit : '') +
            ' · ' + t('band.' + b.band.k)
          : b.id + ' · ' + t('state.' + SATK[b.st]);
        html += '<div class="sat" title="' + esc(title) + '">' + satMark(m, f) +
                '<b>' + esc(b.id) + '</b><i>' + esc(lab) + '</i></div>';
      });
      $('sats').innerHTML = html;
      $('sats').hidden = others.length === 0;
    }

    // --- the honest tally ---------------------------------------------------
    var liveN = list.filter(function (b) { return b.st === 'live'; }).length;
    var offN = list.filter(function (b) { return b.st === 'offline'; }).length;
    var tally;
    if (!list.length) tally = t('tally.none');
    else {
      tally = t(list.length === 1 ? 'tally.one' : 'tally.many',
                { live: liveN, n: list.length });
      if (offN) tally += ' · ' + t('tally.offline', { n: offN });
    }
    $('tally').textContent = tally;
  }

  // The engine calls render()/layout() from several places; both funnel into one
  // coalesced repaint.
  var pending = false;
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; try { paint(); } catch (e) {} });
  }
  function refreshCounts() {}     // the poster has no counters; the tally is computed in paint()

  setInterval(schedule, 1000);    // ages "just now" into "3m ago" and expires readings
  window.addEventListener('resize', function () { fitWord(); });

  /* ---------------------------------------------------------------- failure -- */
  // The curtain remembers WHICH failure it is, not the sentence it printed, so a
  // wall left showing "cannot reach the broker" answers in Thai the moment
  // someone presses l — without a reload that would restart the retry loop.
  var calmState = null;
  function setCalm(kind, vars) {
    calmActive = true;
    calmState = { kind: kind, vars: vars || {} };
    renderCalm();
    $('calm').hidden = false;
    $('stage').hidden = true;
    document.documentElement.style.setProperty('--accent', NEUTRAL);
    document.documentElement.setAttribute('data-invert', '0');
  }
  function renderCalm() {
    if (!calmState) return;
    var v = calmState.vars;
    var why = v.whyKey ? t(v.whyKey) : (v.why || '');
    var s;
    // The vetted sentence is used whole and joined with the same middot this
    // page already separates facts with — never spliced into a longer sentence.
    if (calmState.kind === 'refused') {
      s = t('conn.refused') + (why ? ' · ' + why : '') + ' · ' + t('conn.hint');
    } else if (calmState.kind === 'unreachable') {
      s = t('conn.unreachable') + ' · ' + (v.url || '') + (why ? ' · ' + why : '') +
          ' · ' + t('conn.hint');
    } else {
      s = t('calm.' + calmState.kind);
    }
    $('calm-text').textContent = s;
  }
  function clearCalm() {
    if (!calmActive) return;
    calmActive = false;
    calmState = null;
    $('calm').hidden = true;
    $('stage').hidden = false;
    fitWord();
    schedule();
  }
  var linkState = { s: 'wait', k: 'conn.connecting' };
  function setLink(state, key) { linkState = { s: state, k: key }; renderLink(); }
  function renderLink() {
    $('link').setAttribute('data-s', linkState.s);
    $('link-text').textContent = t(linkState.k);
  }

  /* ---------------------------------------------------------------- connect -- */
  // Returns a KEY where the reason is one this page knows, and the library's own
  // words where it is not: an mqtt.js error message is English and untranslated
  // is more honest than a guess at what it meant.
  function describe(err) {
    var code = err && (err.code !== undefined ? err.code : err.reasonCode);
    var map = {
      1: 'why.protocol', 2: 'why.clientid', 3: 'why.unavail',
      4: 'why.badauth',  5: 'why.notauth'
    };
    if (map[code]) return { whyKey: map[code], fatal: code === 2 || code === 4 || code === 5 };
    var m = String((err && err.message) || err || '') || t('why.unknown');
    if (/not authoriz|bad user/i.test(m)) return { why: m, fatal: true };
    return { why: m, fatal: false };
  }

  function disconnect() {
    manualStop = true;
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    subs.clear();
  }

  function connect(cfg) {
    // The single hard stop. A page showing invented numbers must never also hold
    // a live socket: one screen carrying both a real and a fake reading is the
    // exact failure this mode exists to avoid. Belt and braces — the boot branch
    // below never calls this in demo mode either.
    if (DEMO) return;

    if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
      setCalm('nolib');
      return;
    }

    disconnect();
    manualStop = false;
    everConnected = false;
    activeFilter = typeof cfg.filter === 'string' ? cfg.filter.trim() : '';
    filteredOut.clear();
    ['conn', 'auth', 'nodisc', 'suberr', 'parse', 'wildcard', 'subcap', 'filter'].forEach(clearAlert);

    var scheme = cfg.tls ? 'wss' : 'ws';
    var url = scheme + '://' + cfg.host + ':' + cfg.port;
    setLink('wait', 'conn.connecting');

    // A page served over HTTPS cannot open a plaintext ws:// socket at all.
    if (!cfg.tls && location.protocol === 'https:') {
      setCalm('https');
      return;
    }

    try {
      client = mqtt.connect(url, {
        username: cfg.user || undefined,
        password: cfg.pass || undefined,
        clientId: 'one-mark-' + Math.random().toString(16).slice(2, 10),
        clean: true,
        reconnectPeriod: 4000,
        connectTimeout: 8000,
        keepalive: 45,
        resubscribe: true
      });
    } catch (e) {
      setCalm('cantopen');
      return;
    }

    client.on('connect', function () {
      everConnected = true;
      connState = 'connected';
      clearCalm();
      // Names the BROKER LINK, not a board. 'live' is this file's own state word for a
      // board that is reporting, so a wall reading 'ALL OFFLINE' under the green word
      // 'live' said two opposite things at once.
      setLink('up', 'conn.connected');
      clearAlert('conn');
      // Bounded discovery wildcards — the ONLY wildcards this page may subscribe
      // to, authored here. sub() refuses every wildcard that arrives on the wire.
      subRaw('homeassistant/+/+/config');
      subRaw('homeassistant/+/+/+/config');
      subRaw('dbk/+/status');
      if (discoveryTimer) clearTimeout(discoveryTimer);
      discoveryTimer = setTimeout(function () {
        if (entities.size === 0 && filteredOut.size === 0 && connState === 'connected') {
          setAlert('nodisc', 'info', 'notice.nodisc');
        }
      }, 4000);
      schedule();
    });

    client.on('message', function (topic, payload) {
      try { onMessage(topic, payload); }
      catch (e) { /* one bad message must never stop the stream */ }
    });

    client.on('reconnect', function () {
      if (!manualStop) { connState = 'reconnecting'; setLink('down', 'conn.retrying'); }
    });
    client.on('offline', function () {
      if (!manualStop) { connState = 'reconnecting'; setLink('down', 'conn.retrying'); }
    });

    // A browser never reveals WHY a WebSocket handshake failed, and for a refused
    // port mqtt.js may close without ever emitting a useful 'error'.
    client.on('close', function () {
      if (manualStop) return;
      connState = 'closed';
      if (!everConnected) {
        setCalm('unreachable', { url: url });
      } else {
        // Once it has worked, keep the mark up: the reading ages into STALE on
        // its own, which is more honest than blanking a wall people rely on.
        setLink('down', 'conn.retrying');
      }
    });

    client.on('error', function (err) {
      var d = describe(err);
      if (d.fatal) {
        connState = 'fatal';
        manualStop = true;
        try { client.end(true); } catch (e) {}
        client = null;
        setCalm('refused', { whyKey: d.whyKey, why: d.why });
      } else if (!everConnected) {
        setCalm('unreachable', { url: url, whyKey: d.whyKey, why: d.why });
      } else {
        setLink('down', 'conn.retrying');
      }
    });
  }

  /* --------------------------------------------------------------- settings -- */
  var form = $('form');
  function readForm() {
    return {
      host: $('f-host').value.trim(),
      port: $('f-port').value.trim(),
      user: $('f-user').value,
      pass: $('f-pass').value,
      tls: $('f-tls').checked,
      filter: $('f-filter').value.trim(),
      remember: $('f-remember').checked
    };
  }
  function fillForm(v) {
    $('f-host').value = (v && v.host) || DEFAULT_HOST;
    $('f-port').value = (v && v.port) || DEFAULT_PORT;
    $('f-user').value = (v && v.user) || '';
    $('f-pass').value = (v && v.pass) || '';
    $('f-tls').checked = !!(v && v.tls);
    $('f-filter').value = v && typeof v.filter === 'string' ? v.filter : DEFAULT_FILTER;
    $('f-remember').checked = !!(v && (v.remember || v.pass));
  }
  // What goes to disk is not what is in the form: the passphrase is opt-in, and
  // nothing is written into this file — ever.
  function storable(cfg) {
    var out = { host: cfg.host, port: cfg.port, user: cfg.user, tls: cfg.tls,
                filter: cfg.filter, remember: !!cfg.remember };
    if (cfg.remember) out.pass = cfg.pass;
    return out;
  }

  // Which hint the panel is showing, not the hint itself — same reason as the
  // curtain: pressing l must not leave one English sentence behind.
  var storeHintKey = null;
  function paintStoreHint() {
    if (storeHintKey) $('store-hint').textContent = t(storeHintKey);
  }
  function openPanel() {
    $('panel').hidden = false;
    storeHintKey = storeWorks ? 'hint.store' : 'hint.nostore';
    paintStoreHint();
    try { $('f-host').focus(); } catch (e) {}
  }
  function closePanel() { $('panel').hidden = true; }

  /* --------------------------------------------------------------- language --
     Switching re-renders; it never reloads. A reload would drop the MQTT socket,
     replay discovery, and blank a wall people are reading — and in demo mode it
     would re-synthesise every board. Everything that carries a word is redrawn
     from the table in place. */
  function setLang(next) {
    if (next !== 'th' && next !== 'en') return;
    if (next === LANG) return;
    LANG = next;
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}   // private mode throws
    applyLang();
  }

  function applyLang() {
    // <html lang> drives the browser's own line-breaking and font choice, and
    // every Thai typography rule in the stylesheet hangs off it.
    document.documentElement.setAttribute('lang', LANG);

    var box = $('lang');
    if (box) {
      var bs = box.querySelectorAll('button[data-l]');
      for (var i = 0; i < bs.length; i++) {
        bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-l') === LANG ? 'true' : 'false');
      }
      box.setAttribute('title', t('lang.title'));
    }

    var nodes = document.querySelectorAll('[data-i18n]');
    for (var j = 0; j < nodes.length; j++) {
      nodes[j].textContent = t(nodes[j].getAttribute('data-i18n'));
    }

    paintFoot();
    paintStoreHint();
    renderLink();
    renderCalm();
    paintNotice();
    paintDemoStatic();
    if (DEMO && demoLast) demoMark(demoParts(demoLast));
    satSig = '';        // the satellites carry words; force them to be redrawn
    fitWord();
    schedule();
  }

  // The foot is assembled rather than translated whole: the unit is a unit in
  // both languages and must stay one unbreakable object, and the two key caps
  // are keys, not words to translate.
  function paintFoot() {
    var f = $('foot');
    if (!f) return;
    f.textContent = '';
    f.appendChild(document.createTextNode(t('foot.scale') + ' · '));
    var u = document.createElement('span');
    u.className = 'nb';
    u.textContent = t('unit.ugm3');
    f.appendChild(u);
    [['foot.settings', 's'], ['foot.lang', 'l']].forEach(function (pair) {
      f.appendChild(document.createTextNode(' · '));
      var seg = t(pair[0]).split('{k}');
      f.appendChild(document.createTextNode(seg[0]));
      var b = document.createElement('b');
      b.textContent = pair[1];
      f.appendChild(b);
      f.appendChild(document.createTextNode(seg.length > 1 ? seg[1] : ''));
    });
  }

  function wireLang() {
    var box = $('lang');
    if (!box) return;
    var bs = box.querySelectorAll('button[data-l]');
    for (var i = 0; i < bs.length; i++) {
      bs[i].addEventListener('click', function (ev) {
        setLang(ev.currentTarget.getAttribute('data-l'));
      });
    }
  }

  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var t = ev.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
    if (ev.key === 'Escape') { closePanel(); return; }
    if (typing) return;
    // l for language. It does NOT collide with s: s is the settings panel and
    // stays exactly what it was, including its refusal to open in demo mode.
    // Language, unlike the broker, is safe to change while showing a demo.
    if (ev.key === 'l' || ev.key === 'L') {
      ev.preventDefault();
      setLang(LANG === 'th' ? 'en' : 'th');
      return;
    }
    if (ev.key === 's' || ev.key === 'S') {
      ev.preventDefault();
      if (DEMO) return;      // no broker settings while the wall is showing invented data
      if ($('panel').hidden) openPanel(); else closePanel();
    }
  });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (DEMO) return;        // the panel is unreachable in demo mode; refuse anyway
    var cfg = readForm();
    if (!cfg.host || !cfg.port) return;
    entities.clear(); byState.clear(); byAvail.clear(); byUid.clear(); boardStatus.clear();
    filteredOut.clear(); noticeMap.clear(); paintNotice();
    parseErrors = 0; satSig = '';
    refreshCounts();
    saveStore(storable(cfg));
    closePanel();
    clearCalm();
    schedule();
    connect(cfg);
  });

  $('btn-close').addEventListener('click', closePanel);
  $('btn-forget').addEventListener('click', function () {
    clearStore();
    fillForm(null);
    $('f-pass').value = '';
    storeHintKey = 'hint.cleared';
    paintStoreHint();
  });

  /* ==========================================================================
     DEMO MODE — for judging a layout at bands the fleet is not currently in.
     A wall that reads 0 µg/m³ cannot show whether "163.3" wraps mid-digit, and
     that wrap is a bug this design was drawn to prevent.

     Four rules, all of them safety rules and none of them negotiable:
       1. OPT-IN BY URL ONLY. ?demo= and nothing else turns it on. It is never
          read from or written to localStorage, so it cannot survive a reload
          without the parameter and cannot be left switched on for the next
          person who opens this file.
       2. NO SOCKET. connect() refuses outright while DEMO is set, so a real and
          a fake reading can never share one screen.
       3. A PERSISTENT MARKER, not a toast — fixed bars top and bottom carrying
          the word DEMO, ตัวอย่าง, and the value being simulated.
       4. ONE RENDERER. Everything below builds the same discovery payloads and
          the same state payloads the broker would have sent, hands them to the
          real onMessage(), and lets the real paint() draw them. If demo mode had
          a renderer of its own it would stop testing the thing that ships.
     ======================================================================= */

  // DEMO_VALUES and DEMO_ORDER are declared at the top of this file, beside
  // `var DEMO`, because readDemo() reads the band table long before execution
  // reaches this section.
  var DEMO_UNIT = '\u00b5g/m\u00b3';   // µg/m³, written as escapes so that no editor,
                                        // pipeline or transform can quietly bend it into mg/m³.

  function readDemo() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return null; }
    var raw = q.get('demo');
    if (raw === null) return null;
    var s = String(raw).trim().toLowerCase();
    if (s === '' || s === 'cycle') return { mode: 'cycle' };
    if (s === 'mixed') return { mode: 'mixed' };
    if (Object.prototype.hasOwnProperty.call(DEMO_VALUES, s)) {
      return { mode: 'value', value: DEMO_VALUES[s] };
    }
    var n = Number(s);
    if (Number.isFinite(n) && n >= 0) return { mode: 'value', value: Math.trunc(n * 10) / 10 };
    // Anything else is a typo, and it FAILS TOWARD THE DEMO. This file used to
    // fall through to the real wall on a bad token, which reads as the careful
    // answer and is not: someone who typed ?demo=hazardus is expecting a
    // simulation, and handing them today's genuine 0 µg/m³ under that
    // expectation is how a real Good reading gets photographed and shared as
    // "look, the Hazardous mock-up". Every wall in this folder now answers a
    // bad token the same way, because one control on the contact sheet drives
    // all twenty and they cannot each have their own policy. The mixed fleet
    // invents no band from the bad input, and the marker names the token.
    demoParamBad = String(raw);
    return { mode: 'mixed' };
  }

  // The three boards of the Chiang Mai fleet. DBK-002 is the rich one: it
  // publishes the whole ESPHome sensor set, so a dense layout has something to
  // fill its panels with.
  var DEMO_BOARDS = [
    { id: 'DBK-001', extras: false },
    { id: 'DBK-002', extras: true  },
    { id: 'DBK-010', extras: false }
  ];

  var demoEnc = (typeof TextEncoder === 'function') ? new TextEncoder() : null;

  // Bytes on a topic — the exact pair mqtt.js hands its 'message' listener.
  function demoPublish(topic, text) {
    var payload = demoEnc ? demoEnc.encode(String(text)) : String(text);
    try { onMessage(topic, payload); }
    catch (e) {
      // An empty catch here already cost one debugging cycle: every synthesised
      // config was being refused and the page simply looked like an empty wall.
      // A demo that is quietly broken teaches the wrong thing about the layout.
      setAlert('demopub', 'bad', 'notice.demopub',
        { topic: topic, why: e.message || String(e) });
    }
  }

  function demoSensors(board) {
    var list = [ { obj: 'pm2_5', name: 'PM2.5', unit: DEMO_UNIT, dc: 'pm25' } ];
    if (board.extras) list.push(
      { obj: 'pm1_0',             name: 'PM1.0',             unit: DEMO_UNIT, dc: 'pm1' },
      { obj: 'pm10',              name: 'PM10',              unit: DEMO_UNIT, dc: 'pm10' },
      { obj: 'wi-fi_rssi',        name: 'WiFi RSSI',         unit: 'dBm',     dc: 'signal_strength' },
      { obj: 'uptime',            name: 'Uptime',            unit: 's',       dc: 'duration' },
      { obj: 'air_quality_level', name: 'Air quality level', unit: '',        dc: '' }
    );
    return list;
  }

  function demoUid(id, obj) {
    return id.toLowerCase().replace(/[^a-z0-9]+/g, '') + '_' + obj.replace(/[^a-z0-9_]+/g, '');
  }

  // Retained discovery, abbreviated exactly the way ESPHome abbreviates it, so
  // expand(), the alias table and the "~" substitution are all exercised rather
  // than bypassed. Identity still comes from the board id in the state topic —
  // every one of these configs is named "PM2.5" on purpose, because the real
  // ones are, and titling anything from the discovery name makes three boards
  // indistinguishable.
  function demoAnnounce() {
    DEMO_BOARDS.forEach(function (b) {
      demoSensors(b).forEach(function (s) {
        var uid = demoUid(b.id, s.obj);
        var cfg = {
          '~': 'dbk/' + b.id,
          name: s.name,
          stat_t: '~/sensor/' + s.obj + '/state',
          avty_t: '~/status',
          uniq_id: uid,
          stat_cla: 'measurement',
          exp_aft: DEFAULT_EXPIRE,
          dev: { name: b.id, ids: [ b.id.toLowerCase() ], mf: 'Kit4Kids', mdl: 'DBK air board' }
        };
        if (s.unit) cfg.unit_of_meas = s.unit;
        if (s.dc) cfg.dev_cla = s.dc;
        demoPublish('homeassistant/sensor/' + uid + '/config', JSON.stringify(cfg));
      });
    });
  }

  function demoTrunc(n) { return Math.trunc(n * 10) / 10; }

  // onMessage() stamps every payload with Date.now(), which is right for a real
  // broker and useless for rehearsing a stale board. The timestamp is pushed
  // back afterwards on the very entity the real path produced — no second entity
  // shape, no second code path.
  function demoAge(prefix, ms) {
    if (!ms) return;
    entities.forEach(function (e) {
      if (e.at && e.stateTopic && e.stateTopic.indexOf(prefix) === 0) e.at -= ms;
    });
  }

  function demoBoardState(board, spec) {
    var base = 'dbk/' + board.id;
    demoPublish(base + '/status', spec.status);
    if (typeof spec.pm === 'number') {
      var pm = demoTrunc(spec.pm);
      demoPublish(base + '/sensor/pm2_5/state', pm.toFixed(1));
      if (board.extras) {
        // Derived from the same particle load, not invented separately: PM1 is
        // the fraction of PM2.5 below a micron, PM10 the coarser total above it.
        demoPublish(base + '/sensor/pm1_0/state', demoTrunc(pm * 0.62).toFixed(1));
        demoPublish(base + '/sensor/pm10/state',  demoTrunc(pm * 1.45).toFixed(1));
        demoPublish(base + '/sensor/wi-fi_rssi/state', String(spec.rssi));
        demoPublish(base + '/sensor/uptime/state', String(spec.uptime));
        var band = bandFor(pm);
        demoPublish(base + '/sensor/air_quality_level/state', band ? band.label : 'unknown');
      }
    }
    demoAge(base + '/', spec.ageMs);
  }

  // What the marker says about a spec, built fresh each time so a language
  // switch can relabel the bars WITHOUT republishing anything — republishing
  // would reset every board's age and quietly rewrite the rehearsal.
  var demoLast = null;
  function demoParts(spec) {
    if (spec.mode === 'mixed') {
      return [ { text: t('demo.mixed'), nb: false },
               'DBK-002 87.4 ' + DEMO_UNIT,
               { text: 'DBK-001 ' + t('state.stale'), nb: false },
               { text: 'DBK-010 ' + t('state.offline'), nb: false } ];
    }
    var v = demoTrunc(spec.value), b = bandFor(v);
    return [ { text: t('demo.at'), nb: false },
             v.toFixed(1) + ' ' + DEMO_UNIT ]
           .concat(b ? [ { text: t('word.' + b.k), nb: false } ] : []);
  }

  function demoApply(spec) {
    demoLast = spec;
    if (spec.mode === 'mixed') {
      // The state the fleet is actually in most days, and the one a layout is
      // most likely to render badly: one board answering, one that stopped
      // answering an hour ago, one that is simply not there.
      demoBoardState(DEMO_BOARDS[0], { status: 'online',  pm: 61.8, ageMs: 42 * 60 * 1000 });
      demoBoardState(DEMO_BOARDS[1], { status: 'online',  pm: 87.4, ageMs: 9 * 1000,
                                       rssi: -61, uptime: 263118 });
      demoBoardState(DEMO_BOARDS[2], { status: 'offline', pm: 24.6, ageMs: 3 * 60 * 60 * 1000 });
      demoMark(demoParts(spec));
      return;
    }
    var v = demoTrunc(spec.value);
    demoBoardState(DEMO_BOARDS[0], { status: 'online', pm: v, ageMs: 14 * 1000 });
    demoBoardState(DEMO_BOARDS[1], { status: 'online', pm: v, ageMs: 6 * 1000,
                                     rssi: -58, uptime: 184213 });
    demoBoardState(DEMO_BOARDS[2], { status: 'online', pm: v, ageMs: 31 * 1000 });
    demoMark(demoParts(spec));
  }

  /* -------------------------------------------------- the non-negotiable bit --
     Two fixed bars, top and bottom, in the poster's own two colours. They do not
     fade, they do not scroll away, they cannot be dismissed, and they carry both
     the word DEMO and the value being simulated. A photograph of this screen
     cannot be cropped into something that looks like a real reading. */
  var demoValueEl = null, demoTopEl = null, demoBotEl = null, demoBotTextEl = null;

  // The top bar's warning is printed in BOTH languages, always, whatever the
  // wall is set to. It is a safety marker, not copy: a Thai-speaking child and
  // an English-reading visitor must both be told these numbers are invented, and
  // neither of them pressed the language button.
  function paintDemoStatic() {
    if (demoBotTextEl) demoBotTextEl.textContent = t('demo.foot');
  }

  // Fitted, not guessed — the same rule the word obeys. The bars are fixed, so
  // they are out of flow and cannot push the stage down by themselves; the body
  // is padded by whatever they actually measure, re-measured whenever the text
  // reflows. The CSS clamp is only the floor used before this first runs.
  function demoFit() {
    if (!demoTopEl || !demoBotEl) return;
    var t = demoTopEl.getBoundingClientRect().height;
    var b = demoBotEl.getBoundingClientRect().height;
    if (t > 0) document.body.style.paddingTop = (t + 10) + 'px';
    if (b > 0) document.body.style.paddingBottom = (b + 10) + 'px';
  }

  // A part is either a string — a number and its unit, one unbreakable object —
  // or {text,nb:false} for prose. A Thai phrase must be allowed to wrap here:
  // held nowrap it would push the bar wider than the screen.
  function demoMark(parts) {
    if (!demoValueEl) return;
    demoValueEl.textContent = '';
    parts.forEach(function (p, i) {
      if (i) demoValueEl.appendChild(document.createTextNode(' · '));
      var o = (typeof p === 'string') ? { text: p, nb: true } : p;
      var s = document.createElement('span');
      if (o.nb !== false) s.className = 'nb';
      s.textContent = o.text;
      demoValueEl.appendChild(s);
    });
    demoFit();                   // the chip just changed length; it may have rewrapped
  }

  function demoBuildMarker() {
    document.body.setAttribute('data-demo', '1');

    var top = document.createElement('div');
    top.className = 'demo-bar demo-top';
    top.setAttribute('role', 'status');

    var word = document.createElement('b');
    word.className = 'demo-word';
    word.textContent = 'DEMO';
    var thai = document.createElement('span');
    thai.className = 'demo-th';
    thai.textContent = 'ตัวอย่าง';
    var msgEn = document.createElement('span');
    msgEn.textContent = tIn('en', 'demo.warn');
    var msgTh = document.createElement('span');
    msgTh.className = 'demo-th';     // Thai never takes the bar's wide tracking
    msgTh.textContent = tIn('th', 'demo.warn');
    demoValueEl = document.createElement('span');
    demoValueEl.className = 'demo-val';

    top.appendChild(word);
    top.appendChild(thai);
    top.appendChild(msgEn);
    top.appendChild(msgTh);
    top.appendChild(demoValueEl);

    var bot = document.createElement('div');
    bot.className = 'demo-bar demo-bot';
    var bw = document.createElement('b');
    bw.className = 'demo-word';
    bw.textContent = 'DEMO';
    var bthai = document.createElement('span');
    bthai.className = 'demo-th';
    bthai.textContent = 'ตัวอย่าง';
    demoBotTextEl = document.createElement('span');
    bot.appendChild(bw);
    bot.appendChild(bthai);
    bot.appendChild(demoBotTextEl);
    paintDemoStatic();

    document.body.appendChild(top);
    document.body.appendChild(bot);
    demoTopEl = top;
    demoBotEl = bot;
    demoFit();
    // Registered only in demo mode, so the real path keeps exactly the one
    // resize listener it always had.
    window.addEventListener('resize', function () { demoFit(); fitWord(); });
  }

  function startDemo() {
    // The bars cover every crop of a photograph of the SCREEN, but not a crop of
    // the browser chrome above it. A tab strip, a bookmark and a screenshot of
    // the window frame all carry the title and nothing else, so the title has to
    // carry the warning too. Every other wall in this folder prefixes it.
    document.title = 'DEMO — ' + document.title;
    demoBuildMarker();
    connState = 'demo';
    activeFilter = DEFAULT_FILTER;
    setLink('wait', 'link.demo');
    demoAnnounce();

    if (DEMO.mode === 'cycle') {
      var step = 0;
      demoApply({ mode: 'value', value: DEMO_VALUES[DEMO_ORDER[step]] });
      setInterval(function () {
        step = (step + 1) % DEMO_ORDER.length;
        demoApply({ mode: 'value', value: DEMO_VALUES[DEMO_ORDER[step]] });
        schedule();
      }, 4000);
    } else {
      demoApply(DEMO);
    }
    schedule();
  }

  /* ------------------------------------------------------------------- boot -- */
  // No configuration UI on load, in any branch. Storage first, then the URL,
  // then an anonymous connection to the default broker.
  function urlCfg() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return null; }
    var u = q.get('u'), p = q.get('p'), h = q.get('h'),
        port = q.get('port'), f = q.get('f'), tls = q.get('tls');
    if (u === null && p === null && h === null && port === null && f === null && tls === null) return null;
    return {
      host: (h || DEFAULT_HOST).trim(),
      port: (port || DEFAULT_PORT).trim(),
      user: u || '',
      pass: p || '',
      tls: tls === '1' || tls === 'true',
      filter: f === null ? DEFAULT_FILTER : f,
      remember: false
    };
  }
  // Credentials handed in by URL are used once and wiped from the address bar,
  // so a wall display is not left showing them to the room.
  function scrubUrl() {
    try {
      var q = new URLSearchParams(location.search);
      if (!q.has('u') && !q.has('p')) return;
      q.delete('u'); q.delete('p');
      var s = q.toString();
      history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash);
    } catch (e) {}
  }

  // Language is settled before anything is drawn, in both branches, so no wall
  // ever shows one frame of English before switching.
  wireLang();
  applyLang();

  // Demo mode forks the boot and nothing else. It reads no stored config, writes
  // none, and returns before connect() is ever reached; without ?demo= not one
  // line below this branch behaves differently than it did before demo existed.
  if (DEMO) {
    scrubUrl();               // still wipe u/p from the bar — demo ignores them either way
    startDemo();
    paint();
    return;
  }

  var stored = loadStore();
  var fromUrl = urlCfg();
  var boot;
  if (stored && stored.host && stored.port) {
    boot = stored;
    // A URL that carries credentials fills in for a stored config that has none,
    // so a display can be repointed without anyone touching the settings panel.
    if (fromUrl && (fromUrl.user || fromUrl.pass) && !boot.user && !boot.pass) {
      boot.user = fromUrl.user;
      boot.pass = fromUrl.pass;
    }
  } else if (fromUrl) {
    boot = fromUrl;
  } else {
    boot = { host: DEFAULT_HOST, port: DEFAULT_PORT, user: '', pass: '',
             tls: false, filter: DEFAULT_FILTER, remember: false };
  }
  scrubUrl();
  fillForm(boot);
  activeFilter = typeof boot.filter === 'string' ? boot.filter.trim() : '';
  // A mistyped ?demo= says so out loud rather than silently looking like a demo
  // that failed to start. The wall is in demo mode either way — see readDemo() —
  // so this names the token that was thrown away, beside a marker that is
  // already saying nothing here is a measurement.
  if (demoParamBad) {
    setAlert('demo', 'warn', 'notice.demobad', { v: demoParamBad });
  }
  paint();
  connect(boot);
})();
</script>
</body>
</html>
