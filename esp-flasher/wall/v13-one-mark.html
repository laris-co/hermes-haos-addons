<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Mark — PM2.5</title>
<style>
/* ============================================================================
   ONE MARK — Saul Bass reduction of the air wall.
   Two colours only: a ground, and ONE accent that is the EPA band colour.
   Every glyph and every line on this page is that accent at some opacity —
   nothing is white, nothing is a third hue. At Hazardous the poster inverts:
   the ground becomes the accent and the type becomes the ground.
   There is no table, no row, no card. One circle, one word, one sentence.
   ========================================================================== */
:root{
  --ground:#0a0a0b;
  --accent:#8e9aa8;          /* neutral until a real reading names a band */
  --ink:var(--accent);
  --bg:var(--ground);
  /* A THIRD fixed pair, outside the band rewrite, and the only pair the demo
     marker is allowed to use. The poster's two colours are re-authored on every
     render from the EPA band, so a marker drawn in them takes the band's colour
     as its ground — at ?demo=good the DEMO bars came out in the same green that
     means "the air is safe", which is the one signal the marker exists to
     withdraw. These two never move. The two-colour rule already breaks for
     [data-invert="1"]; this is the same admission, made for a safety device. */
  --demo-ink:#12100a;        /* near-black, never a band */
  --demo-hi:#ffb300;         /* caution amber, never a band */
}
:root[data-invert="1"]{      /* Hazardous only — the one state that flips the poster */
  --ink:#150409;
  --bg:var(--accent);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%}
body{
  background:var(--bg);
  color:var(--ink);
  /* Latin faces first so the poster keeps its own look, then real Thai faces by
     name — per-glyph fallback means Thai lands on a face that sets tone marks
     correctly instead of on whatever last resort the browser reaches for. No
     webfont link: this page has to open from a USB stick on a wall with no
     internet, so the system stack and its fallback are what we get. */
  font:700 16px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
       "Helvetica Neue",Arial,"Noto Sans Thai","IBM Plex Sans Thai",Sarabun,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(.8rem,2.4vmin,2rem);
  transition:background-color .55s ease,color .55s ease;
}
/* One typeface, ONE weight, on the whole page. Hierarchy is size and opacity only. */

/* ---------------------------------------------------------------- stage ---- */
.stage{
  /* The word below is fitted against THIS box, measured — never against the
     viewport. Sizing a reading in vw while its space came from a parent box is
     what once split "163." from "3" in the hazardous range. */
  container-type:inline-size;
  width:min(100%,880px);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:clamp(.4rem,1.25vmin,.85rem);
}
/* An author `display` beats the UA `[hidden]{display:none}` rule regardless of
   specificity, so every flex/block box that can be hidden says so explicitly. */
.stage[hidden],.calm[hidden],.panel[hidden],.sats[hidden]{display:none}

.topline{
  display:flex;width:100%;align-items:center;justify-content:space-between;
  gap:1rem;font-size:clamp(.6rem,1.9cqi,.82rem);letter-spacing:.2em;opacity:.55;
}
.topline span{white-space:nowrap;min-width:0}
.link i{
  display:inline-block;width:.5em;height:.5em;border-radius:50%;
  background:currentColor;margin-right:.5em;
}
.link[data-s="down"] i{animation:blink 1.4s steps(1,end) infinite}
@keyframes blink{50%{opacity:.12}}

/* ---------------------------------------------------------------- the mark - */
.markwrap{width:min(37vmin,62cqi);max-width:100%}
svg.mark{display:block;width:100%;height:auto}
.track{fill:none;stroke:currentColor;stroke-width:9;opacity:.15}
.arc{
  fill:none;stroke:currentColor;stroke-width:9;stroke-linecap:butt;
  transition:stroke-dasharray .9s cubic-bezier(.22,.9,.24,1);
}
.bar{stroke:currentColor;stroke-width:9;stroke-linecap:butt}
.ticks line{stroke:currentColor;stroke-width:2.4;opacity:.3}
/* Three mark states, told by SHAPE so they can never be confused with each
   other or with a low reading: filled arc = a reading; struck ring = no
   reading; dashed ring = online but nothing published yet. */
svg.mark .bar{display:none}
svg.mark[data-mark="none"] .arc{display:none}
svg.mark[data-mark="none"] .bar{display:block}
svg.mark[data-mark="wait"] .arc{display:none}
svg.mark[data-mark="wait"] .track{stroke-dasharray:2.2 8;opacity:.5}

/* ---------------------------------------------------------------- the word - */
.word{width:100%;line-height:.92;letter-spacing:-.035em;white-space:nowrap}
.word span{display:inline-block}
.say{
  margin:0;max-width:23ch;line-height:1.2;
  font-size:clamp(1rem,4.2cqi,1.7rem);letter-spacing:-.01em;opacity:.92;
}
.caption{
  margin:.15rem 0 0;font-size:clamp(.66rem,2.1cqi,.95rem);
  letter-spacing:.14em;opacity:.6;font-variant-numeric:tabular-nums;
}
/* A number and its unit are one object. They never break, and the unit is
   printed exactly as the device published it — no case transform touches it. */
.nb{white-space:nowrap}

/* ---------------------------------------------------------------- satellites */
.rule{width:min(100%,34rem);height:1px;background:currentColor;opacity:.18;margin:clamp(.3rem,1.4vmin,.9rem) 0 0}
.sats{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
  gap:clamp(.7rem,4cqi,2rem);
}
.sat{display:flex;flex-direction:column;align-items:center;gap:.3rem;min-width:0}
.sat svg{width:clamp(1.4rem,5cqi,2.3rem);height:auto;display:block;opacity:.8}
.sat b{font-size:clamp(.62rem,2cqi,.85rem);letter-spacing:.1em;white-space:nowrap;opacity:.85}
.sat i{font-style:normal;font-size:clamp(.55rem,1.7cqi,.74rem);letter-spacing:.14em;white-space:nowrap;opacity:.5}
/* The mixed-state disclosure. It qualifies the mark above it — which two rooms this
   poster is NOT speaking for — so it is body copy at AA, not a watermark. */
.tally{margin:0;font-size:clamp(.66rem,2.1cqi,.9rem);letter-spacing:.14em;opacity:.92}
.notice{margin:0;font-size:clamp(.58rem,1.8cqi,.78rem);letter-spacing:.06em;opacity:.5;max-width:56ch;line-height:1.45}
.notice:empty{display:none}
/* Names the standard the mark is computed from. Required on the wall, so it is
   readable on the wall. */
.foot{margin:.15rem 0 0;font-size:clamp(.6rem,1.8cqi,.8rem);letter-spacing:.1em;opacity:.9;max-width:54ch;line-height:1.55}

/* ---------------------------------------------------------------- failure --- */
/* When the wall cannot do its job the whole screen becomes one calm sentence. */
.calm{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:clamp(1.2rem,6vmin,4rem);
}
.calm p{
  margin:0;max-width:24ch;text-align:center;line-height:1.28;
  font-size:clamp(1.05rem,4.2vmin,2.15rem);letter-spacing:-.015em;
}

/* ---------------------------------------------------------------- settings -- */
/* Never on load. Reachable only by pressing s. */
.panel{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:clamp(1rem,4vmin,2.5rem);
}
.panel form{width:min(100%,30rem);display:flex;flex-direction:column;gap:.9rem;text-align:left}
.panel h2{margin:0 0 .4rem;font-size:1rem;letter-spacing:.2em;font-weight:700}
.f{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.f label{font-size:.66rem;letter-spacing:.18em;opacity:.55}
.f input{
  background:transparent;color:inherit;font:inherit;font-size:1rem;
  border:0;border-bottom:2px solid currentColor;border-radius:0;
  padding:.4rem .1rem;width:100%;min-width:0;
}
.f input:focus{outline:2px solid currentColor;outline-offset:3px}
.row{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center}
.chk{display:flex;align-items:center;gap:.45rem;font-size:.8rem;letter-spacing:.06em}
.chk input{width:1rem;height:1rem;accent-color:currentColor}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
button{
  font:inherit;font-size:.85rem;letter-spacing:.14em;cursor:pointer;
  padding:.6rem 1.1rem;border-radius:0;
  background:currentColor;color:var(--bg);border:2px solid currentColor;
}
button.ghost{background:transparent;color:inherit}
.hint{margin:0;font-size:.72rem;letter-spacing:.06em;opacity:.5;line-height:1.5}

/* ---------------------------------------------------------------- demo ----- */
/* Opt-in through ?demo= and nothing else. The marker is the loudest object on
   the page and is built from ONE FIXED PAIR of its own — near-black and caution
   amber — which is the one place this poster is allowed a third hue. It used to
   borrow the poster's two colours, and that was wrong in the most specific way
   available: the poster's colours ARE the health signal, so at ?demo=good the
   bars came out in band green and the marker adopted the reassurance it exists
   to contradict. A warning may not be painted in the colour of the thing it is
   warning about. Fixed, so it survives any
   scroll; full-bleed top AND bottom, so no crop of a photograph of the wall can
   lose it. The DEMO word is the largest glyph in the bar after the reading
   itself. Nothing here uppercases text: every capital is authored as a capital,
   because text-transform maps "µ" to "M" and turns µg/m³ into a 1000x lie. */
/* A floor only. demoFit() replaces both with the bars' MEASURED height as soon
   as they are on the page, so a banner that wraps to three lines on a narrow
   screen still cannot land on top of the reading. */
body[data-demo="1"]{
  padding-top:clamp(3.6rem,10.5vmin,5.6rem);
  padding-bottom:clamp(2.4rem,7vmin,3.6rem);
}
.demo-bar{
  position:fixed;left:0;right:0;z-index:90;
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:.35em 1.1em;text-align:center;
  background:var(--demo-ink);color:var(--demo-hi);
  padding:clamp(.4rem,1.3vmin,.75rem) clamp(.7rem,2.4vw,1.6rem);
  letter-spacing:.2em;line-height:1.3;
  /* No colour transition: the bars do not follow the poster through a band
     change, because they are not part of it. */
}
/* The banding sits INSIDE the bar's own box, and the bar reserves its height in
   padding, so a measured bar height is the whole marker — nothing sticks out
   into the stage unaccounted for. */
.demo-top{top:0;font-size:clamp(.72rem,2.5vmin,1.15rem);
  padding-bottom:calc(clamp(.4rem,1.3vmin,.75rem) + .5rem)}
.demo-bot{bottom:0;font-size:clamp(.58rem,1.75vmin,.84rem);letter-spacing:.1em;
  padding-top:calc(clamp(.4rem,1.3vmin,.75rem) + .5rem)}
/* Caution banding, drawn in the same two colours — a shape that reads as
   "not real" from across the room, before any word is legible. */
.demo-top::after,.demo-bot::before{
  content:"";position:absolute;left:0;right:0;height:.5rem;
  background:repeating-linear-gradient(135deg,
    var(--demo-hi) 0 .75rem,var(--demo-ink) .75rem 1.5rem);
}
.demo-top::after{bottom:0}
.demo-bot::before{top:0}
.demo-word{font-size:1.5em;letter-spacing:.3em;margin-right:-.3em}
.demo-bot .demo-word{font-size:1.25em}
/* Thai never takes the wide tracking — it breaks the combining marks apart. */
.demo-th{letter-spacing:normal;font-size:1.1em}
.demo-val{
  border:.16em solid var(--demo-hi);padding:.12em .6em;max-width:100%;
  white-space:normal;                 /* the bar may wrap … */
}
.demo-val .nb{white-space:nowrap}     /* … but a number never leaves its unit */

/* ---------------------------------------------------------------- language -- */
/* TH / EN, in the topline, in the page's one accent colour and at the topline's
   own opacity — always reachable, never the loudest thing on a wall whose job is
   a reading. Its two labels are Latin, so the tracking is safe HERE and only
   here. Nothing on this page has text-transform, in any language. */
.lang{display:flex;align-items:center;gap:.35em;flex:0 0 auto}
.lang button{
  font:inherit;font-size:1em;letter-spacing:.2em;line-height:1;
  background:transparent;color:inherit;border:0;border-bottom:2px solid transparent;
  border-radius:0;padding:.15em .1em .12em;margin:0;opacity:.45;cursor:pointer;
}
.lang button[aria-pressed="true"]{opacity:1;border-bottom-color:currentColor}
.lang button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.lang .sep{opacity:.3}

/* ----------------------------------------------------------------- ไทย ----- */
/* Thai is not Latin with other glyphs. Three rules earn their place:
   1. NO TRACKING. letter-spacing drags a combining vowel or tone mark off the
      consonant it belongs to, so every tracked rule above is reset for Thai —
      including the display word's negative tracking.
   2. MORE LEADING. Thai stacks marks above and below the base glyph; 1.2 clips
      them. Body copy takes 1.55–1.7. The one display word takes 1.3: it is a
      single nowrap line and needs room for its marks, not for a second line.
   3. BREAKABLE PROSE, UNBREAKABLE NUMBERS. Thai writes no spaces between words,
      so the browser has no break opportunity inside a phrase and a long
      sentence would run off the wall. Prose gets overflow-wrap:anywhere. A
      reading NEVER does — that is the rule that once split "163.3" into "163."
      and "3". */
html[lang="th"] .topline,html[lang="th"] .caption,html[lang="th"] .tally,
html[lang="th"] .notice,html[lang="th"] .foot,html[lang="th"] .hint,
html[lang="th"] .calm p,html[lang="th"] .say,html[lang="th"] .word,
html[lang="th"] .sat b,html[lang="th"] .sat i,html[lang="th"] .panel h2,
html[lang="th"] .f label,html[lang="th"] .chk,html[lang="th"] .acts button,
html[lang="th"] .demo-bar{letter-spacing:normal}
/* …but NOT the switcher: its two labels are the Latin letters TH and EN in
   every language, and they keep the topline's tracking. */
html[lang="th"] .sat b,html[lang="th"] .sat i,html[lang="th"] .panel h2,
html[lang="th"] .f label,html[lang="th"] .f input,html[lang="th"] .chk,
html[lang="th"] .acts button{line-height:1.5}
html[lang="th"] .say{line-height:1.55}
html[lang="th"] .caption,html[lang="th"] .tally{line-height:1.55}
html[lang="th"] .notice,html[lang="th"] .foot,html[lang="th"] .hint{line-height:1.7}
html[lang="th"] .calm p{line-height:1.5}
html[lang="th"] .demo-bar{line-height:1.6}
html[lang="th"] .word{line-height:1.3}
html[lang="th"] .say,html[lang="th"] .caption,html[lang="th"] .tally,
html[lang="th"] .notice,html[lang="th"] .foot,html[lang="th"] .hint,
html[lang="th"] .calm p,html[lang="th"] .demo-val{
  overflow-wrap:anywhere;word-break:break-word;
}
/* The reading and the display word are objects, not prose, in every language. */
.nb,html[lang="th"] .nb,html[lang="th"] .word{overflow-wrap:normal;word-break:keep-all}
/* A Thai state label under a satellite is a phrase, not a word; let it wrap
   under its own mark rather than push the row wider than the screen. */
html[lang="th"] .sat i{white-space:normal;max-width:9em;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="stage" id="stage">

  <div class="topline">
    <span class="who" id="who">&nbsp;</span>
    <span class="lang" id="lang" role="group" aria-label="Language / ภาษา"><button type="button" data-l="th" aria-pressed="false">TH</button><span class="sep">/</span><button type="button" data-l="en" aria-pressed="true">EN</button></span>
    <span class="link" id="link" data-s="wait"><i></i><span id="link-text">connecting</span></span>
  </div>

  <div class="markwrap">
    <svg class="mark" id="mark" viewBox="0 0 100 100" role="img" aria-labelledby="mark-alt" data-mark="wait">
      <title id="mark-alt">air quality mark</title>
      <g class="ticks" id="ticks"></g>
      <circle class="track" cx="50" cy="50" r="38"></circle>
      <circle class="arc" id="arc" cx="50" cy="50" r="38" transform="rotate(-90 50 50)" stroke-dasharray="0 999"></circle>
      <line class="bar" x1="23.13" y1="76.87" x2="76.87" y2="23.13"></line>
    </svg>
  </div>

  <div class="word" id="word-box"><span id="word" aria-live="polite">&nbsp;</span></div>
  <p class="say" id="say">&nbsp;</p>
  <p class="caption" id="caption">&nbsp;</p>

  <div class="rule"></div>
  <div class="sats" id="sats" hidden></div>
  <p class="tally" id="tally">&nbsp;</p>
  <p class="notice" id="notice"></p>
  <!-- Rebuilt by paintFoot() in the active language; the English below is what a
       reader sees for the one frame before the script runs. -->
  <p class="foot" id="foot">Each sixth of the circle is one band of the US EPA PM2.5 scale
    &middot; &micro;g/m&sup3; &middot; press <b>s</b> for settings</p>

</main>

<section class="calm" id="calm" hidden><p id="calm-text"></p></section>

<section class="panel" id="panel" hidden>
  <form id="form" autocomplete="off">
    <h2 data-i18n="panel.title">BROKER</h2>
    <div class="f"><label for="f-host" data-i18n="panel.host">HOST</label>
      <input id="f-host" spellcheck="false" required></div>
    <div class="f"><label for="f-port" data-i18n="panel.port">WEBSOCKET PORT</label>
      <input id="f-port" inputmode="numeric" required></div>
    <div class="f"><label for="f-user" data-i18n="panel.user">USERNAME</label>
      <input id="f-user" spellcheck="false"></div>
    <div class="f"><label for="f-pass" data-i18n="panel.pass">PASSPHRASE</label>
      <input id="f-pass" type="password" autocomplete="off"></div>
    <div class="f"><label for="f-filter" data-i18n="panel.filter">TOPIC STARTS WITH</label>
      <input id="f-filter" spellcheck="false" placeholder="dbk/"></div>
    <div class="row">
      <span class="chk"><input id="f-tls" type="checkbox"><label for="f-tls" data-i18n="panel.tls">TLS (wss)</label></span>
      <span class="chk"><input id="f-remember" type="checkbox"><label for="f-remember" data-i18n="panel.remember">remember passphrase</label></span>
    </div>
    <div class="acts">
      <button type="submit" data-i18n="panel.connect">CONNECT</button>
      <button type="button" class="ghost" id="btn-forget" data-i18n="panel.forget">FORGET</button>
      <button type="button" class="ghost" id="btn-close" data-i18n="panel.close">CLOSE</button>
    </div>
    <p class="hint" id="store-hint"></p>
  </form>
</section>

<!-- Pinned AND hash-locked, same bytes as the tested dashboard this is built on.
     sha384 of the exact 369,231-byte bundle. If the hash ever fails to match the
     browser refuses the script and the calm screen explains what to do. -->
<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"
        integrity="sha384-haZiwxTLortiFcYMBEEE1+8ayC+o18YtuwHZv+4WQHoPaLzRjwOV6h7Vva5iLSCZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  'use strict';

  /* ==========================================================================
     LANGUAGE — one table, one t(), no second renderer.

     Everything a person reads on this wall comes out of STR. The Thai here was
     written against Thai discourse frames, not translated from the English
     beside it: it is vetted copy and is not to be "improved" one file at a time.
     The English column is the poster's own voice, with ONE deliberate exception
     — the six band words are authored in capitals HERE, in the file, because the
     Bass reduction this page is needs one large word and because no CSS on this
     page may ever uppercase anything (text-transform maps "µ" to "M" and turns
     µg/m³ into a 1000x lie). Thai has no capitals, so the Thai column carries
     the band's name as written and the display simply sets it larger.
     ======================================================================= */
  var LANG_KEY = 'one-mark.lang.v1';

  var STR = {
    en: {
      /* the verdict — the sentence under the word, the thing a child acts on */
      'verdict.good':       'Go outside. The air is clean.',
      'verdict.moderate':   'Air is okay. Outdoor play is fine.',
      'verdict.sensitive':  'Sensitive groups take care.',
      'verdict.unhealthy':  'Unhealthy — stay indoors.',
      'verdict.verybad':    'Very unhealthy — stay indoors.',
      'verdict.hazardous':  'Hazardous — stay inside.',
      'verdict.unknown':    'No reading — air quality unknown.',
      /* the band's name, as a name: spoken by the mark's aria label */
      'band.good':          'Good',
      'band.moderate':      'Moderate',
      'band.sensitive':     'Unhealthy for sensitive groups',
      'band.unhealthy':     'Unhealthy',
      'band.verybad':       'Very unhealthy',
      'band.hazardous':     'Hazardous',
      'band.none':          'Not rated',
      /* a condition, not a name — lower case on purpose */
      'state.offline':      'offline',
      'state.noreading':    'no reading',
      'state.stale':        'stale',
      'state.waiting':      'waiting',
      'state.live':         'live',
      'state.fault':        'sensor fault',
      'state.nosensor':     'no sensor',
      /* the one big word. Capitals authored, never transformed. */
      'word.good':          'GOOD',
      'word.moderate':      'MODERATE',
      /* The caption prints the full EPA name, 'Unhealthy for sensitive groups'.
         The hero used to print 'SENSITIVE GROUPS', which is not a shortening of
         that name — it is a different statement, and the one word it drops is
         the word that says the air is unhealthy. Only a sensitive-band reading
         shows both at once, which is why it survived: 163.3 and 250.5, the two
         values everybody tests with, are Very unhealthy and Hazardous. */
      'word.sensitive':     'UNHEALTHY · SENSITIVE',
      'word.unhealthy':     'UNHEALTHY',
      'word.verybad':       'VERY UNHEALTHY',
      'word.hazardous':     'HAZARDOUS',
      'word.waiting':       'WAITING',
      'word.stale':         'STALE',
      'word.fault':         'SENSOR FAULT',
      'word.noreading':     'NO READING',
      'word.offline':       'OFFLINE',
      'word.alloffline':    'ALL OFFLINE',
      'word.nosensor':      'NO SENSOR',
      /* the broker link chip */
      'conn.connecting':    'connecting',
      'conn.connected':     'connected',
      'conn.retrying':      'reconnecting',
      'conn.refused':       'The broker refused this connection.',
      'conn.unreachable':   'Cannot reach the broker.',
      'conn.hint':          'Press s to enter the details.',
      'link.demo':          'demo · no broker',
      /* why the broker said no */
      'why.protocol':       'the broker rejected the MQTT protocol version',
      'why.clientid':       'the broker rejected this client id',
      'why.unavail':        'the broker is unavailable',
      'why.badauth':        'the username or passphrase is wrong',
      'why.notauth':        'this account is not authorised for the broker',
      'why.unknown':        'unknown error',
      /* the whole-screen sentence when the wall cannot do its job */
      'calm.nolib':         'This wall could not load the library it needs, so put the display ' +
                            'back on a network that can reach the internet and reload the page.',
      'calm.https':         'This page is served over HTTPS, which blocks the plain WebSocket ' +
                            'the broker listens on, so press s and tick TLS, or open this file ' +
                            'straight from disk.',
      'calm.cantopen':      'This wall could not open a connection to the broker, so press s ' +
                            'and check the host and WebSocket port.',
      /* the sentence, for the states that are not a band */
      'say.waiting':        'This board is online but has not sent a reading yet.',

  // ?lang= wins, then what this browser was last told, then what the browser
  // itself says, then English. Every storage touch is wrapped: reading
  // localStorage THROWS in private mode, it does not return null.
  function pickLang() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    if (q) {
      q = String(q).trim().toLowerCase();
      if (q === 'th' || q === 'en') return q;
    }
    var s = null;
    try { s = localStorage.getItem(LANG_KEY); } catch (e) {}
    if (s === 'th' || s === 'en') return s;
    var nav = '';
    try {
      nav = navigator.language ||
            (navigator.languages && navigator.languages.length ? navigator.languages[0] : '') || '';
    } catch (e) {}
    if (/^th\b/i.test(String(nav)) || /^th-/i.test(String(nav))) return 'th';
    return 'en';
  }

  var LANG = pickLang();

  // Missing key falls back to English, then to the key itself. A gap is visible
  // to whoever is developing and is never the word "undefined" on a wall.
  function tIn(lang, key, vars) {
    var tbl = STR[lang] || STR.en;
    var s = tbl[key];
    if (s === undefined || s === null) s = STR.en[key];
    if (s === undefined || s === null) s = key;
    s = String(s);
    if (vars) {
      s = s.replace(/\{(\w+)\}/g, function (m, k) {
        return Object.prototype.hasOwnProperty.call(vars, k) &&
               vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : m;
      });
    }
    return s;
  }
  function t(key, vars) { return tIn(LANG, key, vars); }
