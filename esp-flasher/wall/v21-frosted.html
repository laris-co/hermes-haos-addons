<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Wall — Frosted</title>
<style>
/* ============================================================================
   v21 FROSTED — iOS Control Center over a photograph of the actual sky.

   The background image IS the reading. It changes with the worst live PM2.5
   value on the wall, so a child can see what the air outside looks like before
   reading a single digit.

   ------------------------------------------------------------------ CONTRAST
   Every word on this page sits on a tile of dark frosted glass. Nothing is ever
   typeset directly on the photograph, and no text is ever darker than the
   glass. That reduces the legibility problem to one measurable question: how
   bright is the backdrop *after* the browser blurs and saturates it, and how
   much dark tint must the tile carry so white text still clears 7:1 on it?

   That question was answered by measuring the six JPEGs, not by eye. For each
   image: Gaussian-blur it by the same radius CSS blur(30px) produces at wall
   widths 1280 / 1920 / 2560 / 3840 (a wider wall = less relative blur = the
   worst case), apply the saturate(180%) matrix, composite the tile tint
   rgba(9,11,15,a) over it, add the top sheen, convert to WCAG relative
   luminance and take the MINIMUM contrast against white across every pixel of
   the image. `a` below is the smallest tint alpha where that per-pixel minimum
   still clears 7:1 — so a tile may be dropped anywhere on the frame and hold.

       ground        alpha   white   80%-white
       good           0.71    7.23      5.34
       moderate       0.72    7.14      5.29     <- brightest backdrop of the six
       sensitive      0.65    7.01      5.19
       unhealthy      0.70    7.18      5.31
       verybad        0.58    7.13      5.28
       hazardous      0.35    7.04      5.13     <- darkest; the photo reads through

   Hence two text tiers only: #fff, and rgba(255,255,255,.80). Nothing dimmer
   exists in this file, because 80% white is the dimmest ink that still clears
   AA (>=5.1:1) on all six grounds. The band colours are never used as text on
   glass — they appear only as opaque pills with near-black ink, checked
   separately (worst pair 6.2:1).

   The alphas live in JS, not in CSS rules, because a cross-fade briefly shows
   two photographs at once: during a transition the page applies the MAXIMUM of
   the outgoing and incoming alpha, so the dark-ground alpha is never applied
   over a bright frame even for one animation frame.
   ========================================================================== */

:root{
  --glass-a:.62;                 /* set from JS per ground; see table above */
  --ink:#fff;
  --ink-2:rgba(255,255,255,.80); /* dimmest ink in the file — measured floor */
  --hair:rgba(255,255,255,.30);
  --r:22px;                      /* iOS Control Center module radius */
  --gap:clamp(.6rem,1.15vw,1.05rem);
  --pad:clamp(.85rem,1.5vw,1.35rem);

  --band-good:#4ade80; --band-mod:#fbbf24; --band-usg:#fb923c;
  --band-unh:#f87171;  --band-vun:#b48bff;  --band-haz:#ff4d6d;
  --band:rgba(255,255,255,.72);
  --ink-on-band:#14040a;         /* near-black; >=6.2:1 on every band colour */
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0;height:100%;max-width:100%}
body{
  /* Neutral slate is the floor of the stack. It shows whenever no photograph is
     displayed, and it is what a not-yet-decoded image falls back to — so a band
     change can never flash white. */
  background:linear-gradient(178deg,#161c26 0%,#0d1117 46%,#080b10 100%);
  color:var(--ink);
  /* Latin faces first so English keeps SF Pro, then real Thai faces so a Thai
     glyph never lands on a fallback that misplaces its tone marks. No webfont
     link: this page has to open on a wall with no internet. */
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,
       "Noto Sans Thai","IBM Plex Sans Thai",Sarabun,sans-serif;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}

/* ---------------------------------------------------------------- the ground */
.ground{
  position:fixed;inset:0;z-index:0;
  background-position:center center;background-size:cover;background-repeat:no-repeat;
  opacity:0;transition:opacity 1100ms cubic-bezier(.4,0,.2,1);
}
.ground[data-on="1"]{opacity:1}
/* Purely aesthetic, and it only ever DARKENS — the contrast table above assumed
   no vignette at all, so this layer can only help. */
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(125% 95% at 50% 16%,rgba(0,0,0,0) 34%,rgba(0,0,0,.30) 100%),
    linear-gradient(180deg,rgba(0,0,0,.20) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 60%,rgba(0,0,0,.34) 100%);
}

/* ---------------------------------------------------------------- the glass */
.glass{
  position:relative;
  background:rgba(9,11,15,var(--glass-a));
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border-radius:var(--r);
  box-shadow:
    inset 0 1px 0 0 var(--hair),                 /* the hairline top edge */
    inset 0 0 0 .5px rgba(255,255,255,.10),
    0 16px 40px rgba(0,0,0,.34);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,0) 42%);
}
.glass>*{position:relative}
/* Firefox and anything else without backdrop-filter gets a near-opaque tile
   rather than an unreadable transparent one. Measured the same way: white on
   this fill clears 17:1 over the brightest frame. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(9,11,15,.93)}
  .glass::before{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 42%)}
}

/* ---------------------------------------------------------------- shell */
.cc{
  position:relative;z-index:2;
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;gap:var(--gap);
  padding:clamp(.6rem,1.3vw,1.15rem);
  max-width:2400px;margin:0 auto;
}
.cc[hidden]{display:none}

/* ---------------------------------------------------------------- status bar */
.statusbar{
  display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .7rem;
  padding:.55rem clamp(.7rem,1.2vw,1rem);
  border-radius:calc(var(--r) - 4px);
}
.mark{display:flex;align-items:baseline;gap:.5rem;margin-right:auto}
.mark b{font-size:clamp(.95rem,1.35vw,1.15rem);font-weight:600;letter-spacing:-.015em}
.mark span{font-size:clamp(.7rem,.95vw,.82rem);color:var(--ink-2)}
.pill{
  display:inline-flex;align-items:center;gap:.4rem;
  border-radius:999px;padding:.26rem .6rem;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);
  font-size:clamp(.7rem,.95vw,.82rem);color:var(--ink);
}
.pill em{font-style:normal;color:var(--ink-2)}
.dot{width:.52rem;height:.52rem;border-radius:50%;background:rgba(255,255,255,.55);flex:none}
.pill[data-s="connected"] .dot{background:#4ade80}
.pill[data-s="connecting"] .dot,.pill[data-s="reconnecting"] .dot{background:#fbbf24;animation:blink 1.2s ease-in-out infinite}
.pill[data-s="error"] .dot,.pill[data-s="fatal"] .dot{background:#ff4d6d}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.clock{font-variant-numeric:tabular-nums;font-size:clamp(.72rem,1vw,.86rem);color:var(--ink-2)}
.hintkey{font-size:clamp(.66rem,.9vw,.76rem);color:var(--ink-2)}
kbd{
  font:inherit;font-size:.92em;border-radius:5px;padding:.05em .38em;
  background:rgba(255,255,255,.17);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22);
}
/* Language: one more Control Center segment, the same size as the pills beside
   it. A wall whose job is a reading must not be shouted at by its own chrome,
   so this is the quietest control on the page — the selected half is the only
   thing that carries any weight at all. */
.lang{
  display:inline-flex;gap:.1rem;flex:none;
  padding:.13rem;border-radius:999px;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);
}
.lang button{
  font:inherit;font-size:clamp(.66rem,.9vw,.78rem);font-weight:600;
  border:0;border-radius:999px;padding:.13rem .5rem;cursor:pointer;
  background:transparent;color:var(--ink-2);
}
.lang button[aria-pressed="true"]{background:rgba(255,255,255,.88);color:#101418}
.lang button:focus-visible{outline:2px solid #7cc7ff;outline-offset:2px}

/* ---------------------------------------------------------------- modules */
.modules{
  flex:1;display:grid;gap:var(--gap);
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-auto-rows:minmax(clamp(7rem,15vh,10rem),auto);
  align-content:stretch;
}
/* Two columns doubles the ROW count — the same six modules that made three rows
   at four columns now make six — while each tile becomes about twice as wide
   relative to the screen, so the same cqi figure buys twice the type. Both
   pushed together: at 1024x768 the deck ran 313px past the bottom of the
   screen, and with nothing clipping it that became a real page scrollbar with
   the last row parked below the fold, where nobody standing at a wall will ever
   scroll to it. Rows now share the height they are given instead of each
   claiming a floor, the tiles clip, and the display copy is re-scaled for the
   wider box. The arithmetic cannot overflow after this, at any height. */
@media (max-width:1080px){
  .modules{
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-auto-rows:minmax(0,1fr);
    min-height:0;
  }
  .mod,.tile{overflow:hidden}
}
/* Below 620px this is a phone, not a wall: one column, rows take their natural
   height, and the page is allowed to scroll like any other page. */
@media (max-width:620px){
  .modules{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;min-height:auto}
  .mod,.tile{grid-column:1/-1 !important;grid-row:auto !important;overflow:visible}
}
/* A wall surface should clip a miscalculation, not hide it below the fold. */
@media (min-width:621px){ html,body{overflow:hidden} }
.mod,.tile{
  container-type:inline-size;                 /* readings size off THIS tile */
  display:flex;flex-direction:column;
  padding:var(--pad);
}
.answer{grid-column:span 2;grid-row:span 2}
.tile[data-prom="lead"]{grid-column:span 2;grid-row:span 2}
.tile[data-prom="rest"]{grid-column:span 2;grid-row:span 1}

/* ---------------------------------------------------------------- answer */
.eyebrow{
  font-size:clamp(.68rem,.95vw,.8rem);color:var(--ink-2);
  letter-spacing:.045em;margin-bottom:.35rem;
}
.verdict{
  font-size:clamp(1.5rem,11cqi,3.6rem);line-height:1.04;font-weight:600;
  letter-spacing:-.028em;margin:0 0 .3rem;
}
.because{
  font-size:clamp(.86rem,3.6cqi,1.3rem);line-height:1.4;color:var(--ink);
  margin:0;max-width:34ch;
}
/* Declared HERE, after the two rules it overrides — a media query carries no
   extra specificity, so the same selectors earlier in the file would have lost.
   At two columns this tile is roughly twice as wide relative to the screen, so
   the same cqi figure would draw the sentence at twice the size into a row that
   just halved in height. */
@media (max-width:1080px){
  .verdict{font-size:clamp(1.35rem,5.5cqi,2.6rem)}
  .because{font-size:clamp(.82rem,2.1cqi,1.05rem)}
}
.answer .spacer{flex:1;min-height:.5rem}
.answer-foot{
  display:flex;align-items:center;flex-wrap:wrap;gap:.45rem .6rem;
  padding-top:.6rem;border-top:1px solid rgba(255,255,255,.16);
}
.badge{
  display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:0 .4rem;
  border-radius:999px;padding:.22rem .62rem;font-weight:600;
  font-size:clamp(.72rem,2.6cqi,.95rem);
  background:var(--band);color:var(--ink-on-band);
}
.badge[hidden]{display:none}
/* The label may wrap; the VALUE never may. Bug B is not only about the hero
   number — "163.3" split across two lines reads as 163, or as 1633, anywhere
   it appears. Every place a reading is printed carries its own nowrap. */
.badge .bv{white-space:nowrap;font-variant-numeric:tabular-nums}
.badge[data-neutral="1"]{background:rgba(255,255,255,.86);color:#101418}
.answer-foot .src{font-size:clamp(.68rem,2.3cqi,.84rem);color:var(--ink-2)}

/* ---------------------------------------------------------------- board tile */
.tile-head{display:flex;align-items:center;gap:.55rem;margin-bottom:.15rem}
/* The Control Center "toggle" disc: filled when the board is reporting,
   an empty ring when it is not. */
.disc{
  width:clamp(1.5rem,4.2cqi,2.1rem);height:clamp(1.5rem,4.2cqi,2.1rem);
  border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--band);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.disc i{
  width:38%;height:38%;border-radius:50%;background:var(--ink-on-band);opacity:.85;
}
.tile[data-state="offline"] .disc,
.tile[data-state="waiting"] .disc{
  background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);
}
.tile[data-state="offline"] .disc i,.tile[data-state="waiting"] .disc i{
  background:rgba(255,255,255,.55);width:32%;height:32%;
}
.board{
  font-size:clamp(.9rem,3.3cqi,1.25rem);font-weight:600;letter-spacing:-.01em;
  overflow-wrap:anywhere;
}
.state{
  margin-left:auto;flex:none;border-radius:999px;padding:.2rem .55rem;
  font-size:clamp(.64rem,2.1cqi,.78rem);font-weight:600;white-space:nowrap;
  background:rgba(255,255,255,.15);color:var(--ink);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);
}
.tile[data-state="live"] .state{background:var(--band);color:var(--ink-on-band);box-shadow:none}
/* wrap, so an unusually wide reading pushes the unit onto its own line instead
   of overflowing the tile sideways */
.readrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 .4rem;margin-top:auto;padding-top:.4rem}
/* BUG B GUARD: the reading is sized in cqi — container-inline units of the tile
   that actually holds it — never in vw. A viewport-sized number in a
   grid-sized column is how "163.3" once broke into "163." + "3". nowrap makes
   a mid-digit break impossible even if the sizing were ever wrong again. */
.read{
  font-size:clamp(2rem,24cqi,7.5rem);line-height:.9;font-weight:600;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  white-space:nowrap;color:var(--ink);
}
.tile[data-prom="rest"] .read{font-size:clamp(1.6rem,17cqi,3.2rem)}
.read[data-kind="word"]{
  font-size:clamp(1.4rem,17cqi,3.2rem);letter-spacing:-.02em;
  white-space:normal;overflow-wrap:anywhere;
}
.tile[data-prom="rest"] .read[data-kind="word"]{font-size:clamp(1.25rem,14cqi,2.2rem)}
/* A numeric payload longer than any plausible reading steps down to a size that
   is allowed to wrap — the escape hatch that keeps nowrap from overflowing. */
.read[data-long="1"]{font-size:clamp(1.4rem,12cqi,2.6rem);white-space:normal;overflow-wrap:anywhere}
/* NOTE: there is no text-transform anywhere in this file. CSS uppercasing maps
   "µ" to "M", which turns µg/m³ into MG/M³ — a 1000x unit error produced by a
   styling rule. Units and anything else off the wire print verbatim. */
.unit{font-size:clamp(.78rem,3cqi,1.1rem);color:var(--ink-2);font-weight:500;white-space:nowrap}
.bandline{
  display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .5rem;margin-top:.45rem;
}
.bandline .note{font-size:clamp(.7rem,2.4cqi,.88rem);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:.32rem;margin-top:.55rem}
.chip{
  display:inline-flex;align-items:baseline;gap:.3rem;white-space:nowrap;
  border-radius:9px;padding:.2rem .48rem;
  background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14);
  font-size:clamp(.64rem,2.1cqi,.79rem);color:var(--ink-2);
}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tile-foot{
  display:flex;flex-wrap:wrap;gap:.2rem .6rem;margin-top:.6rem;padding-top:.5rem;
  border-top:1px solid rgba(255,255,255,.16);
  font-size:clamp(.66rem,2.1cqi,.8rem);color:var(--ink-2);
}
.tile-foot .tpc{overflow-wrap:anywhere;opacity:.92}

/* Offline is the ordinary state of two of the three boards. It is drawn as a
   deliberate, fully legible module — not a dimmed one, not an empty one, and
   never a zero. The differentiators are the hollow disc and the hatched edge,
   both of which cost nothing in contrast. */
.tile[data-state="offline"]{
  box-shadow:
    inset 0 1px 0 0 var(--hair),
    inset 0 0 0 1px rgba(255,255,255,.18),
    0 16px 40px rgba(0,0,0,.34);
}
.tile[data-state="offline"] .read{color:var(--ink)}

/* ---------------------------------------------------------------- scale */
.scale{
  display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .5rem;
  padding:.55rem clamp(.7rem,1.2vw,1rem);border-radius:calc(var(--r) - 4px);
}
.scale .cap{font-size:clamp(.66rem,.92vw,.78rem);color:var(--ink-2);margin-right:.25rem}
.sb{
  display:inline-flex;align-items:baseline;gap:.35rem;
  border-radius:8px;padding:.2rem .5rem;
  font-size:clamp(.66rem,.92vw,.79rem);
  background:rgba(255,255,255,.09);
}
.sb i{width:.6rem;height:.6rem;border-radius:3px;background:var(--sb);flex:none;align-self:center}
.sb b{color:var(--ink);font-weight:600}
.sb em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
/* The band the wall is currently claiming fills with its own colour and swaps to
   the near-black ink checked against every band colour (worst pair 6.2:1). */
.sb[data-now="1"]{background:var(--sb)}
.sb[data-now="1"] i{background:var(--ink-on-band);opacity:.5}
.sb[data-now="1"] b,.sb[data-now="1"] em{color:var(--ink-on-band)}
.scale .foot{margin-left:auto;font-size:clamp(.64rem,.88vw,.74rem);color:var(--ink-2)}

/* ---------------------------------------------------------------- notices */
.notices:empty{display:none}
.notices{display:flex;flex-direction:column;gap:.4rem}
.notice{
  padding:.5rem .8rem;border-radius:14px;
  font-size:clamp(.74rem,1vw,.86rem);color:var(--ink);
  background:rgba(9,11,15,var(--glass-a));
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 0 var(--hair),inset 0 0 0 .5px rgba(255,255,255,.12);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .notice{background:rgba(9,11,15,.93)}
}
.notice b{font-weight:600}

/* ---------------------------------------------------------------- calm screen */
.calm{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;
  padding:clamp(1.5rem,6vw,5rem);
  background:linear-gradient(178deg,#161c26,#0b0e13);
}
.calm[hidden]{display:none}
.calm p{
  margin:0;max-width:22ch;text-align:center;color:var(--ink);
  font-size:clamp(1.35rem,4.5vw,3rem);line-height:1.25;font-weight:500;letter-spacing:-.02em;
}
.calm small{
  display:block;margin-top:1.1rem;font-size:clamp(.72rem,1.3vw,.9rem);
  font-weight:400;color:var(--ink-2);letter-spacing:0;
}
.calm small+small{margin-top:.55rem}
/* display:block above beats the UA [hidden] rule, so say it again: a line with
   nothing to say must take no room. */
.calm small[hidden]{display:none}
.eyebrow[hidden],.because[hidden],.state[hidden]{display:none}

/* ---------------------------------------------------------------- settings */
.sheet{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:clamp(1rem,4vw,3rem);background:rgba(4,6,9,.55);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
.sheet[hidden]{display:none}
.sheet .panel{
  width:min(46rem,100%);max-height:88vh;
  background:rgba(16,20,26,.96);border-radius:var(--r);
  box-shadow:inset 0 1px 0 0 var(--hair),0 30px 70px rgba(0,0,0,.55);
  padding:clamp(1rem,2.4vw,1.6rem);
}
.sheet h2{margin:0 0 .2rem;font-size:1.15rem;font-weight:600;letter-spacing:-.015em}
.sheet .lede{margin:0 0 1rem;font-size:.86rem;color:var(--ink-2)}
.form{display:grid;gap:.7rem .9rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));align-items:end}
.f{display:flex;flex-direction:column;gap:.28rem}
.f label{font-size:.74rem;color:var(--ink-2);letter-spacing:.02em}
.f input{
  background:rgba(0,0,0,.45);color:var(--ink);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:.55rem .65rem;font:inherit;font-size:.92rem;width:100%;
}
.f input:focus{outline:2px solid #7cc7ff;outline-offset:1px}
.f-check{flex-direction:row;align-items:center;gap:.5rem}
.f-check input{width:auto}
.f-check label{color:var(--ink)}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;grid-column:1/-1;margin-top:.3rem}
button{
  font:inherit;font-weight:600;cursor:pointer;border-radius:10px;padding:.55rem 1.1rem;
  background:rgba(255,255,255,.92);color:#101418;border:0;
}
button.ghost{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22)}
.sheet .hint{margin:.9rem 0 0;font-size:.78rem;color:var(--ink-2);line-height:1.5}

/* ---------------------------------------------------------------- Thai
   Thai stacks marks above AND below the baseline (สั้/ญู), so the tight Latin
   leading used everywhere else clips them. Every element that can hold Thai is
   lifted to 1.5. The one exception is the numeric reading: it holds digits and
   a decimal point only, and its .9 leading is what makes the hero number work.

   Thai also has no spaces between words, so the browser has no break
   opportunity inside a phrase — a long string would run out of its tile. Thai
   text therefore breaks anywhere; a reading NEVER does, in any language, which
   is the guard that keeps "163.3" from becoming "163." + "3".

   Still no text-transform in this file. Uppercasing does nothing to a Thai
   glyph, but it would turn the µ of µg/m³ into M — a 1000x error from a
   styling rule. */
html[lang="th"]{--thai-lh:1.5}
html[lang="th"] body{line-height:1.6}
html[lang="th"] .verdict,
html[lang="th"] .calm p{line-height:var(--thai-lh);letter-spacing:0;overflow-wrap:break-word}
html[lang="th"] .because,

   of the tile — there are no horizontal scrollbars on this wall to catch it. */

/* ------------------------------------------------------------------ demo ---
   ?demo= and nothing else turns this on. See DEMO MODE in the script.

   The marker is a SAFETY DEVICE, not part of the picture, so it is drawn in one
   fixed pair of colours that never tracks the EPA band. A green DEMO bar under a
   green "Good" wall would borrow the health signal it exists to withdraw. Fixed
   top AND bottom plus a ring around the viewport, so no crop of a photograph of
   this wall can lose it, and sized against the viewport rather than capped in
   rem: on a wall-sized screen a marker that stops growing stops being a marker.

   Nothing here is uppercased by CSS. Every capital is typed as a capital,
   because text-transform maps "µ" to "M" and turns µg/m³ into a 1000x lie. */
.wdemo{
  position:fixed;left:0;right:0;z-index:2147483000;
  display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;
  gap:.3em 1em;text-align:center;
  background:#12100a;color:#ffeec2;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  line-height:1.3;letter-spacing:.12em;
}
.wdemo-top{
  top:0;font-size:clamp(.78rem,2.35vmin,1.6rem);
  padding:clamp(.35rem,1.1vmin,.7rem) clamp(.6rem,2vw,1.4rem)
          calc(clamp(.35rem,1.1vmin,.7rem) + .6rem);
}
.wdemo-bot{
  bottom:0;font-size:clamp(.62rem,1.62vmin,1.1rem);
  padding:calc(clamp(.35rem,1.1vmin,.7rem) + .6rem) clamp(.6rem,2vw,1.4rem)
          clamp(.35rem,1.1vmin,.7rem);
}
/* The caution banding sits inside each bar's own box, reserved in padding, so a
   measured bar height is the whole marker and nothing sticks out unaccounted. */
.wdemo-top::after,.wdemo-bot::before{
  content:"";position:absolute;left:0;right:0;height:.6rem;
  background:repeating-linear-gradient(135deg,#ffb300 0 .8rem,#12100a .8rem 1.6rem);
}
.wdemo-top::after{bottom:0}
.wdemo-bot::before{top:0}
.wdemo b{font-weight:800;font-size:1.6em;letter-spacing:.3em;margin-right:-.3em;color:#ffb300}
/* Thai never takes the wide tracking — it pulls the combining marks apart. */
.wdemo .wd-th{letter-spacing:normal;font-size:1.12em;color:#ffd166}
.wdemo .wd-val{
  border:.14em solid #ffb300;padding:.1em .55em;max-width:100%;
  color:#fff6df;font-weight:700;letter-spacing:.04em;
  white-space:normal;                  /* the bar may wrap … */
}
.wdemo .wd-val .nb{white-space:nowrap} /* … but a number never leaves its unit */
.wdemo-ring{
  position:fixed;inset:0;z-index:2147482999;pointer-events:none;
  border:clamp(3px,.7vmin,10px) solid #ffb300;
}
html[lang="th"] .wdemo{letter-spacing:normal;line-height:1.6}

<body>

<!-- Two ground layers so a band change cross-fades instead of cutting. A layer
     is only faded in once its photograph has actually decoded, so the outgoing
     picture holds until the incoming one is ready — there is no white flash. -->
<div class="ground" id="ground-a" data-on="0"></div>
<div class="ground" id="ground-b" data-on="0"></div>
<div class="vignette"></div>

<div class="cc" id="cc">

  <header class="statusbar glass">
    <div class="mark">
      <b>Air Wall</b>
      <span>Kit4Kids &middot; Chiang Mai</span>
    </div>
    <span class="pill" id="p-fleet"><span class="dot" style="background:rgba(255,255,255,.55)"></span><span id="fleet-text">starting up</span></span>
    <span class="pill" id="p-conn" data-s="connecting"><span class="dot"></span><span id="conn-text">connecting</span></span>
    <span class="clock" id="clock">&nbsp;</span>
    <span class="lang" id="lang" role="group" aria-label="Language">
      <button type="button" data-lang="th" aria-pressed="false">TH</button>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
    </span>
    <span class="hintkey" id="hintkey"></span>
  </header>

  <div class="notices" id="notices"></div>

  <main class="modules" id="modules">
    <section class="mod answer glass" id="answer">
      <p class="eyebrow" id="a-eyebrow">Should we go outside?</p>
      <h1 class="verdict" id="a-verdict">Waiting for the boards</h1>
      <p class="because" id="a-because">This wall is connecting to the air sensors.</p>
      <div class="spacer"></div>
      <div class="answer-foot">
        <span class="badge" id="a-badge" data-neutral="1"><span class="bl">no reading yet</span><span class="bv"></span></span>
        <span class="src" id="a-src"></span>
      </div>
    </section>
  </main>

  <footer class="scale glass" id="scale">
    <span class="cap"><span id="scale-epa"></span> &middot; <span id="scale-unit"></span></span>
    <span id="scale-bands" style="display:contents"></span>
    <span class="foot" id="scale-foot"></span>
  </footer>

</div>

<div class="calm" id="calm" hidden>
  <p id="calm-text">
    <span id="calm-sentence"></span>
    <small id="calm-sub"></small>
    <small id="calm-hint"></small>
  </p>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <h2>Broker settings</h2>
    <p class="lede">Kept in this browser, on this device. Press <kbd>Esc</kbd> to close.</p>
    <form class="form" id="form" autocomplete="off">
      <div class="f"><label for="f-host">Host</label><input id="f-host" spellcheck="false" required></div>
      <div class="f"><label for="f-port">WebSocket port</label><input id="f-port" inputmode="numeric" required></div>
      <div class="f"><label for="f-user">Username</label><input id="f-user" spellcheck="false"></div>
      <div class="f"><label for="f-pass">Passphrase</label><input id="f-pass" type="password" autocomplete="off"></div>
      <div class="f"><label for="f-filter">Topic starts with</label><input id="f-filter" spellcheck="false" placeholder="dbk/"></div>
      <div class="f f-check"><input id="f-tls" type="checkbox"><label for="f-tls">TLS (wss)</label></div>
      <div class="f f-check"><input id="f-remember" type="checkbox"><label for="f-remember">Remember passphrase</label></div>
      <div class="acts">
        <button type="submit">Connect</button>
        <button type="button" class="ghost" id="btn-forget">Forget saved settings</button>
        <button type="button" class="ghost" id="btn-close">Close</button>
      </div>
    </form>
    <p class="hint" id="store-hint"></p>
  </div>
</div>

<!-- Pinned AND hash-locked, carried over from tools/mqtt-dashboard.html. This
     page can hold a broker passphrase, so a hijacked CDN response must not be
     able to execute here; version pinning alone does not stop a CDN serving
     different bytes. If the hash ever fails, the "library did not load" branch
     turns the screen into one calm sentence. -->
<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"
        integrity="sha384-haZiwxTLortiFcYMBEEE1+8ayC+o18YtuwHZv+4WQHoPaLzRjwOV6h7Vva5iLSCZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  'use strict';

  /* ==========================================================================
     LANGUAGE

     Most people who stand in front of this wall read Thai. The Thai below is
     the wording vetted for this project, copied character for character — this
     file invents none of its own, because Thai written by translating the
     English one line at a time reads as machine output to a Thai child.

     A consequence worth stating: where a sentence has no vetted Thai, it is a
     DELIBERATE BLANK in Thai rather than a leftover English paragraph — see
     tx(). The vetted verdict always carries the safety meaning on its own, so
     nothing that matters is lost when a supporting sentence is dropped.

     Diagnostics — the broker notices, the settings sheet, the technical reason
     on a failure curtain — stay English in both languages. They are addressed
     to whoever maintains the wall, not to the room.
     ========================================================================== */
  var LANG_KEY = 'air-wall.lang.v1';

  var STR = {
    en: {
      'verdict.good':      'Go outside. The air is clean.',
      'verdict.moderate':  'Air is okay. Outdoor play is fine.',
      'verdict.sensitive': 'Sensitive groups take care.',
      'verdict.unhealthy': 'Unhealthy — stay indoors.',
      'verdict.verybad':   'Very unhealthy — stay indoors.',

      'band.unhealthy': 'Unhealthy',

      'band.hazardous': 'Hazardous',

      'state.offline':   'offline',
      'state.noreading': 'no reading',
      'state.stale':     'stale',
      'state.waiting':   'waiting',
      'state.live':      'live',

      'conn.connected':   'connected',
      'conn.retrying':    'reconnecting',
      'conn.refused':     'The broker refused this connection.',
      'conn.unreachable': 'Cannot reach the broker.',
      'conn.hint':        'Press s to enter the details.',
