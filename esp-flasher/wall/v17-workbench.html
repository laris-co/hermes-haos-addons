  var DEFAULT_PORT = '1884';            // Mosquitto's MQTT-over-WebSocket listener.
                                        // A browser can only speak WebSocket; the plain
                                        // TCP listener is unreachable from here and fails
                                        // in a way that looks exactly like bad credentials.
  var STORE_KEY = 'air-workbench.conn.v1';
  var MAX_SUBS = 64;                    // hard ceiling; a browser must never firehose a broker
  var DEFAULT_EXPIRE = 900;             // seconds, when discovery declares no expire_after
  var DEFAULT_FILTER = 'dbk/';          // scope to the Kit4Kids boards; blank = everything
  var BOARD_RE = /^dbk\/([^/]+)\//i;
  var FIRST_CONNECT_GRACE = 12000;      // ms before a never-connected link goes to the calm screen

  // US EPA PM2.5 AQI breakpoints, micrograms per cubic metre.
  // One source of truth: the hero band, the plain-language answer and the printed scale.
  //
  // A band carries a KEY, not a sentence. The label, the short label the scale prints, the
  // supporting note and the plain-language verdict are all t('…' + b.key) — so a band cannot
  // be right in one language and stale in the other, and adding a language adds no code here.
  // `wire` is the exception and stays English: it is what an ESPHome board actually publishes
  // on air_quality_level, and the demo must put the same bytes on the bench as the fleet does.
  var BANDS = [
    { key: 'good',      min: 0,     max: 12.0,     r: '0 – 12.0',      v: '--band-good', wire: 'Good' },
    { key: 'moderate',  min: 12.1,  max: 35.4,     r: '12.1 – 35.4',   v: '--band-mod',  wire: 'Moderate' },
    { key: 'sensitive', min: 35.5,  max: 55.4,     r: '35.5 – 55.4',   v: '--band-usg',  wire: 'Sensitive groups' },
    { key: 'unhealthy', min: 55.5,  max: 150.4,    r: '55.5 – 150.4',  v: '--band-unh',  wire: 'Unhealthy' },
    { key: 'verybad',   min: 150.5, max: 250.4,    r: '150.5 – 250.4', v: '--band-vun',  wire: 'Very unhealthy' },
    { key: 'hazardous', min: 250.5, max: Infinity, r: '250.5 +',       v: '--band-haz',  wire: 'Hazardous' }
  ];
  function bandLabel(b) { return b ? t('band.' + b.key) : t('band.none'); }
  function bandShort(b) { return b ? t('band.short.' + b.key) : t('band.none'); }
  function bandNote(b)  { return b ? t('band.note.' + b.key) : ''; }
  function bandVerdict(b) { return b ? t('verdict.' + b.key) : t('verdict.unknown'); }
  var RULER_TOP = 500;   // display cap for the open-ended top band

  // Home Assistant discovery allows abbreviated keys. Expand the ones we read.
  var ALIASES = {
    stat_t: 'state_topic', avty_t: 'availability_topic', uniq_id: 'unique_id',
    unit_of_meas: 'unit_of_measurement', dev_cla: 'device_class', stat_cla: 'state_class',
    exp_aft: 'expire_after', pl_avail: 'payload_available', pl_not_avail: 'payload_not_available',
    dev: 'device', val_tpl: 'value_template', avty: 'availability', ic: 'icon'
  };

  // Every wildcard this page may ever subscribe to, authored here and bounded.
  // Rule D: not one of them contains '#'. A '+' matches exactly one level, so each of
  // these names a finite, known shape — unlike '#', which on this broker is ~109 GB/day.
  var AUTHORED = [
    'homeassistant/+/+/config',      // <component>/<object_id>/config
    'homeassistant/+/+/+/config',    // <component>/<node_id>/<object_id>/config
    'dbk/+/status',                  // board availability (LWT)
    'dbk/+/pm2_5',                   // the headline reading, with or without discovery
    'dbk/+/sensor/+/state'           // everything else ESPHome publishes per board
  ];

  // Fixed row order, so a panel always looks the same and a missing row reads as missing.
  var CH_RANK = {
    'pm2_5': 0, 'pm25': 0, 'pm2.5': 0,
    'pm1_0': 1, 'pm1': 1, 'pm1.0': 1,
    'pm10': 2,
    'air_quality_level': 3,
    'wi-fi_rssi': 4, 'wifi_rssi': 4, 'rssi': 4,
    'uptime': 5
  };

  // ---------------------------------------------------------------- state
  var client = null;
  var entities = new Map();      // discovery topic -> entity
  var byState = new Map();       // state topic     -> Set(discovery topic)
  var byAvail = new Map();       // avail topic     -> Set(discovery topic)
  var byUid = new Map();         // unique_id       -> discovery topic (HA collapses these)
  var boards = new Map();        // board id        -> board
  var subs = new Set();
  var filteredOut = new Set();
  var activeFilter = '';
  var parseErrors = 0;
  var connState = 'idle';
  var demoOn = false;            // set once, from ?demo= in the address, and never unset
  var manualStop = false;
  var everConnected = false;
  var discoveryTimer = null;
  var graceTimer = null;
  var lastUrl = '';

  var $ = function (id) { return document.getElementById(id); };
  var rack = $('rack'), waiting = $('waiting'), notes = $('notes');
  // Which sentence the empty sheet is showing, as a key: the text itself is chosen at
  // render, so this survives a language switch on a sheet that has never seen a board.
  var waitingKey = 'waiting.base';

  // ---------------------------------------------------------------- helpers
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#8b8478';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // The EPA scale starts at 0. Without a lower bound every negative value fell into the
  // first band, so a faulty sensor reporting -999 rendered as a reassuring green "Good".
  function bandIndex(n) {
    if (!Number.isFinite(n) || n < 0) return -1;
    for (var i = 0; i < BANDS.length; i++) if (n <= BANDS[i].max) return i;
    return BANDS.length - 1;
  }
  function bandFor(n) {
    var i = bandIndex(n);
    return i < 0 ? null : BANDS[i];
  }

  // Relative time is composed at RENDER time, from a timestamp, never stored as a string.
  // A cached "5m ago" would survive a language switch and read as the old language forever.
  function ago(ts) {
    if (!ts) return t('time.never');
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 2) return t('time.justnow');
    if (s < 60) return t('time.secondsAgo', { n: s });
    var m = Math.floor(s / 60);
    if (m < 60) return t('time.minutesAgo', { n: m });
    var h = Math.floor(m / 60);
    if (h < 24) {
      return (m % 60) ? t('time.hoursMinutesAgo', { n: h, m: m % 60 }) : t('time.hoursAgo', { n: h });
    }
    return t('time.daysAgo', { n: Math.floor(h / 24) });
  }

  // A payload may be "0", "0.0", "unknown", "unavailable" or empty. Never print NaN.
  // An empty payload carries no text of its own: the words for "no value" are chosen when
  // the cell is drawn, by valText(), so the parse survives a language switch untouched.
  function parseValue(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (s === '') return { kind: 'empty', text: '' };
    if (/^(unknown|unavailable|none|null|nan|n\/a)$/i.test(s)) {
      return { kind: 'unknown', text: s.toLowerCase() };
    }
    var n = Number(s);
    if (!Number.isFinite(n)) return { kind: 'text', text: s };
    // The EPA method truncates the concentration to one decimal BEFORE applying breakpoints.
    // Truncate ONCE, here, and use that one value for both the printed number and the band —
    // otherwise the panel prints 35.4 while calling it "Unhealthy for sensitive groups" and
    // the scale directly beneath it says 35.4 is Moderate. Truncate, never round: rounding
    // 35.44 up to 35.5 would invent a severity the sensor did not report.
    var n1 = Math.trunc(n * 10) / 10;
    var text;
    if (/^[+-]?\d+(\.\d)?$/.test(s)) {
      text = s.replace(/^\+/, '');            // keep the device's own precision: "0", "0.0"
    } else {
      text = n1.toFixed(1);                   // cap runaway precision AT the classified value
    }
    return { kind: 'number', n: n, n1: n1, text: text };
  }

  // The only place a parsed value becomes words. A number, a text payload and an "unknown"
  // payload are all wire text and print verbatim in both languages; only the absence of a
  // payload is this sheet's own word, and that one is translated.
  function valText(v) {
    if (!v) return '';
    return v.kind === 'empty' ? t('val.noValue') : v.text;
  }

  // Rule C: identity is the board id in the topic, never the discovery "name".
  function boardFromTopic(topic) {
    var m = BOARD_RE.exec(topic || '');
    return m ? m[1] : null;
  }

  // dbk/DBK-002/sensor/pm1_0/state -> pm1_0 ;  dbk/DBK-002/pm2_5 -> pm2_5
  function chKeyFromTopic(topic) {
    var p = String(topic).split('/');
    var last = p[p.length - 1];
    if (last === 'state' && p.length >= 2) last = p[p.length - 2];
    return last || String(topic);
  }

  function isPmKey(k) { return /^pm ?2[._]?5$/i.test(String(k)); }
  function isPmCh(ch) {
    return ch.deviceClass === 'pm25' || isPmKey(ch.key) || /pm ?2\.?5/i.test(ch.name || '');
  }

  // The board publishes its OWN summary word on air_quality_level, computed from its own
  // thresholds in sim/dbk-sim.yaml — not from the EPA's. The two disagree: this sheet has
  // printed a bold `Good` three rows under `PM2.5 163.3` and beside `Very unhealthy`. On a
  // children's wall in a smoke event that is the wrong thing to leave unqualified, so the
  // value is tagged as the board's opinion and greyed rather than shown as a measurement.
  // The EPA band on this sheet is computed from PM2.5, and from nothing else.
  function isBoardOpinion(ch) {
    return /air[_ ]?quality[_ ]?level/i.test(ch.key || '') ||
           /air[_ ]?quality[_ ]?level/i.test(ch.name || '');
  }

  var storeWorks = true;
  // Two different failures used to land in one catch: a browser that blocks storage, and a
  // corrupt stored value. The second was misreported as the first, and the bad entry left in
  // place to fail again on every load.
  function loadStore() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); }
    catch (e) { storeWorks = false; return null; }
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (e) {
      try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
      return null;
    }
  }
  function saveStore(v) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; }
    catch (e) { storeWorks = false; return false; }
  }
  function clearStore() {
    try { localStorage.removeItem(STORE_KEY); return true; } catch (e) { return false; }
  }

  // ---------------------------------------------------------------- notes
  // A note is stored as a KEY and its variables, never as finished HTML. Storing the
  // sentence would freeze the language it was raised in: a wall that had been up for an
  // hour would switch to Thai and keep an English warning about a refused subscription.
  // The variables are the escaped wire text; the template around them is authored here.
  var noteState = new Map();

  function drawNote(id) {
    var s = noteState.get(id);
    if (!s) return;
    var el = document.querySelector('.note[data-id="' + id + '"]');
    if (!el) {
      el = document.createElement('div');
      el.className = 'note';
      el.setAttribute('data-id', id);
      notes.appendChild(el);
    }
    el.setAttribute('data-l', s.level);
    el.innerHTML = t(s.key, s.vars);
  }
  function setNote(id, level, key, vars) {
    noteState.set(id, { level: level, key: key, vars: vars || null });
    drawNote(id);
  }
  function clearNote(id) {
    noteState.delete(id);
    var el = document.querySelector('.note[data-id="' + id + '"]');
    if (el) el.remove();
  }
  function redrawNotes() { noteState.forEach(function (s, id) { drawNote(id); }); }

  // ---------------------------------------------------------------- calm screen
  // "On failure the whole screen becomes one calm sentence saying what to do."
  // The curtain remembers WHICH failure it is showing, not the sentence it showed, so a
  // language switch behind a failure curtain redraws the curtain instead of stranding it.
  var calmState = null;
  function calm(parts) {
    calmState = parts;
    drawCalm();
    $('calm').hidden = false;
  }
  // A variable may be a plain value (a URL, a library message — printed as it is) or the
  // marker {key:'…'}, which is resolved at draw time. Without the marker, a reason this
  // sheet DOES have words for would freeze in the language the failure happened in.
  function resolveVars(vars) {
    if (!vars) return null;
    var out = {};
    Object.keys(vars).forEach(function (k) {
      var v = vars[k];
      out[k] = (v && typeof v === 'object' && typeof v.key === 'string') ? t(v.key) : v;
    });
    return out;
  }
  function drawCalm() {
    if (!calmState) return;
    var out = [];
    for (var i = 0; i < calmState.length; i++) {
      out.push(t(calmState[i][0], resolveVars(calmState[i][1])));
    }
    $('calm-text').textContent = out.join(' ');
  }
  function uncalm() { calmState = null; $('calm').hidden = true; }

  // ---------------------------------------------------------------- telemetry
  var CONN_KEY = {
    idle: 'conn.idle', connecting: 'conn.connecting', connected: 'conn.connected',
    reconnecting: 'conn.retrying', closed: 'conn.closed', error: 'conn.error',
    fatal: 'conn.fatal'
  };
  var connDetailKey = '';
  function setConn(state, detailKey) {
    connState = state;
    connDetailKey = detailKey || '';
    var el = $('t-conn');
    el.setAttribute('data-s', state);
    el.textContent = connDetailKey ? t(connDetailKey) : t(CONN_KEY[state] || 'conn.idle');
  }

  // The broker cell is either an address (wire-ish text, printed as typed) or the demo's
  // own word. Remembering which lets the cell follow a language switch without a reload.
  var hostKey = '';
  var hostText = '—';
  function setHost(text, key) {
    hostKey = key || '';
    if (!hostKey) hostText = text;
    $('t-host').textContent = hostKey ? t(hostKey) : hostText;
  }

  // The settings hint is a sentence this sheet chose, so it is a key too.
  var hintKey = '';
  function setHint(key) {
    hintKey = key || '';
    $('set-hint').textContent = hintKey ? t(hintKey) : '';
  }
  // "Reporting" means a board is putting a usable PM2.5 reading on this sheet — the SAME
  // test renderVerdict() uses to pick `worst`. Counting availability instead once printed
  // "3 of 3 reporting" directly above "no board is reporting a reading right now": three
  // boards were online and publishing junk. Availability is a separate fact, and it is
  // already drawn on every station module; the instrument panel counts readings.
  function refreshCounts() {
    var live = 0, online = 0, chans = 0;
    boards.forEach(function (b) {
      var avail = availabilityOfBoard(b);
      if (avail === 'online') online++;
      var pm = pmChannel(b);
      if (pm && chState(b, pm, avail) === 'live' && pm.value && pm.value.kind === 'number') live++;
      chans += b.channels.size;
    });
    $('t-boards').textContent = t('tele.reporting', { n: live, total: boards.size });
    $('t-online').textContent = t('tele.onlineCount', { n: online, total: boards.size });
    $('t-chans').textContent = String(chans);
    $('t-subs').textContent = String(subs.size);
  }

  // ---------------------------------------------------------------- subscribe
  // subRaw is the ONLY place that talks to the broker, and it is private to this file's own
  // authored topics. Everything that came off the wire goes through sub(), which refuses
  // wildcards. Keeping the two apart is the whole point.
  function subRaw(topic) {
    if (!topic || typeof topic !== 'string') return false;
    // demoOn is the only way this passes without a client, and in demo mode there IS no
    // client: the pattern is recorded so the instrument panel counts what a live sheet would
    // have subscribed to, and not one byte is sent anywhere.
    if (!client && !demoOn) return false;
    if (subs.has(topic)) return true;
    if (subs.size >= MAX_SUBS) {
      setNote('subcap', 'warn', 'note.subcap', { max: MAX_SUBS });
      return false;
    }
    subs.add(topic);
    refreshCounts();
    if (!client) return true;   // demo mode: recorded, never sent
    client.subscribe(topic, { qos: 0 }, function (err) {
      if (err) {
        subs.delete(topic);
        refreshCounts();
        setNote('suberr', 'bad', 'note.suberr',
          { topic: esc(topic), err: esc(err.message || String(err)) });
      }
    });
    return true;
  }

  // Does an authored pattern already deliver this exact topic? If so there is nothing to add,
  // and adding it anyway would double-deliver every message and inflate the counter.
  function patternCovers(pattern, topic) {
    // Not `t`: that name belongs to the translation function for the whole file now.
    var p = pattern.split('/'), q = String(topic).split('/');
    if (p.length !== q.length) return false;
    for (var i = 0; i < p.length; i++) if (p[i] !== '+' && p[i] !== q[i]) return false;
    return true;
  }
  function alreadyCovered(topic) {
    for (var i = 0; i < AUTHORED.length; i++) {
      if (subs.has(AUTHORED[i]) && patternCovers(AUTHORED[i], topic)) return true;
    }
    return false;
  }

  function sub(topic) {
    if (!topic || typeof topic !== 'string') return false;
    if (!client && !demoOn) return false;
    // Absolute guard. Rule D and its twin: '+' is every bit as dangerous as '#' when it came
    // off the wire — a retained config declaring state_topic "+/+/+" delivered ten out of ten
    // unrelated fleet topics in testing. A topic from a payload must name one exact topic.
    if (/[#+]/.test(topic)) {
      setNote('wildcard', 'warn', 'note.wildcard', { topic: esc(topic) });
      return false;
    }
    if (alreadyCovered(topic)) return true;
    return subRaw(topic);
  }

  function unsub(topic) {
    if (!topic || !subs.has(topic)) return;
    if (byState.has(topic) || byAvail.has(topic)) return;   // still wanted by the other index
    subs.delete(topic);
    refreshCounts();
    if (client) { try { client.unsubscribe(topic); } catch (e) {} }
  }

  // ---------------------------------------------------------------- boards & channels
  function getBoard(id) {
    var b = boards.get(id);
    if (!b) {
      b = { id: id, status: null, statusAt: 0, channels: new Map(), panel: null, seq: boards.size };
      boards.set(id, b);
    }
    return b;
  }

  function getChannel(boardId, topic) {
    var b = getBoard(boardId);
    var ch = b.channels.get(topic);
    if (!ch) {
      ch = {
        topic: topic, key: chKeyFromTopic(topic), name: '', unit: '', deviceClass: '',
        expire: DEFAULT_EXPIRE, discTopic: '', ent: null,
        raw: undefined, value: null, at: 0, row: null
      };
      b.channels.set(topic, ch);
    }
    return ch;
  }

  function chRank(ch) {
    var r = CH_RANK[String(ch.key).toLowerCase()];
    return typeof r === 'number' ? r : 50;
  }
  function sortedChannels(b) {
    return Array.from(b.channels.values()).sort(function (x, y) {
      return chRank(x) - chRank(y) ||
        String(x.key).localeCompare(String(y.key)) ||
        x.topic.localeCompare(y.topic);
    });
  }
  function pmChannel(b) {
    var list = sortedChannels(b);
    for (var i = 0; i < list.length; i++) if (isPmCh(list[i])) return list[i];
    return null;
  }

  // ---------------------------------------------------------------- discovery
  function expand(cfg) {
    var out = {};
    Object.keys(cfg).forEach(function (k) { out[ALIASES[k] || k] = cfg[k]; });
    // "~" is a base-topic abbreviation: "~/state" and "prefix/~" expand against it.
    var base = out['~'];
    if (typeof base === 'string' && base) {
      ['state_topic', 'availability_topic'].forEach(function (k) {
        var v = out[k];
        if (typeof v !== 'string') return;
        if (v.charAt(0) === '~') out[k] = base + v.slice(1);
        else if (v.charAt(v.length - 1) === '~') out[k] = v.slice(0, -1) + base;
      });
    }
    if (!out.availability_topic && Array.isArray(out.availability) && out.availability.length) {
      var a = out.availability[0];
      if (a && typeof a.topic === 'string') {
        out.availability_topic = a.topic;
        if (a.payload_available) out.payload_available = a.payload_available;
        if (a.payload_not_available) out.payload_not_available = a.payload_not_available;
      }
    }
    return out;
  }

  function index(map, key, dtopic) {
    if (!key) return;
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(dtopic);
  }

  // Without unindex a re-published config left the entity indexed under its OLD state topic,
  // so a row footed "dbk/DBK-999/pm2_5" happily displayed a reading that arrived on the
  // abandoned dbk/DBK-001/pm2_5 — one board's number under another board's name.
  function unindex(map, key, dtopic) {
    if (!key || !map.has(key)) return;
    var set = map.get(key);
    set.delete(dtopic);
    if (set.size === 0) { map.delete(key); unsub(key); }
  }

  function detachChannel(ent) {
    if (!ent || !ent.board || !ent.stateTopic) return;
    var b = boards.get(ent.board);
    if (!b) return;
    var ch = b.channels.get(ent.stateTopic);
    if (!ch || ch.ent !== ent) return;
    ch.ent = null; ch.discTopic = ''; ch.name = ''; ch.unit = ''; ch.deviceClass = '';
    ch.expire = DEFAULT_EXPIRE;
  }

  function removeEntity(dtopic) {
    var gone = entities.get(dtopic);
    if (!gone) return false;
    detachChannel(gone);
    entities.delete(dtopic);
    if (gone.uid && byUid.get(gone.uid) === dtopic) byUid.delete(gone.uid);
    unindex(byState, gone.stateTopic, dtopic);
    unindex(byAvail, gone.availTopic, dtopic);
    refreshCounts();
    return true;
  }

  function matchesFilter(topic) {
    return !activeFilter || String(topic).indexOf(activeFilter) === 0;
  }

  // English needs a singular and a plural; Thai needs neither and uses the same sentence for
  // both. Picking the key here rather than gluing an "s" on at render keeps that difference
  // inside the string table, where a translator can see it.
  function noteFilter() {
    if (!activeFilter || filteredOut.size === 0) { clearNote('filter'); return; }
    setNote('filter', 'info', filteredOut.size === 1 ? 'note.filter1' : 'note.filter',
      { n: filteredOut.size, f: esc(activeFilter) });
  }

  function onDiscovery(dtopic, text) {
    // An empty retained payload is HA's "delete this entity".
    if (text.trim() === '') {
      filteredOut.delete(dtopic);
      if (removeEntity(dtopic)) layout();
      noteFilter();
      return;
    }

    var cfg;
    try {
      cfg = JSON.parse(text);
    } catch (e) {
      parseErrors++;                // one bad retained message must not kill the page
      setNote('parse', 'warn', parseErrors === 1 ? 'note.parse1' : 'note.parse',
        { n: parseErrors, topic: esc(dtopic) });
      return;
    }
    if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) { parseErrors++; return; }

    cfg = expand(cfg);
    if (typeof cfg.state_topic !== 'string' || !cfg.state_topic) return;

    // Scope. Anything outside the filter is dropped BEFORE it takes a row, a subscription or a
    // slot under MAX_SUBS — and it is counted, so the page can say so rather than look empty.
    if (!matchesFilter(cfg.state_topic)) {
      filteredOut.add(dtopic);
      if (removeEntity(dtopic)) layout();
      noteFilter();
      return;
    }
    filteredOut.delete(dtopic);
    noteFilter();

    var parts = dtopic.split('/');
    var dev = cfg.device && typeof cfg.device === 'object' ? cfg.device : null;
    var devName = dev && typeof dev.name === 'string' ? dev.name : '';
    var measure = typeof cfg.name === 'string' && cfg.name ? cfg.name : (parts[2] || 'sensor');
    var expire = Number(cfg.expire_after);
    var uid = typeof cfg.unique_id === 'string' && cfg.unique_id ? cfg.unique_id : '';
    var board = boardFromTopic(cfg.state_topic);
    var newAvail = typeof cfg.availability_topic === 'string' ? cfg.availability_topic : '';

    // HA collapses two discovery topics carrying one unique_id into a single entity; keyed on
    // the discovery topic alone this page drew the same sensor twice. Newest config wins.
    if (uid && byUid.has(uid) && byUid.get(uid) !== dtopic) removeEntity(byUid.get(uid));

    var ent = entities.get(dtopic) ||
      { key: dtopic, value: null, at: 0, availRaw: null, availAt: 0 };

    // Drop the OLD index entries before writing the new ones, or the entity stays reachable
    // from a topic it no longer claims.
    if (ent.stateTopic && ent.stateTopic !== cfg.state_topic) {
      detachChannel(ent);
      unindex(byState, ent.stateTopic, dtopic);
    }
    if (ent.availTopic && ent.availTopic !== newAvail) {
      unindex(byAvail, ent.availTopic, dtopic);
      ent.availRaw = null; ent.availAt = 0;
    }
    if (ent.uid && ent.uid !== uid && byUid.get(ent.uid) === dtopic) byUid.delete(ent.uid);

    // Rule C. cfg.name is "PM2.5" on every board — useful as a ROW label, useless as identity.
    // The board id parsed out of state_topic is the identity, and it names the panel.
    ent.measure = measure;
    ent.devName = devName;
    ent.uid = uid;
    ent.stateTopic = cfg.state_topic;
    ent.availTopic = newAvail;
    ent.unit = typeof cfg.unit_of_measurement === 'string' ? cfg.unit_of_measurement : '';
    ent.deviceClass = typeof cfg.device_class === 'string' ? cfg.device_class : '';
    ent.expire = Number.isFinite(expire) && expire > 0 ? expire : DEFAULT_EXPIRE;
    ent.pAvail = typeof cfg.payload_available === 'string' ? cfg.payload_available : 'online';
    ent.pNot = typeof cfg.payload_not_available === 'string' ? cfg.payload_not_available : 'offline';
    ent.templated = !!cfg.value_template;
    ent.board = board;

    // A sensor this page cannot listen to must never occupy a row. sub() returns false on both
    // the wildcard refusal and the MAX_SUBS ceiling; ignoring it left a permanent row stuck
    // waiting for a topic no data will ever arrive on.
    if (!sub(ent.stateTopic)) {
      if (removeEntity(dtopic)) layout();
      return;
    }

    entities.set(dtopic, ent);
    if (uid) byUid.set(uid, dtopic);
    index(byState, ent.stateTopic, dtopic);
    if (ent.availTopic) { index(byAvail, ent.availTopic, dtopic); sub(ent.availTopic); }

    // Attach the described metadata to the channel this entity speaks for. Boards with no
    // parsable id in state_topic are still shown, under the literal topic prefix, rather than
    // being silently dropped: an unlabelled instrument beats a missing one.
    var bid = board || (ent.stateTopic.split('/')[0] || 'unknown');
    var ch = getChannel(bid, ent.stateTopic);
    ch.ent = ent;
    ch.name = measure;
    ch.unit = ent.unit;
    ch.deviceClass = ent.deviceClass;
    ch.expire = ent.expire;
    ch.discTopic = dtopic;

    clearNote('nodisc');
    refreshCounts();
    layout();
  }

  // ---------------------------------------------------------------- messages
  function onMessage(topic, payload) {
    var text;
    try { text = new TextDecoder('utf-8').decode(payload); }
    catch (e) { text = String(payload); }

    if (/^homeassistant\/.+\/config$/.test(topic)) {
      try { onDiscovery(topic, text); }
      catch (e) {
        parseErrors++;
        setNote('parse', 'warn', 'note.parseApply', { err: esc(e.message || '') });
      }
      return;
    }

    var now = Date.now();
    var dirty = false;

    // Board availability (LWT), whether or not discovery declared an availability_topic.
    var b = /^dbk\/([^/]+)\/status$/i.exec(topic);
    if (b) {
      var brd = getBoard(b[1]);
      brd.status = text.trim();
      brd.statusAt = now;
      dirty = true;
    }

    // Discovery-described entities keep their own copy, for availability + expiry semantics,
    // and push it onto the channel they speak for. Doing this here rather than only in the
    // dbk/ branch below is what keeps a described sensor living outside the dbk namespace
    // from sitting on the bench reading "not published" forever.
    if (byState.has(topic)) {
      byState.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.raw = text; e.value = parseValue(text); e.at = now;
        var bid = e.board || (String(e.stateTopic).split('/')[0] || 'unknown');
        var c = getChannel(bid, e.stateTopic);
        c.raw = text; c.value = e.value; c.at = now;
        dirty = true;
      });
    }
    if (byAvail.has(topic)) {
      byAvail.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.availRaw = text.trim(); e.availAt = now;
      });
      dirty = true;
    }

    // Any dbk topic that is not the status topic is a channel on that board — described by
    // discovery or not. This is the workbench part: the raw material is on the bench too.
    var m = /^dbk\/([^/]+)\/(.+)$/i.exec(topic);
    if (m && !/^status$/i.test(m[2])) {
      var ch = getChannel(m[1], topic);
      ch.raw = text;
      ch.value = parseValue(text);
      ch.at = now;
      dirty = true;
    }

    if (dirty) layout();
  }

  // ---------------------------------------------------------------- state
  function availabilityOfBoard(b) {
    if (b.status !== null) {
      if (b.status === 'offline') return 'offline';
      if (b.status === 'online') return 'online';
    }
    // Fall back to any entity that declared its own availability topic.
    var verdict = 'unknown';
    b.channels.forEach(function (ch) {
      var e = ch.ent;
      if (!e || !e.availTopic || e.availRaw === null) return;
      if (e.availRaw === e.pNot) verdict = 'offline';
      else if (e.availRaw === e.pAvail && verdict !== 'offline') verdict = 'online';
    });
    return verdict;
  }

  function chState(b, ch, avail) {
    if (avail === 'offline') return 'offline';
    if (!ch.at || !ch.value) return 'waiting';
    if (ch.value.kind === 'unknown' || ch.value.kind === 'empty') return 'unknown';
    // A concentration cannot be negative. Checked BEFORE stale and before live so a broken
    // sensor is never dressed up as a reading — least of all as a green one. PM only: -3.2 is
    // a perfectly good temperature, and a negative dBm is the only kind there is.
    if (ch.value.kind === 'number' && ch.value.n1 < 0 && isPmCh(ch)) return 'fault';
    if ((Date.now() - ch.at) / 1000 > ch.expire) return 'stale';
    return 'live';
  }

  // ---------------------------------------------------------------- panel build
  function buildPanel(b) {
    var root = document.createElement('article');
    root.className = 'board';
    root.innerHTML =
      '<header class="b-head">' +
        '<h2 class="b-id"></h2>' +
        '<span class="b-state"></span>' +
        '<span class="b-heard"></span>' +
      '</header>' +
      '<div class="b-hero">' +
        '<div class="hero-line"><span class="hero-num"></span><span class="hero-unit"></span></div>' +
        '<div class="hero-band"></div>' +
        '<div class="hero-sub"></div>' +
      '</div>' +
      '<p class="b-answer"></p>' +
      '<table class="chan">' +
        '<caption></caption>' +
        '<colgroup><col class="c-name"><col class="c-val"><col class="c-unit"><col class="c-age"></colgroup>' +
        '<thead><tr>' +
          '<th scope="col" data-i18n="th.measure"></th>' +
          '<th scope="col" style="text-align:right" data-i18n="th.value"></th>' +
          '<th scope="col" data-i18n="th.unit"></th>' +
          '<th scope="col" data-i18n="th.age"></th>' +
        '</tr></thead>' +
        '<tbody class="grp-avail"></tbody>' +
        '<tbody class="grp-chan"></tbody>' +
      '</table>' +
      '<dl class="b-foot"></dl>';
    var p = {
      root: root,
      id: root.querySelector('.b-id'),
      state: root.querySelector('.b-state'),
      heard: root.querySelector('.b-heard'),
      num: root.querySelector('.hero-num'),
      unit: root.querySelector('.hero-unit'),
      band: root.querySelector('.hero-band'),
      sub: root.querySelector('.hero-sub'),
      answer: root.querySelector('.b-answer'),
      caption: root.querySelector('caption'),
      avail: root.querySelector('tbody.grp-avail'),
      body: root.querySelector('tbody.grp-chan'),
      foot: root.querySelector('.b-foot')
    };
    b.panel = p;
    // The column headings are the only static words inside a panel, so they are marked up
    // the same way the rest of the sheet is and filled from the same pass. A panel built
    // after a language switch is therefore already in the right language, and a panel built
    // before one is caught by the next applyStatic().
    applyStatic(root);
    rack.appendChild(root);
    return p;
  }

  function buildRow(ch) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<th scope="row">' +
        '<span class="ch-name"></span>' +
        '<span class="ch-topic mono"></span>' +
        '<span class="ch-disc mono"></span>' +
      '</th>' +
      '<td class="ch-val"><span class="v-tag"></span><span class="v-num"></span></td>' +
      '<td class="ch-unit"></td>' +
      '<td class="ch-age"></td>';
    ch.row = {
      tr: tr,
      name: tr.querySelector('.ch-name'),
      topic: tr.querySelector('.ch-topic'),
      disc: tr.querySelector('.ch-disc'),
      val: tr.querySelector('.ch-val'),
      tag: tr.querySelector('.v-tag'),
      num: tr.querySelector('.v-num'),
      unit: tr.querySelector('.ch-unit'),
      age: tr.querySelector('.ch-age')
    };
    return ch.row;
  }

  function fact(dl, term, value) {
    var d = document.createElement('div');
    var dt = document.createElement('dt');
    var dd = document.createElement('dd');
    dt.textContent = term;
    dd.textContent = value;
    d.appendChild(dt); d.appendChild(dd); dl.appendChild(d);
  }

  // ---------------------------------------------------------------- render
  function renderRow(b, ch, avail) {
    var r = ch.row || buildRow(ch);
    var st = chState(b, ch, avail);

    // Everything below is passed through verbatim. cfg.name and the unit came off the wire and
    // are never case-transformed anywhere in this file — that is Rule A, and it is why µg/m³
    // still reads as µg/m³ here rather than as a 1000x error.
    r.name.textContent = ch.name || ch.key;
    r.topic.textContent = ch.topic;
    r.disc.textContent = ch.discTopic || '';
    r.disc.hidden = !ch.discTopic;

    // The TAG is a word this sheet chose, so it is translated. The data-tag attribute it
    // sets is NOT: that attribute is what the stylesheet colours on, and colouring the page
    // by a translated string would leave every tag uncoloured in Thai.
    var tag = '', tagKey = '', cur = '1', txt;
    if (!ch.at || !ch.value) {
      txt = t('val.notPublished');
      cur = 'none';
    } else if (st === 'offline') {
      txt = valText(ch.value);
      tag = 'LAST'; tagKey = 'tag.last';
      cur = '0';
    } else if (st === 'stale') {
      txt = valText(ch.value);
      tag = 'STALE'; tagKey = 'tag.stale';
      cur = '0';
    } else if (st === 'fault') {
      txt = valText(ch.value);
      tag = 'FAULT'; tagKey = 'tag.fault';
    } else if (isBoardOpinion(ch)) {
      txt = valText(ch.value);
      tag = 'BOARD'; tagKey = 'tag.board';
    } else {
      txt = valText(ch.value);
    }
    r.num.textContent = txt;
    r.tag.textContent = tagKey ? t(tagKey) : '';
    r.tag.hidden = !tag;
    r.val.setAttribute('data-cur', cur);
    r.val.setAttribute('data-tag', tag || 'NONE');

    // A unit is printed only where Home Assistant published one. Nothing is guessed from a
    // topic name: an invented unit is an invented measurement. The unit itself is wire text
    // and is never translated — only the admission that there isn't one.
    r.unit.textContent = ch.unit || t('unit.notDeclared');
    r.unit.setAttribute('data-declared', ch.unit ? '1' : '0');

    r.age.textContent = ago(ch.at);
    return r.tr;
  }

  function renderPanel(b) {
    var p = b.panel || buildPanel(b);
    var avail = availabilityOfBoard(b);
    var pm = pmChannel(b);
    var pmState = pm ? chState(b, pm, avail) : (avail === 'offline' ? 'offline' : 'waiting');
    var band = null;
    if (pm && pmState === 'live' && pm.value && pm.value.kind === 'number') band = bandFor(pm.value.n1);

    p.root.setAttribute('data-state', avail === 'offline' ? 'offline' : pmState);
    p.root.style.setProperty('--band',
      band ? css(band.v) : (avail === 'offline' ? css('--rule-2') : css('--dim')));

    // The board id is wire-derived and prints as it arrived, in either language.
    p.id.textContent = b.id;
    p.state.textContent =
      avail === 'offline' ? t('badge.offline') :
      avail === 'online' ? t('badge.online') : t('badge.unknown');

    var heardAt = b.statusAt;
    b.channels.forEach(function (ch) { if (ch.at > heardAt) heardAt = ch.at; });
    p.heard.textContent = heardAt ? t('board.heard', { ago: ago(heardAt) }) : t('board.never');

    // ---- the hero instrument: never a number for something that has not published ----
    var longish = false;
    if (avail === 'offline') {
      p.num.textContent = t('state.offline');
      p.num.setAttribute('data-kind', 'word');
      p.unit.textContent = '';
      var lastBit = pm && pm.value && pm.value.kind === 'number'
        ? t('hero.lastValue', {
            v: pm.value.text + (pm.unit ? ' ' + pm.unit : ''), ago: ago(pm.at) })
        : t('hero.neverRecorded');
      p.band.textContent = t('hero.noCurrent');
      p.band.setAttribute('data-haz', '0');
      p.sub.textContent = lastBit;
      p.answer.textContent = t('answer.offline');
    } else if (!pm) {
      p.num.textContent = '—';
      p.num.setAttribute('data-kind', 'word');
      p.unit.textContent = '';
      p.band.textContent = t('hero.noPm');
      p.band.setAttribute('data-haz', '0');
      p.sub.textContent = t('hero.noPmSub');
      p.answer.textContent = t('answer.noPm');
    } else if (pmState === 'waiting') {
      p.num.textContent = '—';
      p.num.setAttribute('data-kind', 'word');
      p.unit.textContent = '';
      p.band.textContent = t('hero.waitBand');
      p.band.setAttribute('data-haz', '0');
      p.sub.textContent = t('hero.waitSub');
      p.answer.textContent = t('answer.waiting');
    } else if (pmState === 'unknown') {
      p.num.textContent = valText(pm.value);
      p.num.setAttribute('data-kind', 'word');
      p.unit.textContent = '';
      p.band.textContent = t('hero.unknownBand');
      p.band.setAttribute('data-haz', '0');
      p.sub.textContent = t('hero.payloadOn', { topic: pm.topic });
      p.answer.textContent = t('verdict.unknown');
    } else if (pmState === 'fault') {
      p.num.textContent = valText(pm.value);
      p.num.setAttribute('data-kind', 'num');
      longish = true;
      p.unit.textContent = pm.unit;
      p.band.textContent = t('state.fault');
      p.band.setAttribute('data-haz', '0');
      p.sub.textContent = t('hero.faultSub');
      p.answer.textContent = t('answer.fault');
    } else if (pmState === 'stale') {
      p.num.textContent = valText(pm.value);
      p.num.setAttribute('data-kind', 'num');
      longish = true;
      p.unit.textContent = pm.unit;
      p.band.textContent = t('hero.staleBand');
      p.band.setAttribute('data-haz', '0');
      p.sub.textContent = t('hero.staleSub', { s: pm.expire, ago: ago(pm.at) });
      p.answer.textContent = t('answer.stale');
    } else {
      p.num.textContent = valText(pm.value);
      p.num.setAttribute('data-kind', 'num');
      longish = true;
      p.unit.textContent = pm.unit;
      p.band.textContent = band ? bandLabel(band) : t('state.live');
      // Keyed off the band's identity, not off its printed label: comparing against the
      // English word "Hazardous" would silently stop reversing the top band out in Thai.
      p.band.setAttribute('data-haz', band && band.key === 'hazardous' ? '1' : '0');
      p.sub.textContent = band
        ? t('hero.bandSub', { note: bandNote(band), r: band.r })
        : t('hero.liveSub');
      p.answer.textContent = band ? bandVerdict(band) : t('answer.noBand');
    }
    // Bug B's escape hatch: digits never break, so an absurd payload steps down to a scale
    // that may wrap rather than overflowing the panel.
    p.num.setAttribute('data-long', (longish && p.num.textContent.length > 7) ? '1' : '0');

    // ---- availability group ----
    p.avail.textContent = '';
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<th scope="row"><span class="ch-name"></span><span class="ch-topic mono"></span></th>' +
      '<td class="ch-val"><span class="v-num"></span></td>' +
      '<td class="ch-unit"></td>' +
      '<td class="ch-age"></td>';
    tr.querySelector('.ch-name').textContent = t('row.avail');
    tr.querySelector('.ch-topic').textContent = 'dbk/' + b.id + '/status';
    // b.status is the board's own LWT payload — "online"/"offline" as the board wrote it.
    // It stays wire text: translating it would put a word on the bench nothing published.
    tr.querySelector('.v-num').textContent = b.status === null ? t('val.notPublished') : b.status;
    tr.querySelector('.ch-val').setAttribute('data-cur', b.status === null ? 'none' : '1');
    tr.querySelector('.ch-unit').textContent = t('unit.notDeclared');
    tr.querySelector('.ch-unit').setAttribute('data-declared', '0');
    tr.querySelector('.ch-age').textContent = ago(b.statusAt);
    p.avail.appendChild(tr);

    // ---- measurement rows, in a fixed order ----
    var list = sortedChannels(b);
    var published = 0, described = 0;
    list.forEach(function (ch) {
      p.body.appendChild(renderRow(b, ch, avail));
      if (ch.at) published++;
      if (ch.discTopic) described++;
    });
    p.caption.textContent = list.length
      ? t('caption.channels', { n: list.length, p: published, d: described })
      : t('caption.none');

    // ---- the small print, which is also just more of the same material ----
    p.foot.textContent = '';
    fact(p.foot, t('foot.idSource'), t('foot.idSourceVal'));
    fact(p.foot, t('foot.configs'), String(described));
    fact(p.foot, t('foot.expiry'), t('foot.seconds', { n: pm ? pm.expire : DEFAULT_EXPIRE }));
    fact(p.foot, t('foot.avail'), t('avail.' + avail));
    return p.root;
  }

  // ---------------------------------------------------------------- the scale
  // Rebuilt rather than patched on a language switch: six segments is cheaper to redraw
  // than to keep six references in sync, and the numeric ranges are identical either way.
  function buildScale() {
    var host = $('segs');
    host.textContent = '';
    BANDS.forEach(function (b) {
      var el = document.createElement('div');
      el.className = 'seg';
      el.style.color = 'var(' + b.v + ')';
      el.innerHTML = '<i></i><b>' + esc(bandShort(b)) + '</b><em>' + esc(b.r) + '</em>';
      host.appendChild(el);
    });
  }

  function rulerPos(n) {
    var i = bandIndex(n);
    if (i < 0) return null;
    var b = BANDS[i];
    var hi = Number.isFinite(b.max) ? b.max : RULER_TOP;
    var f = hi > b.min ? Math.min(1, Math.max(0, (n - b.min) / (hi - b.min))) : 0;
    return ((i + f) / BANDS.length) * 100;
  }

  function renderScale(rows) {
    var pins = $('pins');
    pins.textContent = '';
    var parked = [];
    rows.forEach(function (r) {
      if (r.pos === null) { parked.push(r); return; }
      var el = document.createElement('div');
      el.className = 'pin';
      el.style.left = r.pos.toFixed(2) + '%';
      el.style.setProperty('--pin', r.colour);
      el.innerHTML = '<span></span>';
      el.querySelector('span').textContent = r.id;
      pins.appendChild(el);
    });
    // Each parked board carries the KEY for why it is parked, not the reason in words, so
    // the list is written in whatever language the sheet is in when it is drawn.
    $('parked').innerHTML = parked.length
      ? t('parked.head') + esc(parked.map(function (r) {
          return r.id + ' (' + t(r.whyKey) + ')';
        }).join(' · ')) + t('parked.tail')
      : (rows.length ? '' : t('parked.none'));
  }

  // ---------------------------------------------------------------- verdict
  function renderVerdict() {
    var worst = null, worstBoard = '', liveCount = 0, total = boards.size, offline = 0;
    boards.forEach(function (b) {
      var avail = availabilityOfBoard(b);
      if (avail === 'offline') offline++;
      var pm = pmChannel(b);
      if (!pm) return;
      if (chState(b, pm, avail) !== 'live') return;
      if (!pm.value || pm.value.kind !== 'number') return;
      liveCount++;
      if (worst === null || pm.value.n1 > worst.n1) { worst = pm.value; worstBoard = b.id; }
    });

    var a = $('verdict-a'), why = $('verdict-why'), box = $('verdict');
    if (worst === null) {
      a.textContent = t('verdict.unknown');
      why.textContent = total
        ? t(total === 1 ? 'verdict.whyOffline1' : 'verdict.whyOffline',
            { off: offline, total: total })
        : t('verdict.whyNothing');
      box.style.setProperty('--band', css('--dim'));
      a.style.color = 'var(--dim)';
      return;
    }
    var band = bandFor(worst.n1) || BANDS[BANDS.length - 1];
    a.textContent = bandVerdict(band);
    why.textContent = t(liveCount > 1 ? 'verdict.whyMulti' : 'verdict.why', {
      v: worst.text, board: worstBoard, band: bandLabel(band), n: liveCount
    });
    box.style.setProperty('--band', css(band.v));
    a.style.color = 'var(--band)';
  }

  // ---------------------------------------------------------------- layout
  function layout() {
    var list = Array.from(boards.values());
    // Fixed rack order: by board id, ascending, natural numbering. Positions do not move when
    // a board dies, so a hatched empty slot is visible as a hatched empty slot.
    list.sort(function (x, y) {
      return String(x.id).localeCompare(String(y.id), undefined, { numeric: true, sensitivity: 'base' });
    });

    rack.hidden = list.length === 0;
    waiting.hidden = list.length > 0;
    if (!list.length) {
      $('waiting-msg').textContent = filteredOut.size
        ? t(filteredOut.size === 1 ? 'waiting.filtered1' : 'waiting.filtered',
            { n: filteredOut.size, f: activeFilter })
        : t(waitingKey);
      renderScale([]);
      renderVerdict();
      refreshCounts();
      return;
    }

    var scaleRows = [];
    list.forEach(function (b) {
      rack.appendChild(renderPanel(b));
      var avail = availabilityOfBoard(b);
      var pm = pmChannel(b);
      var st = pm ? chState(b, pm, avail) : 'waiting';
      if (pm && st === 'live' && pm.value && pm.value.kind === 'number') {
        var band = bandFor(pm.value.n1);
        scaleRows.push({
          id: b.id, pos: rulerPos(pm.value.n1),
          colour: band ? css(band.v) : css('--ink'), whyKey: ''
        });
      } else {
        scaleRows.push({
          id: b.id, pos: null, colour: css('--faint'),
          whyKey: avail === 'offline' ? 'avail.offline'
            : !pm ? 'hero.noPm'
            : st === 'stale' ? 'why.stale'
            : st === 'fault' ? 'state.fault'
            : st === 'unknown' ? 'state.noreading'
            : 'why.waiting'
        });
      }
    });

    renderScale(scaleRows);
    renderVerdict();
    refreshCounts();
  }

  // Ages, expiry and "last heard" all move on their own, so the sheet re-reads itself once a
  // second whether or not the broker said anything.
  setInterval(layout, 1000);

  // ---------------------------------------------------------------- connect
  // A reason code this sheet recognises becomes one of its own sentences and is translated.
  // Anything else is the library's own message: printed verbatim, in English, because a
  // half-translated error is harder to search for than an untranslated one.
  function describe(err) {
    var code = err && (err.code !== undefined ? err.code : err.reasonCode);
    var map = { 1: 'err.proto', 2: 'err.clientid', 3: 'err.unavail',
                4: 'err.badauth', 5: 'err.notauth' };
    if (map[code]) return { key: map[code], fatal: code === 2 || code === 4 || code === 5 };
    var m = String((err && err.message) || err || 'unknown error');
    if (/not authoriz|bad user/i.test(m)) return { text: m, fatal: true };
    return { text: m, fatal: false };
  }

  function disconnect() {
    manualStop = true;
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    subs.clear();
    refreshCounts();
  }

  function connect(cfg) {
    if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
      setConn('fatal', 'conn.detail.lib');
      calm([['calm.lib']]);
      return;
    }

    disconnect();
    manualStop = false;
    everConnected = false;
    activeFilter = typeof cfg.filter === 'string' ? cfg.filter.trim() : '';
    filteredOut.clear();
    ['conn', 'auth', 'mixed', 'nodisc', 'suberr', 'parse', 'wildcard', 'subcap', 'filter']
      .forEach(clearNote);

    var scheme = cfg.tls ? 'wss' : 'ws';
    var url = scheme + '://' + cfg.host + ':' + cfg.port;
    lastUrl = url;
    setHost(cfg.host + ':' + cfg.port);
    setConn('connecting');

    if (!cfg.tls && location.protocol === 'https:') {
      setNote('mixed', 'warn', 'note.mixed');
    }

    try {
      client = mqtt.connect(url, {
        username: cfg.user || undefined,
        password: cfg.pass || undefined,
        clientId: 'air-workbench-' + Math.random().toString(16).slice(2, 10),
        clean: true,
        reconnectPeriod: 4000,
        connectTimeout: 8000,
        keepalive: 45,
        resubscribe: true
      });
    } catch (e) {
      setConn('fatal');
      calm([['calm.open', { url: url }], ['conn.hint']]);
      return;
    }

    if (graceTimer) clearTimeout(graceTimer);
    graceTimer = setTimeout(function () {
      if (!everConnected && !manualStop) {
        calm([['conn.unreachable'], ['calm.grace', { url: lastUrl }], ['conn.hint']]);
      }
    }, FIRST_CONNECT_GRACE);

    client.on('connect', function () {
      everConnected = true;
      uncalm();
      setConn('connected');
      clearNote('conn');
      if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }

      // subRaw, not sub: these five are authored here and are the ONLY wildcards this page may
      // ever subscribe to. sub() refuses every wildcard that arrives over the wire, and none of
      // these contains a multi-level wildcard.
      AUTHORED.forEach(subRaw);

      if (discoveryTimer) clearTimeout(discoveryTimer);
      discoveryTimer = setTimeout(function () {
        if (boards.size === 0 && filteredOut.size === 0 && connState === 'connected') {
          setNote('nodisc', 'info', 'note.nodisc');
        }
      }, 4000);
      waitingKey = 'waiting.connected';
      layout();
    });

    client.on('message', function (topic, payload) {
      try { onMessage(topic, payload); }
      catch (e) { /* one bad message must never stop the stream */ }
    });

    client.on('reconnect', function () {
      if (!manualStop && connState !== 'fatal') setConn('reconnecting');
    });
    client.on('offline', function () {
      if (!manualStop && connState !== 'fatal') setConn('reconnecting', 'conn.detail.unreachable');
    });

    // A browser never reveals WHY a WebSocket handshake failed, and for a refused port mqtt.js
    // may close without ever emitting a useful 'error'. Without this branch the sheet would sit
    // on a bare "disconnected" and explain nothing.
    client.on('close', function () {
      if (manualStop || connState === 'fatal') return;
      if (!everConnected) {
        setConn('error', 'conn.detail.unreachable');
      } else {
        setConn('reconnecting', 'conn.detail.lost');
        setNote('conn', 'warn', 'note.conn');
      }
    });

    client.on('error', function (err) {
      var d = describe(err);
      if (d.fatal) {
        setConn('fatal');
        manualStop = true;
        try { client.end(true); } catch (e) {}
        client = null;
        calm([['conn.refused'],
              ['calm.because', { why: d.key ? { key: d.key } : d.text }],
              ['conn.hint']]);
      } else {
        setConn('error', 'conn.detail.unreachable');
      }
    });
  }

  // ---------------------------------------------------------------- demo mode
  /* OPT-IN FROM THE ADDRESS BAR AND NOWHERE ELSE.
     ?demo=<number> | good|moderate|sensitive|unhealthy|verybad|hazardous | cycle | mixed
     It is read once from location.search, never from local storage, never defaulted, and
     never written anywhere — so a reload without the parameter is a live sheet again.

     Two rules make this safe enough to put on a wall a child looks at:
     1. In demo mode connect() is never called, so no WebSocket is ever opened. A page must
        never carry one real reading and one invented one; here there is no real one to mix.
     2. Every value below is pushed through onMessage() — the same discovery expansion,
        availability, expiry, banding and rendering the broker feeds. Nothing here draws a
        panel of its own. A second renderer would be a renderer nobody is testing. */
  var demoMode = '';             // 'fixed' | 'cycle' | 'mixed'
  var demoValue = 0;
  var demoStep = 0;
  var demoTimer = null;
  var demoEnc = (typeof TextEncoder !== 'undefined') ? new TextEncoder() : null;

  // One representative value from the middle of each EPA band. Hazardous is open-ended, so
  // its value is the middle of the range this sheet's ruler actually draws (250.5 – 500).
  var DEMO_BANDS = {
    good: 6.0, moderate: 23.7, sensitive: 45.4,
    unhealthy: 102.9, verybad: 200.4, hazardous: 375.2
  };
  var DEMO_ORDER = ['good', 'moderate', 'sensitive', 'unhealthy', 'verybad', 'hazardous'];
  var DEMO_EXPIRE = 600;         // what the simulated discovery configs declare, in seconds
  var DEMO_CYCLE_MS = 4000;

  function demoNum(n) { return (Math.trunc(n * 10) / 10).toFixed(1); }

  // Payloads arrive as bytes on the wire, so they arrive as bytes here too — including the
  // UTF-8 for µg/m³, which is exactly the byte sequence that has been mangled before.
  function demoWire(topic, text) {
    onMessage(topic, demoEnc ? demoEnc.encode(String(text)) : String(text));
  }

  // What each board publishes. Only DBK-002 carries the extra sensors, because on the wall
  // only DBK-002 carries them — a demo fleet where every board is identical would hide the
  // half-empty panel this sheet has to render most days.
  function demoChannels(id, pm) {
    var list = [{
      key: 'pm2_5', topic: 'dbk/' + id + '/pm2_5', name: 'PM2.5',
      unit: 'µg/m³', dc: 'pm25', expire: DEMO_EXPIRE, val: demoNum(pm)
    }];
    if (id !== 'DBK-002') return list;
    var s = 'dbk/' + id + '/sensor/';
    var band = bandFor(Math.trunc(pm * 10) / 10);
    // Derived from the same reading, not invented separately: a demo where PM10 sits below
    // PM2.5 is a demo that teaches the wrong thing.
    list.push({ key: 'pm1_0', topic: s + 'pm1_0/state', name: 'PM1.0', unit: 'µg/m³',
                dc: 'pm1', expire: DEMO_EXPIRE, val: demoNum(pm * 0.62) });
    list.push({ key: 'pm10', topic: s + 'pm10/state', name: 'PM10', unit: 'µg/m³',
                dc: 'pm10', expire: DEMO_EXPIRE, val: demoNum(pm * 1.45) });
    // band.wire, not the translated label: this is a PAYLOAD, and a real board publishes
    // this word in English. A demo that put Thai on the wire would be testing a wire that
    // does not exist, and the table below would stop showing what a board actually sends.
    list.push({ key: 'air_quality_level', topic: s + 'air_quality_level/state',
                name: 'Air quality level', unit: '', dc: '', expire: 0,
                val: band ? band.wire : 'unknown' });
    list.push({ key: 'wi-fi_rssi', topic: s + 'wi-fi_rssi/state', name: 'Wi-Fi RSSI',
                unit: 'dBm', dc: 'signal_strength', expire: 0, val: '-58' });
    list.push({ key: 'uptime', topic: s + 'uptime/state', name: 'Uptime', unit: 's',
                dc: 'duration', expire: 0, val: '86942.6' });
    return list;
  }

  // A retained Home Assistant discovery config, in the abbreviated form the real ones use,
  // so expand() and the "~" handling are exercised rather than bypassed. Rule C is honoured
  // the hard way: name is "PM2.5" on all three boards here too, exactly as on the wall.
  function demoDiscover(id, ch) {
    var node = id.toLowerCase();
    var cfg = {
      name: ch.name,
      uniq_id: node + '_' + ch.key,
      stat_t: ch.topic,
      avty_t: 'dbk/' + id + '/status',
      dev: { name: 'Kit4Kids ' + id, ids: [node] }
    };
    if (ch.unit) cfg.unit_of_meas = ch.unit;
    if (ch.dc) cfg.dev_cla = ch.dc;
    if (ch.expire) cfg.exp_aft = ch.expire;
    demoWire('homeassistant/sensor/' + node + '/' + ch.key + '/config', JSON.stringify(cfg));
  }

  function demoScene() {
    if (demoMode === 'mixed') {
      // The state the rack is actually in on an ordinary day: one board reporting, one dark,
      // one online but long past its expiry window. This is the layout most likely to be
      // rendered badly, so it is the one that gets its own switch.
      return [
        { id: 'DBK-001', pm: 41.8, status: 'offline', age: 1320 },
        { id: 'DBK-002', pm: 88.3, status: 'online',  age: 2 },
        { id: 'DBK-010', pm: 63.2, status: 'online',  age: 1860 }
      ];
    }
    return [
      { id: 'DBK-001', pm: demoValue, status: 'online', age: 6 },
      { id: 'DBK-002', pm: demoValue, status: 'online', age: 2 },
      { id: 'DBK-010', pm: demoValue, status: 'online', age: 9 }
    ];
  }

  // Messages land with the clock's own timestamp, which is right for a live board and wrong
  // for a board that is meant to look like it has been quiet for half an hour. Ages are
  // pushed back on the entity objects themselves, after the fact, so "5s ago", "22m ago" and
  // the expiry arithmetic are all the real ones.
  function demoAge(id, seconds) {
    var b = boards.get(id);
    if (!b || !seconds) return;
    var back = seconds * 1000;
    if (b.statusAt) b.statusAt -= back;
    b.channels.forEach(function (ch) {
      if (ch.at) ch.at -= back;
      if (ch.ent && ch.ent.at) ch.ent.at -= back;
    });
  }

  // The marker bar's detail line. The scene it last described is kept so a language switch
  // can redraw it: a wall that says DEMO in Thai and describes the fake reading in English
  // is a wall where half the warning is unreadable to the person it is warning.
  var lastDemoScene = null;
  var demoBadArg = '';
  function demoMark(scene) {
    if (scene) lastDemoScene = scene; else scene = lastDemoScene;
    if (!demoMode) { $('demo-val').textContent = t('demo.unrecognised'); return; }
    if (!scene) return;
    var txt;
    if (demoMode === 'mixed') {
      txt = scene.map(function (s) {
        if (s.status === 'offline') {
          return t('demo.mixed.offline', { id: s.id, v: demoNum(s.pm) });
        }
        if (s.age > DEMO_EXPIRE) {
          return t('demo.mixed.expired', { id: s.id, v: demoNum(s.pm) });
        }
        var bd = bandFor(Math.trunc(s.pm * 10) / 10);
        return t('demo.mixed.live', { id: s.id, v: demoNum(s.pm), band: bd ? bandLabel(bd) : '' });
      }).join('   ·   ');
    } else {
      var b = bandFor(Math.trunc(demoValue * 10) / 10);
      txt = t('demo.at') + ' PM2.5 ' + demoNum(demoValue) + ' µg/m³ · ' +
            (b ? bandLabel(b) : t('band.none'));
      if (demoMode === 'cycle') {
        txt += t('demo.cycle', {
          i: demoStep + 1, n: DEMO_ORDER.length, s: DEMO_CYCLE_MS / 1000 });
      }
    }
    // Echoed exactly as typed, with a cross: whoever put a bad token in the address bar
    // reads their own token back, in whatever language they typed it.
    if (demoBadArg) txt += '   ·   ?demo=' + demoBadArg + ' \u2717';
    $('demo-val').textContent = txt;
  }

  function demoApply() {
    var scene = demoScene();
    scene.forEach(function (s) {
      var chans = demoChannels(s.id, s.pm);
      chans.forEach(function (ch) { demoDiscover(s.id, ch); });
      demoWire('dbk/' + s.id + '/status', s.status);
      chans.forEach(function (ch) { demoWire(ch.topic, ch.val); });
      demoAge(s.id, s.age);
    });
    demoMark(scene);
    layout();
  }

  function startDemo(arg) {
    demoOn = true;
    // The bar covers every crop of a photograph of the SHEET, but not a crop of the
    // browser chrome above it: a tab strip, a bookmark and a screenshot of the window
    // frame carry the title and nothing else.
    document.title = 'DEMO · ' + document.title;
    document.body.setAttribute('data-demo', '1');
    $('demo-bar').hidden = false;

    // The instrument panel must not read like a connected sheet, because it is not one.
    setHost('', 'conn.host.demo');
    setConn('idle', 'conn.detail.demo');
    setHint('hint.demo');

    if (arg === '' || arg === 'cycle' || arg === 'mixed') {
      demoMode = (arg === '') ? 'cycle' : arg;
      demoStep = 0;
      demoValue = DEMO_BANDS[DEMO_ORDER[0]];
    } else if (Object.prototype.hasOwnProperty.call(DEMO_BANDS, arg)) {
      demoMode = 'fixed';
      demoValue = DEMO_BANDS[arg];
    } else if (/^\d{1,6}(\.\d{1,3})?$/.test(arg) && Number(arg) <= 100000) {
      demoMode = 'fixed';
      demoValue = Number(arg);
    } else {
      // An address nobody recognises still connects to nothing — showing real data to
      // someone who asked for a demo is the one outcome worse than showing neither. It
      // now shows the MIXED FLEET rather than an empty sheet, so the reason the reader
      // opened the parameter (what does this layout do at a reading it is not getting
      // today) is still answered, while the note names the token that was thrown away.
      demoMode = 'mixed';
      demoBadArg = String(arg);
      setNote('demo', 'bad', 'note.demoBad', { arg: esc(arg) });
    }

    // …unless the bad-token note is already standing. Both write the same note id, and
    // the token the reader mistyped is the more useful of the two sentences.
    if (!demoBadArg) setNote('demo', 'bad', 'note.demo');

    // Recorded, never sent: what a live sheet would have subscribed to, so the SUBSCRIPTIONS
    // count on the panel above is the honest one rather than a zero that needs explaining.
    AUTHORED.forEach(subRaw);

    demoApply();
    demoTimer = setInterval(function () {
      if (demoMode === 'cycle') {
        demoStep = (demoStep + 1) % DEMO_ORDER.length;
        demoValue = DEMO_BANDS[DEMO_ORDER[demoStep]];
      }
      demoApply();   // republish, so the simulated boards stay live instead of ageing out
    }, demoMode === 'cycle' ? DEMO_CYCLE_MS : 30000);
  }

  // ---------------------------------------------------------------- settings
  var panelEl = $('settings');
  function openSettings() {
    panelEl.hidden = false;
    $('f-host').focus();
  }
  function closeSettings() { panelEl.hidden = true; }

  document.addEventListener('keydown', function (ev) {
    // NOT named `t` any more: this handler used to shadow the translation function with the
    // event target, which would have made every t() call inside it a TypeError.
    var el = ev.target;
    var typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    if (ev.key === 'Escape') { closeSettings(); return; }
    if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === 's' || ev.key === 'S') { ev.preventDefault(); openSettings(); return; }
    // l, next to s and deliberately not colliding with it.
    if (ev.key === 'l' || ev.key === 'L') {
      ev.preventDefault();
      setLang(LANG === 'th' ? 'en' : 'th');
    }
  });
  $('btn-close').addEventListener('click', closeSettings);
  panelEl.addEventListener('click', function (ev) { if (ev.target === panelEl) closeSettings(); });

  function readForm() {
    return {
      host: $('f-host').value.trim(),
      port: $('f-port').value.trim(),
      user: $('f-user').value,
      pass: $('f-pass').value,
      tls: $('f-tls').checked,
      filter: $('f-filter').value.trim(),
      remember: $('f-remember').checked
    };
  }
  function fillForm(v) {
    $('f-host').value = (v && v.host) || DEFAULT_HOST;
    $('f-port').value = (v && v.port) || DEFAULT_PORT;
    $('f-user').value = (v && v.user) || '';
    $('f-pass').value = (v && v.pass) || '';
    $('f-tls').checked = !!(v && v.tls);
    $('f-filter').value = v && typeof v.filter === 'string' ? v.filter : DEFAULT_FILTER;
    $('f-remember').checked = !!(v && (v.remember || v.pass));
  }
  // What goes to disk is not what is in the form: the passphrase is opt-in.
  function storable(cfg) {
    var out = { host: cfg.host, port: cfg.port, user: cfg.user, tls: cfg.tls,
                filter: cfg.filter, remember: !!cfg.remember };
    if (cfg.remember) out.pass = cfg.pass;
    return out;
  }

  function resetData() {
    boards.forEach(function (b) { if (b.panel) b.panel.root.remove(); });
    boards.clear();
    entities.clear(); byState.clear(); byAvail.clear(); byUid.clear();
    filteredOut.clear();
    parseErrors = 0;
    layout();
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    // The one door left into connect() once the demo is running. A sheet that answered this
    // would put a real reading and an invented one on the same screen.
    if (demoOn) {
      setHint('hint.demoConnect');
      return;
    }
    var cfg = readForm();
    if (!cfg.host || !cfg.port) return;
    resetData();
    var ok = saveStore(storable(cfg));
    setHint(!ok ? 'hint.saveFail' : cfg.remember ? 'hint.savedPass' : 'hint.saved');
    closeSettings();
    uncalm();
    connect(cfg);
  });

  $('btn-forget').addEventListener('click', function () {
    // Demo mode neither reads nor writes storage, so it does not get to erase it either.
    if (demoOn) {
      setHint('hint.demoForget');
      return;
    }
    clearStore();
    fillForm(null);
    $('f-pass').value = '';
    setHint('hint.cleared');
  });

  // ---------------------------------------------------------------- language, applied
  /* Everything static on the sheet is marked up with the key it should carry, and one pass
     fills them all. Four attributes, because four different things need words:
       data-i18n       textContent — the safe default, and what most labels use
       data-i18n-html  innerHTML   — only for strings authored HERE that carry <b>/<kbd>/<code>
       data-i18n-ph    placeholder
       data-i18n-aria  aria-label
     No wire text ever reaches data-i18n-html: those templates are this file's own prose, and
     the values interpolated into them are escaped at the call site. */
  function applyStatic(root) {
    var scope = root || document;
    var i, n;
    n = scope.querySelectorAll('[data-i18n]');
    for (i = 0; i < n.length; i++) n[i].textContent = t(n[i].getAttribute('data-i18n'));
    n = scope.querySelectorAll('[data-i18n-html]');
    for (i = 0; i < n.length; i++) n[i].innerHTML = t(n[i].getAttribute('data-i18n-html'));
    n = scope.querySelectorAll('[data-i18n-ph]');
    for (i = 0; i < n.length; i++) n[i].setAttribute('placeholder', t(n[i].getAttribute('data-i18n-ph')));
    n = scope.querySelectorAll('[data-i18n-aria]');
    for (i = 0; i < n.length; i++) n[i].setAttribute('aria-label', t(n[i].getAttribute('data-i18n-aria')));
  }

  function syncLang() {
    document.documentElement.setAttribute('lang', LANG);
    $('lang-th').setAttribute('aria-pressed', LANG === 'th' ? 'true' : 'false');
    $('lang-en').setAttribute('aria-pressed', LANG === 'en' ? 'true' : 'false');
  }

  // A full redraw. Every dynamic surface is rebuilt from state that was never stored as
  // words, so this is the whole of a language switch — no reload, no reconnect, no flash,
  // and the MQTT client is not touched. Panels keep their DOM nodes; only text is rewritten.
  function render() {
    syncLang();
    applyStatic();
    buildScale();
    redrawNotes();
    drawCalm();
    setConn(connState, connDetailKey);
    setHost(hostText, hostKey);
    setHint(hintKey);
    if (demoOn) demoMark(null);
    layout();
  }

  function setLang(next) {
    if (next !== 'th' && next !== 'en') return;
    if (next === LANG) return;
    LANG = next;
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
    render();
  }

  $('lang-th').addEventListener('click', function () { setLang('th'); });
  $('lang-en').addEventListener('click', function () { setLang('en'); });

  // ---------------------------------------------------------------- boot
  // No configuration UI on load, ever. The sheet connects itself: stored settings first, then
  // credentials handed in on the URL, then anonymously to the lab broker's WebSocket listener.
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  function qp(k) { try { return (q && q.get(k)) || ''; } catch (e) { return ''; } }

  // The demo flag is read here and only here — by PRESENCE, not by truthiness. An empty
  // ?demo= used to boot live on the argument that it "carries no value and is not a request
  // for one". It is a request for one: nobody types the parameter by accident, and the wall
  // that answers it with today's genuine air, unmarked and connected, has handed a real
  // reading to somebody who believes they are looking at a simulation. Every wall in this
  // folder now treats an empty value as ?demo=cycle and an unrecognised one as the mixed
  // fleet, because one control on the contact sheet drives all twenty.
  var demoHas = false;
  try { demoHas = !!(q && q.has('demo')); } catch (e) { demoHas = false; }
  var demoArg = qp('demo').trim().toLowerCase();

  // Demo mode never touches local storage, in either direction, so it cannot be remembered.
  var saved = demoHas ? null : loadStore();

  var boot;
  if (saved && saved.host && saved.port) {
    boot = saved;
    setHint('hint.loaded');
  } else if (qp('u') || qp('p') || qp('h')) {
    boot = {
      host: qp('h') || DEFAULT_HOST,
      port: qp('port') || DEFAULT_PORT,
      user: qp('u'),
      pass: qp('p'),
      tls: qp('tls') === '1',
      filter: q && q.has('f') ? qp('f') : DEFAULT_FILTER,
      remember: false
    };
    setHint('hint.url');
  } else {
    boot = {
      host: DEFAULT_HOST, port: DEFAULT_PORT, user: '', pass: '',
      tls: false, filter: DEFAULT_FILTER, remember: false
    };
    setHint(storeWorks ? 'hint.none' : 'hint.blocked');
  }

  fillForm(boot);
  activeFilter = typeof boot.filter === 'string' ? boot.filter.trim() : '';
  // One pass writes the whole sheet in the chosen language before anything is shown, so a
  // Thai wall never flashes English on the way up.
  render();
  // The demo returns before connect() is reached: in demo mode no socket is opened at all.
  if (demoHas) { startDemo(demoArg); return; }
  connect(boot);
})();
</script>
</body>
</html>
