<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit4Kids Air Workbench — every value the boards publish</title>
<style>
/* =====================================================================
   WORKBENCH — Charles & Ray Eames
   Honest materials. Nothing hidden as "advanced". Every value Home
   Assistant publishes for a board is on the panel, with its topic
   printed underneath it, because the topic is the joint and a joint
   should be visible. Warmth comes from rigour and spacing, not from
   decoration.

   Four rules this file is built around, each a bug that already shipped:
   A. NO text-transform declaration exists anywhere in this file — the
      only two mentions of the property are inside this comment. CSS case
      mapping turns "µ" into "M", silently rendering µg/m³ as MG/M³ — a
      1000x unit error caused by a styling rule. Every capitalised label
      here is typed in capitals by hand, so nothing that came off the
      wire is ever case-mapped by the stylesheet.
   B. The hero reading is sized in cqi against its own panel container,
      never in vw. Sized in vw while its space came from a grid column,
      "163.3" broke into "163." + "3" — failing exactly in the hazardous
      range. white-space:nowrap plus a step-down for absurd payloads.
   C. Identity is the board id parsed out of state_topic. The discovery
      "name" is "PM2.5" on every board, so it can only ever be a row
      label inside a panel — never the panel's name.
   D. No subscription in this file contains '#'.
   E. Thai is a first-class reader here, not a retrofit. Thai has no spaces
      between words, so a space in a Thai string is a clause boundary and is
      never "tidied"; its ascenders and descenders stack, so Thai prose gets
      at least 1.5 line-height and no letter-spacing; and because a browser
      cannot find a word boundary in Thai, Thai prose blocks may break
      anywhere — but no rule in this file ever grants that to a reading.
      Rule A protects Thai twice over: case mapping does nothing to Thai
      glyphs but would still mangle the Latin and the unit sitting beside it.
   ===================================================================== */

:root{
  color-scheme:light dark;

  /* paper, ink, rule — the three materials */
  --paper:#eeeae0;
  --panel:#f8f6f0;
  --panel-2:#f2eee5;
  --ink:#1b1915;
  --dim:#57524a;
  --faint:#8b8478;
  --rule:#d9d3c4;
  --rule-2:#c3bbaa;
  --shadow:0 1px 0 rgba(27,25,21,.05);

  --band-good:#1f7a4d;
  --band-mod:#9a7407;
  --band-usg:#bf5f14;
  --band-unh:#b8342a;
  --band-vun:#6f43a0;
  --band-haz:#7d1327;
  --haz-ink:#fdf3f5;

  --band:var(--faint);

  --sp:clamp(.85rem,1.5vw,1.5rem);

  /* Real Thai faces are named first, so a Thai glyph is never left to a
     fallback that renders its tone marks badly. No webfont is fetched: this
     sheet stays one self-contained file that works with no network. */
  --ui:'Noto Sans Thai','IBM Plex Sans Thai','Sarabun',ui-sans-serif,system-ui,
       -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

  /* The per-panel demo badge is drawn by CSS, so its wording is a custom
     property keyed off <html lang> rather than a string JavaScript injects.
     One renderer, both languages, no code path that only one of them takes. */
  --demo-badge:"DEMO — SIMULATED READING, NOT REAL AIR";
}
html[lang="th"]{
  --demo-badge:"DEMO — ข้อมูลตัวอย่าง ไม่ใช่ค่าจริง";
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#16140f;
    --panel:#1e1b15;
    --panel-2:#231f19;
    --ink:#efe9dc;
    --dim:#b0a897;
    --faint:#7d766a;
    --rule:#332e25;
    --rule-2:#463f33;
    --shadow:none;

    --band-good:#5cc98b;
    --band-mod:#e0b341;
    --band-usg:#f0904a;
    --band-unh:#f2726a;
    --band-vun:#b992f0;
    --band-haz:#ff7d95;
    --haz-ink:#22060c;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font:16px/1.55 var(--ui);
  -webkit-font-smoothing:antialiased;
  padding:var(--sp);
  min-height:100vh;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.005em}
p{margin:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.num-t{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------------------------------------------------- Thai (Rule E)
   Three corrections, applied only while the sheet is in Thai, and applied to
   named prose elements rather than to the page, so that nothing here can ever
   reach the hero reading. Line-height first: 1.25 clips a สั้ or a ญู against
   the line above it. Letter-spacing second: Thai has no spaces between words
   and relies on glyph adjacency to group them, so tracking that flatters
   Latin small-caps actively destroys Thai. Breaking third: a browser cannot
   find a word boundary inside Thai, so a long Thai clause would otherwise
   overflow its panel — these blocks may break anywhere.

   The reading is NOT in any list below. `overflow-wrap` is an inherited
   property, so nothing that contains .hero-num is in them either: granting
   "break anywhere" to an ancestor is how "163.3" once became "163." + "3". */
html[lang="th"] body{line-height:1.65}
html[lang="th"] .ident h1,
html[lang="th"] .ident .sub,
html[lang="th"] .ident .std,
html[lang="th"] .verdict-q,
html[lang="th"] .verdict-a,
html[lang="th"] .verdict-why,
html[lang="th"] .tele dt,
html[lang="th"] .tele dd,
html[lang="th"] .b-state,
html[lang="th"] .b-heard,
html[lang="th"] .hero-band,
html[lang="th"] .hero-sub,
html[lang="th"] .b-answer,
html[lang="th"] .chan caption,
html[lang="th"] .chan thead th,
html[lang="th"] .ch-name,
html[lang="th"] .ch-unit,
html[lang="th"] .b-foot dt,
html[lang="th"] .b-foot dd,
html[lang="th"] .scale h3,
html[lang="th"] .seg b,
html[lang="th"] .seg em,
html[lang="th"] .parked,
html[lang="th"] .materials h3,
html[lang="th"] .materials h4,
html[lang="th"] .materials p,
html[lang="th"] .note,
html[lang="th"] .waiting h2,
html[lang="th"] .waiting p,
html[lang="th"] footer.colophon,
html[lang="th"] .set-card h2,
html[lang="th"] .set-card>p,
html[lang="th"] .f label,
html[lang="th"] .set-hint,
html[lang="th"] #calm p,
html[lang="th"] .demo-say,
html[lang="th"] .demo-exit{letter-spacing:0;line-height:1.6}
html[lang="th"] .hero-num[data-kind="word"]{letter-spacing:0;line-height:1.3}

/* Breaking, deliberately as break-word and NOT as anywhere. Both let a Thai run
   break when it would otherwise overflow, which is the whole requirement; the
   difference is that `anywhere` also shrinks min-content, and every block below
   carries English wire text too — a topic, a unit, a board id, state_topic. This
   file already documents `anywhere` splitting "declared" into "declare"/"d" and
   "air_quality_level" into "air_quality_l"/"evel". Thai must not buy its wrapping
   by reintroducing that. */
html[lang="th"] .verdict-a,
html[lang="th"] .verdict-why,
html[lang="th"] .b-answer,
html[lang="th"] .hero-band,
html[lang="th"] .hero-sub,
html[lang="th"] .ch-name,
html[lang="th"] .ch-unit,
html[lang="th"] .b-foot dd,
html[lang="th"] .parked,
html[lang="th"] .materials p,
html[lang="th"] .note,
html[lang="th"] .waiting p,
html[lang="th"] footer.colophon,
html[lang="th"] .set-hint,
html[lang="th"] #calm p,
html[lang="th"] .demo-say,
html[lang="th"] .demo-exit{word-break:break-word;overflow-wrap:break-word}
/* The one exception: a scale segment is a sixth of the sheet and holds nothing but
   a band name, so there is no identifier here for `anywhere` to damage. */
html[lang="th"] .seg b{word-break:break-word;overflow-wrap:anywhere}

/* Two cells are held on one line by white-space:nowrap because the English they
   were sized for is short — "5s ago", "last heard 22m ago". The Thai is three
   times longer, and nowrap in a fixed-layout table does not wrap, it spills past
   the panel edge and takes the page's horizontal scrollbar with it. Neither cell
   is a reading, so in Thai both are allowed to wrap. */
html[lang="th"] .b-heard,
html[lang="th"] .ch-age{white-space:normal}

/* ---------------------------------------------------------- the switcher
   It lives in the instrument panel beside SETTINGS, because that is where
   this sheet already keeps the two controls it has. It is a pair of small
   text labels, not a button: the loudest thing on a wall must stay the
   reading. The active language is ink and underlined; the other is faint. */
.lang{display:flex;align-items:baseline;gap:.3rem;min-width:0}
.lang button{
  font:inherit;font-size:clamp(.78rem,1.1vw,.9rem);font-weight:600;line-height:1.4;
  background:none;border:0;border-bottom:1px solid transparent;
  padding:0;margin:0;color:var(--faint);cursor:pointer;
}
.lang button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.lang button:hover{color:var(--dim)}
.lang button:focus-visible{outline:2px solid var(--band-good);outline-offset:2px}
.lang .lang-sep{color:var(--rule-2)}

.sheet{max-width:2200px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp)}

/* ---------------------------------------------------------- masthead */
.masthead{
  display:grid;gap:var(--sp);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));
  align-items:start;
  background:var(--panel);
  border:1px solid var(--rule);
  border-top:3px solid var(--ink);
  box-shadow:var(--shadow);
  padding:calc(var(--sp) * .9);
}
.ident h1{font-size:clamp(1.05rem,2vw,1.5rem);letter-spacing:.02em}
.ident .sub{color:var(--dim);font-size:clamp(.78rem,1.1vw,.9rem);margin-top:.2rem}
.ident .std{color:var(--faint);font-size:clamp(.7rem,1vw,.8rem);margin-top:.45rem;letter-spacing:.02em}

.verdict{
  border-left:3px solid var(--band);
  padding-left:calc(var(--sp) * .75);
  min-width:0;
}
.verdict-q{font-size:clamp(.7rem,1vw,.79rem);letter-spacing:.13em;color:var(--faint)}
.verdict-a{
  font-size:clamp(1.05rem,2.1vw,1.6rem);font-weight:650;line-height:1.25;
  margin-top:.25rem;color:var(--band);letter-spacing:-.012em;
}
.verdict-why{font-size:clamp(.76rem,1.1vw,.88rem);color:var(--dim);margin-top:.35rem}

.tele{margin:0;display:grid;gap:.4rem .9rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr))}
.tele div{display:flex;flex-direction:column;gap:.1rem;min-width:0;border-top:1px solid var(--rule);padding-top:.32rem}
.tele dt{font-size:.66rem;letter-spacing:.12em;color:var(--faint)}
/* break-word, never anywhere: an unbreakable token still breaks rather than overflow, but a
   host:port or a slashed topic breaks at its own joints instead of mid-token. "your-broker-host:1"
   over "884" is not a legible address. */
.tele dd{margin:0;font-size:clamp(.78rem,1.1vw,.9rem);font-weight:600;overflow-wrap:break-word}
.tele dd[data-s="connected"]{color:var(--band-good)}
.tele dd[data-s="connecting"],.tele dd[data-s="reconnecting"],.tele dd[data-s="error"]{color:var(--band-mod)}
.tele dd[data-s="fatal"]{color:var(--band-unh)}

/* ---------------------------------------------------------- notes */
.notes:empty{display:none}
.notes{display:flex;flex-direction:column;gap:.5rem}
.note{
  background:var(--panel);border:1px solid var(--rule);border-left-width:3px;
  padding:.55rem .8rem;font-size:clamp(.78rem,1.1vw,.88rem);color:var(--dim);
}
.note b{color:var(--ink);font-weight:650}
.note[data-l="bad"]{border-left-color:var(--band-unh)}
.note[data-l="warn"]{border-left-color:var(--band-mod)}
.note[data-l="info"]{border-left-color:var(--rule-2)}

/* ---------------------------------------------------------- rack */
.rack{
  display:grid;gap:var(--sp);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,25rem),1fr));
  align-items:start;
}
.rack[hidden]{display:none}

.board{
  /* Bug B: the hero number sizes off THIS element, not the viewport. */
  container-type:inline-size;
  background:var(--panel);
  border:1px solid var(--rule);
  border-top:3px solid var(--band);
  box-shadow:var(--shadow);
  padding:calc(var(--sp) * .9);
  display:flex;flex-direction:column;gap:.85rem;min-width:0;
}
/* Two of three boards are dark on a normal day. That is the normal state of
   this rack, so it is drawn deliberately — a hatched ground and a dashed
   frame — never a blank card and never a zero standing in for a dead sensor. */
.board[data-state="offline"]{
  border-style:dashed;
  border-top-style:solid;
  background:
    repeating-linear-gradient(135deg,
      transparent 0 9px,
      color-mix(in srgb,var(--rule) 45%,transparent) 9px 10px),
    var(--panel-2);
}

.b-head{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;min-width:0;
  border-bottom:1px solid var(--rule);padding-bottom:.55rem}
.b-id{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:clamp(1rem,1.7vw,1.25rem);font-weight:700;letter-spacing:.04em;
  overflow-wrap:anywhere;min-width:0;
}
.b-state{
  flex:none;font-size:.66rem;letter-spacing:.12em;font-weight:700;
  padding:.2rem .45rem;border:1px solid var(--band);color:var(--band);
}
.board[data-state="offline"] .b-state{border-color:var(--rule-2);color:var(--dim)}
.b-heard{margin-left:auto;font-size:.74rem;color:var(--faint);white-space:nowrap}

/* ---- hero instrument ---- */
.b-hero{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.hero-line{display:flex;align-items:baseline;gap:.45rem;min-width:0}
.hero-num{
  font-size:clamp(2.1rem,21cqi,6.5rem);line-height:.92;font-weight:700;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums;color:var(--band);
  /* Bug B: digits never break, ever. */
  white-space:nowrap;
}
/* Escape hatch: a payload too long to be a plausible reading steps down to a
   scale that is allowed to wrap, so nowrap can never become an overflow. */
/* The escape hatch for a payload too long to fit: it steps the size down and
   lets the string wrap. What it does NOT do any more is `overflow-wrap:anywhere`.
   That declaration permits a break at any character — including between the "3"
   and the "." of a reading — and it is the exact declaration that once shipped
   "163.3" broken across two lines on this fleet's wall. The step-down below
   already removes the overflow pressure on its own; `anywhere` was insurance
   against a case the step-down had already handled, bought with the one failure
   mode this whole file is written to prevent. The wrap between WORDS that a long
   non-numeric payload needs is what `white-space:normal` gives, and that is
   enough. (Reachable only above 7 characters, which ?demo= cannot produce — it
   truncates to one decimal — so this branch is for a malformed wire payload.) */
.hero-num[data-long="1"]{font-size:clamp(1.5rem,9cqi,2.6rem);white-space:normal}
.hero-num[data-kind="word"]{font-size:clamp(1.5rem,12cqi,3rem);letter-spacing:-.01em;white-space:normal;overflow-wrap:anywhere}
/* An expired reading steps DOWN, not merely grey. The colour on this figure comes
   from --band, which the render path drains for a stale board — but a colour is
   the weakest signal a wall display has: measured at ?demo=mixed the stale board
   printed 63.2 at 104px and the live board 88.3 at the identical 104px, and from
   across a room the muted one reads as quieter, which is heard as calmer. Size is
   the axis a reader takes in before any hue. */
.board[data-state="stale"] .hero-num,.board[data-state="fault"] .hero-num{
  font-size:clamp(1.4rem,11cqi,3rem);
}
.hero-unit{font-size:clamp(.85rem,1.35vw,1.1rem);color:var(--dim);font-weight:500;white-space:nowrap}
.hero-band{font-size:clamp(.95rem,1.6vw,1.2rem);font-weight:650;color:var(--band);letter-spacing:-.008em}
.hero-band[data-haz="1"]{display:inline-block;background:var(--band-haz);color:var(--haz-ink);padding:.05rem .45rem}
.hero-sub{font-size:clamp(.76rem,1.1vw,.86rem);color:var(--faint)}
.b-answer{
  font-size:clamp(.85rem,1.25vw,1rem);color:var(--ink);
  border-left:2px solid var(--rule-2);padding-left:.6rem;
}
.board[data-state="offline"] .b-answer{color:var(--dim)}

/* ---- the instrument table: every channel, every topic ---- */
.chan{
  width:100%;border-collapse:collapse;table-layout:fixed;
  font-size:clamp(.76rem,1.05vw,.86rem);
}
.chan caption{
  caption-side:top;text-align:left;font-size:.66rem;letter-spacing:.13em;
  color:var(--faint);padding-bottom:.35rem;
}
.chan th,.chan td{padding:.42rem .4rem;vertical-align:top;text-align:left}
.chan thead th{
  font-size:.62rem;letter-spacing:.11em;color:var(--faint);font-weight:600;
  border-bottom:1px solid var(--rule-2);padding-bottom:.3rem;
}
.chan tbody tr{border-bottom:1px solid var(--rule)}
.chan tbody tr:last-child{border-bottom:0}
/* The name column carries two printed topics as well as the label, so it gets the room. AGE
   is nowrap and never needs more than "5s ago" / "never"; UNIT never more than "not declared"
   wrapped at its space. */
.chan col.c-name{width:48%}
.chan col.c-val{width:21%}
.chan col.c-unit{width:16%}
.chan col.c-age{width:15%}
.chan th[scope="row"]{font-weight:600;min-width:0}
/* Every wrapping cell below uses break-word rather than anywhere. `anywhere` broke
   "declared" into "declare"/"d" and a topic into "air_quality_l"/"evel" — mid-token breaks
   that make a dense table unreadable. break-word keeps the natural break opportunities
   (spaces, and the "/" in a topic) and only splits a token that genuinely cannot fit. */
.ch-name{display:block;overflow-wrap:break-word;color:var(--ink)}
.ch-topic{display:block;font-size:.88em;color:var(--faint);overflow-wrap:break-word;line-height:1.35;margin-top:.1rem}
.ch-topic::before{content:"state  ";color:var(--rule-2)}
.ch-disc{display:block;font-size:.88em;color:var(--faint);overflow-wrap:break-word;line-height:1.35}
.ch-disc::before{content:"config ";color:var(--rule-2)}
.ch-val{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:break-word;
  font-weight:600;color:var(--ink);
}
.ch-val .v-tag{
  display:block;font-size:.62rem;letter-spacing:.1em;font-weight:700;
  font-family:inherit;margin-bottom:.05rem;
}
.ch-val[data-cur="0"]{color:var(--dim);font-weight:500}
.ch-val[data-cur="none"]{color:var(--faint);font-weight:500;font-style:italic}
.ch-val[data-tag="LAST"] .v-tag,.ch-val[data-tag="STALE"] .v-tag{color:var(--band-mod)}
.ch-val[data-tag="FAULT"] .v-tag{color:var(--band-unh)}
/* The board's own word is not a measurement and must not carry a measurement's weight. */
.ch-val[data-tag="BOARD"]{color:var(--dim)}
.ch-val[data-tag="BOARD"] .v-num{font-weight:400}
.ch-val[data-tag="BOARD"] .v-tag{color:var(--dim)}
.ch-unit{color:var(--dim);overflow-wrap:break-word}
.ch-unit[data-declared="0"]{color:var(--faint);font-style:italic}
.ch-age{color:var(--faint);font-variant-numeric:tabular-nums;overflow-wrap:break-word;white-space:nowrap}
.chan tbody.grp-avail tr{background:var(--panel-2)}
.chan tbody.grp-avail th[scope="row"]{color:var(--dim)}

.b-foot{
  margin:0;display:grid;gap:.3rem .8rem;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));
  border-top:1px solid var(--rule);padding-top:.55rem;
  font-size:clamp(.7rem,1vw,.79rem);
}
.b-foot div{min-width:0}
.b-foot dt{color:var(--faint);letter-spacing:.08em;font-size:.9em}
.b-foot dd{margin:0;color:var(--dim);overflow-wrap:break-word;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------- waiting */
.waiting{
  border:1px dashed var(--rule-2);background:var(--panel);
  padding:clamp(1.2rem,4vw,2.6rem);color:var(--dim);
}
.waiting h2{font-size:clamp(1rem,1.8vw,1.25rem);color:var(--ink);margin-bottom:.4rem}
.waiting p{max-width:56ch;font-size:clamp(.82rem,1.15vw,.93rem)}

/* ---------------------------------------------------------- the scale */
.scale{background:var(--panel);border:1px solid var(--rule);box-shadow:var(--shadow);padding:calc(var(--sp) * .9)}
.scale h3{font-size:.68rem;letter-spacing:.13em;color:var(--faint);font-weight:600}
.scale h3 .lit{letter-spacing:0}
.track{margin-top:1.9rem;position:relative}
.segs{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--rule-2)}
.seg{padding:.35rem .4rem;min-width:0;border-right:1px solid var(--rule-2)}
.seg:last-child{border-right:0}
.seg i{display:block;height:.5rem;background:currentColor;margin-bottom:.3rem}
.seg b{display:block;font-size:clamp(.62rem,.95vw,.75rem);font-weight:650;color:var(--ink);overflow-wrap:break-word;line-height:1.25}
.seg em{display:block;font-style:normal;font-size:clamp(.58rem,.9vw,.7rem);color:var(--faint);font-variant-numeric:tabular-nums;margin-top:.1rem}
.pins{position:absolute;left:0;right:0;top:-1.55rem;height:1.55rem;pointer-events:none}
.pin{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap}
.pin span{
  display:block;font-size:.63rem;font-weight:700;letter-spacing:.04em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color:var(--pin,var(--ink));
}
.pin::after{content:"";display:block;width:1px;height:.55rem;margin:.1rem auto 0;background:var(--pin,var(--ink))}
.parked{
  margin-top:.7rem;font-size:clamp(.72rem,1vw,.82rem);color:var(--faint);
  border-top:1px solid var(--rule);padding-top:.5rem;overflow-wrap:break-word;
}
.parked b{color:var(--dim);font-weight:650}

/* ---------------------------------------------------------- materials */
.materials{
  background:var(--panel);border:1px solid var(--rule);box-shadow:var(--shadow);
  padding:calc(var(--sp) * .9);
  display:grid;gap:.9rem var(--sp);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));
}
.materials h3{
  grid-column:1/-1;font-size:.68rem;letter-spacing:.13em;color:var(--faint);font-weight:600;
}
.materials section{min-width:0}
.materials h4{font-size:clamp(.8rem,1.15vw,.9rem);color:var(--ink);margin-bottom:.2rem}
.materials p{font-size:clamp(.74rem,1.05vw,.84rem);color:var(--dim);line-height:1.6;overflow-wrap:break-word}
.materials code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.94em;color:var(--faint);
}
/* HONEST MATERIALS and the colophon now live on the settings panel. On the wall they
   were 447px of prose nobody could reach — and worse, they pushed the EPA breakpoint
   scale and the "Parked, not pinned" callout, which name the standard and the dead
   boards, below the fold of an unattended display. Same words, one keypress away. */
#settings .materials{margin-top:1.6rem}
#settings footer.colophon{margin-top:1rem}
footer.colophon{
  color:var(--faint);font-size:clamp(.72rem,1vw,.8rem);line-height:1.7;
  padding:0 .2rem 1.2rem;
}
footer.colophon b{color:var(--dim);font-weight:650}
kbd{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  border:1px solid var(--rule-2);padding:0 .3rem;font-size:.92em;color:var(--dim);
}

/* ---------------------------------------------------------- settings */
#settings{
  position:fixed;inset:0;z-index:60;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  display:grid;place-items:start center;padding:var(--sp);
}
#settings[hidden]{display:none}
.set-card{
  background:var(--panel);border:1px solid var(--rule-2);border-top:3px solid var(--ink);
  padding:calc(var(--sp) * .95);width:min(100%,44rem);
}
.set-card h2{font-size:clamp(.95rem,1.6vw,1.15rem)}
.set-card>p{color:var(--dim);font-size:.84rem;margin-top:.3rem}
.form{display:grid;gap:.75rem var(--sp);grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));align-items:end;margin-top:1rem}
.f{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.f label{font-size:.66rem;letter-spacing:.12em;color:var(--faint)}
.f input{
  background:var(--paper);color:var(--ink);border:1px solid var(--rule-2);
  padding:.5rem .55rem;font:inherit;font-size:.92rem;min-width:0;width:100%;
}
.f input:focus{outline:2px solid var(--band-good);outline-offset:1px}
.f-check{flex-direction:row;align-items:center;gap:.45rem}
.f-check label{letter-spacing:0;color:var(--dim);font-size:.85rem}
.f-check input{width:auto}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
button{
  font:inherit;font-weight:650;cursor:pointer;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);padding:.5rem 1rem;
}
button.ghost{background:transparent;color:var(--dim);border-color:var(--rule-2)}
.set-hint{color:var(--faint);font-size:.78rem;margin-top:.8rem}

/* ---------------------------------------------------------- calm screen */
#calm{
  position:fixed;inset:0;z-index:80;background:var(--paper);
  display:grid;place-items:center;padding:8vmin;
}
#calm[hidden]{display:none}
#calm p{
  max-width:34ch;font-size:clamp(1.15rem,3.4vw,2.1rem);line-height:1.4;
  font-weight:500;color:var(--ink);letter-spacing:-.012em;text-wrap:balance;
}

/* ---------------------------------------------------------- demo marker
   This is a health display for children in a burning season. A simulated
   reading must be impossible to mistake for a real one — in the room, and in a
   photograph of the room. So the marker is a full-bleed sticky bar that cannot
   be scrolled away, carrying the word DEMO, the same word in Thai, and the
   value being simulated. It is drawn in ink-on-paper and never in a band
   colour: a marker that borrowed green or red would be imitating a reading.
   Rule A still holds — every capital below is typed as a capital by hand and
   there is no case-mapping rule here either. */
#demo-bar{
  position:sticky;top:0;z-index:70;
  margin:calc(var(--sp) * -1) calc(var(--sp) * -1) var(--sp);
  padding:.5rem calc(var(--sp) * .9);
  background:var(--ink);color:var(--paper);
  border-bottom:.3rem solid var(--paper);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem .9rem;min-width:0;
}
#demo-bar[hidden]{display:none}
.demo-word{
  flex:none;background:var(--paper);color:var(--ink);
  padding:.1rem .55rem;font-weight:700;letter-spacing:.18em;
  font-size:clamp(1rem,2.3vw,1.55rem);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
.demo-say{font-weight:650;font-size:clamp(.8rem,1.3vw,1rem);letter-spacing:.03em;min-width:0}
.demo-val{font-size:clamp(.82rem,1.35vw,1.05rem);font-weight:700;overflow-wrap:break-word;min-width:0}
.demo-exit{
  margin-left:auto;font-size:clamp(.7rem,1vw,.8rem);min-width:0;
  color:color-mix(in srgb,var(--paper) 68%,var(--ink));overflow-wrap:break-word;
}
/* A photograph cropped to one panel must still say DEMO, so every panel and the
   headline verdict repeat it. Both are CSS-only, so the renderer that draws a
   real reading and the renderer that draws a simulated one stay the same code. */
body[data-demo="1"] .board::before{
  content:var(--demo-badge);
  order:-1;
  margin:calc(var(--sp) * -.9) calc(var(--sp) * -.9) 0;
  padding:.22rem calc(var(--sp) * .9);
  background:var(--ink);color:var(--paper);
  font-size:.68rem;letter-spacing:.14em;font-weight:700;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
body[data-demo="1"] #verdict-a::before,
body[data-demo="1"] .hero-band::before{content:"DEMO · "}
</style>
</head>

  // ?lang= wins, then this browser, then the browser's own language, then English.
  // Storage is wrapped: a private window throws on the first read, and a wall that
  // cannot remember a language must still be able to show one.
  function pickLang() {
    var asked = '';
    try {
      asked = (new URLSearchParams(location.search).get('lang') || '').trim().toLowerCase();
    } catch (e) { asked = ''; }
    if (asked === 'th' || asked === 'en') return asked;
    try {
      var kept = localStorage.getItem(LANG_KEY);
      if (kept === 'th' || kept === 'en') return kept;
    } catch (e) {}
    try {
      var nav = String(navigator.language ||
        (navigator.languages && navigator.languages[0]) || '').toLowerCase();
      if (nav.indexOf('th') === 0) return 'th';
    } catch (e) {}
    return 'en';
  }

  var LANG = pickLang();
  // Stamped before anything is drawn, so the browser picks Thai line-breaking and the Thai
  // rules in the stylesheet on the first frame rather than after the first render.
  document.documentElement.setAttribute('lang', LANG);

  // Never returns undefined. A key present in neither table prints as itself, which is
  // loud in development and merely odd on a wall — a blank slot is neither.
  function t(key, vars) {
    var table = STR[LANG] || STR.en;
    var s = table[key];
    if (typeof s !== 'string') s = STR.en[key];
    if (typeof s !== 'string') s = key;
    if (!vars) return s;
    return s.replace(/\{(\w+)\}/g, function (whole, name) {
      return Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : whole;
    });
  }
