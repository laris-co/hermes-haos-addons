name: "ESP Web Flasher"
version: "2.10.0"
slug: "esp_flasher"
description: >-
  The Many Bodies, One Soul workshop gallery and web flasher, served inside the
  Home Assistant sidebar. Flash any of the workshop firmwares over USB, or set an
  already-flashed board's Wi-Fi, without leaving Home Assistant.
url: "https://github.com/laris-co/hermes-haos-addons/tree/main/esp-flasher"
arch:
  - amd64
  - aarch64
startup: application
# boot: auto — a host reboot leaves `boot: manual` add-ons stopped, and a stopped
# add-on reads as a failed install when it is nothing of the kind.
boot: auto
# The HA base image ships s6-overlay and owns PID 1 via ENTRYPOINT ["/init"].
init: false
hassio_api: false
homeassistant_api: false
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:usb-flash-drive
panel_title: ESP32 Workshop
panel_admin: false
stage: experimental
