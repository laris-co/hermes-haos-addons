name: "ESP Web Flasher"
version: "2.14.0"
slug: "esp_flasher"
description: >-
  The Many Bodies, One Soul workshop gallery and web flasher, served inside the
  Home Assistant sidebar. Flash any of the workshop firmwares over USB, or set an
  already-flashed board's Wi-Fi, without leaving Home Assistant.
url: "https://github.com/laris-co/hermes-haos-addons/tree/main/esp-flasher"
arch:
  - amd64
  - aarch64
startup: application
# boot: auto — a host reboot leaves `boot: manual` add-ons stopped, and a stopped
# add-on reads as a failed install when it is nothing of the kind.
boot: auto
# The HA base image ships s6-overlay and owns PID 1 via ENTRYPOINT ["/init"].
init: false
hassio_api: false
homeassistant_api: false
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:usb-flash-drive
panel_title: ESP32 Workshop
panel_admin: false
stage: experimental
options:
  # Set once per install, in this add-on's own Configuration tab — never in
  # git, never in the image. If set, every wall under /wall/ fills its
  # connection form and connects on its own, in ANY browser on ANY device,
  # because the value is rendered server-side at container start rather than
  # relying on one browser's localStorage. Leave blank to require the normal
  # ?u=/?p= or the "s" settings panel, same as before this option existed.
  mqtt_user: ""
  mqtt_password: ""
  # Broker location override. Blank host = each wall's existing default
  # (this page's own hostname, port 1884, plain ws://) — the LAN/ingress path.
  # Set all three to point every wall at a broker reachable from OUTSIDE the
  # LAN instead, e.g. a Cloudflare Tunnel published straight to the broker
  # (host: the tunnel's public hostname, port: "443", tls: true → wss://).
  mqtt_host: ""
  mqtt_port: ""
  mqtt_tls: false
schema:
  mqtt_user: str
  mqtt_password: password
  mqtt_host: str
  mqtt_port: str
  mqtt_tls: bool
