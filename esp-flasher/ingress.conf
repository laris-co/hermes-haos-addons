server {
    listen 8099;
    server_name _;

    # Supervisor is the only peer allowed to reach an ingress service; Home
    # Assistant has already authenticated the user.
    allow 172.30.32.2;
    deny all;

    server_tokens off;

    # DNS for the upstream. An add-on container resolves through Supervisor's
    # DNS at 172.30.32.3; the others are fallbacks. Without a resolver, nginx
    # cannot use a VARIABLE in proxy_pass and fails at request time, not at
    # config test — so this looks fine until the first page load.
    resolver 172.30.32.3 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Serve the REAL workshop gallery, not a local rewrite of it. Two reasons
    # this is a proxy rather than a copy:
    #   · docs/ is 89 MB (47 firmware .bin files) — far too big for the image
    #   · proxied means always current; a copy silently goes stale
    #
    # Verified before building: index.html has ZERO absolute (`/…`) references —
    # every link is relative or fully-qualified external. Absolute paths are what
    # break an SPA under an ingress mount, so this one survives being served from
    # /api/hassio_ingress/<token>/.
    # Injected helper, served locally so it is same-origin under script-src 'self'.
    location = /_panel.js {
        alias /usr/share/esp-flasher/panel.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # The FLASHER is the landing page, not the gallery — this panel exists to
    # flash boards. The page's own "← Fleet gallery" link is relative, so it
    # still reaches index.html through the same proxy.
    location = / {
        set $upstream "the-oracle-keeps-the-human-human.github.io";
        rewrite ^ /workshop-04-esp32-wasm/flasher.html break;
        proxy_pass https://$upstream;
        proxy_set_header Host $upstream;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # Keep every link INSIDE the panel. index.html carries 16 target="_blank"
        # attributes (books, GitHub links); in an ingress iframe each one throws
        # the user out into a new browser tab and loses the Home Assistant shell.
        # sub_filter needs an UNCOMPRESSED upstream body, which is why
        # `proxy_set_header Accept-Encoding "";` above is load-bearing, not tidy.
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter 'target="_blank"' '';
        sub_filter '</body>' '<script src="_panel.js"></script></body>';
        sub_filter "target='_blank'" '';

        # GitHub Pages sends long-lived cache headers. Proxied into a panel that
        # can change version-to-version, that means the browser keeps serving the
        # OLD page after an add-on update — which looked exactly like the update
        # not applying. HTML must never be cached here; assets still may be.
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, must-revalidate" always;

        add_header Permissions-Policy "serial=(self)" always;
        # Verified in a browser against flasher.html's REAL inline module script:
        # executes with zero violations, and unpkg/api.github.com/fonts all load.
        # 'unsafe-inline' is required and not laziness — this proxy mirrors
        # upstream byte-for-byte and cannot inject per-request nonces.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com; frame-ancestors 'self';" always;
    }

    location / {
        set $upstream "the-oracle-keeps-the-human-human.github.io";

        # ⚠ proxy_pass with a VARIABLE ignores the URI part of the directive and
        # forwards the original request URI unchanged. Writing
        #   proxy_pass https://$upstream/workshop-04-esp32-wasm/;
        # silently sends /flasher.html to the ORG root instead of the project
        # path — and because the org root also serves this gallery, every page
        # returned 200 with the index content. It looked like it worked.
        # The rewrite is what actually prefixes the project path.
        rewrite ^/(.*)$ /workshop-04-esp32-wasm/$1 break;
        proxy_pass https://$upstream;

        proxy_set_header Host $upstream;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        # firmware .bin files are multi-MB; small buffers stall them
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;

        # GitHub Pages sets its own caching; firmware URLs are content-addressed
        # by the page's versioned() helper, so let them cache normally.
        proxy_redirect off;

        # NOTE: proxy_hide_header X-Frame-Options is a NO-OP here, and the old
        # comment claiming otherwise was wrong. GitHub Pages sends no such header
        # to hide, and Home Assistant's Supervisor ingress gateway stamps
        # X-Frame-Options: SAMEORIGIN onto every ingress response AFTER it leaves
        # this container — nginx never sees it. Measured: every proxied response,
        # including the 404 page, arrives at the browser with SAMEORIGIN. Framing
        # still works only because SAMEORIGIN permits the same-origin ingress
        # iframe. Kept in case upstream ever sends a restrictive value of its own.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # Web Serial needs an explicit grant when the document is framed, which
        # it is here (HA renders ingress panels in an iframe).

        # Keep every link INSIDE the panel. index.html carries 16 target="_blank"
        # attributes (books, GitHub links); in an ingress iframe each one throws
        # the user out into a new browser tab and loses the Home Assistant shell.
        # sub_filter needs an UNCOMPRESSED upstream body, which is why
        # `proxy_set_header Accept-Encoding "";` above is load-bearing, not tidy.
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter 'target="_blank"' '';
        sub_filter '</body>' '<script src="_panel.js"></script></body>';
        sub_filter "target='_blank'" '';

        # GitHub Pages sends long-lived cache headers. Proxied into a panel that
        # can change version-to-version, that means the browser keeps serving the
        # OLD page after an add-on update — which looked exactly like the update
        # not applying. HTML must never be cached here; assets still may be.
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, must-revalidate" always;

        add_header Permissions-Policy "serial=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com; frame-ancestors 'self';" always;
    }
}
