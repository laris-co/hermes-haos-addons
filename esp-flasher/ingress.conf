server {
    listen 8099;
    server_name _;

    # Supervisor is the only peer allowed to reach an ingress service; HA has
    # already authenticated the user. This is the whole auth boundary, which is
    # why config.yaml publishes no port.
    allow 172.30.32.2;
    deny all;

    root /usr/share/esp-flasher;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    # DELIBERATELY different from the other add-ons in this repo.
    #
    # Every other page here ships `default-src 'none'` with NO script-src, because
    # an inline <script> under that policy is blocked silently — no console error,
    # no visible failure. That is correct for a static page.
    #
    # This add-on is the exception: esp-web-tools IS JavaScript, loaded as an ES
    # module from unpkg, and it opens a Web Serial port. So script-src and
    # connect-src must name unpkg explicitly. Narrow, not absent.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://unpkg.com; connect-src 'self' https://unpkg.com https://*.github.io; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'self'" always;

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
