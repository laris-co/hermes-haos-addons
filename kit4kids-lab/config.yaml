name: "Kit4Kids Lab"
version: "1.0.0"
slug: "kit4kids_lab"
description: >-
  The classroom bench card for the Kit4Kids PM2.5 kit — wiring, sensor, MQTT
  topics and the build order, on one page in the Home Assistant sidebar. Named
  and coloured per classroom from the add-on's Configuration tab.
url: "https://github.com/laris-co/hermes-haos-addons/tree/main/kit4kids-lab"
arch:
  - amd64
  - aarch64
startup: application
# boot: auto, deliberately. A host reboot leaves boot: manual add-ons stopped,
# and a stopped add-on reads as a failed install when it is nothing of the kind.
# Measured 2026-08-25: a reboot took down 8 of 21 add-ons, every one boot: manual.
boot: auto
# The Home Assistant base image ships s6-overlay and owns PID 1 via its inherited
# ENTRYPOINT ["/init"]. CMD runs underneath it. Never add a second init.
init: false
hassio_api: false
homeassistant_api: false
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:air-filter
panel_title: Kit4Kids Lab
panel_admin: false
stage: experimental
options:
  lab_name: "Kit4Kids"
  accent_color: "#32c999"
  mqtt_prefix: "DUSTBOY/DBK"
schema:
  lab_name: str
  accent_color: str
  mqtt_prefix: str
