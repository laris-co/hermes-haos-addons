server {
    listen 8099;
    server_name _;

    # Home Assistant Supervisor is the only peer allowed to reach an ingress
    # service. HA has already authenticated the user, which is the whole reason
    # there is no `ports:` entry to go around this.
    allow 172.30.32.2;
    deny all;

    root /usr/share/kit4kids-lab;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # No script-src, and default-src 'none' — an inline <script> here is dropped
    # SILENTLY, nothing in the console, nothing in the UI. This page is HTML+CSS
    # only by design. Need JS? Ship a same-origin file and add script-src 'self'.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; frame-ancestors 'self'" always;

    location / {
        # The page is regenerated at every container start, so it must never be
        # served from a browser's heuristic cache — an option change would be
        # applied correctly and simply never seen.
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
