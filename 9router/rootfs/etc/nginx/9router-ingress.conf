# 9Router ingress sidecar.
#
# WHY THIS FILE EXISTS — measured, not assumed.
# 9Router's dashboard is a Next.js app that emits ROOT-RELATIVE asset paths and
# has no awareness of a reverse-proxy path prefix. Verified against the running
# 0.5.55 image:
#
#   $ curl -s :20128/          -> 307, Location: /dashboard      (absolute)
#   $ curl -s :20128/login | grep -c '(src|href)="/'  -> 20
#   $ curl -s :20128/_next/static/chunks/webpack-*.js | grep -o '\.p="[^"]*"'
#       .p="/_next/"
#
# Fetching /login with and without `X-Ingress-Path` returns BYTE-IDENTICAL HTML,
# so the app genuinely ignores the header. Under HA's path-prefixed ingress the
# browser would request /_next/... at the site root, past the ingress mount, and
# get Home Assistant's 404 instead of the asset.
#
# Supervisor strips the ingress prefix before forwarding and passes the original
# in X-Ingress-Path, so nginx can put it back on the way out. Three separate
# rewrites are needed and each covers a case the others do not:
#
#   1. proxy_redirect   — the 307 Location header. Without this the very first
#                         request escapes the mount before any asset loads.
#   2. sub_filter HTML  — the 20 static src/href references on the page.
#   3. sub_filter JS    — webpack's baked `.p="/_next/"`, which is what dynamic
#                         chunk loading reads. Rewriting only the HTML gets the
#                         first paint and then fails on the first route change.
#
# A fourth case, fetch()/XHR to root-relative API paths, cannot be fixed by text
# substitution safely — "/api/ appears in too many innocuous contexts to rewrite
# blindly. That is handled by the injected shim below, which patches the request
# APIs at runtime instead of guessing at build text.

pid        /var/lib/nginx/9router-ingress.pid;
error_log  /dev/stderr warn;
daemon     off;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    server_tokens off;

    # Websocket/SSE upgrade. Passing the client's Connection header straight
    # through works for a plain upgrade and breaks on keep-alive, so it is mapped.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 20129 default_server;
        server_name _;

        # Without this, nginx expands a rewritten Location back into an ABSOLUTE
        # url using its own listen address — the proxy_redirect below produced
        # `http://127.0.0.1:20129/api/hassio_ingress/<token>/dashboard`, sending
        # the browser at the add-on's internal port instead of back through
        # ingress. Measured, not theoretical. Relative Location is what ingress
        # needs and what every modern browser accepts.
        absolute_redirect off;
        port_in_redirect  off;

        # The dashboard serves a large JS bundle; the default 1m is ample but the
        # 413 it produces on upload endpoints is confusing, so it is explicit.
        client_max_body_size 32m;

        # Injected before </head>, so it runs before any framework code.
        #
        # It patches the three request paths text substitution cannot safely reach:
        # fetch(), XMLHttpRequest, and the src/href setters used to inject script and
        # link elements at runtime. Each guard checks the URL is root-relative AND
        # not already prefixed, so a double application is a no-op — which matters
        # because sub_filter may also have rewritten the same URL already.
        set $shim '<script>(function(){var P="$http_x_ingress_path";if(!P)return;function f(u){return (typeof u==="string"&&u.charAt(0)==="/"&&u.indexOf(P+"/")!==0&&u.indexOf("//")!==0)?P+u:u;}var of=window.fetch;if(of)window.fetch=function(u,o){try{if(typeof u==="string")u=f(u);else if(u&&u.url)u=new Request(f(u.url),u);}catch(e){}return of.call(this,u,o);};var xo=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){var a=[].slice.call(arguments);if(typeof u==="string")a[1]=f(u);return xo.apply(this,a);};[[HTMLScriptElement,"src"],[HTMLLinkElement,"href"],[HTMLImageElement,"src"]].forEach(function(p){var d=Object.getOwnPropertyDescriptor(p[0].prototype,p[1]);if(!d||!d.set)return;Object.defineProperty(p[0].prototype,p[1],{get:function(){return d.get.call(this);},set:function(v){d.set.call(this,typeof v==="string"?f(v):v);},configurable:true});});})();</script>';

        location / {
            proxy_pass http://127.0.0.1:20128;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The dashboard uses SSE and websockets for live token/quota updates.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;

            # sub_filter cannot rewrite a gzipped body, and Next.js will happily
            # gzip. Asking upstream for identity encoding is the only way the
            # filters below run at all — omit this and everything silently passes
            # through unmodified while looking correctly configured.
            proxy_set_header Accept-Encoding "";

            # 307 Location: /dashboard -> <prefix>/dashboard. Scheme-relative and
            # absolute URLs are left alone.
            proxy_redirect ~^/(?!/)(.*)$ $http_x_ingress_path/$1;

            sub_filter_once off;
            sub_filter_types text/html application/javascript text/javascript application/manifest+json text/css;
            sub_filter 'url(/_next/' 'url($http_x_ingress_path/_next/';
        sub_filter '"/_next/'  '"$http_x_ingress_path/_next/';
            sub_filter "'/_next/"  "'$http_x_ingress_path/_next/";
            sub_filter '"/favicon' '"$http_x_ingress_path/favicon';
            sub_filter '"/manifest.webmanifest' '"$http_x_ingress_path/manifest.webmanifest';
            sub_filter '</head>' '$shim</head>';
        }
    }
}
