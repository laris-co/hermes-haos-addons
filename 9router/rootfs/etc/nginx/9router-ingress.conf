# 9Router ingress sidebar wrapper.
#
# WHY THIS IS A STATIC WRAPPER, NOT A PROXY.
# 9Router is a Next.js App-Router SPA. It cannot be served under Home Assistant's
# ingress path-prefix, and this was proven live, not assumed:
#   - it does hard `window.location` redirects to root-relative paths (after login
#     it navigates to /dashboard at the site root) that escape the ingress mount →
#     HA answers its own bare "404: Not Found";
#   - it builds absolute API URLs from `window.location.origin` in ~21 places
#     (OAuth authorize/device-code, the /v1 endpoint display, CLI-tool cards);
#   - `window.location` assignment cannot be intercepted by any reverse proxy, and
#     OAuth redirect_uri can't round-trip through a per-session token path anyway.
# A previous version of this file tried to rewrite HTML/CSS/JS/fetch/History to
# make ingress work; it got the first paint but navigation still broke. That whole
# approach is gone.
#
# Instead the app is exposed on a published port (config.yaml `ports: 20128`).
# This sidecar serves ONE static page on ingress port 20129; that page embeds the
# direct app in a full-size nested iframe. The user sees the complete app inside
# HA while 9Router itself remains at a root origin where its routing works.
#
# Loaded with `nginx -c <this file>`, i.e. as a COMPLETE config, so it needs its
# own events{}/http{}. pid/error_log/temp all live under /tmp because the
# container drops to the non-root `node` user (su-exec) and /tmp is always
# writable — no dependency on chown'ing an nginx spool dir.

pid        /tmp/9router-sidebar.pid;
error_log  /dev/stderr warn;
daemon     off;

events {
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  text/html;
    access_log    off;
    server_tokens off;
    sendfile      on;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 20129 default_server;
        server_name _;

        root /usr/share/9router-launcher;

        # Any ingress sub-path shows the wrapper — there is nothing else to serve.
        location / {
            try_files /index.html =404;
        }
    }
}
