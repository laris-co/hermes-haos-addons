<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>9Router</title>
<style>
  :root { color-scheme: dark; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { background: #0a0a0a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: block; width: 100%; height: 100%; border: 0; background: #0a0a0a; }
  #external {
    position: fixed; right: 12px; bottom: 12px; z-index: 3;
    display: none; width: 34px; height: 34px; place-items: center;
    border: 1px solid #3d3b38; border-radius: 9px; background: #161616d9;
    color: #d9d6cf; text-decoration: none; font-size: 18px; line-height: 1;
    box-shadow: 0 3px 14px #0008;
  }
  #external:hover, #external:focus-visible { background: #272522; color: #fff; }
  #status {
    position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
    background: #0a0a0a; color: #a7a49c; font-size: 14px;
  }
  #status[hidden] { display: none; }
  #status .card { max-width: 440px; padding: 24px; text-align: center; line-height: 1.55; }
  #status strong { display: block; color: #ece9e2; font-size: 18px; margin-bottom: 8px; }
  #status a {
    display: inline-block; margin-top: 18px; padding: 10px 16px;
    border-radius: 8px; background: #f0653a; color: #fff; font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div id="status" role="status">
    <div class="card">
      <strong id="title">Loading 9Router…</strong>
      <span id="message">Opening the dashboard inside Home Assistant.</span><br />
      <a id="fallback" href="#" target="_blank" rel="noopener" hidden>Open 9Router in a new tab ↗</a>
    </div>
  </div>
  <a id="external" href="#" target="_blank" rel="noopener" title="Open 9Router in a new tab" aria-label="Open 9Router in a new tab">↗</a>
  <iframe
    id="app"
    title="9Router dashboard"
    allow="clipboard-read; clipboard-write"
    allowfullscreen
  ></iframe>
<script>
  (function () {
    var PORT = 20128;
    var directProtocol = location.protocol === "https:" ? "http:" : location.protocol;
    var url = directProtocol + "//" + location.hostname + ":" + PORT + "/dashboard";
    var frame = document.getElementById("app");
    var status = document.getElementById("status");
    var title = document.getElementById("title");
    var message = document.getElementById("message");
    var fallback = document.getElementById("fallback");
    var external = document.getElementById("external");
    var loaded = false;

    fallback.href = url;
    external.href = url;

    function showFallback(reason) {
      title.textContent = "Open 9Router on the LAN";
      message.textContent = reason;
      fallback.hidden = false;
      status.hidden = false;
    }

    if (location.protocol === "https:") {
      showFallback("The dashboard uses a plain-HTTP LAN port, so browsers cannot embed it inside an HTTPS Home Assistant page.");
      return;
    }

    frame.addEventListener("load", function () {
      loaded = true;
      status.hidden = true;
      external.style.display = "grid";
    });

    frame.addEventListener("error", function () {
      showFallback("The embedded dashboard could not be reached.");
    });

    var controller = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (controller) controller.abort();
      if (!loaded) showFallback("The embedded dashboard did not respond. Check that the add-on is running.");
    }, 12000);

    // A no-CORS request can prove network reachability without asking 9Router to
    // expose its API cross-origin. The response is intentionally opaque.
    fetch(url, {
      mode: "no-cors",
      cache: "no-store",
      signal: controller ? controller.signal : undefined
    }).then(function () {
      frame.src = url;
    }).catch(function () {
      clearTimeout(timer);
      showFallback("The embedded dashboard could not be reached. Check that the add-on is running.");
    });

    frame.addEventListener("load", function () { clearTimeout(timer); });

    // The app stays on its own root origin, so its Next.js navigation, API URLs,
    // cookies, provider OAuth, and static assets work normally. Home Assistant
    // only frames that origin; it no longer tries to reverse-proxy the SPA under
    // its dynamic ingress prefix.
  })();
</script>
</body>
</html>
