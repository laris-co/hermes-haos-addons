server {
    listen 8099;
    server_name _;

    # Home Assistant Supervisor is the only network peer allowed to reach an
    # ingress service. Authentication has already happened in Home Assistant.
    allow 172.30.32.2;
    deny all;

    root /usr/share/hello-world;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
