<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #f4f7fb;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(50, 201, 153, .18), transparent 30%),
        radial-gradient(circle at 85% 82%, rgba(62, 130, 247, .16), transparent 34%),
        #0d1117;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(34px, 7vw, 64px);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 28px;
      background: rgba(17, 23, 32, .82);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .42);
      backdrop-filter: blur(18px);
      text-align: center;
    }
    .wave {
      display: inline-grid;
      place-items: center;
      width: 74px;
      height: 74px;
      margin-bottom: 22px;
      border-radius: 22px;
      background: linear-gradient(145deg, #45d4a4, #2d78f3);
      box-shadow: 0 16px 38px rgba(45, 120, 243, .28);
      font-size: 38px;
    }
    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 72px);
      line-height: .98;
      letter-spacing: -.055em;
    }
    .lead {
      max-width: 510px;
      margin: 22px auto 0;
      color: #aab5c5;
      font-size: clamp(16px, 2.7vw, 20px);
      line-height: 1.6;
    }
    .proof {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }
    .proof span {
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 999px;
      background: rgba(255, 255, 255, .045);
      color: #c8d1df;
      font-size: 13px;
      font-weight: 650;
    }
    footer {
      margin-top: 32px;
      color: #6f7b8d;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      body { padding: 18px; }
      main { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="wave" aria-hidden="true">👋</div>
    <h1>Hello, catlab.</h1>
    <p class="lead">
      This page is running as a real Home Assistant app, protected by your HA
      login and rendered directly inside the sidebar.
    </p>
    <div class="proof" aria-label="App properties">
      <span>Ingress authenticated</span>
      <span>No published port</span>
      <span>Zero secrets</span>
    </div>
    <footer>repository → supervisor → ingress → sidebar</footer>
  </main>
</body>
</html>
