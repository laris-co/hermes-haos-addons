<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kit4Kids Rules</title>
  <style>
    :root{--accent:#32c999;--bg:#0d1117;--panel:#111722;--ink:#f4f7fb;--muted:#8b98a9;--line:rgba(255,255,255,.1)}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Thai",sans-serif}
    header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
    header h1{font-size:16px;margin:0}
    header p{margin:0;color:var(--muted);font-size:12.5px}
    main{display:grid;grid-template-columns:1fr 360px;height:calc(100% - 58px)}
    #blockly-div{width:100%;height:100%}
    aside{border-left:1px solid var(--line);padding:16px;overflow:auto;background:var(--panel)}
    aside h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 10px}
    pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#0a0e14;
        border:1px solid var(--line);border-radius:8px;padding:12px;line-height:1.6}
    .note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6}
    .note code{background:rgba(50,201,153,.15);padding:1px 5px;border-radius:4px}
  </style>
</head>
<body>
  <header>
    <h1>🧩 Kit4Kids Rules</h1>
    <p>ลาก block เพื่อสร้างกติกา — โค้ดที่ได้คือ ESPHome lambda จริงจาก pms7003.yaml</p>
  </header>
  <main>
    <div id="blockly-div"></div>
    <aside>
      <h2>ESPHome lambda ที่ generate</h2>
      <pre id="code-output"></pre>
      <p class="note">
        เอาโค้ดนี้ไปวางใน <code>packages/pms7003.yaml</code> ตรง <code>pm_2_5.on_value.then</code>
        — เหมือนที่บอร์ดจริงใช้ตัดสิน GOOD/FAIR/BAD
      </p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
