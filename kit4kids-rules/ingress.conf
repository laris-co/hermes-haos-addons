server {
    listen 8099;
    server_name _;
    allow 172.30.32.2;
    deny all;

    root /usr/share/kit4kids-rules;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # script-src 'self' — this app is a real Blockly bundle, not HTML+CSS only.
    # The bundle is VENDORED (bun build from node_modules, no CDN), so 'self'
    # is enough: no external origin is ever requested.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-ancestors 'self'" always;

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
