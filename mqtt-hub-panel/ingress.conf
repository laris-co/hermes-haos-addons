# Only send "Connection: upgrade" when the client actually asked for one —
# hardcoding it would send that header on every plain HTTP dashboard request
# too, which is wrong even if most backends tolerate it silently.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8100;
    server_name _;

    # Supervisor is the only peer allowed to reach an ingress service; Home
    # Assistant has already authenticated the user. Same pattern as esp-flasher.
    allow 172.30.32.2;
    deny all;

    server_tokens off;

    location / {
        # LITERAL mesh IP, deliberately — NOT the .netbird hostname. Nothing
        # in this container's DNS chain (Supervisor DNS, Docker embedded DNS,
        # public 1.1.1.1) knows how to resolve NetBird's own DNS TLD; only
        # NetBird's own embedded resolver does, and this container has no
        # route to it. A variable proxy_pass would also re-resolve on every
        # request regardless. If mqtt-hub's mesh IP ever changes:
        # `just nb-find mqtt-hub` in netbird-oracle.
        proxy_pass http://100.97.163.98:18083;

        proxy_set_header Host mqtt-hub.oracle.netbird;
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        proxy_read_timeout 60s;

        # EMQX dashboard is a websocket-backed SPA (live stats) — same upgrade
        # dance as the wall's MQTT-over-WS proxying elsewhere in this repo.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_hide_header X-Frame-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
