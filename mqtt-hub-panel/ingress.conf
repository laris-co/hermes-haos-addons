# Only send "Connection: upgrade" when the client actually asked for one —
# hardcoding it would send that header on every plain HTTP dashboard request
# too, which is wrong even if most backends tolerate it silently.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8100;
    server_name _;

    # Supervisor is the only peer allowed to reach an ingress service; Home
    # Assistant has already authenticated the user. Same pattern as esp-flasher.
    allow 172.30.32.2;
    deny all;

    server_tokens off;

    location / {
        # LAN IP, not the NetBird mesh IP. Measured: even with host_network,
        # this add-on container has no route to catlab's own NetBird
        # container's mesh interface — sibling add-on containers don't get
        # to ride catlab's mesh connection, only catlab's NetBird container
        # itself does. mqtt-hub and catlab happen to share the same physical
        # LAN (192.168.1.0/24) regardless of the mesh, so use that instead —
        # simpler, and doesn't depend on solving the container-routing
        # question at all. The mesh IP stays the right choice for access
        # from OUTSIDE this LAN (see the tracking issue's public-route item).
        proxy_pass http://192.168.1.140:18083;

        proxy_set_header Host mqtt-hub;
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        proxy_read_timeout 60s;

        # EMQX dashboard is a websocket-backed SPA (live stats) — same upgrade
        # dance as the wall's MQTT-over-WS proxying elsewhere in this repo.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_hide_header X-Frame-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
