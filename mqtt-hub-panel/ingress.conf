# Only send "Connection: upgrade" when the client actually asked for one —
# hardcoding it would send that header on every plain HTTP dashboard request
# too, which is wrong even if most backends tolerate it silently.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8100;
    server_name _;

    # Supervisor is the only peer allowed to reach an ingress service; Home
    # Assistant has already authenticated the user. Same pattern as esp-flasher.
    allow 172.30.32.2;
    deny all;

    server_tokens off;

    resolver 172.30.32.3 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $upstream "mqtt-hub.oracle.netbird";
        proxy_pass http://$upstream:18083;

        proxy_set_header Host $upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        proxy_read_timeout 60s;

        # EMQX dashboard is a websocket-backed SPA (live stats) — same upgrade
        # dance as the wall's MQTT-over-WS proxying elsewhere in this repo.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_hide_header X-Frame-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
