# Standalone nginx config (not a fragment — loaded via `nginx -c`,
# replacing nginx's default /etc/nginx/nginx.conf entirely) for the HA
# ingress sidecar in front of `thclaws --serve`.
#
# Unlike hermes-agent's equivalent config, thclaws needs NONE of the
# Host/Origin rewriting hermes requires — verified directly, not
# assumed:
#   - thclaws --serve binds 127.0.0.1 by default with no Host-header
#     allowlist at all (confirmed: a WS upgrade with
#     `Host: 127.0.0.1:8443` and a real ingress-shaped
#     `Origin: http://homeassistant.local:8123` succeeded with a real
#     101; a second attempt with a deliberately hostile
#     `Origin: http://evil.example.com` ALSO succeeded — thclaws does
#     no Origin-based CSWSH check on this endpoint at all. Upstream's
#     own `--help` text is explicit about the implication: "--bind
#     0.0.0.0 exposes the server publicly (only with auth in front)" —
#     this add-on's whole design (loopback bind + ingress) IS that
#     "auth in front", matching HA's own login as the trust boundary,
#     same model as every other ingress-only add-on here.
#   - The served page has zero absolute (`/...`) asset references
#     (verified: `grep -o '(src|href)="/[^"]*"' index.html` — 0
#     matches, unlike litellm's /ui/ or 9router's dashboard), so there
#     is no path-prefix problem for Supervisor's ingress-strips-the-
#     prefix behavior to break.
#
# This config still sets Host explicitly below anyway, as cheap
# defense-in-depth against a future thclaws release adding a Host
# check — NOT because it's required today (it verifiably isn't).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Standard recipe for a location serving both plain HTTP and
    # WebSocket upgrades: only ask for "Connection: upgrade" when the
    # client actually requested one.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8342;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:8443;
            proxy_http_version 1.1;

            proxy_set_header Host 127.0.0.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;

            # thclaws's WebSocket (/ws) is the agent's whole live
            # session — same "don't let nginx's default proxy timeout
            # silently kill an idle-but-open connection" reasoning as
            # hermes-agent's /api/ws and /api/pty.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
