name: "Hermes Logs"
version: "1.0.0"
slug: "hermes_logs"
description: >-
  A focused, live, redacted log console for the Hermes Gateway add-on. The
  browser never receives the Supervisor token, no port is published, and a
  small JSON/text API makes the same view scriptable from ingress-aware tools.
url: "https://github.com/laris-co/hermes-haos-addons/tree/main/hermes-logs"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
hassio_api: true
# Cross-add-on log reads require the Supervisor manager role. The app only
# issues GET requests to the configured add-on log endpoint.
hassio_role: manager
homeassistant_api: false
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:text-box-search-outline
panel_title: Hermes Logs
panel_admin: true
stage: experimental
options:
  target_addon: a90308c2_hermes_gateway
  default_lines: 250
  refresh_seconds: 3
schema:
  target_addon: str
  default_lines: int(50,1000)
  refresh_seconds: int(1,60)
