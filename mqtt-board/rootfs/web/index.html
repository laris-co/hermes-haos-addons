<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MQTT Board</title>
<style>
  /* No build step on purpose: no Vite, no committed dist/, nothing to fall out
     of sync with the source. Hand-written CSS, ~200 lines, ships as-is. */
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --ink:#e6e8ec; --dim:#9aa2b1; --faint:#6b7484;
    --accent:#4ade80; --warn:#fbbf24; --dead:#64748b; --drop:#3b82f6;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dfe3ea;
           --ink:#12151a; --dim:#5b6474; --faint:#8a93a3; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{display:grid;grid-template-columns:300px 1fr;height:100vh}
  @media (max-width:820px){ .wrap{grid-template-columns:1fr;height:auto} }

  aside{background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .head{padding:14px 16px;border-bottom:1px solid var(--line)}
  .head h1{margin:0;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
  .status{margin-top:6px;font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dead)}
  .dot.on{background:var(--accent)}
  #q{margin:10px 16px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:13px}
  #cat{overflow:auto;padding:0 10px 14px;flex:1;min-height:0}
  .topic{padding:7px 9px;margin:3px 0;border-radius:7px;background:var(--panel2);
    border:1px solid transparent;cursor:grab;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topic:hover{border-color:var(--line)}
  .topic:active{cursor:grabbing}
  .topic .v{color:var(--faint);margin-left:6px}
  .hint{color:var(--faint);font-size:12px;padding:8px 16px;line-height:1.5}

  main{overflow:auto;padding:16px;min-height:0}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .bar h2{margin:0;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:6px 11px;border-radius:7px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--faint)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;
    min-height:220px;border-radius:12px}
  #grid.empty{border:2px dashed var(--line);place-content:center;text-align:center;color:var(--faint);padding:44px 16px}
  #grid.over{outline:2px dashed var(--drop);outline-offset:5px}

  .tile{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;
    position:relative;cursor:grab}
  .tile.drag{opacity:.4}
  .tile.overt{border-color:var(--drop)}
  .tile .t{font-size:10.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .lab{font-size:12px;color:var(--dim);margin-top:3px}
  .tile .val{font-size:27px;font-weight:600;margin-top:5px;
    font-variant-numeric:tabular-nums;word-break:break-word;line-height:1.15}
  .tile .val.txt{font-size:14px;font-weight:500;font-family:ui-monospace,Menlo,monospace}
  .tile .unit{font-size:13px;color:var(--dim);margin-left:3px;font-weight:400}
  .tile .age{font-size:11px;color:var(--faint);margin-top:5px}
  .tile.stale .val{color:var(--warn)}
  .tile.dead{opacity:.62}
  .tile.dead .val{color:var(--dead)}
  .x{position:absolute;top:7px;right:8px;border:0;background:transparent;color:var(--faint);
    font-size:15px;cursor:pointer;padding:2px 5px;line-height:1;border-radius:5px}
  .x:hover{color:#ef4444;background:var(--panel2)}
  svg.sp{display:block;margin-top:7px;width:100%;height:26px}
  .err{background:#7f1d1d;color:#fee;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="head">
      <h1>MQTT Board</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="stat">connecting…</span></div>
    </div>
    <input id="q" placeholder="filter topics…" autocomplete="off">
    <div id="cat"></div>
    <div class="hint">Drag a topic onto the board. Drag tiles to reorder. The layout is saved on the server, so everyone sees the same board.</div>
  </aside>
  <main>
    <div id="err"></div>
    <div class="bar">
      <h2>Board — <span id="count">0</span> tiles</h2>
      <div><button id="clear">Clear board</button></div>
    </div>
    <div id="grid" class="empty">Drag topics here</div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
