# Standalone nginx config (not a fragment — this replaces the whole
# /etc/nginx/nginx.conf via `nginx -c`) for the HA ingress sidecar.
#
# Purpose: HA Supervisor's ingress proxy connects to this container on
# INGRESS_PORT (8099) and forwards the browser's request essentially
# unprefixed (Supervisor strips the /api/hassio_ingress/<token>/ part
# before proxying to the add-on — same contract every ingress add-on
# gets). This nginx sits in front of `hermes dashboard`, which is bound
# to 127.0.0.1 INSIDE this container (see the Dockerfile CMD) rather
# than 0.0.0.0.
#
# Why loopback + a local proxy instead of just binding 0.0.0.0 and
# using ingress directly: hermes_cli/web_server.py's should_require_auth()
# only disables the dashboard's own auth gate for a LOOPBACK bind — any
# non-loopback bind (0.0.0.0, a LAN IP) always demands a configured auth
# provider. A 0.0.0.0-bound dashboard behind ingress would therefore
# still show hermes's own login page, and that page hardcodes
# root-relative asset/fetch paths regardless of any X-Forwarded-Prefix
# header (confirmed by diffing two real responses — see
# hermes-agent/DOCS.md's ingress history). Binding loopback instead
# means hermes's OWN auth never engages at all (should_require_auth
# returns False), so the broken login page never renders — HA's own
# session (already required to reach the ingress URL in the first
# place) becomes the only auth boundary, exactly like every other
# ingress-only HA add-on (Node-RED, ESPHome builder, etc.).
#
# Home Assistant and Hermes use different names for the same path-prefix
# contract. Supervisor sends X-Ingress-Path; Hermes reads X-Forwarded-Prefix
# and uses it to rewrite dashboard asset, API, and WebSocket URLs. v1.1.0
# omitted that translation: / loaded, but every /assets/* request escaped the
# ingress mount and returned 404. See the live regression note in DOCS.md.
#
# Two hermes-side guards this config also has to satisfy for that loopback
# bind to accept our traffic (both in hermes_cli/web_server.py):
#   1. _is_accepted_host(): when bound_host is loopback, only accepts a
#      Host header in {localhost, 127.0.0.1, ::1} (port stripped) — a
#      DNS-rebinding defence. Supervisor's own Host header (the real HA
#      hostname/IP) would otherwise get a 400 "Invalid Host header".
#      Fixed below with `proxy_set_header Host 127.0.0.1`.
#   2. _ws_host_origin_reason(): the WebSocket-upgrade path (/api/ws,
#      /api/pty — what the embedded Chat tab actually uses) ALSO checks
#      the browser's Origin header against the same loopback set. A
#      real browser's Origin under ingress is the Home Assistant
#      frontend's own origin (e.g. https://ha.laris.co), which would
#      fail that check. But the same function reads
#      `if not origin: return None` BEFORE the loopback comparison — a
#      missing Origin header passes outright. Stripping Origin here
#      (rather than trying to spoof a value that might change across
#      hermes releases) is the simpler, more robust fix.
#   3. The peer-IP guard (_ws_client_is_allowed) requires the actual TCP
#      peer to be loopback too — satisfied automatically here since
#      nginx and hermes share this container's network namespace; no
#      config needed for that one.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Standard nginx recipe for a location that serves BOTH plain HTTP
    # and WebSocket upgrades: only ask for "Connection: upgrade" when
    # the client actually requested an upgrade, otherwise a normal
    # keep-alive/close value.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:9119;
            proxy_http_version 1.1;

            proxy_set_header Host 127.0.0.1;
            proxy_set_header Origin "";
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;

            # /api/ws and /api/pty are long-lived sockets (the chat
            # session and the PTY bridge) — nginx's default proxy
            # timeouts would silently kill an idle-but-open session.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
