name: "Hermes Agent"
version: "1.2.0"
slug: "hermes_agent"
description: >-
  Nous Research's Hermes Agent, running as `hermes dashboard` — the web UI
  that includes an embedded PTY-backed chat tab (the same interactive agent
  you'd otherwise only get from the `hermes` terminal command). This is the
  browser-reachable half of Hermes; see hermes-gateway for the messaging
  (Telegram/Discord/Slack/etc.) side. Wraps the upstream
  nousresearch/hermes-agent Docker image, plus an in-container nginx that
  makes HA ingress work — see DOCS.md for the full verified writeup,
  including a real 101-Switching-Protocols WebSocket round trip through it.
url: "https://github.com/laris-co/hermes-haos-addons/tree/main/hermes-agent"
# See hermes-gateway/config.yaml for the arch-claim rationale — same
# upstream image, same digest pin, both archs built natively upstream.
# nginx-light is a tiny cross-arch-trivial Debian package, adds nothing
# arch-specific.
arch:
  - amd64
  - aarch64
startup: application
boot: manual
# init: false (NOT true) — this image wraps upstream's own Docker image,
# which already ships its own s6-overlay supervisor and expects to own
# PID 1 (see docker/entrypoint-dispatch.sh in the hermes-agent source).
# The new nginx-ingress service (see rootfs/etc/s6-overlay/s6-rc.d/) is
# supervised BY that same s6 tree, not by Supervisor's init — this key
# is about who owns PID 1 in the container, unchanged by adding a
# second supervised service. Do not "fix" this to true: true is only
# correct for hermes-agent-lite (the minimal add-on next door), which
# has no bundled supervisor of its own — see that add-on's config.yaml.
init: false
hassio_api: false
homeassistant_api: false
host_network: false
# ingress: true — REPLACES the v1 direct-port design, verified working
# end to end (2026-08-24), including the WebSocket upgrade the chat tab
# depends on. See DOCS.md for the full architecture (loopback bind +
# in-container nginx translating Host/Origin) and the real request/
# response transcript, including a genuine HTTP/1.1 101 Switching
# Protocols on both /api/ws and /api/pty through the whole chain with a
# simulated HA-ingress Origin header. No `ports:` block — this add-on
# is reachable ONLY through Home Assistant's sidebar now; there is no
# direct-port fallback shipped alongside it (the v1 approach is
# preserved in git history if ever needed again — see DOCS.md).
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy
panel_title: Hermes Agent
options:
  openrouter_api_key: ""
  openrouter_base_url: ""
  inference_provider: ""
  inference_model: ""
  extra_env: []
schema:
  openrouter_api_key: password?
  openrouter_base_url: url?
  inference_provider: str?
  inference_model: str?
  extra_env:
    - match(^[A-Za-z_][A-Za-z0-9_]*=.*$)
