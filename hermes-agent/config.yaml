name: "Hermes Agent"
version: "2.0.0"
slug: "hermes_agent"
description: >-
  Nous Research's Hermes Agent, running as `hermes dashboard` — the web UI
  that includes an embedded PTY-backed chat tab (the same interactive agent
  you'd otherwise only get from the `hermes` terminal command). This is the
  browser-reachable half of Hermes; see hermes-gateway for the messaging
  (Telegram/Discord/Slack/etc.) side. Built as a MINIMAL profile from
  pinned upstream source — the frontend is built fresh (no prebuilt
  frontend ships on PyPI), but no Playwright and no provider extras. See
  DOCS.md for the real measured image size / idle memory and the
  TERMINAL_ENV=local tradeoff.
url: "https://github.com/laris-co/hermes-haos-addons/tree/main/hermes-agent"
# Both archs genuinely built and run-tested on this machine (2026-08-24) —
# see hermes-gateway/config.yaml for the same note (full login round trip
# verified on both amd64-via-QEMU and native arm64).
arch:
  - amd64
  - aarch64
startup: application
boot: manual
# No bundled init/supervisor in this image (single `hermes dashboard`
# process — see Dockerfile). Supervisor's own init reaps zombies and
# forwards signals, so init: true is correct here, unlike the v1 design
# that wrapped upstream's own s6-overlay image.
init: true
hassio_api: false
homeassistant_api: false
host_network: false
# NOT using ingress: true. Verified against a running container
# (2026-08-24) that this does not work correctly yet:
#   - Home Assistant's Supervisor ingress proxy sends `X-Ingress-Path`.
#   - hermes's dashboard only reads `X-Forwarded-Prefix` for path-prefix
#     awareness (hermes_cli/dashboard_auth/prefix.py) — confirmed by its own
#     test suite, which is explicitly written against the HA ingress prefix
#     *format* (tests/hermes_cli/test_dashboard_auth_prefix.py references
#     "Home Assistant Supervisor ingress prefixes") but exercises it via the
#     X-Forwarded-Prefix header, not X-Ingress-Path.
#   - Worse: the unauthenticated /login page hermes serves for basic-auth
#     (the zero-infra auth mode this add-on uses) hardcodes root-relative
#     paths (`fetch('/auth/password-login', ...)`, `/fonts/...`) in its
#     static HTML/JS — confirmed by diffing a real response with and
#     without an X-Forwarded-Prefix header set: byte-identical, the prefix
#     is not honoured on this page at all. Under an ingress mount, the
#     login *page* would load but submitting the form would POST past the
#     ingress prefix and 404 against Home Assistant's own frontend instead
#     of the add-on.
# A direct port avoids all of that and is guaranteed to work. If a future
# hermes-agent release adds real X-Ingress-Path support end-to-end
# (including the login page), switch this to ingress: true and drop the
# ports block below.
ports:
  "9119/tcp": 9119
ports_description:
  "9119/tcp": >-
    Hermes dashboard web UI. Open http://<host>:9119/ and sign in with the
    username/password configured below. Never remap this to 80 or 443 —
    Home Assistant itself owns those on this host.
options:
  username: null
  password: null
  session_secret: ""
  public_url: ""
schema:
  # No safe default exists for a dashboard credential — an empty-string
  # default would satisfy schema validation and let the add-on start with
  # no real password (exactly the Advanced-SSH-style failure this repo
  # was asked to avoid). Using `null` in options + a non-optional type
  # here instead makes Supervisor treat the field as genuinely required:
  # it will not let the add-on start until both are filled in.
  username: str
  password: password
  # Optional: without this, dashboard sessions are signed with a random
  # per-boot secret and everyone is logged out on every add-on restart.
  # run.sh auto-generates and persists one to /data/.dashboard_secret if
  # this is left blank, so restarts stay logged-in either way — this
  # option exists only for operators who want to pin/rotate it themselves.
  session_secret: password?
  # Advanced: only needed for a reverse-proxy-behind-HAOS setup with a
  # fixed public hostname (see hermes's dashboard.public_url docs).
  # Leave blank for the normal http://<host>:9119/ direct-port access
  # this add-on is built around.
  public_url: str?
