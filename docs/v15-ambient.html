<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambient — the air, as a room</title>
<style>
/* ---------------------------------------------------------------------------
   v15 AMBIENT — Naoto Fukasawa.
   "Design dissolving into behaviour."

   At rest this wall shows a field of tone and one small word. No numerals.
   You are meant to read the ROOM, not the screen: colour = the air, stillness
   and hatching = a monitor that is not answering. Two of three boards are dark
   right now, so two thirds of the field is a colourless, motionless void — an
   offline fleet can never be mistaken for clean air, because clean air is the
   only thing on this wall that breathes.

   Detail exists, but it is a behaviour, not a layout: move, touch or type and
   it fades up for a few seconds, then recedes.

   TYPOGRAPHY RULES THIS FILE ENFORCES
   - There is NO text-transform anywhere in this stylesheet. A styling rule once
     folded "µg/m³" into "MG/M³" — a thousand-fold unit error caused by CSS.
     Everything that came off the wire is printed exactly as it arrived.
   - Sensor readings are sized in cqi against their own row container, never in
     vw. Viewport units sized against a grid-allocated box once split "163.3"
     into "163." and "3" — precisely in the hazardous range. Every reading also
     carries white-space:nowrap.
   - Thai is a first-class language on this wall, not a translation bolted on.
     It sets its own line-height, drops the Latin tracking, and gets a font
     stack that names real Thai faces. Nothing here links a webfont: this page
     must open from a USB stick on a classroom TV with no network.
--------------------------------------------------------------------------- */

:root{
  /* EPA band colours — kept from the tested dashboard so the detail dots and
     the field agree on what each band looks like. */
  --band-good:#4ade80; --band-mod:#fbbf24; --band-usg:#fb923c;
  --band-unh:#f87171; --band-vun:#b48bff; --band-haz:#ff4d6d;

  --ground:#04060a;
  --amb-ink:#7b8c9c;      /* the resting word's colour; shifts with the air */
  --breath:14s;           /* one breath; shortens as the air gets worse */
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--ground)}
body{
  color:var(--amb-ink);
  /* The Thai faces are named in BOTH languages. Even in English the demo mark
     carries its Thai half, and a Thai glyph that falls through to whatever the
     system happens to pick renders its tone marks badly. */
  font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,
       'Noto Sans Thai','IBM Plex Sans Thai','Sarabun',sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:color 7s linear;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

/* ---------------------------------------------------------------- Thai */
/* When Thai is the active language its faces lead the stack. */
html[lang="th"] body{
  font-family:'Noto Sans Thai','IBM Plex Sans Thai','Sarabun',
              ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.6;
}
/* Thai stacks above and below the baseline — สั้ and ญู need the room that a
   Latin line-height does not give them. 1.2 clips the diacritics outright. */
html[lang="th"] #say,html[lang="th"] #cover,html[lang="th"] #lead,
html[lang="th"] .rsay,html[lang="th"] #notes,html[lang="th"] #foot>span,
html[lang="th"] #stop p,html[lang="th"] #panel p,html[lang="th"] #panel label{line-height:1.6}
html[lang="th"] #word{line-height:1.4}
#demobar{line-height:1.5}     /* the mark is bilingual in both languages */
/* Thai marks a phrase with the space, so tracking meant for a Latin display
   face only pulls its clusters apart. */
html[lang="th"] #word,html[lang="th"] #say,html[lang="th"] #cover,
html[lang="th"] #lead,html[lang="th"] .rsay,html[lang="th"] #foot>span,
html[lang="th"] #stop p,html[lang="th"] #stop small{letter-spacing:0}
.dthai{letter-spacing:0}
/* Thai gives the browser no word boundary to break on, so one long string would
   run off the wall. Never applied to .rnum or .runit: breaking a reading is
   exactly how "163.3" once became "163." and "3". */
html[lang="th"] #say,html[lang="th"] #cover,html[lang="th"] #lead,
html[lang="th"] .rsay,html[lang="th"] #notes,html[lang="th"] #foot>span,
html[lang="th"] #stop p,html[lang="th"] #panel p{overflow-wrap:anywhere; word-break:break-word}

/* ---------------------------------------------------------------- the field */
/* The whole field is built from gradients that end in `transparent`, and from
   nothing else. There is deliberately no CSS blur here: a gradient is already
   perfectly soft, costs the compositor nothing, and this screen runs for months
   without being looked at. The ground tint is one full-screen wash; each board
   adds only a pool of light on top of it, so there is no rectangle anywhere and
   no seam between one board's air and its neighbour's. */
#wash{position:fixed; inset:0; z-index:0; transition:opacity 1.2s ease}
.wlay{position:absolute; inset:0; opacity:0; transition:opacity 7s linear}
.wlay[data-on="1"]{opacity:1}

#field{
  position:fixed; inset:0; overflow:hidden; z-index:1;
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  transition:opacity 1.2s ease;
}
@media (orientation:portrait){
  #field{grid-auto-flow:row; grid-auto-rows:1fr; grid-auto-columns:auto}
}
.reg{position:relative}

/* Two stacked layers per region. A tone change is a crossfade, never a snap:
   opacity transitions are honoured by every engine, gradient interpolation is
   not. The negative inset lets each pool of light spill into its neighbours, so
   three cells read as one continuous field rather than three tiles. */
.lay{
  position:absolute; inset:-25%;
  opacity:0; transition:opacity 7s linear;
}
.lay[data-on="1"]{opacity:1}

/* Breath. Only a region with a live reading moves. Motion means "something is
   measuring here"; absolute stillness means nothing is. Opacity and transform
   only — both run on the compositor. */
.pulse{
  position:absolute; inset:-15%;
  opacity:0; transition:opacity 5s linear;
  background:radial-gradient(72% 56% at 50% 60%, rgba(255,255,255,.055) 0%, transparent 72%);
}
.reg[data-live="1"] .pulse{
  opacity:1;
  animation:breathe var(--breath) ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.30; transform:scale(.965)}
  50%    {opacity:1;   transform:scale(1.035)}
}

/* The absence texture. Hairline hatching, motionless, unblurred — the visual
   opposite of a breathing tone. Rendered only where a monitor is dark. */
.weave{
  position:absolute; inset:0; opacity:0; transition:opacity 3.5s linear;
  background:repeating-linear-gradient(
    58deg, rgba(150,172,192,.075) 0 1px, transparent 1px 13px);
  mask-image:radial-gradient(80% 70% at 50% 50%, #000 0%, transparent 88%);
  -webkit-mask-image:radial-gradient(80% 70% at 50% 50%, #000 0%, transparent 88%);
}
.reg[data-dark="1"] .weave{opacity:1}
.weave{z-index:1}

/* ---------------------------------------------------------------- rest state */
#rest{
  position:fixed; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.65rem; padding:6vmin; text-align:center;
  transition:opacity 1.1s ease;
}

/* The reading scrim. Without it the ink and the ground TRACK each other: the
   band tints the field and the same band tints the type, so every band lands at
   roughly the same miserable ratio and the safety instruction is never legible.
   Measured before this existed: `harmful` 2.87:1, its sentence 2.08:1, the EPA
   citation 2.47:1, the coverage line 1.51:1 — invisible. Raising the ink alone
   cannot fix it: over the hazardous glow even pure white reaches only 5.77:1,
   so a band-tinted ink can never clear 4.5:1 there.
   A soft central vignette breaks the coupling instead. It darkens only the
   middle, where the type sits; the pools of light still breathe at the edges,
   which is where the field is actually read as a field. The ambient wall keeps
   its colour and gains a ground its own words can be read on. */
#rest::before,#detail::before{
  content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(66% 52% at 50% 50%,
    rgba(2,4,7,.80) 0%, rgba(2,4,7,.66) 46%, rgba(2,4,7,.34) 72%, transparent 92%);
}
#word{
  font-size:clamp(2rem,8.5vmin,6.4rem);
  font-weight:300; letter-spacing:.06em; line-height:1;
  white-space:nowrap;
  color:var(--amb-ink); opacity:1;
  transition:color 7s linear;
}
/* These two carry the safety instruction and the coverage disclosure. They are
   the last things on this wall that may be dimmed for atmosphere. */
#say{
  font-size:clamp(.85rem,2.1vmin,1.35rem);
  font-weight:400; letter-spacing:.045em; opacity:1; max-width:26ch;
}
#cover{
  font-size:clamp(.7rem,1.5vmin,.95rem);
  letter-spacing:.14em; opacity:.94; max-width:30ch;
}
body[data-reveal="1"] #rest{opacity:0}

/* ---------------------------------------------------------------- detail */
#detail{
  position:fixed; inset:0; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(.5rem,1.6vmin,1.1rem); padding:clamp(1rem,5vmin,3rem);
  opacity:0; pointer-events:none;
  transition:opacity 1.5s ease;
}
body[data-reveal="1"] #detail{opacity:1; transition:opacity .42s ease}

#lead{
  font-size:clamp(1rem,3vmin,1.9rem); font-weight:300; letter-spacing:.03em;
  color:var(--amb-ink); text-align:center; max-width:30ch;
  transition:color 7s linear;
}
#rows{
  display:flex; flex-direction:column; gap:clamp(.35rem,1.1vmin,.7rem);
  width:min(56rem,92vw);
}

/* Each row is its own container. Readings are measured against THIS box (cqi),
   never against the viewport — see the typography note at the top of the file. */
.row{
  container-type:inline-size;
  display:grid; align-items:baseline; gap:.35rem clamp(.5rem,1.6vmin,1.1rem);
  grid-template-columns:minmax(6.5rem,auto) minmax(0,1fr) minmax(0,auto);
  padding:clamp(.35rem,1.2vmin,.7rem) 0;
  border-top:1px solid rgba(150,172,192,.13);
  color:#93a6b8;
}
.rid{
  font-size:clamp(.72rem,1.7vmin,.95rem); letter-spacing:.13em;
  color:#c2d2e0; white-space:nowrap;
}
.rval{
  display:flex; align-items:baseline; gap:.3em;
  white-space:nowrap;          /* a reading is never broken across lines */
  justify-self:start;
}
.rnum{
  font-size:clamp(1.05rem,4.4cqi,2.15rem);
  font-weight:300; line-height:1.05;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  color:#e6eef6;
}
.runit{
  /* Printed exactly as the discovery payload sent it. Do not restyle its case. */
  font-style:normal; font-size:clamp(.66rem,1.7cqi,.9rem); opacity:.66; white-space:nowrap;
}
.rsay{
  font-size:clamp(.7rem,1.6vmin,.9rem); letter-spacing:.02em; opacity:.94;
  text-align:right; justify-self:end; min-width:0;
}
/* An offline row is quieter than a live one, but it is the row that names a dead
   sensor — it stays readable. Deliberate, not faded out. */
.row[data-s="offline"]{color:#9fb2c4}
.row[data-s="offline"] .rid{color:#8b9dad}
.row[data-s="offline"] .rnum{font-size:clamp(.95rem,3.2cqi,1.5rem); color:#8b9dad}
.row[data-s="waiting"] .rnum,.row[data-s="unknown"] .rnum{color:#9fb1c2}
/* An expired reading steps down in SIZE as well as colour, exactly as an offline
   row does above. Colour alone is the weakest signal a wall display has: seen
   from across a room and at an angle a muted number reads as "quieter, therefore
   calmer", which is the opposite of what an expired figure means. Measured at
   ?demo=mixed before this change, the stale board printed 57.4 — Unhealthy — at
   the identical 34.4px as the live 42.7 beside it, while the wall's headline word
   read "smoky" from the live board. Two numbers of equal weight, one of them from
   forty minutes ago. */
.row[data-s="stale"] .rnum,.row[data-s="fault"] .rnum{
  font-size:clamp(.95rem,3.2cqi,1.5rem); color:#d8b98a;
}

/* The named standard. The brief requires it on the wall, so it is body copy at
   AA, not a watermark. */
#foot{
  display:flex; flex-wrap:wrap; justify-content:center; gap:.4rem 1.4rem;
  font-size:clamp(.66rem,1.4vmin,.85rem); letter-spacing:.09em;
  opacity:.92; text-align:center; max-width:60rem;
}
#notes{
  font-size:clamp(.66rem,1.4vmin,.85rem); opacity:.92; text-align:center;
  max-width:52ch; color:#c9a86a;
}
#notes:empty{display:none}
#notes b{font-weight:600}

/* ---------------------------------------------------------------- language */
/* This wall's job is a reading, so the switch is the quietest control on it. It
   lives inside the revealed detail — the layer that already carries the ids, the
   numbers and the standard — and on the stop curtain, which hides that layer.
   At rest there is still nothing on the field but tone and one word. Anyone who
   never touches the wall can press "l". */
.langsw{display:inline-flex; align-items:center; gap:.45em}
.langsw button{
  font:inherit; letter-spacing:inherit; color:inherit;
  background:none; border:0; margin:0; padding:0 .12em;
  cursor:pointer; opacity:.45; line-height:1.6;
  border-bottom:1px solid transparent;
  transition:opacity .4s ease;
}
/* The detail layer is inert while it is invisible — so the switch inside it
   becomes clickable at exactly the moment it becomes readable, and never a
   moment before. The stop curtain is its own layer and is always live. */
body[data-reveal="1"] #foot .langsw{pointer-events:auto}
.langsw button[aria-pressed="true"]{opacity:1; border-bottom-color:currentColor}
.langsw button:hover{opacity:.8}
.langsw button:focus-visible{outline:2px solid #3d6f9e; outline-offset:3px}
.langsep{opacity:.28}
#stop .langsw{
  font-size:clamp(.66rem,1.5vmin,.85rem); letter-spacing:.16em;
  color:#a9bccd; opacity:.65;
}

/* ---------------------------------------------------------------- calm stop */
/* When nothing can be reached, the whole screen becomes one sentence. */
#stop{
  position:fixed; inset:0; z-index:6; background:var(--ground);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:1.4rem; padding:8vmin; text-align:center;
}
body[data-stop="1"] #stop{display:flex}
body[data-stop="1"] #rest,body[data-stop="1"] #detail,
body[data-stop="1"] #field,body[data-stop="1"] #wash{opacity:0}
#stop p{
  margin:0; font-size:clamp(1rem,3.4vmin,2rem); font-weight:300;
  line-height:1.5; letter-spacing:.01em; color:#a9bccd; max-width:26ch;
}
#stop small{font-size:clamp(.66rem,1.5vmin,.85rem); letter-spacing:.16em; opacity:.4}

/* ---------------------------------------------------------------- settings */
#panel{
  position:fixed; inset:0; z-index:9; background:rgba(3,5,9,.93);
  display:grid; place-items:center; padding:3vmin;
}
#panel[hidden]{display:none}
#panel form{
  width:min(30rem,94vw); max-height:94vh;
  background:#0b1119; border:1px solid #1d2836; border-radius:14px;
  padding:clamp(.9rem,2.4vmin,1.4rem);
  display:flex; flex-direction:column; gap:.55rem;
  color:#dbe5ef;
}
#panel h2{margin:0 0 .2rem; font-size:1rem; font-weight:600; letter-spacing:.01em}
#panel p{margin:0; font-size:.74rem; line-height:1.45; color:#7f93a6}
.f2{display:grid; grid-template-columns:1fr 7rem; gap:.5rem}
#panel label{display:flex; flex-direction:column; gap:.2rem; font-size:.68rem; letter-spacing:.1em; color:#7f93a6}
#panel input[type=text],#panel input[type=password]{
  background:#060a0f; border:1px solid #22303f; border-radius:8px;
  color:#e6eef6; font:inherit; font-size:.85rem; padding:.42rem .55rem; min-width:0;
}
#panel input:focus-visible{outline:2px solid #3d6f9e; outline-offset:1px}
.ck{flex-direction:row; align-items:center; gap:.45rem; letter-spacing:.02em; font-size:.75rem; color:#9fb1c2}
.btns{display:flex; gap:.5rem; margin-top:.25rem}
#panel button{
  font:inherit; font-size:.82rem; border-radius:8px; padding:.44rem .9rem; cursor:pointer;
  background:#14202c; color:#dbe5ef; border:1px solid #263646;
}
#panel button[type=submit]{background:#1d3a52; border-color:#2d5776}
#panel button:focus-visible{outline:2px solid #3d6f9e; outline-offset:1px}

/* ---------------------------------------------------------------- demo mark */
/* Simulated air is only safe if it is impossible to mistake for a reading, so
   the mark is not a toast and not a corner label: a bar across the top of the
   screen plus a frame around the whole of it, both fixed, both above everything
   — including the settings sheet. Any photograph of this wall in demo mode has
   the frame in the shot.

   The palette here is deliberately achromatic. Every EPA band on this wall is a
   colour, so the one thing that must never be read as a band is given none.
   And, as everywhere else in this file, there is no text-transform: "DEMO" is
   uppercase because it is typed uppercase, and the µg/m³ beside it is printed
   exactly as it is spelled. */
#demobar{
  position:fixed; top:0; left:0; right:0; z-index:40;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:.35em .8em;
  padding:.5em .9em calc(.5em + 7px);
  background:#eef2f6; color:#0a0e14;
  line-height:1.35; letter-spacing:.01em;
  box-shadow:0 .5rem 1.6rem rgba(0,0,0,.55);
}
/* Stepped in rem, never in viewport units. The bar carries a reading, and a
   reading on this wall is never sized against the viewport — see the top of
   this file for what that once did to "163.3". */
#demobar{font-size:.95rem}
@media (min-width:900px) { #demobar{font-size:1.15rem} }
@media (min-width:1600px){ #demobar{font-size:1.4rem} }

/* Tape, not decoration. */
#demobar::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:7px;
  background:repeating-linear-gradient(45deg,#0a0e14 0 10px,#eef2f6 10px 20px);
}
.dtag{
  background:#0a0e14; color:#f4f7fa; font-weight:700; letter-spacing:.22em;
  padding:.12em .35em .12em .55em; border-radius:.2em; white-space:nowrap;
}
/* Both halves of the mark carry the same warning, one in each language, and
   neither is decoration: whichever one the reader has, it says the same thing. */
.dthai{font-weight:600}
.dsay{font-weight:600; opacity:.88}
.dval{
  display:flex; flex-wrap:wrap; justify-content:center; gap:.25em .5em;
  font-weight:600; font-variant-numeric:tabular-nums;
}
.dval .nb{white-space:nowrap}      /* a value is never broken across lines */
.dval .dsep{opacity:.4}
#demoframe{
  position:fixed; inset:0; z-index:39; pointer-events:none;
  box-shadow:inset 0 0 0 4px #eef2f6,
             inset 0 0 0 10px rgba(10,14,20,.92),
             inset 0 0 0 14px #eef2f6;
}
#demobar[hidden],#demoframe[hidden]{display:none}

/* The wall's own content sits below the bar, so the mark never covers a word and
   a word never covers the mark. The value here is a FLOOR only: the bar is
   flex-wrap and its height is content-driven, so on a narrow screen it takes two
   or three lines and any constant is wrong — and the bar wins on z-index, so
   being wrong means it lands on top of the wall's own content. demoFit() below
   replaces this with the bar's measured height, re-measured on every resize. */
body[data-demo="1"] #rest,body[data-demo="1"] #detail{top:var(--demobar-h,3.6rem)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .lay,.pulse,.weave{transition-duration:.9s!important}
}
</style>
</head>
<body>

<!-- The demo mark. Present in the markup but hidden unless ?demo= put it there,
     and first in the document so a screen reader meets it before any number. -->
<div id="demobar" hidden>
  <span class="dtag">DEMO</span>
  <span class="dthai" id="demo-th" lang="th"></span>
  <span class="dsay" id="demo-en" lang="en"></span>
  <span class="dval mono" id="demo-val"></span>
</div>
<div id="demoframe" hidden aria-hidden="true"></div>

<div id="wash" aria-hidden="true"><div class="wlay"></div><div class="wlay"></div></div>
<div id="field" aria-hidden="true"></div>

<!-- At rest: one word, one plain sentence, and how much of the fleet we can
     actually hear. No numerals. -->
<div id="rest">
  <div id="word" data-i18n="word.waking">waking</div>
  <div id="say" data-i18n="say.waking">listening for the monitors</div>
  <div id="cover"></div>
</div>

<!-- Revealed by behaviour, not by a button. -->
<div id="detail">
  <div id="lead"></div>
  <div id="rows"></div>
  <div id="notes"></div>
  <div id="foot">
    <span id="foot-epa"></span>
    <span id="foot-conn"></span>
    <span id="foot-hint"></span>
    <!-- the TH / EN pair is mounted here, and on the stop curtain, by script -->
  </div>
</div>

<div id="stop">
  <p id="stop-say"></p>
  <small data-i18n="conn.hint"></small>
</div>

<div id="panel" hidden>
  <form id="form" autocomplete="off">
    <h2 data-i18n="panel.title"></h2>
    <p data-i18n="panel.about"></p>
    <div class="f2">
      <label><span data-i18n="panel.host"></span><input id="f-host" type="text" spellcheck="false" autocapitalize="off"></label>
      <label><span data-i18n="panel.port"></span><input id="f-port" type="text" inputmode="numeric" spellcheck="false"></label>
    </div>
    <div class="f2">
      <label><span data-i18n="panel.user"></span><input id="f-user" type="text" spellcheck="false" autocapitalize="off" autocomplete="off"></label>
      <label><span data-i18n="panel.pass"></span><input id="f-pass" type="password" autocomplete="new-password"></label>
    </div>
    <label><span data-i18n="panel.filter"></span><input id="f-filter" type="text" spellcheck="false" autocapitalize="off"></label>
    <label class="ck"><input id="f-remember" type="checkbox"> <span data-i18n="panel.remember"></span></label>
    <label class="ck"><input id="f-tls" type="checkbox"> <span data-i18n="panel.tls"></span></label>
    <p id="store-hint"></p>
    <div class="btns">
      <button type="submit" data-i18n="panel.connect"></button>
      <button type="button" id="btn-forget" data-i18n="panel.forget"></button>
      <button type="button" id="btn-close" data-i18n="panel.close"></button>
    </div>
  </form>
</div>

<!-- Pinned AND hash-locked, exactly as the source dashboard does it: this page
     can hold a broker passphrase, so a hijacked CDN response must not execute
     here. If the hash ever fails, the "library did not load" branch explains it. -->
<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"
        integrity="sha384-haZiwxTLortiFcYMBEEE1+8ayC+o18YtuwHZv+4WQHoPaLzRjwOV6h7Vva5iLSCZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
     LANGUAGE.
     Most of the people this wall is for read Thai. One table, one t(), one
     <html lang>. The Thai here was written against Thai discourse frames,
     not translated from the English beside it: it uses the space as a phrase
     mark, keeps Arabic digits for readings, and never borrows English
     sentence order. Do not "improve" it into a calque.
     ===================================================================== */

  var STR = {
