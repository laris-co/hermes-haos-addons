  // No numerals at rest — so counts are spelled out, in both languages.
  var NUMWORD = {
    en: ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven',
         'eight', 'nine', 'ten', 'eleven', 'twelve'],
    th: ['ไม่มี', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด',
         'แปด', 'เก้า', 'สิบ', 'สิบเอ็ด', 'สิบสอง']
  };

  var LANG_KEY = 'air-wall.lang.v1';

  // ?lang= wins, then this browser, then the browser's own language, then English.
  function pickLang() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    if (typeof q === 'string') {
      q = q.trim().toLowerCase();
      if (q === 'th' || q === 'en') return q;
    }
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); }   // throws in private mode
    catch (e) { saved = null; }
    if (saved === 'th' || saved === 'en') return saved;
    var nav = '';
    try { nav = (navigator.languages && navigator.languages[0]) || navigator.language || ''; }
    catch (e) { nav = ''; }
    return /^th\b|^th-/i.test(String(nav)) ? 'th' : 'en';
  }

  var LANG = pickLang();

  // Missing key falls back to English, then to the key itself: a gap is visible
  // to whoever is editing this file, and never a blank space on a wall.
  function t(key, vars) {
    var s = (STR[LANG] && STR[LANG][key]);
    if (typeof s !== 'string') s = STR.en[key];
    if (typeof s !== 'string') s = key;
    if (!vars) return s;
    return s.replace(/\{(\w+)\}/g, function (m, name) {
      return Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : m;
    });
  }

  // Some values are themselves translatable — {i18n:'err.credentials'} — and are
  // resolved at render time so a language switch re-renders them too.
  function rv(vars) {
    if (!vars) return null;
    var out = {};
    Object.keys(vars).forEach(function (k) {
      var v = vars[k];
      out[k] = (v && typeof v === 'object' && typeof v.i18n === 'string') ? t(v.i18n) : v;
    });
    return out;
  }

  function numWord(n) {
    var list = NUMWORD[LANG] || NUMWORD.en;
    return (n >= 0 && n < list.length) ? list[n] : String(n);
  }

  // The ambient voice sets band names in lower case. Thai has no case, so this
  // is a no-op there — and it is never text-transform, which is what once folded
  // "µg/m³" into "MG/M³".
  function quiet(s) { return LANG === 'en' ? String(s).toLowerCase() : s; }

  /* =====================================================================
     DATA LAYER — lifted from tools/mqtt-dashboard.html.
     Discovery parsing, alias expansion, availability, expiry, wildcard
     refusal and EPA banding are the tested originals. Only the presentation
     below them is new.
     ===================================================================== */

  // ---------------------------------------------------------------- config
  var DEFAULT_HOST = (location.hostname || '');  /* derive from the page's own host — a browser cannot open a WebSocket to a LAN address from a different network, and this keeps one out of source. */
  var DEFAULT_PORT = '1884';            // the broker's MQTT-over-WebSocket listener. A browser
                                        // cannot open the raw-TCP MQTT port at all, and pointing
                                        // it there fails looking exactly like bad credentials.
  var STORE_KEY = 'air-wall.conn.v1';
  var MAX_SUBS = 64;                    // hard ceiling; a browser must never firehose a broker
  var DEFAULT_EXPIRE = 900;             // seconds, when discovery does not declare expire_after
  var DEFAULT_FILTER = 'dbk/';          // scope the wall to the classroom boards; blank = everything

  // US EPA PM2.5 AQI breakpoints, micrograms per cubic metre. `k` is the key the
  // band's name, its verdict and its resting word are all looked up under, so a
  // band can never be shown under one language's name and another's advice.
  var BANDS = [
    { max: 12.0,     k: 'good',      v: '--band-good', r: '0 – 12.0' },
    { max: 35.4,     k: 'moderate',  v: '--band-mod',  r: '12.1 – 35.4' },
    { max: 55.4,     k: 'sensitive', v: '--band-usg',  r: '35.5 – 55.4' },
    { max: 150.4,    k: 'unhealthy', v: '--band-unh',  r: '55.5 – 150.4' },
    { max: 250.4,    k: 'verybad',   v: '--band-vun',  r: '150.5 – 250.4' },
    { max: Infinity, k: 'hazardous', v: '--band-haz',  r: '250.5 +' }
  ];
  function bandName(b) { return b && b.k ? t('band.' + b.k) : t('band.none'); }

  // Home Assistant discovery allows abbreviated keys. Expand the ones we read.
  var ALIASES = {
    stat_t: 'state_topic', avty_t: 'availability_topic', uniq_id: 'unique_id',
    unit_of_meas: 'unit_of_measurement', dev_cla: 'device_class', stat_cla: 'state_class',
    exp_aft: 'expire_after', pl_avail: 'payload_available', pl_not_avail: 'payload_not_available',
    dev: 'device', val_tpl: 'value_template', avty: 'availability', ic: 'icon'
  };

  // ---------------------------------------------------------------- state
  var client = null;
  var entities = new Map();      // discovery topic -> entity
  var byState = new Map();       // state topic     -> Set(discovery topic)
  var byAvail = new Map();       // avail topic     -> Set(discovery topic)
  var byUid = new Map();         // unique_id       -> discovery topic (HA collapses these)
  var boardStatus = new Map();   // board id        -> { raw, at }
  var subs = new Set();
  var filteredOut = new Set();
  var activeFilter = '';
  var parseErrors = 0;
  var connState = 'idle';
  var manualStop = false;
  var everConnected = false;
  var discoveryTimer = null;

  var $ = function (id) { return document.getElementById(id); };

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#5d7086';
  }

  // The EPA scale starts at 0. Without a lower bound a faulty sensor reporting
  // -999 fell into the first band and rendered as a reassuring green "Good".
  function bandFor(n) {
    if (!Number.isFinite(n) || n < 0) return null;
    for (var i = 0; i < BANDS.length; i++) if (n <= BANDS[i].max) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }
  function bandIndex(b) {
    for (var i = 0; i < BANDS.length; i++) if (BANDS[i] === b) return i;
    return -1;
  }

  function isPm(ent) {
    return ent.deviceClass === 'pm25' || /pm ?2\.?5/i.test(ent.measure || ent.title || '');
  }

  // Arabic digits in both languages: these are readings and clock counts, and a
  // Thai reader reads them in Arabic digits.
  function ago(ts) {
    if (!ts) return t('time.never');
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 2) return t('time.justnow');
    if (s < 60) return t('time.secondsAgo', { n: s });
    var m = Math.floor(s / 60);
    if (m < 60) return t('time.minutesAgo', { n: m });
    var h = Math.floor(m / 60);
    if (h < 24) return (m % 60) === 0 ? t('time.hoursAgo', { n: h })
                                      : t('time.hoursMinsAgo', { n: h, m: m % 60 });
    return t('time.daysAgo', { n: Math.floor(h / 24) });
  }

  // A payload may be "0", "0.0", "unknown", "unavailable" or empty. Never print NaN.
  function parseValue(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (s === '') return { kind: 'empty', text: 'no value' };
    if (/^(unknown|unavailable|none|null|nan|n\/a)$/i.test(s)) {
      return { kind: 'unknown', text: s.toLowerCase() };
    }
    var n = Number(s);
    if (!Number.isFinite(n)) return { kind: 'text', text: s };
    // The EPA method truncates to one decimal BEFORE applying breakpoints.
    // Truncate once, here, so the printed number and the band can never disagree.
    var n1 = Math.trunc(n * 10) / 10;
    var text;
    if (/^[+-]?\d+(\.\d)?$/.test(s)) {
      text = s.replace(/^\+/, '');            // keep the device's own precision: "0", "0.0"
    } else {
      text = n1.toFixed(1);
    }
    return { kind: 'number', n: n, n1: n1, text: text };
  }

  // Identity comes from the topic, never from the discovery "name" — every one
  // of these boards publishes the name "PM2.5", so a name-keyed wall shows three
  // identical rows.
  function boardFromTopic(topic) {
    var m = /^dbk\/([^/]+)\//i.exec(topic || '');
    return m ? m[1] : null;
  }

  var storeWorks = true;
  function loadStore() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); }
    catch (e) { storeWorks = false; return null; }   // private mode throws on access
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (e) {
      try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
      return null;
    }
  }
  function saveStore(v) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; }
    catch (e) { storeWorks = false; return false; }
  }
  function clearStore() {
    try { localStorage.removeItem(STORE_KEY); return true; } catch (e) { return false; }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ---------------------------------------------------------------- alerts
  // The dashboard stacked these as banners. An ambient wall has no banner rail,
  // so they are held quietly and surfaced in the revealed detail instead.
  // A note is held as a KEY plus its values, never as finished text: the wall can
  // change language while a note is up, and a note that had already been baked
  // into English would sit there in English until the fault cleared.
  var alertBag = new Map();
  var RANK = { bad: 3, warn: 2, info: 1 };
  function setAlert(id, level, key, vars) {
    alertBag.set(id, { level: level, key: key, vars: vars || null });
    paintNotes();
  }
  function clearAlert(id) { if (alertBag.delete(id)) paintNotes(); }
  function paintNotes() {
    var best = null;
    alertBag.forEach(function (a) {
      if (!best || (RANK[a.level] || 0) > (RANK[best.level] || 0)) best = a;
    });
    // Values interpolated into a note are escaped by the caller; the note itself
    // is authored markup from the table above.
    $('notes').innerHTML = best ? t(best.key, rv(best.vars)) : '';
  }

  // ---------------------------------------------------------------- subscribe
  // subRaw is the ONLY place that talks to the broker, and it is private to this
  // file's own authored topics. Anything that came off the wire goes through
  // sub(), which refuses wildcards outright.
  function subRaw(topic) {
    // In demo mode there is no broker to ask, and there must never be one — but a
    // synthesised sensor still has to pass the very same subscribe test a real one
    // does, because onDiscovery() DELETES any entity whose topic it cannot listen
    // to. Refusing on !client here would silently empty the wall under a confident
    // DEMO bar. subRaw() stops short of the client itself, a few lines down.
    if ((!client && !demoMode) || !topic || typeof topic !== 'string') return false;
    if (subs.has(topic)) return true;
    if (subs.size >= MAX_SUBS) {
      setAlert('subcap', 'warn', 'alert.subcap', { n: MAX_SUBS });
      return false;
    }
    subs.add(topic);
    if (demoMode) return true;   // a demo has no broker to ask, and must never look for one
    client.subscribe(topic, { qos: 0 }, function (err) {
      if (err) {
        subs.delete(topic);
        setAlert('suberr', 'bad', 'alert.suberr',
          { topic: esc(topic), err: esc(err.message || String(err)) });
      }
    });
    return true;
  }

  function sub(topic) {
    // In demo mode there is no broker to ask, and there must never be one — but a
    // synthesised sensor still has to pass the very same subscribe test a real one
    // does, because onDiscovery() DELETES any entity whose topic it cannot listen
    // to. Refusing on !client here would silently empty the wall under a confident
    // DEMO bar. subRaw() stops short of the client itself, a few lines down.
    if ((!client && !demoMode) || !topic || typeof topic !== 'string') return false;
    // Absolute guard. A wildcard on this broker costs roughly 109 GB a day, and
    // '+' is every bit as dangerous as '#'. A topic that arrived over the wire
    // must name one exact topic.
    if (/[#+]/.test(topic)) {
      setAlert('wildcard', 'warn', 'alert.wildcard', { topic: esc(topic) });
      return false;
    }
    return subRaw(topic);
  }

  function unsub(topic) {
    if (!topic || !subs.has(topic)) return;
    if (byState.has(topic) || byAvail.has(topic)) return;   // still wanted by the other index
    subs.delete(topic);
    if (client) { try { client.unsubscribe(topic); } catch (e) {} }
  }

  // ---------------------------------------------------------------- discovery
  function expand(cfg) {
    var out = {};
    Object.keys(cfg).forEach(function (k) { out[ALIASES[k] || k] = cfg[k]; });
    var base = out['~'];
    if (typeof base === 'string' && base) {
      ['state_topic', 'availability_topic'].forEach(function (k) {
        var v = out[k];
        if (typeof v !== 'string') return;
        if (v.charAt(0) === '~') out[k] = base + v.slice(1);
        else if (v.charAt(v.length - 1) === '~') out[k] = v.slice(0, -1) + base;
      });
    }
    if (!out.availability_topic && Array.isArray(out.availability) && out.availability.length) {
      var a = out.availability[0];
      if (a && typeof a.topic === 'string') {
        out.availability_topic = a.topic;
        if (a.payload_available) out.payload_available = a.payload_available;
        if (a.payload_not_available) out.payload_not_available = a.payload_not_available;
      }
    }
    return out;
  }

  function index(map, key, dtopic) {
    if (!key) return;
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(dtopic);
  }
  function unindex(map, key, dtopic) {
    if (!key || !map.has(key)) return;
    var set = map.get(key);
    set.delete(dtopic);
    if (set.size === 0) { map.delete(key); unsub(key); }
  }

  function removeEntity(dtopic) {
    var gone = entities.get(dtopic);
    if (!gone) return false;
    entities.delete(dtopic);
    if (gone.uid && byUid.get(gone.uid) === dtopic) byUid.delete(gone.uid);
    unindex(byState, gone.stateTopic, dtopic);
    unindex(byAvail, gone.availTopic, dtopic);
    return true;
  }

  function matchesFilter(topic) {
    return !activeFilter || String(topic).indexOf(activeFilter) === 0;
  }
  function noteFilter() {
    if (!activeFilter || filteredOut.size === 0) { clearAlert('filter'); return; }
    setAlert('filter', 'info',
      filteredOut.size === 1 ? 'alert.filter.one' : 'alert.filter.many',
      { n: filteredOut.size, f: esc(activeFilter) });
  }

  function onDiscovery(dtopic, text) {
    if (text.trim() === '') {                 // empty retained payload = delete
      filteredOut.delete(dtopic);
      removeEntity(dtopic);
      noteFilter();
      return;
    }

    var cfg;
    try {
      cfg = JSON.parse(text);
    } catch (e) {
      parseErrors++;
      setAlert('parse', 'warn',
        parseErrors === 1 ? 'alert.parse.one' : 'alert.parse.many',
        { n: parseErrors, topic: esc(dtopic) });
      return;
    }
    if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) { parseErrors++; return; }

    cfg = expand(cfg);
    if (typeof cfg.state_topic !== 'string' || !cfg.state_topic) return;

    if (!matchesFilter(cfg.state_topic)) {
      filteredOut.add(dtopic);
      removeEntity(dtopic);
      noteFilter();
      return;
    }
    filteredOut.delete(dtopic);
    noteFilter();

    var parts = dtopic.split('/');
    var dev = cfg.device && typeof cfg.device === 'object' ? cfg.device : null;
    var devName = dev && typeof dev.name === 'string' ? dev.name : '';
    var measure = typeof cfg.name === 'string' && cfg.name ? cfg.name : (parts[2] || 'sensor');
    var expire = Number(cfg.expire_after);
    var uid = typeof cfg.unique_id === 'string' && cfg.unique_id ? cfg.unique_id : '';
    var board = boardFromTopic(cfg.state_topic);
    var newAvail = typeof cfg.availability_topic === 'string' ? cfg.availability_topic : '';

    if (uid && byUid.has(uid) && byUid.get(uid) !== dtopic) removeEntity(byUid.get(uid));

    var ent = entities.get(dtopic) || { key: dtopic, value: null, at: 0, availRaw: null, availAt: 0 };

    // Drop the OLD index entries before writing the new ones — and drop what was
    // measured there with them, so one board's number can never survive under
    // another board's identity.
    if (ent.stateTopic && ent.stateTopic !== cfg.state_topic) {
      unindex(byState, ent.stateTopic, dtopic);
      ent.value = null; ent.at = 0; ent.raw = undefined;
    }
    if (ent.availTopic && ent.availTopic !== newAvail) {
      unindex(byAvail, ent.availTopic, dtopic);
      ent.availRaw = null; ent.availAt = 0;
    }
    if (ent.uid && ent.uid !== uid && byUid.get(ent.uid) === dtopic) byUid.delete(ent.uid);

    // The board id is the identity. "PM2.5" is the name every one of these
    // boards publishes, so it can only ever be the measurement label.
    var who = board || devName || uid;
    ent.title = who || measure;
    ent.measure = who ? measure : '';
    ent.uid = uid;
    ent.stateTopic = cfg.state_topic;
    ent.availTopic = newAvail;
    ent.unit = typeof cfg.unit_of_measurement === 'string' ? cfg.unit_of_measurement : '';
    ent.deviceClass = typeof cfg.device_class === 'string' ? cfg.device_class : '';
    ent.expire = Number.isFinite(expire) && expire > 0 ? expire : DEFAULT_EXPIRE;
    ent.pAvail = typeof cfg.payload_available === 'string' ? cfg.payload_available : 'online';
    ent.pNot = typeof cfg.payload_not_available === 'string' ? cfg.payload_not_available : 'offline';
    ent.templated = !!cfg.value_template;
    ent.board = board;

    // A sensor this page cannot listen to must never occupy the wall.
    if (!sub(ent.stateTopic)) { removeEntity(dtopic); return; }

    entities.set(dtopic, ent);
    if (uid) byUid.set(uid, dtopic);
    index(byState, ent.stateTopic, dtopic);
    if (ent.availTopic) { index(byAvail, ent.availTopic, dtopic); sub(ent.availTopic); }

    clearAlert('nodisc');
    paint();
  }

  // ---------------------------------------------------------------- messages
  function onMessage(topic, payload) {
    var text;
    try { text = new TextDecoder('utf-8').decode(payload); }
    catch (e) { text = String(payload); }

    if (/^homeassistant\/.+\/config$/.test(topic)) {
      try { onDiscovery(topic, text); }
      catch (e) {
        parseErrors++;
        setAlert('parse', 'warn', 'alert.parse.apply', { msg: esc(e.message || '') });
      }
      return;
    }

    var now = Date.now();

    // Board availability, even where discovery declared no availability_topic.
    var b = /^dbk\/([^/]+)\/status$/i.exec(topic);
    if (b) boardStatus.set(b[1], { raw: text.trim(), at: now });

    if (byState.has(topic)) {
      byState.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.raw = text; e.value = parseValue(text); e.at = now;
      });
    }
    if (byAvail.has(topic)) {
      byAvail.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.availRaw = text.trim(); e.availAt = now;
      });
    }
    paint();
  }

  // ---------------------------------------------------------------- honesty
  function availabilityOf(ent) {
    if (ent.availTopic && ent.availRaw !== null) {
      if (ent.availRaw === ent.pNot) return 'offline';
      if (ent.availRaw === ent.pAvail) return 'online';
      return 'unknown';
    }
    if (ent.board && boardStatus.has(ent.board)) {
      var raw = boardStatus.get(ent.board).raw;
      if (raw === ent.pNot || raw === 'offline') return 'offline';
      if (raw === ent.pAvail || raw === 'online') return 'online';
    }
    return 'unknown';
  }

  function stateOf(ent) {
    if (availabilityOf(ent) === 'offline') return 'offline';
    if (!ent.at || !ent.value) return 'waiting';
    if (ent.value.kind === 'unknown' || ent.value.kind === 'empty') return 'unknown';
    // A concentration cannot be negative. Checked before stale and before live,
    // so a broken sensor is never dressed up as a reading — least of all a green one.
    if (ent.value.kind === 'number' && ent.value.n1 < 0 && isPm(ent)) return 'fault';
    if ((Date.now() - ent.at) / 1000 > ent.expire) return 'stale';
    return 'live';
  }

  /* =====================================================================
     PRESENTATION — the ambient wall.
     ===================================================================== */

  // Tones. One per EPA band, plus the three colourless states. Nothing that is
  // not a live measurement is ever given a band hue: an unheard monitor cannot
  // be allowed to look like clean air.
  // `ink` is deliberately NOT derived from `base` or `glow`. When it was a mid tint of the
  // band it tracked the ground it was drawn on and every band landed at the same unreadable
  // ratio. Each ink is now a high-luminance tint — still unmistakably the band's hue, but
  // pinned near the top of the scale so it separates from the field no matter how bright the
  // glow behind it gets. Legibility is verified by sampling rendered pixels, not by eye.
  var TONE = {
    '--band-good': { base: '#061410', glow: 'rgba(56,190,132,.50)', ink: '#d9f5e6', breath: '16s' },
    '--band-mod':  { base: '#151005', glow: 'rgba(214,163,58,.52)',  ink: '#faecc9', breath: '14s' },
    '--band-usg':  { base: '#170b04', glow: 'rgba(226,124,52,.56)',  ink: '#fde0cb', breath: '11s' },
    '--band-unh':  { base: '#170609', glow: 'rgba(226,80,96,.58)',   ink: '#fdd9de', breath: '8.5s' },
    '--band-vun':  { base: '#110818', glow: 'rgba(160,110,220,.58)', ink: '#e9e0fb', breath: '7s' },
    '--band-haz':  { base: '#1a040b', glow: 'rgba(255,64,100,.66)',  ink: '#ffdbe3', breath: '5.5s' }
  };
  var VOID_TONE  = { base: '#04070a', glow: 'rgba(126,146,166,.085)', ink: '#c3d0dc', breath: '0s' };
  var WAIT_TONE  = { base: '#05080d', glow: 'rgba(126,160,196,.14)',  ink: '#c8d5e2', breath: '0s' };
  var DOUBT_TONE = { base: '#0b0906', glow: 'rgba(190,160,110,.16)',  ink: '#e4d8bf', breath: '0s' };

  // The plain answer to "should we go outside?", one per band, in words a child
  // can act on — the resting word and the sentence under it. Both are looked up
  // by the band's own key, so neither can drift out of step with the other or
  // with the band name in the revealed detail.
  function advWord(b) { return b && b.k ? t('word.' + b.k) : t('word.unknown'); }
  function advSay(b)  { return b && b.k ? t('verdict.' + b.k) : t('verdict.unknown'); }

  var field = $('field');
  var regions = new Map();   // board id -> { root, a, b, front, sig, live, dark }
  var regionKey = '';

  function boardIds() {
    var s = new Set();
    boardStatus.forEach(function (v, k) { s.add(k); });
    entities.forEach(function (e) { if (e.board && isPm(e)) s.add(e.board); });
    return Array.from(s).sort();
  }

  function pmFor(id) {
    var best = null;
    entities.forEach(function (e) {
      if (e.board === id && isPm(e) && (!best || e.at > best.at)) best = e;
    });
    return best;
  }

  function buildRegions(ids) {
    var key = ids.join('|') || '(no boards)';
    if (key === regionKey) return;
    regionKey = key;
    field.textContent = '';
    regions.clear();
    var list = ids.length ? ids : ['(no boards)'];
    list.forEach(function (id) {
      var root = document.createElement('div');
      root.className = 'reg';
      var a = document.createElement('div'); a.className = 'lay';
      var b = document.createElement('div'); b.className = 'lay';
      var p = document.createElement('div'); p.className = 'pulse';
      var w = document.createElement('div'); w.className = 'weave';
      root.appendChild(a); root.appendChild(b); root.appendChild(p); root.appendChild(w);
      field.appendChild(root);
      regions.set(id, { root: root, a: a, b: b, front: null, sig: '', live: '', dark: '' });
    });
  }

  // A tone change is a crossfade between two layers, never a repaint of one:
  // opacity interpolates everywhere, a gradient does not.
  function crossfade(pair, background) {
    if (pair.sig === background) return;
    pair.sig = background;
    var next = (pair.front === pair.a) ? pair.b : pair.a;
    var prev = pair.front;
    next.style.background = background;
    void next.offsetWidth;                      // commit before the transition starts
    next.setAttribute('data-on', '1');
    if (prev) prev.setAttribute('data-on', '0');
    pair.front = next;
  }

  // The ground the whole room sits on. One wash, no edges.
  var washLayers = document.querySelectorAll('#wash .wlay');
  var wash = { a: washLayers[0], b: washLayers[1], front: null, sig: '' };
  function paintWash(tone) { crossfade(wash, tone.base); }

  // A board contributes a pool of light, never a filled rectangle.
  function paintRegion(reg, tone) {
    crossfade(reg, 'radial-gradient(108% 86% at 50% 62%, ' + tone.glow + ' 0%, transparent 72%)');
    var live = tone.breath !== '0s' ? '1' : '0';
    if (reg.live !== live) {
      reg.live = live;
      reg.root.setAttribute('data-live', live);
    }
    if (live === '1') reg.root.style.setProperty('--breath', tone.breath);
    var dark = (tone === VOID_TONE) ? '1' : '0';
    if (reg.dark !== dark) {
      reg.dark = dark;
      reg.root.setAttribute('data-dark', dark);
    }
  }

  // ---------------------------------------------------------------- paint
  var rowCache = new Map();
  var rowOrder = '';

  function rowFor(id) {
    var r = rowCache.get(id);
    if (r) return r;
    var root = document.createElement('div');
    root.className = 'row';
    root.innerHTML =
      '<span class="rid mono"></span>' +
      '<span class="rval"><span class="rnum"></span><i class="runit"></i></span>' +
      '<span class="rsay"></span>';
    r = {
      root: root,
      id: root.querySelector('.rid'),
      num: root.querySelector('.rnum'),
      unit: root.querySelector('.runit'),
      say: root.querySelector('.rsay')
    };
    rowCache.set(id, r);
    return r;
  }

  function paint() {
    var ids = boardIds();
    buildRegions(ids);

    var worst = -1;          // worst EPA band index among boards actually reporting
    var dark = 0;            // boards that say they are offline
    var doubt = 0;           // boards that are up but whose reading cannot be trusted
    var reporting = 0;       // boards holding a live, in-date, numeric reading RIGHT NOW
    var rowsHost = $('rows');
    var seen = new Set();
    // Re-attach only when the set of boards actually changed. Collecting the
    // existing rows into a fragment every second would MOVE them out of the
    // document, and a skipped append then left the detail layer empty.
    var order = ids.join('|');
    var reorder = order !== rowOrder;
    var frag = reorder ? document.createDocumentFragment() : null;

    (ids.length ? ids : []).forEach(function (id) {
      seen.add(id);
      var ent = pmFor(id);
      var st, band = null;

      if (!ent) {
        var bs = boardStatus.get(id);
        st = (bs && (bs.raw === 'offline' || bs.raw === '')) ? 'offline'
           : (bs && bs.raw === 'online') ? 'waiting' : 'unknown';
      } else {
        st = stateOf(ent);
        if (st === 'live' && ent.value && ent.value.kind === 'number') band = bandFor(ent.value.n1);
      }

      if (st === 'live' && band) { worst = Math.max(worst, bandIndex(band)); reporting++; }
      if (st === 'offline') dark++;
      if (st === 'stale' || st === 'fault' || st === 'unknown') doubt++;

      var tone = band ? TONE[band.v]
               : st === 'offline' ? VOID_TONE
               : (st === 'stale' || st === 'fault' || st === 'unknown') ? DOUBT_TONE
               : WAIT_TONE;
      var reg = regions.get(id);
      if (reg) paintRegion(reg, tone);

      // ---- the revealed row -------------------------------------------------
      var r = rowFor(id);
      r.root.setAttribute('data-s', st);
      r.id.textContent = id;                       // identity from the topic, not the name
      r.unit.textContent = '';
      r.say.style.color = '';

      if (st === 'offline') {
        var heard = (ent && ent.availAt) || (boardStatus.has(id) ? boardStatus.get(id).at : 0);
        r.num.textContent = t('state.offline');
        var lastSeen = ent && ent.value && ent.value.kind === 'number'
          ? t('row.lastsaid', { v: ent.value.text, u: ent.unit, ago: ago(ent.at) })
          : t('row.norecord');
        r.say.textContent = lastSeen + ' · ' + t('row.offlinefor', { ago: ago(heard) });
      } else if (st === 'waiting') {
        r.num.textContent = t('state.noreading');
        r.say.textContent = t('row.waiting');
      } else if (st === 'unknown') {
        // Whatever the sensor actually said stays verbatim; only a genuinely
        // empty payload gets words of ours.
        r.num.textContent = (ent && ent.value && ent.value.kind !== 'empty')
          ? ent.value.text : t('state.noreading');
        r.say.textContent = t('row.unknownvalue');
      } else if (st === 'fault') {
        r.num.textContent = ent.value.text;
        r.unit.textContent = ent.unit;             // verbatim from the wire
        r.say.textContent = t('row.fault');
      } else if (st === 'stale') {
        r.num.textContent = ent.value.text;
        r.unit.textContent = ent.unit;
        r.say.textContent = t('row.stale', { n: ent.expire, ago: ago(ent.at) });
      } else {
        r.num.textContent = ent.value.text;
        r.unit.textContent = ent.unit;             // µg/m³ exactly as published
        r.say.textContent = (band ? quiet(bandName(band)) : (ent.measure || t('state.live'))) +
          (band ? ' · ' + advSay(band) : '') + ' · ' + ago(ent.at);
        if (band) r.say.style.color = css(band.v);
      }
      if (ent && ent.templated) r.say.textContent += ' · ' + t('row.templated');

      if (reorder) frag.appendChild(r.root);
    });

    rowCache.forEach(function (r, id) { if (!seen.has(id)) { r.root.remove(); rowCache.delete(id); } });
    if (reorder) { rowOrder = order; rowsHost.appendChild(frag); }

    // ---- the resting word -------------------------------------------------
    var tone, word, say;
    var known = ids.length;

    if (worst >= 0) {
      var wb = BANDS[worst];
      tone = TONE[wb.v];
      word = advWord(wb);
      // Partial knowledge is stated in the sentence itself, not buried below it.
      // The clause leads, because the caveat has to be read before the advice —
      // and because it is the only phrasing that stays grammatical in front of
      // all six of these sentences, in either language.
      say = dark > 0 ? t('say.partial', { say: advSay(wb) }) : advSay(wb);
    } else {
      // Nothing here is allowed to borrow a band colour. A wall that cannot
      // measure says so, in the one word it has, and stays colourless. The
      // reason follows the verdict, because a wall that says only "unknown"
      // tells nobody whether to go and look at the monitors.
      word = t('word.unknown');
      var why;
      if (known === 0)        { tone = WAIT_TONE;  why = 'why.none'; }
      else if (dark === known){ tone = VOID_TONE;  why = 'why.silent'; }
      else if (doubt > 0)     { tone = DOUBT_TONE; why = 'why.doubt'; }
      else                    { tone = WAIT_TONE;  why = 'why.first'; }
      say = t('verdict.unknown') + ' ' + t(why);
    }

    // One ground for the whole room; the pools of light sit on top of it.
    paintWash(tone);
    document.documentElement.style.setProperty('--amb-ink', tone.ink);
    $('word').textContent = word;
    $('say').textContent = say;
    $('lead').textContent = say;

    // "Reporting" means a monitor is giving a reading we can actually use — the same test
    // that produced `worst` above. Counting "not declared offline" instead once printed
    // "every monitor is reporting" directly under "no monitor is giving a reading we can
    // trust": three boards were up and publishing "unavailable", "" and -4.2. A board that
    // is powered but silent is not reporting, and this line is the wall's only disclosure
    // of how much of the room it can actually see.
    var cover;
    if (known === 0) cover = t('cover.none');
    else if (reporting === 0) cover = known === 1
      ? t('cover.one.no')
      : t('cover.none.of', { n: numWord(known) });
    else if (reporting === known) cover = known === 1
      ? t('cover.one.yes')
      : t('cover.all');
    else cover = t(reporting === 1 ? 'cover.some.one' : 'cover.some.many',
                   { a: numWord(reporting), b: numWord(known) });
    $('cover').textContent = cover;

    $('foot-conn').textContent = connText(connState);
  }

  // ---------------------------------------------------------------- language
  // Everything that is written once and then only re-lettered lives here.

  function each(list, fn) { Array.prototype.forEach.call(list, fn); }

  // The named standard, with the bands under their own names in the active
  // language and their breakpoints in Arabic digits — a Thai reader reads a
  // PM2.5 value in Arabic digits, so the numbers never change.
  function paintEpaLine() {
    $('foot-epa').textContent = t('scale.epa') + ' · ' + BANDS.map(function (b) {
      return quiet(bandName(b)) + ' ' + b.r;
    }).join(' · ');
  }

  function paintFootHint() {
    $('foot-hint').textContent = demoMode ? t('demo.exit') : t('conn.hint');
  }

  // The demo mark is bilingual in BOTH languages, always. A Thai child standing
  // in front of an English wall still has to be able to see that the number is
  // invented, and the reverse.
  function paintDemoWarn() {
    $('demo-th').textContent = STR.th['demo.warn'];
    $('demo-en').textContent = STR.en['demo.warn'];
  }

  // TH / EN. Two of them: one in the revealed detail, one on the stop curtain —
  // the curtain hides the detail, and it is exactly the screen a Thai reader is
  // most likely to be staring at.
  function buildSwitch(host) {
    var w = document.createElement('div');
    w.className = 'langsw';
    w.setAttribute('role', 'group');
    ['th', 'en'].forEach(function (code, i) {
      if (i) {
        var sep = document.createElement('span');
        sep.className = 'langsep';
        sep.setAttribute('aria-hidden', 'true');
        sep.textContent = '·';
        w.appendChild(sep);
      }
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'langbtn';
      b.setAttribute('data-lang', code);
      b.setAttribute('lang', 'en');
      b.textContent = code === 'th' ? 'TH' : 'EN';   // typed, never text-transform
      b.addEventListener('click', function () { setLang(code); reveal(); });
      w.appendChild(b);
    });
    host.appendChild(w);
    return w;
  }

  function syncSwitch() {
    each(document.querySelectorAll('.langsw'), function (w) {
      w.setAttribute('aria-label', t('lang.label'));
    });
    each(document.querySelectorAll('.langbtn'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === LANG ? 'true' : 'false');
    });
  }

  // A language change re-letters the wall in place. No reload: reloading would
  // drop the MQTT connection, lose every retained reading the broker already
  // replayed, and blink the field back through its boot state.
  function setLang(code) {
    if (code !== 'th' && code !== 'en') return;
    if (code === LANG) return;
    LANG = code;
    try { localStorage.setItem(LANG_KEY, code); } catch (e) {}   // private mode throws
    applyLang();
  }

  function applyLang() {
    document.documentElement.lang = LANG;    // line-breaking and font selection
    each(document.querySelectorAll('[data-i18n]'), function (n) {
      n.textContent = t(n.getAttribute('data-i18n'));
    });
    syncSwitch();
    paintEpaLine();
    paintFootHint();
    paintStoreHint();
    paintDemoWarn();
    paintNotes();
    renderStop();
    if (demoMode && lastDemoSpec) demoMark(lastDemoSpec, lastDemoPlan);
    paint();          // the word, the sentence, the coverage line, every row
  }

  buildSwitch($('foot'));
  buildSwitch($('stop'));

  // ---------------------------------------------------------------- behaviour
  // The detail is not a screen you open. It is what the wall does when someone
  // comes near it, and it goes away again on its own.
  var revealTimer = null;
  function reveal(ms) {
    document.body.setAttribute('data-reveal', '1');
    if (revealTimer) clearTimeout(revealTimer);
    revealTimer = setTimeout(function () {
      if (!$('panel').hidden) return;            // stay up while settings are open
      document.body.setAttribute('data-reveal', '0');
    }, ms || 6000);
  }

  ['pointermove', 'pointerdown', 'wheel', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, function () { reveal(); }, { passive: true });
  });

  // A wall has nobody to move a mouse at it. Bound to input alone, the detail layer —
  // the ONLY place the board ids, their state and their readings appear — never showed
  // at all on the display this page was written for: during a smoke event it was a purple
  // glow and the word "harmful", disclosing nothing about two thirds of its sensors being
  // dead. So the wall also shows itself, unprompted, on its own clock.
  var CENSUS_EVERY = 120000;   // every two minutes
  var CENSUS_FOR   = 8000;     // held for eight seconds
  setInterval(function () {
    if (document.body.getAttribute('data-reveal') === '1') return;  // someone is already there
    if (!$('panel').hidden) return;                                 // settings are open
    reveal(CENSUS_FOR);
  }, CENSUS_EVERY);

  // A board changing state is worth showing immediately — that is the moment the census
  // stopped being true.
  var lastCensus = '';
  function censusChanged() {
    var sig = boardIds().map(function (id) {
      var ent = pmFor(id);
      if (ent) return id + ':' + stateOf(ent);
      var bs = boardStatus.get(id);
      return id + ':' + ((bs && bs.raw) || '?');
    }).join('|');
    if (sig === lastCensus) return;
    var had = lastCensus !== '';
    lastCensus = sig;
    if (had) reveal(CENSUS_FOR);
  }
  setInterval(censusChanged, 1000);

  window.addEventListener('keydown', function (e) {
    var t = e.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (e.key === 'Escape' && !$('panel').hidden) { closePanel(); return; }
    if (typing) return;
    reveal();
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); openPanel(); }
    // "l" for language. "s" is the settings key and was here first.
    if (e.key === 'l' || e.key === 'L') { e.preventDefault(); setLang(LANG === 'th' ? 'en' : 'th'); }
  });

  // ---------------------------------------------------------------- the stop
  // Held as a key, not as finished text, so the curtain follows a language
  // switch — it is the one screen where nothing else is left to read.
  var lastStop = null;
  function stop(key, vars) {
    lastStop = { key: key, vars: vars || null };
    renderStop();
    document.body.setAttribute('data-stop', '1');
  }
  function renderStop() {
    if (lastStop) $('stop-say').textContent = t(lastStop.key, rv(lastStop.vars));
  }
  function unstop() { lastStop = null; document.body.setAttribute('data-stop', '0'); }

  // ---------------------------------------------------------------- connect
  var CONN_KEY = {
    idle: 'conn.idle', connecting: 'conn.connecting', connected: 'conn.connected',
    reconnecting: 'conn.retrying', closed: 'conn.closed', error: 'conn.unreachable',
    fatal: 'conn.refused', demo: 'conn.demo'
  };
  function connText(state) { return CONN_KEY[state] ? t(CONN_KEY[state]) : state; }
  function setConn(state) {
    connState = state;
    $('foot-conn').textContent = connText(state);
  }

  // The reason travels as a key, not as a sentence: it ends up inside the stop
  // curtain, which has to be able to re-render itself in the other language.
  function describe(err) {
    var code = err && (err.code !== undefined ? err.code : err.reasonCode);
    var map = {
      1: 'err.proto',
      2: 'err.clientid',
      3: 'err.unavailable',
      4: 'err.credentials',
      5: 'err.notauth'
    };
    if (map[code]) return { reason: { i18n: map[code] }, fatal: code === 2 || code === 4 || code === 5 };
    var m = String((err && err.message) || err || 'unknown error');
    if (/not authoriz|bad user/i.test(m)) return { reason: m, fatal: true };
    return { reason: m, fatal: false };
  }

  function disconnect() {
    manualStop = true;
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    subs.clear();
  }

  function connect(cfg) {
    // The one hard rule of demo mode: no socket. A wall must never carry a real
    // reading and a simulated one at the same time, so this is enforced at the
    // only door to the broker rather than at each of the callers.
    if (demoMode) return;

    if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
      setConn('fatal');
      stop('stop.nolib');
      return;
    }

    disconnect();
    manualStop = false;
    everConnected = false;
    activeFilter = typeof cfg.filter === 'string' ? cfg.filter.trim() : '';
    filteredOut.clear();
    ['conn', 'auth', 'mixed', 'nodisc', 'suberr', 'parse', 'wildcard', 'subcap', 'filter'].forEach(clearAlert);

    var scheme = cfg.tls ? 'wss' : 'ws';
    var url = scheme + '://' + cfg.host + ':' + cfg.port;
    var where = cfg.host + ':' + cfg.port;
    setConn('connecting');

    // A page served over HTTPS cannot open a plaintext ws:// socket.
    if (!cfg.tls && location.protocol === 'https:') {
      setAlert('mixed', 'warn', 'alert.mixed');
    }

    try {
      client = mqtt.connect(url, {
        username: cfg.user || undefined,
        password: cfg.pass || undefined,
        clientId: 'air-ambient-' + Math.random().toString(16).slice(2, 10),
        clean: true,
        reconnectPeriod: 4000,
        connectTimeout: 8000,
        keepalive: 45,
        resubscribe: true
      });
    } catch (e) {
      setConn('fatal');
      stop('stop.nostart', { where: where });
      return;
    }

    client.on('connect', function () {
      everConnected = true;
      unstop();
      setConn('connected');
      clearAlert('conn');
      // Bounded discovery wildcards — the two shapes HA publishes, plus board
      // availability. subRaw, not sub: these three are authored here and are the
      // only wildcards this page may ever hold. Nothing containing '#' is one of them.
      subRaw('homeassistant/+/+/config');     // <component>/<object_id>/config
      subRaw('homeassistant/+/+/+/config');   // <component>/<node_id>/<object_id>/config
      subRaw('dbk/+/status');
      if (discoveryTimer) clearTimeout(discoveryTimer);
      discoveryTimer = setTimeout(function () {
        if (entities.size === 0 && filteredOut.size === 0 && connState === 'connected') {
          setAlert('nodisc', 'info', 'alert.nodisc');
        }
      }, 4000);
      paint();
    });

    client.on('message', function (topic, payload) {
      try { onMessage(topic, payload); }
      catch (e) { /* one bad message must never stop the stream */ }
    });

    client.on('reconnect', function () { if (!manualStop && connState !== 'fatal') setConn('reconnecting'); });
    client.on('offline', function () { if (!manualStop && connState !== 'fatal') setConn('reconnecting'); });

    // A browser never reveals WHY a WebSocket handshake failed, and for a refused
    // port mqtt.js may close without ever emitting a useful 'error'.
    client.on('close', function () {
      if (manualStop || connState === 'fatal') return;
      if (!everConnected) {
        setConn('error');
        stop('stop.unreachable', { where: where });
      } else {
        setConn('reconnecting');
        setAlert('conn', 'warn', 'alert.dropped');
      }
    });

    client.on('error', function (err) {
      var d = describe(err);
      if (d.fatal) {
        setConn('fatal');
        manualStop = true;
        try { client.end(true); } catch (e) {}
        client = null;
        stop('stop.refused', { where: where, reason: d.reason });
      } else {
        setConn('error');
        stop('stop.unreachable', { where: where });
      }
    });
  }

  // ---------------------------------------------------------------- settings
  var panel = $('panel'), form = $('form');
  var storeHintKey = null;
  function setStoreHint(key) { storeHintKey = key; paintStoreHint(); }
  function paintStoreHint() { $('store-hint').textContent = storeHintKey ? t(storeHintKey) : ''; }
  function openPanel() {
    if (demoMode) return;      // there is nothing to configure on a wall that is
                               // not listening, and connecting from here would
                               // put a live reading under the demo mark.
    panel.hidden = false;
    reveal(600000);
    setTimeout(function () { $('f-host').focus(); }, 0);
  }
  function closePanel() {
    panel.hidden = true;
    reveal(2500);
  }
  $('btn-close').addEventListener('click', closePanel);

  function readForm() {
    return {
      host: $('f-host').value.trim(),
      port: $('f-port').value.trim(),
      user: $('f-user').value,
      pass: $('f-pass').value,
      tls: $('f-tls').checked,
      filter: $('f-filter').value.trim(),
      remember: $('f-remember').checked
    };
  }
  function fillForm(v) {
    $('f-host').value = (v && v.host) || DEFAULT_HOST;
    $('f-port').value = (v && v.port) || DEFAULT_PORT;
    $('f-user').value = (v && v.user) || '';
    $('f-pass').value = (v && v.pass) || '';
    $('f-tls').checked = !!(v && v.tls);
    $('f-filter').value = v && typeof v.filter === 'string' ? v.filter : DEFAULT_FILTER;
    $('f-remember').checked = !!(v && (v.remember || v.pass));
  }
  // What goes to disk is not what is in the form: the passphrase is opt-in.
  function storable(cfg) {
    var out = { host: cfg.host, port: cfg.port, user: cfg.user, tls: cfg.tls,
                filter: cfg.filter, remember: !!cfg.remember };
    if (cfg.remember) out.pass = cfg.pass;
    return out;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (demoMode) return;      // unreachable through the UI; belt and braces so
                               // demo mode can never write settings to disk.
    var cfg = readForm();
    if (!cfg.host || !cfg.port) return;
    entities.clear(); byState.clear(); byAvail.clear(); byUid.clear(); boardStatus.clear();
    filteredOut.clear();
    rowCache.forEach(function (r) { r.root.remove(); });
    rowCache.clear();
    rowOrder = '';
    regionKey = '';
    parseErrors = 0;
    unstop();
    var ok = saveStore(storable(cfg));
    setStoreHint(!ok ? 'store.refused'
                     : cfg.remember ? 'store.savedpass' : 'store.savednopass');
    closePanel();
    connect(cfg);
    paint();
  });

  $('btn-forget').addEventListener('click', function () {
    clearStore();
    fillForm(null);
    $('f-pass').value = '';
    disconnect();
    setConn('idle');
    setStoreHint('store.cleared');
  });

  /* =====================================================================
     DEMO MODE — for judging the layout at the readings the fleet is not
     currently giving us. Three rules hold it together:

       1. It is opt-in from the URL and nowhere else. No default, no stored
          flag, no key to press. Drop ?demo= and reload and this wall is a
          live wall again, with nothing left behind.
       2. It opens no socket (see connect()). Real air and simulated air are
          never on this screen at the same time.
       3. It renders through the SHIPPED path, not beside it. The scene is
          emitted as discovery configs and state payloads — the same abbreviated
          keys and the same UTF-8 bytes a board puts on the wire — and pushed
          through onMessage(), which is where the broker's messages land. It used
          to build entity objects by hand and index them directly, which drew a
          convincing picture while running none of the ingest code, so none of
          the bugs that live in the ingest code could ever show up in a demo.

       4. An unrecognised ?demo= is still a demo. See demoParam().
     ===================================================================== */

  // Middles of the EPA bands, so a named band shows a value that is squarely
  // inside it rather than one breakpoint away from the neighbouring colour.
  var DEMO_MID = {
    good: 6, moderate: 24, sensitive: 45, unhealthy: 100, verybad: 200, hazardous: 320
  };
  var DEMO_ORDER = ['good', 'moderate', 'sensitive', 'unhealthy', 'verybad', 'hazardous'];

  var demoMode = null;      // null when off — the only switch this file reads
  var demoStep = 0;
  var demoTimer = null;
  var demoBorn = Date.now();

  function demoParam() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return null; }
    var raw = q.get('demo');
    if (raw === null) return null;
    var v = String(raw).trim().toLowerCase();
    if (v === '' || v === 'cycle') return { kind: 'cycle' };
    if (v === 'mixed') return { kind: 'mixed' };
    if (Object.prototype.hasOwnProperty.call(DEMO_MID, v)) return { kind: 'value', pm: DEMO_MID[v] };
    var n = Number(v);
    if (Number.isFinite(n) && n >= 0 && n < 100000) return { kind: 'value', pm: n };
    // An unreadable ?demo= FAILS TOWARD THE DEMO. This file used to fall through
    // to the real wall and say nothing at all — no marker, no notice, a live
    // socket — which reads as the careful answer and is not: whoever typed
    // ?demo=hazardus is expecting a simulation, and today's real air handed over
    // under that expectation is a genuine reading photographed and passed around
    // as a mock-up. The mixed fleet invents no band from the bad token, and the
    // mark prints the token back with a cross through it. Every wall in this
    // folder now answers a bad token this way; one control on the contact sheet
    // drives all twenty, so they cannot each have a policy of their own.
    return { kind: 'mixed', bad: String(raw) };
  }

  // Publish-shaped strings. These boards send integers and the EPA truncates to
  // one decimal, so a demo value carries at most one — exactly the shape
  // parseValue() sees off the wire.
  function demoText(n) {
    var t = Math.round(n * 10) / 10;
    return Number.isInteger(t) ? String(t) : t.toFixed(1);
  }
  // What the WALL will print for that payload — the marker and the screen have to
  // agree about the value being simulated, and the only way to guarantee that is
  // to run the payload through the very parser the wall runs it through. Reached
  // for by the mark; demoText() stays the wire format, because that is what goes
  // on the topic.
  function demoShown(n) {
    var v = parseValue(demoText(n));
    return (v && v.kind === 'number') ? v.text : demoText(n);
  }
  // Fitted, not guessed. The bar is fixed and out of flow, so it cannot push the
  // wall down by itself; whatever it actually measures becomes the offset, and it
  // is re-measured whenever the text reflows.
  function demoFit() {
    var bar = $('demobar');
    if (!bar || bar.hidden) return;
    var h = bar.getBoundingClientRect().height;
    if (h > 0) document.body.style.setProperty('--demobar-h', (h + 6) + 'px');
  }
  // The board's own thresholds, from sim/dbk-sim.yaml. Its wording, not ours.
  function demoLevel(pm) { return pm <= 25 ? 'GOOD' : pm <= 50 ? 'FAIR' : 'BAD'; }

  /* ---------------------------------------------------- the wire, not the model

     Everything below emits BYTES ON A TOPIC and hands them to onMessage(), the
     same function the broker's messages land in. Nothing here writes an entity,
     an index or a Map.

     This file used to hand-build entity objects and drop them straight into
     entities / byUid / byState / byAvail. It rendered convincingly and tested
     almost nothing. Instrumented, v15's demo called onDiscovery 0 times,
     onMessage 0 times, expand() 0 times and sub() 0 times, where every sibling
     called them roughly 8 / 19 / 8 / 16. So the demo never ran JSON.parse, never
     ran the '~' alias expansion, never ran the topic filter, never ran the UTF-8
     decode that protects the µ, never evicted a unique_id collision, and — most
     of all — never ran the guard in onDiscovery() that DELETES an entity whose
     state topic sub() refuses. Two sibling walls each independently shipped a
     bug in exactly that guard, where every synthesised entity was silently
     removed and the wall rendered empty under a confident DEMO banner. A demo
     that bypasses the ingest path cannot surface that class of defect, and that
     class of defect is what demo mode is for. ------------------------------- */

  var demoEnc = (typeof TextEncoder === 'function') ? new TextEncoder() : null;
  var demoDeclared = false;

  function demoPublish(topic, text) {
    var str = String(text);
    try { onMessage(topic, demoEnc ? demoEnc.encode(str) : str); }
    catch (e) { /* one bad synthetic message must not stop the scene */ }
  }

  // Abbreviated keys and a '~' base on purpose: alias expansion is part of what a
  // demo has to prove still works, not something to step around. The name is
  // "PM2.5" on every board, exactly as on the wire — the identity has to come out
  // of the state topic, and that rule is only tested if the demo obeys it too.
  function demoConfig(board, o) {
    var slug = board.toLowerCase().replace(/-/g, '_');
    var cfg = {
      '~': 'dbk/' + board,
      name: o.name,
      stat_t: o.topic,
      avty_t: '~/status',
      uniq_id: slug + '_' + o.slug,
      exp_aft: DEFAULT_EXPIRE,
      dev: { name: 'Kit4Kids ' + board, ids: [slug] }
    };
    if (o.unit) { cfg.unit_of_meas = o.unit; cfg.stat_cla = 'measurement'; }
    if (o.dcls) cfg.dev_cla = o.dcls;
    demoPublish('homeassistant/sensor/' + slug + '_' + o.slug + '/config', JSON.stringify(cfg));
  }

  // The sensors each board actually announces. Only DBK-002 publishes the rest of
  // the ESPHome set; the other two send PM2.5 alone, which is itself worth
  // demonstrating, because a dense layout has to survive both.
  function demoSensors(p) {
    var list = [{ slug: 'pm25', name: 'PM2.5', unit: 'µg/m³', dcls: 'pm25',
                  topic: 'dbk/' + p.id + '/pm2_5' }];
    if (!p.extras) return list;
    var s = 'dbk/' + p.id + '/sensor/';
    return list.concat([
      { slug: 'pm1_0',  name: 'PM1.0',  unit: 'µg/m³', dcls: 'pm1',   topic: s + 'pm1_0/state' },
      { slug: 'pm10',   name: 'PM10',   unit: 'µg/m³', dcls: 'pm10',  topic: s + 'pm10/state' },
      { slug: 'wi_fi_rssi', name: 'Wi-Fi RSSI', unit: 'dBm', dcls: 'signal_strength',
        topic: s + 'wi-fi_rssi/state' },
      { slug: 'uptime', name: 'Uptime', unit: 's',     dcls: 'duration', topic: s + 'uptime/state' },
      { slug: 'air_quality_level', name: 'Air Quality Level', unit: '', dcls: '',
        topic: s + 'air_quality_level/state' }
    ]);
  }

  // When a message arrived is the only thing that makes a reading stale, so the
  // demo back-dates the very fields onMessage() just wrote rather than keeping a
  // clock of its own. The shipped expiry rule still decides what "stale" means.
  function demoBackdate(p, now) {
    var at = now - p.age * 1000, availAt = now - p.availAge * 1000;
    entities.forEach(function (e) {
      if (e.board !== p.id) return;
      if (e.at) e.at = at;
      if (e.availAt) e.availAt = availAt;
    });
    if (boardStatus.has(p.id)) boardStatus.get(p.id).at = availAt;
  }

  function demoPlan(spec) {
    if (spec.kind === 'mixed') {
      // The state the fleet is actually in most days: one board reporting, one
      // dark, and one that answered hours ago and has not been heard from since
      // — the arrangement a layout is most likely to render badly.
      return [
        { id: 'DBK-001', state: 'offline', pm: 38.2, age: 11894, availAge: 11720, rssi: -74, up: 0 },
        { id: 'DBK-002', state: 'live',    pm: 42.7, age: 6,     availAge: 268,   rssi: -58, up: 214380, extras: true },
        { id: 'DBK-010', state: 'stale',   pm: 57.4, age: 2520,  availAge: 2520,  rssi: -69, up: 61980 }
      ];
    }
    // Every board reporting the same value, so the value under test is the only
    // thing the layout has to deal with.
    return [
      { id: 'DBK-001', state: 'live', pm: spec.pm, age: 11, availAge: 74520, rssi: -71, up: 91260 },
      { id: 'DBK-002', state: 'live', pm: spec.pm, age: 4,  availAge: 74210, rssi: -58, up: 214380, extras: true },
      { id: 'DBK-010', state: 'live', pm: spec.pm, age: 18, availAge: 73980, rssi: -66, up: 61980 }
    ];
  }

  function demoFleet(plan, now) {
    if (!demoDeclared) {
      plan.forEach(function (p) {
        demoSensors(p).forEach(function (o) { demoConfig(p.id, o); });
      });
      demoDeclared = true;
    }
    plan.forEach(function (p) {
      var avail = p.state === 'offline' ? 'offline' : 'online';
      demoPublish('dbk/' + p.id + '/status', avail);
      demoSensors(p).forEach(function (o) {
        var raw;
        if (o.slug === 'pm25')            raw = demoText(p.pm);
        else if (o.slug === 'pm1_0')      raw = demoText(p.pm * 0.62);
        else if (o.slug === 'pm10')       raw = demoText(p.pm * 1.45);
        else if (o.slug === 'wi_fi_rssi') raw = String(p.rssi);
        else if (o.slug === 'uptime')     raw = String(p.up + Math.floor((now - demoBorn) / 1000));
        else                              raw = demoLevel(p.pm);
        demoPublish(o.topic, raw);
      });
      demoBackdate(p, now);
    });
  }

  // What the mark says. Built as separate nodes so the bar wraps between the
  // parts and never inside a number.
  function demoSegments(parts) {
    var host = $('demo-val');
    host.textContent = '';
    parts.forEach(function (p, i) {
      if (i) {
        var sep = document.createElement('span');
        sep.className = 'dsep'; sep.textContent = '·';
        sep.setAttribute('aria-hidden', 'true');   // spacing, not wording
        host.appendChild(sep);
      }
      var s = document.createElement('span');
      s.className = 'nb'; s.textContent = p;
      host.appendChild(s);
    });
  }

  function demoMark(spec, plan) {
    var parts = [];
    if (spec.kind === 'mixed') {
      plan.forEach(function (p) {
        parts.push(p.state === 'live' ? p.id + ' ' + demoShown(p.pm) + ' ' + t('unit.ugm3')
                 : p.state === 'offline' ? p.id + ' ' + t('state.offline')
                 : p.id + ' ' + t('state.stale'));
      });
    } else {
      var pm = plan[0].pm;
      var b = bandFor(Math.trunc(pm * 10) / 10);
      parts.push(t('demo.at') + ' ' + demoShown(pm) + ' ' + t('unit.ugm3'));
      if (b) parts.push(quiet(bandName(b)));
      if (demoMode && demoMode.kind === 'cycle') parts.push(t('demo.cycling'));
    }
    // Echoed back exactly as typed, with a cross. Whoever put a bad token in the
    // address bar is reading their own token, in whatever language they typed it.
    if (spec.bad) parts.push('?demo=' + spec.bad + ' ✗');
    demoSegments(parts);
    demoFit();          // the value just changed length; the bar may have rewrapped
  }

  // Kept so a language switch can re-letter the mark without waiting for the
  // next tick — the mark is the one thing on a simulated wall that must never
  // be even briefly wrong.
  var lastDemoSpec = null, lastDemoPlan = null;

  function demoTick() {
    var spec = demoMode;
    if (!spec) return;
    if (spec.kind === 'cycle') {
      spec = { kind: 'value', pm: DEMO_MID[DEMO_ORDER[demoStep % DEMO_ORDER.length]] };
      demoStep++;
    }
    var now = Date.now();
    var plan = demoPlan(spec);
    lastDemoSpec = spec; lastDemoPlan = plan;
    // Re-stamped each tick, so a board that is meant to be reporting keeps
    // reporting instead of quietly ageing into "expired" fifteen minutes into a
    // demonstration — while the stale board stays exactly as stale as it was.
    demoFleet(plan, now);
    demoMark(spec, plan);
    paint();
  }

  function startDemo(spec) {
    demoMode = spec;
    demoBorn = Date.now();
    // The bar and the frame cover every crop of a photograph of the SCREEN, but
    // not a crop of the browser chrome above it: a tab strip, a bookmark and a
    // screenshot of the window frame carry the title and nothing else.
    document.title = 'DEMO — ' + document.title;
    document.body.setAttribute('data-demo', '1');
    $('demobar').hidden = false;
    $('demoframe').hidden = false;
    paintDemoWarn();
    paintFootHint();
    connState = 'demo';
    demoTick();
    demoFit();
    // Registered only in demo mode, so a live wall keeps exactly the listeners it
    // always had.
    window.addEventListener('resize', demoFit);
    if (demoTimer) clearInterval(demoTimer);
    demoTimer = setInterval(demoTick, spec.kind === 'cycle' ? 4000 : 5000);
  }

  // ---------------------------------------------------------------- boot
  // No configuration screen on load. Stored settings first, then the URL, then
  // an anonymous connection to the lab broker's websocket port.
  function bootCfg() {
    var q;
    try { q = new URLSearchParams(location.search); }
    catch (e) { q = { get: function () { return null; }, has: function () { return false; } }; }
    var s = loadStore();
    var qs = function (k) { var v = q.get(k); return typeof v === 'string' ? v : ''; };
    return {
      host: (s && s.host) || qs('h') || DEFAULT_HOST,
      port: (s && s.port) || qs('port') || DEFAULT_PORT,
      user: (s && s.user) || qs('u') || '',
      pass: (s && s.pass) || qs('p') || '',
      tls: s && typeof s.tls === 'boolean' ? s.tls : (qs('tls') === '1'),
      filter: s && typeof s.filter === 'string' ? s.filter
            : (q.has && q.has('f') ? qs('f') : DEFAULT_FILTER),
      remember: !!(s && s.remember)
    };
  }

  var demoSpec = demoParam();
  if (demoSpec) {
    // No connection setting is read from storage, none is written to it, and no
    // socket is opened. This branch ends here: there is no path from it back to
    // the wire. (The chosen language is remembered under its own key — it is a
    // reading preference, not a credential, and it cannot reach the broker.)
    startDemo(demoSpec);
  } else {
    var boot = bootCfg();
    fillForm(boot);
    activeFilter = typeof boot.filter === 'string' ? boot.filter.trim() : '';
    setStoreHint(!storeWorks ? 'store.blocked' : 'store.local');

    paint();
    connect(boot);
  }

  // Last, so it letters whatever the two branches above just put on the screen —
  // including a stop curtain that connect() may already have raised.
  applyLang();

  // Time keeps moving even when the broker is quiet: a reading that has aged
  // past its expiry must lose its colour on its own.
  setInterval(paint, 1000);

  // Show what the wall knows once, then let it recede. After this it only
  // speaks when someone is there.
  reveal(4500);
})();
</script>
<script src="_wallcreds.js"></script>
</body>
</html>
