<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing — the air over Chiang Mai</title>
<style>
/* ============================================================================
   NOW PLAYING — a music-player face for live PM2.5.

   The photograph is the data. One sharp crop of the band photograph sits in the
   "album art" slot; the same frame, blown up and heavily blurred, is the room
   colour behind everything. When the air changes band, the record changes.

   ── HOW CONTRAST IS GUARANTEED ACROSS ALL SIX GROUNDS ─────────────────────
   Measured mean luminance of the six raw frames (sRGB grey mean):
     good 93.9 · moderate 104.5 · sensitive 144.9 · unhealthy 126.9 ·
     verybad 136.8 · hazardous 52.4       (pixel min 0, pixel max 255)
   No single ink survives that spread on bare photography, so no text is ever
   placed on bare photography. Two structural rules do the work:

   1. NOTHING READS OFF THE SHARP PHOTO. The sharp frame appears in exactly one
      element — the art tile. Its only text sits inside .art-cap, under its own
      bottom-up gradient scrim of alpha .78 → .96. Absolute worst case, a pure
      white 255 pixel at the .78 stop: 0.22*255 + 0.78*8 = 62.3 sRGB, where
      white ink measures 10.6:1.
   2. EVERYTHING ELSE READS OFF A BOUNDED FIELD. The blurred layer is covered by
      a fixed scrim of alpha .62 (#070911), and every panel adds its own fill at
      alpha >= .40. That exact stack was composited over all six frames and
      measured; the BRIGHTEST PIXEL produced by any of them is 66.1 sRGB
      (moderate). Contrast against that single worst pixel, measured not
      estimated — WCAG AA for normal text is 4.5:1, and most of this is large:
        --ink #f2f6fb 9.25:1 · --dim 5.78:1 · --faint 4.84:1
        Good 7.14 · Moderate 7.32 · Sensitive 5.73 · Unhealthy 5.27 ·
        Very unhealthy 5.99 · Hazardous 4.88
      Each band ink against its OWN ground is better still: 6.5:1 – 7.9:1.
   The @supports fallback raises every panel fill to alpha .93, which can only
   darken the ground and therefore only raise those numbers — a browser without
   backdrop-filter gets a flatter, entirely readable wall, never a transparent
   unreadable one.

   ── DELIBERATELY ABSENT ───────────────────────────────────────────────────
   This file contains no CSS uppercasing rule at all. Re-casing in CSS maps "µ"
   to "M", turning µg/m³ into MG/M³ — a 1000x unit error caused by a styling
   rule. Every label that wants capitals is authored with capitals, in the
   markup or in a string, so no rule can ever reach a unit or a wire value.
   ========================================================================== */

:root{
  --ink:#f2f6fb;
  --dim:#b9c6d4;
  --faint:#a6b6c6;          /* floor-tested: 4.84:1 at the worst possible ground */
  --hair:rgba(255,255,255,.16);
  --hair-top:rgba(255,255,255,.34);
  --glass:rgba(17,21,29,.42);
  --glass-2:rgba(13,16,23,.52);
  --shadow:0 18px 44px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.3);

  /* Saturated hues drive graphics (bar fills, dots). The paler "ink" variants
     drive TEXT, and only those were contrast-checked. */
  --g-good:#34d399; --i-good:#7cf0ae;
  --g-mod:#facc15;  --i-mod:#ffd873;
  --g-usg:#fb923c;  --i-usg:#ffb37a;
  --g-unh:#f87171;  --i-unh:#ffa3a3;
  --g-vun:#a78bfa;  --i-vun:#d7bcff;
  --g-haz:#fb4d68;  --i-haz:#ff96ab;

  --acc:#8fa3b6;   /* no-signal grey — never a band colour */
  --ink-acc:#c3d2e0;
  --r:22px;

  /* Two stacks, one switch. No webfont link: this page is opened off a wall-mounted
     browser with no internet, so it names system faces and accepts the fallback. A
     Latin-only stack renders Thai through whatever the OS substitutes, which parks
     tone marks badly — so real Thai faces are named first when Thai is on. */
  --latin:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --thai:'Noto Sans Thai','IBM Plex Sans Thai','Sarabun';
  --font:var(--latin);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%}
body{
  min-height:100vh;
  background:#0a0d13;
  color:var(--ink);
  font:16px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
  text-shadow:0 1px 3px rgba(0,0,0,.5);   /* belt-and-braces over the glass */
}
h1,h2,h3{margin:0;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------------------------------------------------------------- language */
/* Thai is not Latin with different glyphs, and three things have to be true or the
   wall renders it badly:

   1. A REAL THAI FACE IS NAMED. --font is redefined per language and re-declared on
      every element that carries a lang attribute, so a single element can hold the
      other language — which is exactly what the third line of the answer block does.
   2. MORE LEADING. สั้ / ญู stack a mark ABOVE and a tail BELOW the line; the 1.15
      and 1.2 that suit a Latin display face clip them. Every Thai-bearing box below
      is raised to at least 1.5.
   3. NO LETTER-SPACING, AND NO BREAK RULE NEAR A NUMBER. Letter-spacing is a Latin
      small-caps device that only prises Thai apart. Thai has no word boundary for
      the browser to break on, so Thai prose is given overflow-wrap:anywhere — and
      a numeric reading never is, in either language.

   :lang(th) matches whether the language comes from <html lang="th"> or from one
   element marked lang="th" inside an English page, so each rule below is written
   once and covers both. Note what is NOT here: no text-transform. This file has
   never had one — re-casing maps µ to M, and it would do nothing to Thai anyway. */
[lang="th"]{--font:var(--thai),var(--latin)}
[lang="en"]{--font:var(--latin)}
[lang]{font-family:var(--font)}

.art-cap .v:lang(th){line-height:1.5;letter-spacing:0}
.art-blank p:lang(th){line-height:1.6;overflow-wrap:anywhere}
.np-artist:lang(th){line-height:1.5;letter-spacing:0}
.np-num[data-kind="word"]:lang(th){line-height:1.3;letter-spacing:0}
.np-album:lang(th),.scale-ends:lang(th),.pill:lang(th){line-height:1.6}
.answer .a:lang(th){line-height:1.5;letter-spacing:0;overflow-wrap:anywhere}
.answer .why:lang(th),.answer .alt:lang(th){line-height:1.6;overflow-wrap:anywhere}
.trk-id:lang(th){line-height:1.5;letter-spacing:0}
.trk-note:lang(th){line-height:1.6}
.extra:lang(th),.list-head .count:lang(th),.foot:lang(th){line-height:1.6}
#down .say:lang(th){line-height:1.55;overflow-wrap:anywhere}
.sheet .lead:lang(th),.sheet .note:lang(th),.warn:lang(th){line-height:1.7}
.eyebrow:lang(th),.art-cap .k:lang(th),.answer .q:lang(th),.f label:lang(th){letter-spacing:.02em}

/* ---------------------------------------------------------------- the room */
/* Layer 0: the blurred record sleeve. Layer 1: the fixed scrim that bounds it. */
#room{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 20% 0%, #16202c 0%, #0a0d13 62%, #070910 100%);
  overflow:hidden}
/* The bleed is `inset:-14%` — that alone is what stops the blur showing a soft
   edge. A `transform:scale(1.25)` on top of it was enlarging the same layer a
   second time, taking the rasterised box to 3.4 megapixels per layer BEFORE a
   64px blur ran, twice over, for no visible difference. `will-change:opacity`
   keeps the blurred texture cached across the 900ms crossfade instead of
   re-blurring when the layer is promoted; 32px is plenty at this bleed, since
   the fixed #scrim above is what actually buys the legibility. */
#room .fade{
  position:absolute;inset:-14%;
  background-size:cover;background-position:center;
  filter:blur(32px) saturate(1.45);
  opacity:0;transition:opacity .9s ease;
  will-change:opacity;
}
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(6,8,14,.30) 0%, rgba(6,8,14,0) 26%, rgba(6,8,14,0) 70%, rgba(6,8,14,.34) 100%),
    rgba(7,9,17,.62);
}

/* ---------------------------------------------------------------- shell */
.player{
  position:relative;z-index:2;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;gap:clamp(.75rem,1.6vh,1.4rem);
  padding:clamp(.85rem,2.2vmin,1.9rem);
  max-width:1700px;margin:0 auto;
}

/* ---------------------------------------------------------------- glass */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(1.7);
  backdrop-filter:blur(26px) saturate(1.7);
  border:1px solid var(--hair);
  border-top-color:var(--hair-top);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}
/* Firefox and anything else without backdrop-filter must not get an unreadable
   transparent panel. Raise every fill to near-solid; the contrast maths above
   only improves. */
@supports not (backdrop-filter: blur(1px)){
  .glass{background:rgba(11,14,21,.93)}
  #scrim{background:rgba(7,9,17,.74)}
}
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))){
  .glass{background:rgba(11,14,21,.93)}
}

/* ---------------------------------------------------------------- top bar */
.top{
  display:flex;align-items:center;gap:.65rem clamp(.7rem,1.6vw,1.2rem);
  flex-wrap:wrap;padding:.6rem clamp(.85rem,1.8vw,1.25rem);
}
.eyebrow{
  font-size:clamp(.64rem,1.05vw,.76rem);letter-spacing:.22em;
  color:var(--dim);font-weight:700;white-space:nowrap;
}
.top .where{color:var(--faint);font-size:clamp(.72rem,1.15vw,.86rem);margin-right:auto;min-width:0}
.pill{
  display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;
  border:1px solid var(--hair);border-radius:999px;
  background:rgba(255,255,255,.06);
  padding:.24rem .68rem;font-size:clamp(.68rem,1.05vw,.8rem);color:var(--dim);
}
.pill b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--faint);flex:none}
.pill[data-s="connected"] .dot{background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.2)}
.pill[data-s="connecting"] .dot,.pill[data-s="reconnecting"] .dot{background:#facc15;animation:blip 1.2s ease-in-out infinite}
.pill[data-s="error"] .dot,.pill[data-s="fatal"] .dot{background:#fb4d68;box-shadow:0 0 0 4px rgba(251,77,104,.22)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------------------------------------------------------------- stage */
.stage{
  display:grid;gap:clamp(.75rem,1.8vmin,1.5rem);
  grid-template-columns:minmax(0,auto) minmax(0,1fr);
  align-items:stretch;flex:1 1 auto;min-height:0;
}
@media (max-width:900px){ .stage{grid-template-columns:minmax(0,1fr)} }

/* ---------- album art ---------- */
.art{
  position:relative;overflow:hidden;
  width:clamp(190px,34vmin,400px);aspect-ratio:1/1;
  border-radius:var(--r);
  border:1px solid var(--hair);border-top-color:var(--hair-top);
  box-shadow:0 26px 60px rgba(0,0,0,.55), 0 3px 10px rgba(0,0,0,.4);
  background:
    repeating-linear-gradient(135deg, #171d27 0 10px, #131922 10px 20px);
  flex:none;
}
@media (max-width:900px){ .art{width:min(100%,300px);margin:0 auto} }
.art .fade{
  position:absolute;inset:0;background-size:cover;background-position:center 58%;
  opacity:0;transition:opacity .9s ease;
}
/* The placeholder is what "no cover art" looks like in a player: it is visible
   only when no frame is loaded, i.e. when nothing is reporting. An unknown sky
   is NEVER drawn as the clear-dawn frame. */
.art-blank{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.5rem;text-align:center;
  padding:1.2rem;color:var(--faint);
  background:linear-gradient(180deg, rgba(20,26,35,.6), rgba(10,13,19,.85));
}
.art-blank .mark{
  width:clamp(46px,9vmin,74px);height:clamp(46px,9vmin,74px);border-radius:50%;
  border:2px dashed rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.2rem,3vmin,1.9rem);color:var(--dim);
}
.art-blank p{margin:0;font-size:clamp(.72rem,1.5vmin,.86rem);max-width:22ch;line-height:1.45}
.art[data-blank="0"] .art-blank{display:none}
/* Local scrim: the ONLY text that ever sits over the sharp photograph, and it
   sits under alpha .78 -> .96. See the header note. */
.art-cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:2.6rem clamp(.75rem,2vmin,1.1rem) clamp(.7rem,1.8vmin,1rem);
  background:linear-gradient(180deg, rgba(6,8,11,0) 0%, rgba(6,8,11,.78) 46%, rgba(6,8,11,.96) 100%);
}
.art-cap .k{font-size:clamp(.6rem,1.25vmin,.72rem);letter-spacing:.2em;color:var(--dim);font-weight:700}
.art-cap .v{
  display:block;margin-top:.15rem;line-height:1.2;
  font-size:clamp(.9rem,2.3vmin,1.2rem);font-weight:650;color:var(--ink-acc);
}

/* ---------- now-playing panel ---------- */
.np{
  display:flex;flex-direction:column;gap:clamp(.55rem,1.4vmin,1rem);
  padding:clamp(.95rem,2.4vmin,1.8rem) clamp(1.05rem,2.6vmin,2rem);
  min-width:0;
  /* Bug B: the reading is sized off THIS PANEL, never the viewport. A column
     that narrows must shrink the digits with it, or "163.3" splits into
     "163." + "3" exactly when the number matters most. */
  container-type:inline-size;
}
.np-head{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.np-head .eyebrow{color:var(--ink-acc)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:.85em}
.eq i{width:3px;height:100%;background:var(--ink-acc);border-radius:2px;
  transform-origin:bottom;animation:eq 1.15s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.24s}
.eq i:nth-child(3){animation-delay:.48s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

.np-title{display:flex;align-items:baseline;gap:.45rem;min-width:0}
.np-num{
  /* nowrap is the other half of the bug-B fix: words may wrap, digits may not. */
  white-space:nowrap;
  font-size:clamp(2.4rem,20cqi,8rem);line-height:.9;font-weight:700;
  letter-spacing:-.038em;font-variant-numeric:tabular-nums;color:var(--ink-acc);
}
/* A payload too long to be a plausible reading steps down to a size allowed to
   wrap — the escape hatch that stops nowrap becoming a horizontal overflow. */
.np-num[data-long="1"]{font-size:clamp(1.5rem,9cqi,3.2rem);white-space:normal;overflow-wrap:anywhere}
.np-num[data-kind="word"]{font-size:clamp(1.4rem,11cqi,3.4rem);letter-spacing:-.01em;white-space:normal;overflow-wrap:anywhere}
.np-unit{font-size:clamp(.85rem,2.6cqi,1.35rem);color:var(--dim);font-weight:500;white-space:nowrap}

.np-artist{
  font-size:clamp(1.05rem,4.2cqi,2rem);font-weight:650;line-height:1.15;
  color:var(--ink-acc);letter-spacing:-.01em;overflow-wrap:anywhere;
}
.np-album{
  font-size:clamp(.74rem,1.9cqi,.92rem);color:var(--faint);
  display:flex;flex-wrap:wrap;gap:.15rem .5rem;min-width:0;
}
.np-album .sep{color:rgba(255,255,255,.22)}

/* ---------- the scrubber: position on the EPA scale ---------- */
.scale{margin-top:.15rem}
.scale-track{
  position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;
  height:clamp(9px,1.5vmin,14px);
}
.scale-track i{border-radius:3px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.scale-track i::after{
  content:"";position:absolute;inset:0;transform:scaleX(var(--f,0));transform-origin:left;
  background:var(--seg);transition:transform .6s ease;
}
.scale-track i:nth-child(1){--seg:var(--g-good)}
.scale-track i:nth-child(2){--seg:var(--g-mod)}
.scale-track i:nth-child(3){--seg:var(--g-usg)}
.scale-track i:nth-child(4){--seg:var(--g-unh)}
.scale-track i:nth-child(5){--seg:var(--g-vun)}
.scale-track i:nth-child(6){--seg:var(--g-haz)}
.head{
  position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;
  border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.45);
  box-shadow:0 2px 8px rgba(0,0,0,.6);
  transition:left .6s ease;opacity:0;
}
.scale[data-known="1"] .head{opacity:1}
.scale-ends{
  display:flex;justify-content:space-between;gap:.6rem;margin-top:.4rem;
  font-size:clamp(.66rem,1.6cqi,.8rem);color:var(--faint);
  font-variant-numeric:tabular-nums;
}
.scale-ends .mid{text-align:center;flex:1 1 auto;min-width:0}

/* ---------- the answer ---------- */
.answer{
  margin-top:auto;
  border-radius:16px;padding:clamp(.7rem,1.9vmin,1.1rem) clamp(.85rem,2.1vmin,1.25rem);
  background:rgba(255,255,255,.09);
  border:1px solid var(--hair);border-top-color:var(--hair-top);
  border-left:3px solid var(--ink-acc);
}
@supports not (backdrop-filter: blur(1px)){ .answer{background:rgba(255,255,255,.07)} }
.answer .q{font-size:clamp(.64rem,1.5cqi,.75rem);letter-spacing:.2em;color:var(--dim);font-weight:700}
.answer .a{
  font-size:clamp(1.15rem,4cqi,2.05rem);font-weight:700;line-height:1.15;
  margin:.28rem 0 .18rem;color:var(--ink);letter-spacing:-.015em;
}
.answer .why{font-size:clamp(.82rem,2.1cqi,1.02rem);color:var(--dim);line-height:1.45;margin:0}
/* The third line is the OTHER language's verdict — Thai under an English wall,
   English under a Thai one. It is not a translation caption bolted on; this block
   was bilingual before the switcher existed, and the switcher only decides which
   of the two leads. A child who reads one of the two still gets the verdict. */
.answer .alt{font-size:clamp(.82rem,2.1cqi,1.02rem);color:var(--faint);line-height:1.6;margin:.28rem 0 0}

/* ---------------------------------------------------------------- tracklist */
.list{padding:clamp(.6rem,1.6vmin,1rem) clamp(.7rem,1.8vmin,1.15rem)}
.list-head{
  display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;
  padding:0 .2rem .55rem;border-bottom:1px solid var(--hair);
}
.list-head .eyebrow{color:var(--dim)}
.list-head .count{color:var(--faint);font-size:clamp(.7rem,1.1vw,.83rem);margin-left:auto}
ol.trks{list-style:none;margin:0;padding:.25rem 0 0;display:flex;flex-direction:column}
/* Bug B: every reading on this page is sized off the box it lives in, never off the
   viewport. The row is that box for a board's value — `.trk-right` cannot be the
   container because it is an `auto` grid column that shrink-to-fits its own text, and
   inline-size containment would collapse it to nothing. */
.trk{
  display:grid;grid-template-columns:2.1rem minmax(0,1fr) auto;
  align-items:center;gap:.15rem .8rem;
  padding:clamp(.42rem,1.1vmin,.7rem) .2rem;
  border-bottom:1px solid rgba(255,255,255,.07);
  container-type:inline-size;
}
.trk:last-child{border-bottom:0}
.trk-num{
  grid-row:span 2;display:flex;align-items:center;justify-content:center;
  font-size:.82rem;color:var(--faint);font-variant-numeric:tabular-nums;
}
.trk-id{
  font-size:clamp(.95rem,1.82cqi,1.25rem);font-weight:650;color:var(--ink);
  min-width:0;overflow-wrap:anywhere;letter-spacing:-.01em;
}
.trk-note{
  grid-column:2;font-size:clamp(.72rem,1.18cqi,.84rem);color:var(--faint);
  min-width:0;overflow-wrap:anywhere;line-height:1.4;
}
.trk-right{
  grid-row:span 2;display:flex;align-items:baseline;gap:.3rem;justify-self:end;
  white-space:nowrap;min-width:0;
}
.trk-val{font-size:clamp(1.05rem,2.35cqi,1.7rem);font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.trk-val[data-kind="word"]{font-size:clamp(.86rem,1.6cqi,1.1rem);font-weight:650;letter-spacing:.01em}
.trk-unit{font-size:clamp(.7rem,1.12cqi,.85rem);color:var(--dim)}

/* A STATE WORD may wrap; a READING may not. "ไม่ได้ส่งข้อมูล" is more than twice the
   length of "offline" and offers the browser no word boundary to break on, so an
   offline/waiting/unknown row is allowed to fold rather than push the grid wide.
   data-wrap is set by renderRow ONLY for those three rows and never for a number —
   this is the rule that once split "163.3" into "163." and "3", and a fault value
   (a negative number) deliberately stays on the nowrap side of it. */
.trk[data-wrap="1"] .trk-right{white-space:normal;text-align:right}
.trk[data-wrap="1"] .trk-val{white-space:normal;overflow-wrap:anywhere}

/* Two of three boards being dark is the NORMAL state of this wall, so an
   offline row is composed, not degraded: full-strength ink, a dashed rule that
   says "unavailable track", and a sentence explaining itself. Never a blank,
   never a zero. */
.trk[data-state="offline"]{
  border-left:2px dashed rgba(255,255,255,.28);
  padding-left:.65rem;margin-left:-.2rem;border-radius:2px;
}
.trk[data-state="offline"] .trk-id{color:var(--dim)}
.trk[data-state="offline"] .trk-val{color:var(--dim)}
.trk[data-state="playing"] .trk-id{color:var(--ink-acc)}
.trk[data-state="playing"] .trk-val{color:var(--ink-acc)}
.trk[data-state="stale"] .trk-val,.trk[data-state="fault"] .trk-val,
.trk[data-state="waiting"] .trk-val,.trk[data-state="unknown"] .trk-val{color:var(--dim)}
.trk-num .eq{height:.95rem}
.trk-num .dot{background:currentColor}
.extra{padding:.5rem .2rem 0;font-size:clamp(.7rem,1.1vw,.82rem);color:var(--faint)}
.extra:empty{display:none}

/* ---------------------------------------------------------------- foot */
.foot{
  display:flex;align-items:center;gap:.5rem 1rem;flex-wrap:wrap;
  padding:.15rem .35rem;font-size:clamp(.68rem,1.05vw,.79rem);color:var(--faint);
}
.foot .right{margin-left:auto}
kbd{
  font:inherit;font-size:.94em;padding:.06rem .38rem;border-radius:5px;
  border:1px solid var(--hair);background:rgba(255,255,255,.1);color:var(--dim);
}

/* The language switch. It lives in the footer at footer scale, beside the other
   keyboard hint, because the loudest thing on this wall has to stay the reading.
   It is a text pair, not a button pair: the only ink it spends is on the half that
   is currently off. `button{}` above fills solid blue, so every property that
   would make this look like a control is undone here — including :hover, which at
   (0,1,1) outranks a bare class and would otherwise flash blue on mouseover. */
.lang{display:inline-flex;align-items:center;gap:.28rem}
.lang-b{
  font:inherit;font-size:1em;font-weight:650;cursor:pointer;
  background:none;border:0;padding:.05rem .32rem;border-radius:6px;
  color:var(--faint);letter-spacing:0;line-height:1.5;
}
.lang-b:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.lang-b[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.1)}
.lang-b:focus-visible{outline:2px solid #6ea8d8;outline-offset:1px}
.lang-sep{color:rgba(255,255,255,.22)}

/* ---------------------------------------------------------------- sheets */
.sheet{
  position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
  padding:clamp(1rem,4vmin,2.5rem);background:rgba(5,7,12,.68);
}
.sheet[hidden]{display:none}
.sheet-in{
  width:min(560px,100%);padding:clamp(1.1rem,3vmin,1.8rem);
  background:rgba(13,17,24,.9);
  -webkit-backdrop-filter:blur(30px) saturate(1.6);
  backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid var(--hair);border-top-color:var(--hair-top);
  border-radius:var(--r);box-shadow:var(--shadow);
}
@supports not (backdrop-filter: blur(1px)){ .sheet-in{background:rgba(11,14,21,.98)} }
.sheet h2{font-size:1.1rem;margin-bottom:.15rem}
.sheet .lead{color:var(--faint);font-size:.85rem;margin:.15rem 0 1rem;line-height:1.5}
.form{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr))}
.f{display:flex;flex-direction:column;gap:.28rem;min-width:0}
.f label{font-size:.7rem;letter-spacing:.12em;color:var(--faint);font-weight:700}
.f input{
  background:rgba(0,0,0,.4);color:var(--ink);border:1px solid rgba(255,255,255,.2);
  border-radius:10px;padding:.55rem .65rem;font:inherit;font-size:.92rem;width:100%;min-width:0;
}
.f input:focus{outline:2px solid #6ea8d8;outline-offset:1px}
.f-check{flex-direction:row;align-items:center;gap:.5rem}
.f-check label{letter-spacing:0;color:var(--dim);font-size:.85rem;font-weight:500}
.f-check input{width:auto}
.acts{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
button{
  font:inherit;font-weight:650;cursor:pointer;border-radius:10px;padding:.55rem 1.1rem;
  background:#2b6ea3;color:#fff;border:1px solid #3d87c2;
}
button:hover{background:#3480bb}
button.ghost{background:rgba(255,255,255,.07);color:var(--dim);border-color:var(--hair)}
button.ghost:hover{color:var(--ink)}
.sheet .note{color:var(--faint);font-size:.78rem;margin:.9rem 0 0;line-height:1.55}

/* One calm sentence, and nothing else. */
#down .sheet-in{text-align:center;max-width:44rem}
#down .say{font-size:clamp(1.1rem,3.4vmin,1.75rem);line-height:1.45;font-weight:600;color:var(--ink)}
#down .sub{color:var(--faint);font-size:clamp(.76rem,1.6vmin,.88rem);margin:1rem 0 0}

.warn{
  padding:.55rem .85rem;border-radius:12px;margin-top:.9rem;
  background:rgba(250,204,21,.14);border:1px solid rgba(250,204,21,.38);
  color:#ffe8a3;font-size:.82rem;line-height:1.5;
}
.warn:empty{display:none}

/* ------------------------------------------------------------------ demo ---
   ?demo= and nothing else turns this on. See DEMO MODE in the script.

   The marker is a SAFETY DEVICE, not part of the picture, so it is drawn in one
   fixed pair of colours that never tracks the EPA band. A green DEMO bar under a
   green "Good" wall would borrow the health signal it exists to withdraw. Fixed
   top AND bottom plus a ring around the viewport, so no crop of a photograph of
   this wall can lose it, and sized against the viewport rather than capped in
   rem: on a wall-sized screen a marker that stops growing stops being a marker.

   Nothing here is uppercased by CSS. Every capital is typed as a capital,
   because text-transform maps "µ" to "M" and turns µg/m³ into a 1000x lie. */
.wdemo{
  position:fixed;left:0;right:0;z-index:2147483000;
  display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;
  gap:.3em 1em;text-align:center;
  background:#12100a;color:#ffeec2;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  line-height:1.3;letter-spacing:.12em;
}
.wdemo-top{
  top:0;font-size:clamp(.78rem,2.35vmin,1.6rem);
  padding:clamp(.35rem,1.1vmin,.7rem) clamp(.6rem,2vw,1.4rem)
          calc(clamp(.35rem,1.1vmin,.7rem) + .6rem);
}
.wdemo-bot{
  bottom:0;font-size:clamp(.62rem,1.62vmin,1.1rem);
  padding:calc(clamp(.35rem,1.1vmin,.7rem) + .6rem) clamp(.6rem,2vw,1.4rem)
          clamp(.35rem,1.1vmin,.7rem);
}

   measured bar height is the whole marker and nothing sticks out unaccounted. */
.wdemo-top::after,.wdemo-bot::before{
  content:"";position:absolute;left:0;right:0;height:.6rem;
  background:repeating-linear-gradient(135deg,#ffb300 0 .8rem,#12100a .8rem 1.6rem);
}
.wdemo-top::after{bottom:0}
.wdemo-bot::before{top:0}
.wdemo b{font-weight:800;font-size:1.6em;letter-spacing:.3em;margin-right:-.3em;color:#ffb300}
/* Thai never takes the wide tracking — it pulls the combining marks apart. */
.wdemo .wd-th{letter-spacing:normal;font-size:1.12em;color:#ffd166}
.wdemo .wd-val{
  border:.14em solid #ffb300;padding:.1em .55em;max-width:100%;
  color:#fff6df;font-weight:700;letter-spacing:.04em;
  white-space:normal;                  /* the bar may wrap … */
}
.wdemo .wd-val .nb{white-space:nowrap} /* … but a number never leaves its unit */
.wdemo-ring{
  position:fixed;inset:0;z-index:2147482999;pointer-events:none;
  border:clamp(3px,.7vmin,10px) solid #ffb300;
}
html[lang="th"] .wdemo{letter-spacing:normal;line-height:1.6}

<body>

<div id="room"></div>
<div id="scrim"></div>

<div class="player">

  <header class="top glass">
    <span class="eyebrow" data-t="ui.nowplaying"></span>
    <span class="where" data-t="ui.where"></span>
    <span class="pill" id="p-conn" data-s="idle"><span class="dot"></span><span id="conn-text"></span></span>
    <span class="pill"><span data-t="ui.broker"></span> <b class="mono" id="p-host">&mdash;</b></span>
    <span class="pill"><span data-t="ui.reporting"></span> <b id="p-live">0</b> / <b id="p-total">0</b></span>
  </header>

  <div class="stage">

    <figure class="art glass" id="art" data-blank="1" style="padding:0">
      <div class="art-blank">
        <span class="mark">&#9633;</span>
        <p id="blank-msg" data-t="ui.nocover"></p>
      </div>
      <figcaption class="art-cap" id="art-cap" hidden>
        <span class="k" data-t="ui.airnow"></span>
        <span class="v" id="art-cap-v"></span>
      </figcaption>
    </figure>

    <section class="np glass">
      <div class="np-head">
        <span class="eyebrow" id="np-eyebrow"></span>
        <span class="eq" id="np-eq" hidden><i></i><i></i><i></i></span>
      </div>

      <div class="np-title">
        <span class="np-num" id="np-num" data-kind="word">&mdash;</span>
        <span class="np-unit" id="np-unit"></span>
      </div>

      <div class="np-artist" id="np-artist"></div>
      <div class="np-album" id="np-album"></div>

      <div class="scale" id="scale" data-known="0">
        <div class="scale-track" id="track">
          <i></i><i></i><i></i><i></i><i></i><i></i>
          <span class="head" id="head"></span>
        </div>
        <div class="scale-ends">
          <span>0</span>
          <span class="mid" id="scale-mid"></span>
          <span>250+</span>
        </div>
      </div>

      <div class="answer" id="answer">
        <div class="q" data-t="ui.question"></div>
        <p class="a" id="ans-a"></p>
        <p class="why" id="ans-why"></p>
        <p class="alt" id="ans-alt"></p>
      </div>
    </section>
  </div>

  <section class="list glass">
    <div class="list-head">
      <span class="eyebrow" data-t="ui.theboards"></span>
      <span class="count" id="list-count"></span>
    </div>
    <ol class="trks" id="trks"></ol>
    <p class="extra" id="extra"></p>
  </section>

  <footer class="foot">
    <span data-t="ui.built"></span>
    <span class="right lang" id="lang-sw" role="group" data-t-aria="ui.language">
      <button type="button" class="lang-b" data-lang="th" lang="th">&#3652;&#3607;&#3618;</button>
      <span class="lang-sep" aria-hidden="true">/</span>
      <button type="button" class="lang-b" data-lang="en" lang="en">EN</button>
    </span>
    <span id="hint-s"></span>
  </footer>
</div>

<!-- settings, hidden until "s" -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" data-t-aria="sheet.title">
    <h2 data-t="sheet.title"></h2>
    <p class="lead" data-t="sheet.lead"></p>
    <form class="form" id="form" autocomplete="off">
      <div class="f"><label for="f-host" data-t="sheet.host"></label><input id="f-host" spellcheck="false" required></div>
      <div class="f"><label for="f-port" data-t="sheet.port"></label><input id="f-port" inputmode="numeric" required></div>
      <div class="f"><label for="f-user" data-t="sheet.user"></label><input id="f-user" spellcheck="false"></div>
      <div class="f"><label for="f-pass" data-t="sheet.pass"></label><input id="f-pass" type="password" autocomplete="off"></div>
      <div class="f"><label for="f-filter" data-t="sheet.filter"></label><input id="f-filter" spellcheck="false" placeholder="dbk/"></div>
      <div class="f f-check"><input id="f-tls" type="checkbox"><label for="f-tls" data-t="sheet.tls"></label></div>
      <div class="f f-check"><input id="f-remember" type="checkbox"><label for="f-remember" data-t="sheet.remember"></label></div>
    </form>
    <div class="acts">
      <button type="button" id="btn-go" data-t="sheet.connect"></button>
      <button type="button" class="ghost" id="btn-close" data-t="sheet.close"></button>
      <button type="button" class="ghost" id="btn-forget" data-t="sheet.forget"></button>
    </div>
    <div class="warn" id="warn"></div>
    <p class="note" id="store-hint"></p>
  </div>
</div>

<!-- failure takeover: one calm sentence -->

  <div class="sheet-in">
    <p class="say" id="down-say"></p>
    <p class="sub" id="down-sub"></p>
  </div>
</div>
