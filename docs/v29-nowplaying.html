  // ?lang= wins, then what this browser last chose, then what the browser itself
  // is set to, then English. localStorage is wrapped: it THROWS in a private
  // window rather than returning null, and an uncaught throw here would take the
  // whole wall down before the first reading.
  function pickLang() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    if (q === 'th' || q === 'en') return q;
    try {
      var s = localStorage.getItem(LANG_KEY);
      if (s === 'th' || s === 'en') return s;
    } catch (e) {}
    var nav = navigator.language || (navigator.languages && navigator.languages[0]) || '';
    if (String(nav).toLowerCase().indexOf('th') === 0) return 'th';
    return 'en';
  }

  var LANG = pickLang();

  function tIn(lang, key, vars) {
    var tbl = STR[lang] || STR.en;
    var s = tbl[key];
    if (s === undefined || s === null) s = STR.en[key];   // a gap falls back to English
    if (s === undefined || s === null) s = key;           // ...and then shows the key,
    s = String(s);                                        //    never the word "undefined"
    if (!vars) return s;
    // The replacement value is not re-scanned, so a board id containing braces
    // cannot smuggle another placeholder into the sentence.
    return s.replace(/\{(\w+)\}/g, function (m, k) {
      var v = vars[k];
      return (v === undefined || v === null) ? m : String(v);
    });
  }

  function t(key, vars) { return tIn(LANG, key, vars); }

  /* ==========================================================================
     BANDS — breakpoints and colour only. Every word that describes a band now
     lives in STR, because it has to exist in two languages; `key` is the join.
     ========================================================================== */
  var BANDS = [
    { key: 'good',      max: 12.0,     floor: 0,     img: 'good',      g: '--g-good', i: '--i-good' },
    { key: 'moderate',  max: 35.4,     floor: 12.0,  img: 'moderate',  g: '--g-mod',  i: '--i-mod'  },
    { key: 'sensitive', max: 55.4,     floor: 35.4,  img: 'sensitive', g: '--g-usg',  i: '--i-usg'  },
    { key: 'unhealthy', max: 150.4,    floor: 55.4,  img: 'unhealthy', g: '--g-unh',  i: '--i-unh'  },
    { key: 'verybad',   max: 250.4,    floor: 150.4, img: 'verybad',   g: '--g-vun',  i: '--i-vun'  },
    { key: 'hazardous', max: Infinity, floor: 250.4, ceil: 500,
      img: 'hazardous', g: '--g-haz', i: '--i-haz' }
  ];

  // When nothing is reporting the wall speaks under the key 'unknown', which has
  // no image on purpose: an unknown sky drawn as the clear-dawn frame would be a
  // false all-clear, in either language.

  var ALIASES = {
    stat_t: 'state_topic', avty_t: 'availability_topic', uniq_id: 'unique_id',
    unit_of_meas: 'unit_of_measurement', dev_cla: 'device_class', stat_cla: 'state_class',
    exp_aft: 'expire_after', pl_avail: 'payload_available', pl_not_avail: 'payload_not_available',
    dev: 'device', val_tpl: 'value_template', avty: 'availability', ic: 'icon'
  };

  var client = null;
  var entities = new Map();
  var byState = new Map();
  var byAvail = new Map();
  var byUid = new Map();
  var boardStatus = new Map();
  var subs = new Set();
  var filteredOut = new Set();
  var activeFilter = '';
  var parseErrors = 0;
  var connState = 'idle';
  var manualStop = false;
  var everConnected = false;
  var downTimer = null;

  var $ = function (id) { return document.getElementById(id); };

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#8fa3b6';
  }

  // The EPA scale starts at 0. Without a lower bound every negative value fell into
  // the first band, so a faulty sensor reporting -999 rendered as a reassuring
  // green "Good".
  function bandFor(n) {
    if (!Number.isFinite(n) || n < 0) return null;
    for (var i = 0; i < BANDS.length; i++) if (n <= BANDS[i].max) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  function isPm(ent) {
    return ent.deviceClass === 'pm25' || /pm ?2\.?5/i.test(ent.measure || ent.title || '');
  }

  // Arabic digits in both languages — the readings are numbers, and a Thai reader
  // reads a PM2.5 value in Arabic digits. Only the words around them change.
  function ago(ts) {
    if (!ts) return t('time.never');
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 2) return t('time.justnow');
    if (s < 60) return t('time.secondsAgo', { n: s });
    var m = Math.floor(s / 60);
    if (m < 60) return t('time.minutesAgo', { n: m });
    var h = Math.floor(m / 60);
    if (h < 24) return t('time.hoursAgo', { n: h });
    return t('time.daysAgo', { n: Math.floor(h / 24) });
  }

  // A payload may be "0", "0.0", "unknown", "unavailable" or empty. Never print NaN.
  function parseValue(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (s === '') return { kind: 'empty', text: 'no value' };
    if (/^(unknown|unavailable|none|null|nan|n\/a)$/i.test(s)) {
      return { kind: 'unknown', text: s.toLowerCase() };
    }
    var n = Number(s);
    if (!Number.isFinite(n)) return { kind: 'text', text: s };
    // The EPA method truncates the concentration to one decimal BEFORE applying
    // breakpoints. Truncate once, here, and use that one value for both the printed
    // number and the band, so the reading and its label can never disagree.
    // Truncate, never round: rounding 35.44 up to 35.5 would invent a severity the
    // sensor did not report.
    var n1 = Math.trunc(n * 10) / 10;
    var text;
    if (/^[+-]?\d+(\.\d)?$/.test(s)) {
      text = s.replace(/^\+/, '');   // keep the device's own precision: "0", "0.0"
    } else {
      text = n1.toFixed(1);
    }
    return { kind: 'number', n: n, n1: n1, text: text };
  }

  // Bug C: the discovery "name" is "PM2.5" on every board, so it can never be the
  // identity. The board id is parsed out of the state topic and that is what the
  // wall shows.
  function boardFromTopic(topic) {
    var m = /^dbk\/([^/]+)\//i.exec(topic || '');
    return m ? m[1] : null;
  }

  var storeWorks = true;
  function loadStore() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); }
    catch (e) { storeWorks = false; return null; }
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (e) {
      try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
      return null;
    }
  }
  function saveStore(v) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; }
    catch (e) { storeWorks = false; return false; }
  }
  function clearStore() {
    try { localStorage.removeItem(STORE_KEY); return true; } catch (e) { return false; }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ---------------------------------------------------------------- subscribe
  // subRaw is the only thing that talks to the broker and it is private to the
  // three wildcards authored in this file. Everything that arrived over the wire
  // goes through sub(), which refuses wildcards outright.
  function subRaw(topic) {
    // In demo mode there is no broker to ask, and there must never be one — but a
    // synthesised sensor still has to pass the very same subscribe test a real one
    // does, because onDiscovery() DELETES any entity whose topic it cannot listen
    // to. Refusing on !client here would silently empty the wall under a confident
    // DEMO bar. subRaw() stops short of the client itself, a few lines down.
    if ((!client && !DEMO) || !topic || typeof topic !== 'string') return false;
    // Bug D, absolute: '#' is never subscribed, not even from an authored string.
    // A '#' on this broker costs roughly 109 GB/day.
    if (topic.indexOf('#') !== -1) return false;
    if (subs.has(topic)) return true;
    if (subs.size >= MAX_SUBS) { warn('warn.ceiling', { n: MAX_SUBS }); return false; }
    subs.add(topic);
    if (DEMO) return true;   // a demo has no broker to ask, and must never look for one
    client.subscribe(topic, { qos: 0 }, function (err) {
      if (err) {
        subs.delete(topic);
        warn('warn.subrefused', { topic: topic });
      }
    });
    return true;
  }

  function sub(topic) {
    // In demo mode there is no broker to ask, and there must never be one — but a
    // synthesised sensor still has to pass the very same subscribe test a real one
    // does, because onDiscovery() DELETES any entity whose topic it cannot listen
    // to. Refusing on !client here would silently empty the wall under a confident
    // DEMO bar. subRaw() stops short of the client itself, a few lines down.
    if ((!client && !DEMO) || !topic || typeof topic !== 'string') return false;
    // '+' is every bit as dangerous as '#' here: a retained config declaring
    // state_topic "+/+/+" delivers the whole fleet. A topic off the wire must name
    // exactly one topic.
    if (/[#+]/.test(topic)) {
      warn('warn.wildcard', { topic: topic });
      return false;
    }
    return subRaw(topic);
  }

  function unsub(topic) {
    if (!topic || !subs.has(topic)) return;
    if (byState.has(topic) || byAvail.has(topic)) return;
    subs.delete(topic);
    if (client) { try { client.unsubscribe(topic); } catch (e) {} }
  }

  // ---------------------------------------------------------------- discovery
  function expand(cfg) {
    var out = {};
    Object.keys(cfg).forEach(function (k) { out[ALIASES[k] || k] = cfg[k]; });
    var base = out['~'];
    if (typeof base === 'string' && base) {
      ['state_topic', 'availability_topic'].forEach(function (k) {
        var v = out[k];
        if (typeof v !== 'string') return;
        if (v.charAt(0) === '~') out[k] = base + v.slice(1);
        else if (v.charAt(v.length - 1) === '~') out[k] = v.slice(0, -1) + base;
      });
    }
    if (!out.availability_topic && Array.isArray(out.availability) && out.availability.length) {
      var a = out.availability[0];
      if (a && typeof a.topic === 'string') {
        out.availability_topic = a.topic;
        if (a.payload_available) out.payload_available = a.payload_available;
        if (a.payload_not_available) out.payload_not_available = a.payload_not_available;
      }
    }
    return out;
  }

  function index(map, key, dtopic) {
    if (!key) return;
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(dtopic);
  }
  function unindex(map, key, dtopic) {
    if (!key || !map.has(key)) return;
    var set = map.get(key);
    set.delete(dtopic);
    if (set.size === 0) { map.delete(key); unsub(key); }
  }

  function removeEntity(dtopic) {
    var gone = entities.get(dtopic);
    if (!gone) return false;
    if (gone.row) gone.row.root.remove();
    entities.delete(dtopic);
    if (gone.uid && byUid.get(gone.uid) === dtopic) byUid.delete(gone.uid);
    unindex(byState, gone.stateTopic, dtopic);
    unindex(byAvail, gone.availTopic, dtopic);
    return true;
  }

  function matchesFilter(topic) {
    return !activeFilter || String(topic).indexOf(activeFilter) === 0;
  }

  function onDiscovery(dtopic, text) {
    if (text.trim() === '') {           // empty retained payload = "delete this entity"
      filteredOut.delete(dtopic);
      if (removeEntity(dtopic)) layout();
      return;
    }

    var cfg;
    try { cfg = JSON.parse(text); }
    catch (e) {
      parseErrors++;
      warn(parseErrors === 1 ? 'warn.malformed.one' : 'warn.malformed.many',
           { n: parseErrors, t: dtopic });
      return;
    }
    if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) { parseErrors++; return; }

    cfg = expand(cfg);
    if (typeof cfg.state_topic !== 'string' || !cfg.state_topic) return;

    if (!matchesFilter(cfg.state_topic)) {
      filteredOut.add(dtopic);
      if (removeEntity(dtopic)) layout();
      return;
    }
    filteredOut.delete(dtopic);

    var parts = dtopic.split('/');
    var dev = cfg.device && typeof cfg.device === 'object' ? cfg.device : null;
    var devName = dev && typeof dev.name === 'string' ? dev.name : '';
    var measure = typeof cfg.name === 'string' && cfg.name ? cfg.name : (parts[2] || 'sensor');
    var expire = Number(cfg.expire_after);
    var uid = typeof cfg.unique_id === 'string' && cfg.unique_id ? cfg.unique_id : '';
    var board = boardFromTopic(cfg.state_topic);
    var newAvail = typeof cfg.availability_topic === 'string' ? cfg.availability_topic : '';

    if (uid && byUid.has(uid) && byUid.get(uid) !== dtopic) removeEntity(byUid.get(uid));

    var ent = entities.get(dtopic) || { key: dtopic, value: null, at: 0, availRaw: null, availAt: 0, row: null };

    // Drop the OLD index entries before writing new ones, and drop the value read
    // through them: a number measured on DBK-001 must never survive under a card
    // that now says DBK-010.
    if (ent.stateTopic && ent.stateTopic !== cfg.state_topic) {
      unindex(byState, ent.stateTopic, dtopic);
      ent.value = null; ent.at = 0; ent.raw = undefined;
    }
    if (ent.availTopic && ent.availTopic !== newAvail) {
      unindex(byAvail, ent.availTopic, dtopic);
      ent.availRaw = null; ent.availAt = 0;
    }
    if (ent.uid && ent.uid !== uid && byUid.get(ent.uid) === dtopic) byUid.delete(ent.uid);

    // Bug C in one line: the board id off the state topic is the identity. The
    // discovery name ("PM2.5" on every board) is demoted to a subtitle.
    ent.board = board;
    ent.title = board || devName || uid || measure;
    ent.measure = measure;
    ent.uid = uid;
    ent.stateTopic = cfg.state_topic;
    ent.availTopic = newAvail;
    ent.unit = typeof cfg.unit_of_measurement === 'string' ? cfg.unit_of_measurement : '';
    ent.deviceClass = typeof cfg.device_class === 'string' ? cfg.device_class : '';
    ent.expire = Number.isFinite(expire) && expire > 0 ? expire : DEFAULT_EXPIRE;
    ent.pAvail = typeof cfg.payload_available === 'string' ? cfg.payload_available : 'online';
    ent.pNot = typeof cfg.payload_not_available === 'string' ? cfg.payload_not_available : 'offline';
    ent.templated = !!cfg.value_template;

    // A sensor this page cannot listen to must never take a slot on the wall.
    if (!sub(ent.stateTopic)) { if (removeEntity(dtopic)) layout(); return; }

    entities.set(dtopic, ent);
    if (uid) byUid.set(uid, dtopic);
    index(byState, ent.stateTopic, dtopic);
    if (ent.availTopic) { index(byAvail, ent.availTopic, dtopic); sub(ent.availTopic); }

    layout();
  }

  // ---------------------------------------------------------------- messages
  function onMessage(topic, payload) {
    var text;
    try { text = new TextDecoder('utf-8').decode(payload); }
    catch (e) { text = String(payload); }

    if (/^homeassistant\/.+\/config$/.test(topic)) {
      try { onDiscovery(topic, text); }
      catch (e) { parseErrors++; warn('warn.applyfail'); }
      return;
    }

    var now = Date.now();
    var dirty = false;

    // Board availability, even where discovery declared no availability_topic.
    var b = /^dbk\/([^/]+)\/status$/i.exec(topic);
    if (b) { boardStatus.set(b[1], { raw: text.trim(), at: now }); dirty = true; }

    if (byState.has(topic)) {
      byState.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.raw = text; e.value = parseValue(text); e.at = now; dirty = true;
      });
    }
    if (byAvail.has(topic)) {
      byAvail.get(topic).forEach(function (k) {
        var e = entities.get(k);
        if (!e) return;
        e.availRaw = text.trim(); e.availAt = now; dirty = true;
      });
    }
    if (dirty) layout();
  }

  // ---------------------------------------------------------------- states
  function availabilityOf(ent) {
    if (ent.availTopic && ent.availRaw !== null) {
      if (ent.availRaw === ent.pNot) return 'offline';
      if (ent.availRaw === ent.pAvail) return 'online';
      return 'unknown';
    }
    if (ent.board && boardStatus.has(ent.board)) {
      var raw = boardStatus.get(ent.board).raw;
      if (raw === ent.pNot || raw === 'offline') return 'offline';
      if (raw === ent.pAvail || raw === 'online') return 'online';
    }
    return 'unknown';
  }

  function stateOf(ent) {
    if (availabilityOf(ent) === 'offline') return 'offline';
    if (!ent.at || !ent.value) return 'waiting';
    if (ent.value.kind === 'unknown' || ent.value.kind === 'empty') return 'unknown';
    // A concentration cannot be negative. Checked before stale and before live, so a
    // broken sensor is never dressed up as a reading — least of all a green one.
    if (ent.value.kind === 'number' && ent.value.n1 < 0 && isPm(ent)) return 'fault';
    if ((Date.now() - ent.at) / 1000 > ent.expire) return 'stale';
    return 'live';
  }

  /* ==========================================================================
     PRESENTATION — the record player.
     ========================================================================== */

  // ---- the crossfader. Two stacked layers per host; set(null) fades both out and
  // reveals the host's own no-signal ground. Nothing ever cuts to white.
  function fader(host, cls) {
    var a = document.createElement('div');
    var b = document.createElement('div');
    a.className = b.className = cls;
    host.insertBefore(a, host.firstChild);
    host.insertBefore(b, host.firstChild);
    var layers = [a, b], top = 0, cur = null;
    return {
      set: function (url) {
        if (url === cur) return;
        cur = url;
        if (!url) { layers[0].style.opacity = '0'; layers[1].style.opacity = '0'; return; }
        var next = layers[1 - top];
        // Paint order must follow the crossfade, not the DOM. Without these two
        // lines the incoming frame fades in UNDERNEATH the outgoing one on every
        // other band change, and the wall appears to ignore the air getting worse.
        next.style.zIndex = '1';
        layers[top].style.zIndex = '0';
        next.style.backgroundImage = 'url("' + url + '")';
        next.style.opacity = '1';
        layers[top].style.opacity = '0';
        top = 1 - top;
      }
    };
  }

  var roomFade = fader($('room'), 'fade');
  var artFade = fader($('art'), 'fade');

  // Preload every frame up front. They are local files next to this page, and a
  // band change must never show a white flash while a JPEG downloads.
  var PRELOAD = [];
  BANDS.forEach(function (b) {
    var im = new Image();
    im.src = 'img/' + b.img + '.jpg';
    PRELOAD.push(im);
  });

  // ---- position on the EPA scale, as a music player's progress bar.
  // Six equal segments, one per band, with the playhead interpolated inside its
  // own segment — piecewise-linear, exactly like the AQI itself. A raw linear
  // 0-250 bar would crush Good, Moderate and Sensitive into the first 22%.
  function scalePos(n1) {
    for (var i = 0; i < BANDS.length; i++) {
      var b = BANDS[i];
      if (n1 <= b.max || i === BANDS.length - 1) {
        var top = Number.isFinite(b.max) ? b.max : (b.ceil || 500);
        var span = top - b.floor;
        var f = span > 0 ? (n1 - b.floor) / span : 1;
        if (f < 0) f = 0;
        if (f > 1) f = 1;
        return { i: i, f: f, x: (i + f) / BANDS.length };
      }
    }
    return { i: 5, f: 1, x: 1 };
  }

  var segs = $('track').querySelectorAll('i');
  function paintScale(n1) {
    var known = Number.isFinite(n1);
    $('scale').setAttribute('data-known', known ? '1' : '0');
    var p = known ? scalePos(n1) : null;
    for (var i = 0; i < segs.length; i++) {
      var f = !p ? 0 : (i < p.i ? 1 : (i === p.i ? p.f : 0));
      segs[i].style.setProperty('--f', String(f));
    }
    $('head').style.left = (p ? p.x * 100 : 0) + '%';
  }

  // ---- track rows
  function buildRow(ent) {
    var root = document.createElement('li');
    root.className = 'trk';
    root.innerHTML =
      '<span class="trk-num"></span>' +
      '<span class="trk-id"></span>' +
      '<span class="trk-right"><span class="trk-val"></span><span class="trk-unit"></span></span>' +
      '<span class="trk-note"></span>';
    var row = {
      root: root,
      num: root.querySelector('.trk-num'),
      id: root.querySelector('.trk-id'),
      val: root.querySelector('.trk-val'),
      unit: root.querySelector('.trk-unit'),
      note: root.querySelector('.trk-note')
    };
    ent.row = row;
    return row;
  }

  function renderRow(ent, n, playing) {
    var r = ent.row || buildRow(ent);
    var st = stateOf(ent);
    var band = null;
    if (st === 'live' && ent.value && ent.value.kind === 'number' && isPm(ent)) band = bandFor(ent.value.n1);

    r.root.setAttribute('data-state', playing ? 'playing' : st);
    // Scope the band ink to this row so its equaliser bars carry its own colour.
    r.root.style.setProperty('--ink-acc', band ? css(band.i) : css('--faint'));

    // The playing board gets the equaliser; a dark board gets a hollow ring, which
    // is what an unavailable track looks like in a playlist. Neither is a number.
    if (playing) r.num.innerHTML = '<span class="eq"><i></i><i></i><i></i></span>';
    else if (st === 'offline') r.num.textContent = '○';
    else r.num.textContent = String(n);
    r.num.style.color = band ? css(band.i) : css('--faint');

    // Identity is the board id parsed from the state topic, never the discovery
    // name — that string is "PM2.5" on all three boards.
    r.id.textContent = ent.title;

    // A state WORD may fold; a READING may not. Thai gives the browser no word
    // boundary to break on and "ไม่ได้ส่งข้อมูล" is twice the length of "offline",
    // so the three word-valued rows are allowed to wrap rather than push the grid
    // wide. data-wrap is never set on a row whose value is a number — including a
    // fault row, whose value is a negative number.
    r.root.setAttribute('data-wrap',
      (st === 'offline' || st === 'waiting' || st === 'unknown') ? '1' : '0');

    if (st === 'offline') {
      r.val.textContent = t('state.offline');
      r.val.setAttribute('data-kind', 'word');
      r.unit.textContent = '';
    } else if (st === 'waiting') {
      r.val.textContent = t('state.noreading');
      r.val.setAttribute('data-kind', 'word');
      r.unit.textContent = '';
    } else if (st === 'unknown') {
      // Straight off the wire when there is one — a payload is not ours to translate.
      r.val.textContent = ent.value ? ent.value.text : t('state.noreading');
      r.val.setAttribute('data-kind', 'word');
      r.unit.textContent = '';
    } else if (st === 'fault') {
      r.val.textContent = ent.value.text;
      r.val.setAttribute('data-kind', 'word');
      r.unit.textContent = ent.unit;      // straight off the wire, never re-cased
    } else {
      r.val.textContent = ent.value.text;
      r.val.setAttribute('data-kind', ent.value.kind === 'number' ? 'num' : 'word');
      r.unit.textContent = ent.unit;      // straight off the wire, never re-cased
    }

    var note;
    if (st === 'offline') {
      var seen = ent.availAt || (ent.board && boardStatus.has(ent.board) ? boardStatus.get(ent.board).at : 0);
      var last = ent.value && ent.value.kind === 'number'
        ? t('row.lastreading', { v: ent.value.text, u: ent.unit, ago: ago(ent.at) })
        : t('row.neverread');
      note = t('row.offline', { last: last, ago: ago(seen) });
    } else if (st === 'waiting') {
      note = t('row.waiting', { topic: ent.stateTopic });
    } else if (st === 'stale') {
      note = t('row.stale', { n: ent.expire });
    } else if (st === 'fault') {
      note = t('row.fault');
    } else if (st === 'unknown') {
      note = t('row.unknown');
    } else {
      note = (band ? t('band.' + band.key) + ' · ' : '') +
             (ent.measure || t('ui.reading')) +
             ' · ' + t('ui.updated', { t: ago(ent.at) });
      if (availabilityOf(ent) === 'unknown') note += ' · ' + t('row.availunknown');
    }
    if (ent.templated) note += ' · ' + t('row.templated');
    r.note.textContent = note;
    return r;
  }

  // ---- the whole face
  var trks = $('trks');
  var lastKey = '';

  function layout() {
    var all = Array.from(entities.values());
    var pm = all.filter(isPm);
    var other = all.filter(function (e) { return !isPm(e); });

    // The worst CURRENT reading owns the picture. Stale numbers are excluded on
    // purpose: an expired reading is not a description of the air right now.
    var worst = null;
    pm.forEach(function (e) {
      if (stateOf(e) !== 'live' || !e.value || e.value.kind !== 'number') return;
      if (!worst || e.value.n1 > worst.value.n1) worst = e;
    });

    var band = worst ? bandFor(worst.value.n1) : null;

    // ---------- the record ----------
    // No live board => no photograph at all. The clear-dawn frame is never used as
    // a stand-in for "we do not know".
    roomFade.set(band ? 'img/' + band.img + '.jpg' : null);
    artFade.set(band ? 'img/' + band.img + '.jpg' : null);
    $('art').setAttribute('data-blank', band ? '0' : '1');
    $('art-cap').hidden = !band;
    if (band) $('art-cap-v').textContent = t('sky.' + band.key);

    // ---------- the accent ----------
    var ink = band ? css(band.i) : css('--acc');
    document.documentElement.style.setProperty('--ink-acc', band ? css(band.i) : '#c3d2e0');
    $('answer').style.borderLeftColor = ink;

    // ---------- title / artist / album ----------
    var liveCount = pm.filter(function (e) { return stateOf(e) === 'live'; }).length;
    $('np-eq').hidden = !worst;

    if (worst && band) {
      $('np-eyebrow').textContent = pm.length > 1
        ? t('ui.worstofN', { n: pm.length })
        : t('ui.nowplaying');
      $('np-num').textContent = worst.value.text;
      $('np-num').setAttribute('data-kind', 'num');
      $('np-unit').textContent = worst.unit;          // wire text, verbatim
      $('np-artist').textContent = t('band.' + band.key);
      $('np-album').innerHTML =
        esc(worst.title) + ' <span class="sep">·</span> ' + esc(t('tag.' + band.key)) +
        ' <span class="sep">·</span> ' + esc(t('ui.updated', { t: ago(worst.at) })) +
        ' <span class="sep">·</span> ' + esc(t('ui.boardsreporting', { n: liveCount, m: pm.length }));
      paintScale(worst.value.n1);
      sayVerdict(band.key);
    } else {
      $('np-eyebrow').textContent = t('ui.nothingplaying');
      $('np-num').textContent = t('state.noreading');
      $('np-num').setAttribute('data-kind', 'word');
      $('np-unit').textContent = '';
      $('np-artist').textContent = pm.length
        ? t('ui.nonereporting', { n: pm.length })
        : t('ui.noboards');
      $('np-album').textContent = pm.length ? t('ui.nosky') : t('ui.waitdiscovery');
      paintScale(NaN);
      sayVerdict('unknown');
    }
    // Digits never break, so an implausibly long payload steps down to a size that
    // is allowed to wrap. Without this, nowrap would trade a mid-digit split for a
    // horizontal overflow.
    $('np-num').setAttribute('data-long', $('np-num').textContent.length > 7 ? '1' : '0');

    // ---------- the track list ----------
    // Live first, then waiting/stale, then the dark boards. Stable and alphabetical
    // inside each group, so the wall does not reshuffle itself every second.
    var rank = { live: 0, stale: 1, fault: 1, unknown: 1, waiting: 2, offline: 3 };
    pm.sort(function (a, b2) {
      var ra = rank[stateOf(a)], rb = rank[stateOf(b2)];
      return (ra - rb) || String(a.title).localeCompare(String(b2.title));
    });
    var key = pm.map(function (e) { return e.key; }).join('|');
    pm.forEach(function (e, i) {
      var r = renderRow(e, i + 1, worst === e);
      if (key !== lastKey || !r.root.parentNode) trks.appendChild(r.root);
    });
    lastKey = key;

    $('list-count').textContent = pm.length
      ? t('ui.onair', { n: liveCount, m: pm.length })
      : t('ui.waitingdisc');
    $('p-live').textContent = String(liveCount);
    $('p-total').textContent = String(pm.length);

    $('extra').textContent = other.length
      ? t(other.length === 1 ? 'ui.othersensors.one' : 'ui.othersensors.many',
          { n: other.length })
      : (filteredOut.size
          ? t(filteredOut.size === 1 ? 'ui.filteredout.one' : 'ui.filteredout.many',
              { n: filteredOut.size, f: activeFilter })
          : '');
  }

  // The answer block is bilingual by design and stays that way in both directions:
  // the active language leads, and the other language keeps the third line. A child
  // who reads only one of the two still gets the verdict. Each line carries its own
  // lang attribute so the Thai one gets the Thai face and the Thai leading even when
  // the page around it is in English.
  function sayVerdict(key) {
    var other = LANG === 'th' ? 'en' : 'th';
    var a = $('ans-a'), why = $('ans-why'), alt = $('ans-alt');
    a.textContent = t('verdict.' + key);
    a.setAttribute('lang', LANG);
    why.textContent = t('why.' + key);
    why.setAttribute('lang', LANG);
    alt.textContent = tIn(other, 'verdict.' + key);
    alt.setAttribute('lang', other);
  }

  // Re-render once a second so "updated 4s ago" and the stale threshold stay true.
  setInterval(layout, 1000);

  // ---------------------------------------------------------------- messages UI
  // Nothing below stores a SENTENCE — it stores the key that produced one. That is
  // the whole trick behind switching language without a reload: a warning raised in
  // English three minutes ago is re-rendered in Thai from the same key, and the
  // broker connection underneath it is never touched.
  var warnState = null;
  function warn(key, vars) {
    warnState = key ? { k: key, v: vars || null } : null;
    paintWarn();
  }
  function paintWarn() {
    var w = $('warn');
    if (w) w.textContent = warnState ? t(warnState.k, warnState.v) : '';
  }

  var CONN_TEXT = {
    idle: 'conn.starting', connecting: 'conn.connecting', connected: 'conn.connected',
    reconnecting: 'conn.retrying', closed: 'conn.closed',
    error: 'conn.unreachableShort', fatal: 'conn.refusedShort'
  };
  var connDetailKey = null;
  function setConn(state, detailKey) {
    connState = state;
    connDetailKey = detailKey || null;
    paintConn();
  }
  function paintConn() {
    $('p-conn').setAttribute('data-s', connState);
    $('conn-text').textContent = t(connDetailKey || CONN_TEXT[connState] || connState);
  }

  // On failure the whole screen becomes one calm sentence: what went wrong, then
  // what that means for the reader. Both halves come from the table.
  var downState = null;
  function showDown(leadKey, reasonKey, reasonText) {
    downState = { k: leadKey, rk: reasonKey || null, rt: reasonText || null };
    paintDown();
    $('down').hidden = false;
  }
  function paintDown() {
    if (!downState) return;
    var vars = null;
    if (downState.rk) vars = { reason: t(downState.rk) };
    else if (downState.rt) vars = { reason: downState.rt };   // raw broker text; not ours to translate
    $('down-say').textContent = t(downState.k, vars) + ' ' + t('down.nothing');
  }
  function hideDown() {
    downState = null;
    $('down').hidden = true;
    if (downTimer) { clearTimeout(downTimer); downTimer = null; }
  }

  // ---------------------------------------------------------------- connect
  // Returns a KEY where the reason is one this page can name in both languages, and
  // raw broker text only where it cannot. Code 5 — "not authorised" — is exactly what
  // conn.refused says, so it reuses that string rather than owning a second one.
  function describe(err) {
    var code = err && (err.code !== undefined ? err.code : err.reasonCode);
    var map = { 1: 'fatal.1', 2: 'fatal.2', 3: 'fatal.3', 4: 'fatal.4', 5: 'conn.refused' };
    if (map[code]) return { key: map[code], text: null, fatal: code === 2 || code === 4 || code === 5 };
    var m = String((err && err.message) || err || 'unknown error');
    if (/not authoriz|bad user/i.test(m)) return { key: null, text: m, fatal: true };
    return { key: null, text: m, fatal: false };
  }

  function disconnect() {
    manualStop = true;
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    subs.clear();
  }


  /* ===================================================================
     DEMO MODE — opt-in from the address bar, and from nowhere else.

       ?demo=163.3     every board publishes that value
       ?demo=<band>    good | moderate | sensitive | unhealthy | verybad | hazardous
       ?demo=cycle     all six bands in turn, four seconds each (also the empty value)
       ?demo=mixed     the fleet as it usually is: one live, one stale, one dark

     Why this is safe to leave in a file that hangs on a school wall:

       1. It cannot start itself. One switch, in the URL. Nothing is written to
          storage and nothing defaults to it, so a reload without the parameter
          is an ordinary wall display again, byte for byte.
       2. It never opens a socket. connect() refuses outright while DEMO is set,
          and subRaw() returns before it can reach a client — so real air and
          invented air can never appear on one screen.
       3. It cannot be missed or cropped away: two fixed bars, top and bottom, a
          ring around the whole viewport, and "DEMO ·" in the tab title. The bars
          carry the VALUE being simulated, not merely the word DEMO.
       4. It renders through the SHIPPED path. The scene is emitted as discovery
          configs and state payloads — the same abbreviated-key JSON and the same
          UTF-8 bytes a board puts on the wire — and pushed through onDiscovery()
          and onMessage(). There is no second renderer, so the alias expansion,
          the wildcard refusal, the unique_id eviction, the EPA truncate-then-band
          and the availability rules all still run, and the band-reactive backdrop
          is swapped by exactly the code the broker drives.

     An unrecognised value FAILS TOWARD THE DEMO, never toward live air: whoever
     typed ?demo= is shown the mixed fleet with their token echoed back and
     crossed out. Silently handing them today's real reading, under an expectation
     of a simulation, is the more dangerous of the two answers — it is the one
     that can send a child outside during a hazardous episode.
     =================================================================== */

  // Written as escapes, not as a literal: the micro sign and the letter M are one
  // careless transform apart, and µg/m³ read as mg/m³ is a 1000x lie about the air.
  // Spelled this way no editor, pipeline or copy-paste can bend it.
  var DEMO_UNIT = '\u00b5g/m\u00b3';

  // A value from the middle of each band, so a screenshot shows that band's
  // colour and wording rather than an edge case that could belong to either
  // neighbour. `wire` is the English payload a board publishes on
  // air_quality_level — it is data, not display copy, and is never shown as-is.
  var DEMO_BANDS = [
    { key:'good',      max:12.0,     mid:6,   wire:'Good' },
    { key:'moderate',  max:35.4,     mid:24,  wire:'Moderate' },
    { key:'sensitive', max:55.4,     mid:45,  wire:'Unhealthy for Sensitive Groups' },
    { key:'unhealthy', max:150.4,    mid:103, wire:'Unhealthy' },
    { key:'verybad',   max:250.4,    mid:200, wire:'Very Unhealthy' },
    { key:'hazardous', max:Infinity, mid:320, wire:'Hazardous' }
  ];

  var demoBad = '';                  // the token that was not understood, as typed
  var DEMO = readDemo();             // decided ONCE, here, and never re-read
  var demoStep = 0, demoStarted = false, demoDeclared = false;
  var demoValEl = null, demoTopEl = null, demoBotEl = null, demoFootEl = null;
  var demoLast = null;

  function demoBandOf(n) {
    for (var i = 0; i < DEMO_BANDS.length; i++) { if (n <= DEMO_BANDS[i].max) return DEMO_BANDS[i]; }
    return DEMO_BANDS[DEMO_BANDS.length - 1];
  }
  function demoByKey(k) {
    for (var i = 0; i < DEMO_BANDS.length; i++) { if (DEMO_BANDS[i].key === k) return DEMO_BANDS[i]; }
    return null;
  }

  function readDemo() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return null; }
    if (!q.has('demo')) return null;              // the real wall, untouched
    var raw = q.get('demo');
    var s = String(raw == null ? '' : raw).trim().toLowerCase();
    if (s === '' || s === 'cycle') return { mode:'cycle' };
    if (s === 'mixed') return { mode:'mixed' };
    var b = demoByKey(s);
    if (b) return { mode:'value', value:b.mid };
    // Digits only. Number('') is 0 and Number('-') is NaN; letting either through
    // would answer a question nobody asked with a confident green zero.
    if (/^\d+(\.\d+)?$/.test(s)) return { mode:'value', value:Number(s) };
    demoBad = String(raw);
    return { mode:'mixed' };
  }

  // Truncate, never round — the same rule the shipped parser applies to a payload.
  function demoTrunc(n) { return Math.trunc(n * 10) / 10; }

  var demoEnc = (typeof TextEncoder === 'function') ? new TextEncoder() : null;

  // Exactly the bytes a board puts on the wire, into the handler the broker feeds.
  // Encoded rather than handed over as a string so the UTF-8 decode that protects
  // µ is part of what the demo exercises.
  function demoPublish(topic, text) {
    var s = String(text);
    try { onMessage(topic, demoEnc ? demoEnc.encode(s) : s); }
    catch (e) { /* one bad synthetic message must not stop the scene */ }
  }

  // DBK-002 publishes more than PM2.5; the other two send PM2.5 only, which is
  // itself worth demonstrating — a dense layout has to survive both.
  var DEMO_EXTRA = [
    { leaf:'pm1_0',             name:'PM1.0',             cls:'pm1',             unit:DEMO_UNIT },
    { leaf:'pm10',              name:'PM10',              cls:'pm10',            unit:DEMO_UNIT },
    { leaf:'wi-fi_rssi',        name:'WiFi Signal',       cls:'signal_strength', unit:'dBm' },
    { leaf:'uptime',            name:'Uptime',            cls:'duration',        unit:'s' },
    { leaf:'air_quality_level', name:'Air Quality Level', cls:'',                unit:'' }
  ];

  function demoDeclare(id) {
    var slug = id.toLowerCase();
    var list = [{ leaf:'pm2_5', name:'PM2.5', cls:'pm25', unit:DEMO_UNIT }];
    if (id === 'DBK-002') list = list.concat(DEMO_EXTRA);
    list.forEach(function (s) {
      // Abbreviated keys and a '~' base on purpose: alias expansion is part of
      // what a demo has to prove still works, not something to step around.
      var cfg = {
        '~': 'dbk/' + id,
        name: s.name,                 // every board calls its sensor the same thing —
        stat_t: '~/' + s.leaf,        // identity has to come from the board id
        avty_t: '~/status',
        uniq_id: slug + '-' + s.leaf,
        exp_aft: 900,
        dev: { name: 'Kit4Kids ' + id, ids: [slug] }
      };
      if (s.unit) { cfg.unit_of_meas = s.unit; cfg.stat_cla = 'measurement'; }
      if (s.cls) cfg.dev_cla = s.cls;
      demoPublish('homeassistant/sensor/' + slug + '/' + s.leaf + '/config', JSON.stringify(cfg));
    });
  }

  // When a message arrived is the only thing that makes a reading stale, so
  // back-date the very field onMessage() just wrote. No parallel clock and no
  // second state model — the shipped expiry rule still decides.
  function demoAge(id, secondsAgo) {
    if (!secondsAgo) return;
    var t0 = Date.now() - secondsAgo * 1000;
    entities.forEach(function (e) { if (e.board === id && e.at) e.at = t0; });
  }

  function demoScene() {
    if (DEMO.mode === 'mixed') {
      // What the fleet actually looks like most days, and the layout that breaks
      // first: a three-digit reading beside two boards with nothing to say. 163.3
      // is the string that once wrapped between "163." and "3"; it stays here as
      // a regression test.
      return [
        { id:'DBK-001', up:true,  pm:41.8,  age:26 * 60 },   // older than expire_after
        { id:'DBK-002', up:true,  pm:163.3, age:11 },
        { id:'DBK-010', up:false, pm:24.6,  age:4 * 3600 }
      ];
    }
    var v = (DEMO.mode === 'cycle')
      ? DEMO_BANDS[demoStep % DEMO_BANDS.length].mid
      : DEMO.value;
    return [
      { id:'DBK-001', up:true, pm:v, age:9 },
      { id:'DBK-002', up:true, pm:v, age:6 },
      { id:'DBK-010', up:true, pm:v, age:14 }
    ];
  }

  function demoApply() {
    var scene = demoScene();
    if (!demoDeclared) { scene.forEach(function (b) { demoDeclare(b.id); }); demoDeclared = true; }
    scene.forEach(function (b) {
      var pm = demoTrunc(b.pm);
      demoPublish('dbk/' + b.id + '/status', b.up ? 'online' : 'offline');
      demoPublish('dbk/' + b.id + '/pm2_5', pm.toFixed(1));
      if (b.id === 'DBK-002') {
        // Derived from the same reading rather than invented separately: a PM1
        // that contradicts PM2.5 teaches a wrong shape to anyone reading a dense
        // board.
        demoPublish('dbk/DBK-002/pm1_0', demoTrunc(b.pm * 0.62).toFixed(1));
        demoPublish('dbk/DBK-002/pm10',  demoTrunc(b.pm * 1.45).toFixed(1));
        demoPublish('dbk/DBK-002/wi-fi_rssi', '-58');
        demoPublish('dbk/DBK-002/uptime', String(93124 + demoStep * 4));
        demoPublish('dbk/DBK-002/air_quality_level', demoBandOf(pm).wire);
      }
      demoAge(b.id, b.age);
    });
    demoLast = scene;
    demoMark(scene);
    layout();
  }

  /* -------------------------------------------------- the non-negotiable bit --
     Two fixed bars and a ring. They do not fade, they do not scroll away, they
     cannot be dismissed, and they carry the word DEMO, the Thai ตัวอย่าง, and the
     VALUE being simulated — "DEMO" alone leaves a reader wondering which part of
     the screen is pretending. */
  function demoMark(scene) {
    if (!demoValEl) return;
    var parts = [];
    if (DEMO.mode === 'mixed') {
      scene.forEach(function (b) {
        parts.push(b.id + ' ' + (!b.up ? 'offline'
          : b.age > 900 ? 'stale'
          : demoTrunc(b.pm).toFixed(1) + ' ' + DEMO_UNIT));
      });
    } else {
      var v = demoTrunc(scene[0].pm);
      parts.push('every board at ' + v.toFixed(1) + ' ' + DEMO_UNIT +
                 ' · ' + demoBandOf(v).wire);
      // A glyph and a duration rather than a clause: this fragment has no
      // reviewed Thai and needs none, because it is not words.
      if (DEMO.mode === 'cycle') parts.push('↻ 4s');
    }
    // Echoed back exactly as typed, with a cross. Whoever put a bad token in the
    // address bar reads their own token, in whatever language they typed it.
    if (demoBad) parts.push('?demo=' + demoBad + ' ✗');

    demoValEl.textContent = '';
    parts.forEach(function (p, i) {
      if (i) demoValEl.appendChild(document.createTextNode(' · '));
      var s = document.createElement('span');
      s.className = 'nb';
      s.textContent = p;
      demoValEl.appendChild(s);
    });
  }

  function demoBar(cls) {
    var el = document.createElement('div');
    el.className = 'wdemo ' + cls;
    var w = document.createElement('b');
    w.textContent = 'DEMO';
    var th = document.createElement('span');
    th.className = 'wd-th';
    th.textContent = 'ตัวอย่าง';   // ตัวอย่าง
    el.appendChild(w);
    el.appendChild(th);
    return el;
  }

  // The warning is printed in BOTH languages, always, whatever the wall is set
  // to. It is a safety marker, not copy: a Thai-speaking child and an
  // English-reading visitor must both be told these numbers are invented, and
  // neither of them pressed the language button.
  function demoBuild() {
    document.documentElement.setAttribute('data-demo', DEMO.mode);

    var top = demoBar('wdemo-top');
    top.setAttribute('role', 'status');
    var en = document.createElement('span');
    en.textContent = 'SIMULATED DATA, NOT A REAL READING';
    var th = document.createElement('span');
    th.className = 'wd-th';
    th.textContent = 'ข้อมูลตัวอย่าง ' +
                     'ไม่ใช่ค่าจริง';
    demoValEl = document.createElement('span');
    demoValEl.className = 'wd-val';
    top.appendChild(en);
    top.appendChild(th);
    top.appendChild(demoValEl);

    var bot = demoBar('wdemo-bot');
    demoFootEl = document.createElement('span');
    demoFootEl.textContent = 'every number on this screen is invented for design testing · ' +
      'no broker is connected · remove ?demo= from the address for the real wall';
    var botTh = document.createElement('span');
    botTh.className = 'wd-th';
    botTh.textContent = 'ทุกตัวเลขสร้าง' +
      'ขึ้นมาเพื่อทดสอบหน้าจอ';
    bot.appendChild(demoFootEl);
    bot.appendChild(botTh);

    var ring = document.createElement('div');
    ring.className = 'wdemo-ring';
    ring.setAttribute('aria-hidden', 'true');

    document.body.appendChild(top);
    document.body.appendChild(bot);
    document.body.appendChild(ring);
    demoTopEl = top; demoBotEl = bot;
  }

  function demoStart() {
    if (demoStarted) return;             // connect() can be called again from the
    demoStarted = true;                  // settings sheet; the demo starts once
    document.title = 'DEMO · ' + document.title;
    // The pill must not go on saying "connecting…" while nothing is connecting.
    // The words go into the language tables rather than straight into the DOM, so
    // a language switch relabels them like any other word on the wall.
    try {
      STR.en['conn.demo'] = 'demo · no broker';
      STR.th['conn.demo'] = 'ตัวอย่าง · ' +
                            'ไม่ได้ต่อ broker';
      setConn('idle','conn.demo');
    } catch (e) {}
    demoBuild();
    demoApply();
    // Re-assert the scene. Without this a static demo drifts past expire_after and
    // starts describing itself as stale; re-applying is idempotent, including the
    // back-dating that keeps the deliberately stale board stale.
    setInterval(function () {
      if (DEMO.mode === 'cycle') demoStep++;
      demoApply();
    }, DEMO.mode === 'cycle' ? 4000 : 15000);
  }

  function connect(cfg) {
    // The one gate that makes demo mode safe on a health display: while ?demo= is
    // set no socket is opened, from here or from the settings sheet, so real air
    // and invented air can never be on one screen.
    if (DEMO) { demoStart(); return; }

    if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
      setConn('fatal', 'conn.nolib');
      showDown('down.nolib');
      return;
    }

    disconnect();
    manualStop = false;
    everConnected = false;
    hideDown();
    warn(null);
    activeFilter = typeof cfg.filter === 'string' ? cfg.filter.trim() : '';
    filteredOut.clear();

    var scheme = cfg.tls ? 'wss' : 'ws';
    var url = scheme + '://' + cfg.host + ':' + cfg.port;
    $('p-host').textContent = cfg.host + ':' + cfg.port;
    setConn('connecting');

    if (!cfg.tls && location.protocol === 'https:') {
      warn('warn.https');
    }

    try {
      client = mqtt.connect(url, {
        username: cfg.user || undefined,
        password: cfg.pass || undefined,
        clientId: 'now-playing-' + Math.random().toString(16).slice(2, 10),
        clean: true,
        reconnectPeriod: 4000,
        connectTimeout: 8000,
        keepalive: 45,
        resubscribe: true
      });
    } catch (e) {
      setConn('fatal');
      showDown('down.cantopen');
      return;
    }

    // If nothing has worked after 14 seconds, stop pretending and say so plainly.
    if (downTimer) clearTimeout(downTimer);
    downTimer = setTimeout(function () {
      if (!everConnected) showDown('conn.unreachable');
    }, 14000);

    client.on('connect', function () {
      everConnected = true;
      setConn('connected');
      hideDown();
      // Bounded discovery wildcards, authored here — the only wildcards this page
      // may subscribe to, and none of them contains '#'.
      subRaw('homeassistant/+/+/config');
      subRaw('homeassistant/+/+/+/config');
      subRaw('dbk/+/status');
      layout();
    });

    client.on('message', function (topic, payload) {
      try { onMessage(topic, payload); }
      catch (e) { /* one bad message must never stop the stream */ }
    });

    client.on('reconnect', function () { if (!manualStop && connState !== 'fatal') setConn('reconnecting'); });
    client.on('offline', function () { if (!manualStop && connState !== 'fatal') setConn('reconnecting'); });

    client.on('close', function () {
      if (manualStop || connState === 'fatal') return;
      setConn(everConnected ? 'reconnecting' : 'error');
      if (!everConnected && !downTimer) showDown('conn.unreachable');
    });

    client.on('error', function (err) {
      var d = describe(err);
      if (d.fatal) {
        setConn('fatal');
        manualStop = true;
        try { client.end(true); } catch (e) {}
        client = null;
        if (d.key) showDown(d.key);                       // a refusal this page can name
        else showDown('down.turnedaway', null, d.text);   // ...or the broker's own words
      } else {
        setConn('error');
      }
    });
  }

  // ---------------------------------------------------------------- settings
  var sheet = $('sheet');
  function readForm() {
    return {
      host: $('f-host').value.trim(),
      port: $('f-port').value.trim(),
      user: $('f-user').value,
      pass: $('f-pass').value,
      tls: $('f-tls').checked,
      filter: $('f-filter').value.trim(),
      remember: $('f-remember').checked
    };
  }
  function fillForm(v) {
    $('f-host').value = (v && v.host) || DEFAULT_HOST;
    $('f-port').value = (v && v.port) || DEFAULT_PORT;
    $('f-user').value = (v && v.user) || '';
    $('f-pass').value = (v && v.pass) || '';
    $('f-tls').checked = !!(v && v.tls);
    $('f-filter').value = v && typeof v.filter === 'string' ? v.filter : DEFAULT_FILTER;
    $('f-remember').checked = !!(v && (v.remember || v.pass));
  }
  // What goes to disk is not what is in the form: the passphrase is opt-in.
  function storable(cfg) {
    var out = { host: cfg.host, port: cfg.port, user: cfg.user, tls: cfg.tls,
                filter: cfg.filter, remember: !!cfg.remember };
    if (cfg.remember) out.pass = cfg.pass;
    return out;
  }
  function openSheet() { sheet.hidden = false; $('f-host').focus(); }
  function closeSheet() { sheet.hidden = true; }

  $('btn-close').addEventListener('click', closeSheet);
  $('form').addEventListener('submit', function (ev) { ev.preventDefault(); $('btn-go').click(); });
  $('btn-go').addEventListener('click', function () {
    var cfg = readForm();
    if (!cfg.host || !cfg.port) return;
    entities.forEach(function (e) { if (e.row) e.row.root.remove(); });
    entities.clear(); byState.clear(); byAvail.clear(); byUid.clear(); boardStatus.clear();
    filteredOut.clear(); parseErrors = 0; lastKey = '';
    var ok = saveStore(storable(cfg));
    storeHintKey = !ok ? 'store.refused'
                       : (cfg.remember ? 'store.savedpass' : 'store.savednopass');
    paintStoreHint();
    closeSheet();
    layout();
    connect(cfg);
  });
  $('btn-forget').addEventListener('click', function () {
    clearStore();
    fillForm(null);
    $('f-pass').value = '';
    storeHintKey = 'store.cleared';
    paintStoreHint();
  });

  // ---------------------------------------------------------------- the switch
  // Every string on this wall is written by paintStatic() or by layout(), and
  // layout() already runs once a second — so changing language is a repaint, not a
  // reload. The MQTT socket, the retained discovery it has collected, and the
  // "updated 4s ago" clock all keep running straight through it.
  function setLang(next) {
    if (next !== 'th' && next !== 'en') return;
    if (next === LANG) return;
    LANG = next;
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
    applyLang();
  }

  function applyLang() {
    // <html lang> is what makes the browser pick Thai line-breaking and Thai font
    // fallback, and what every :lang(th) rule in the stylesheet hangs off.
    document.documentElement.setAttribute('lang', LANG);
    document.title = t('doc.title');
    paintStatic();
    layout();
  }

  // Keeps the <kbd>s</kbd> chip while the sentence around it changes language. The
  // key is a standalone token in both columns ("Press s to…", "กด s เพื่อ…"); if a
  // future string has no standalone key, the sentence still renders whole.
  function kbdify(str, key) {
    var parts = String(str).split(/(\s)/), out = '', done = false;
    for (var i = 0; i < parts.length; i++) {
      if (!done && parts[i] === key) { out += '<kbd>' + esc(key) + '</kbd>'; done = true; }
      else out += esc(parts[i]);
    }
    return out;
  }

  var storeHintKey = null;
  function paintStoreHint() {
    $('store-hint').textContent = storeHintKey ? t(storeHintKey) : '';
  }

  // Everything that is not written by layout(): the fixed furniture, marked in the
  // markup with data-t so a new label cannot be added without a key.
  function paintStatic() {
    var nodes = document.querySelectorAll('[data-t]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute('data-t'));
    }
    var arias = document.querySelectorAll('[data-t-aria]');
    for (var j = 0; j < arias.length; j++) {
      arias[j].setAttribute('aria-label', t(arias[j].getAttribute('data-t-aria')));
    }
    // The scale caption is our prose plus a unit. The unit is identical in both
    // columns and is never re-cased — µ is not M.
    $('scale-mid').textContent = t('scale.epa') + ' · ' + t('unit.ugm3');
    $('hint-s').innerHTML = kbdify(t('conn.hint'), 's');
    $('down-sub').innerHTML = kbdify(t('conn.hint'), 's');
    paintStoreHint();
    paintConn();
    paintWarn();
    paintDown();
    var bs = document.querySelectorAll('#lang-sw .lang-b');
    for (var k = 0; k < bs.length; k++) {
      bs[k].setAttribute('aria-pressed', bs[k].getAttribute('data-lang') === LANG ? 'true' : 'false');
    }
  }

  $('lang-sw').addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('.lang-b') : null;
    if (b) setLang(b.getAttribute('data-lang'));
  });

  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tgt = ev.target, tag = tgt && tgt.tagName;
    if (ev.key === 'Escape') { closeSheet(); return; }
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (tgt && tgt.isContentEditable)) return;
    if (ev.key === 's' || ev.key === 'S') {
      ev.preventDefault();
      sheet.hidden ? openSheet() : closeSheet();
      return;
    }
    // "l" for language. "s" is already the settings sheet; these do not collide.
    if (ev.key === 'l' || ev.key === 'L') {
      ev.preventDefault();
      setLang(LANG === 'th' ? 'en' : 'th');
    }
  });

  // ---------------------------------------------------------------- boot
  // No configuration UI on load, ever. Stored settings first, then anything handed
  // in on the query string, then a plain anonymous connection to the default
  // WebSocket listener. The wall starts trying immediately.
  function fromQuery() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return null; }
    if (!q) return null;
    var got = ['u', 'p', 'h', 'port', 'f'].some(function (k) { return q.has(k); });
    if (!got) return null;
    var cfg = {
      host: (q.get('h') || DEFAULT_HOST).trim(),
      port: (q.get('port') || DEFAULT_PORT).trim(),
      user: q.get('u') || '',
      pass: q.get('p') || '',
      tls: q.get('tls') === '1',
      filter: q.has('f') ? q.get('f') : DEFAULT_FILTER,
      remember: false
    };
    // Do not leave a passphrase sitting in the address bar of a wall-mounted
    // browser for the rest of the day.
    if (q.has('p') || q.has('u')) {
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
    }
    return cfg;
  }

  var saved = loadStore();
  fillForm(saved);
  activeFilter = $('f-filter').value.trim();

  storeHintKey = !storeWorks ? 'store.blocked' : (saved ? 'store.loaded' : 'store.empty');

  // A ?lang= on a wall-mounted browser is set once and meant to stick, and
  // fromQuery() below strips the query string whenever it carries credentials —
  // so the choice is written down before that can happen.
  try {
    var qlang = new URLSearchParams(location.search).get('lang');
    if (qlang === 'th' || qlang === 'en') localStorage.setItem(LANG_KEY, qlang);
  } catch (e) {}

  applyLang();   // sets <html lang>, the title, every static label, then layout()

  var boot = null;
  if (saved && saved.host && saved.port && !(saved.user && !saved.pass)) boot = saved;
  if (!boot) boot = fromQuery();
  if (!boot) boot = { host: DEFAULT_HOST, port: DEFAULT_PORT, user: '', pass: '',
                      tls: false, filter: DEFAULT_FILTER, remember: false };

  connect(boot);
})();
</script>
<script src="_wallcreds.js"></script>
</body>
</html>
