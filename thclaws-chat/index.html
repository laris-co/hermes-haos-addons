<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>thCLAWS Chat</title>
  <style>
    :root { color-scheme: dark; background: #111; }
    * { box-sizing: border-box; }
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { overflow: hidden; background: #111; }
    iframe { display: block; background: #111; }
    #status {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: #aeb4bf;
      background: #111;
      font: 500 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
      letter-spacing: .02em;
      transition: opacity .18s ease;
    }
    #status.ready { opacity: 0; }
    #status.reconnecting {
      inset: auto 18px 18px auto;
      width: auto;
      height: auto;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(17,17,17,.9);
      opacity: 1;
    }
  </style>
</head>
<body>
  <iframe
    id="chatbot"
    title="thCLAWS Chat"
    src="gui-shell/chatbot/?session=tier1"
    sandbox="allow-scripts allow-same-origin"
  ></iframe>
  <div id="status">Connecting to thCLAWS…</div>
  <script src="host.js"></script>
</body>
</html>
