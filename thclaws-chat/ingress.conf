# The upstream name is resolved lazily through Docker's embedded DNS. That lets
# this lightweight companion start even while the thCLAWS add-on is restarting;
# users receive a temporary 502 instead of this app crash-looping at boot.
resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8099;
    server_name _;

    # Home Assistant Supervisor is the only network peer allowed to enter this
    # ingress app. Browser authentication has already happened in HA.
    allow 172.30.32.2;
    deny all;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # thCLAWS injects its official bridge runtime inline into the proxied shell
    # document, so unsafe-inline is narrowly required for that upstream script.
    add_header Content-Security-Policy "default-src 'self'; frame-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'self'" always;

    root /usr/share/thclaws-chat;
    index index.html;

    # Host page for the focused sidebar app. It embeds thCLAWS's own built-in
    # chatbot shell and supplies the same postMessage <-> WebSocket relay as
    # thCLAWS's React UIView component.
    location = / {
        try_files /index.html =404;
    }

    location = /host.js {
        try_files /host.js =404;
    }

    # Proxy the shell itself from the already-running thCLAWS process. The
    # binary injects its official window.thclaws bridge into this HTML.
    location /gui-shell/chatbot/ {
        set $thclaws http://a90308c2-thclaws:8342;
        proxy_pass $thclaws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Shared thCLAWS agent IPC. Shell requests are translated by host.js into
    # gui_shell_* frames and streamed gui_shell_event frames go back to it.
    location = /ws {
        set $thclaws http://a90308c2-thclaws:8342;
        proxy_pass $thclaws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Generated images/files referenced by chatbot Markdown stay sandboxed by
    # thCLAWS's own workspace path validator.
    location /file-asset/ {
        set $thclaws http://a90308c2-thclaws:8342;
        proxy_pass $thclaws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
